<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡A movernos! · Educación Física en el salón</title>
<style>
  :root { --marino:#0F3B5F; --naranja:#E8772E; --fondo:#F3F7FA; --verde:#2E8B57; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Inter","Ubuntu","Noto Sans",sans-serif; background:var(--fondo); color:#12212E; }
  header { background:var(--marino); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:26px; }
  header p { margin:0; color:#BFD3E2; }
  .grados { margin-left:auto; display:flex; gap:6px; }
  .grados button, .modos button { font:inherit; font-weight:700; border:2px solid #fff3; background:transparent; color:#fff; padding:8px 14px; border-radius:12px; cursor:pointer; }
  .grados button.sel { background:var(--naranja); border-color:var(--naranja); }
  nav.modos { display:flex; gap:8px; padding:12px 24px; background:#E3ECF2; flex-wrap:wrap; }
  .modos button { color:var(--marino); border-color:#C9D6E0; background:#fff; font-size:17px; }
  .modos button.sel { background:var(--marino); color:#fff; border-color:var(--marino); }
  main { padding:20px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; min-height:calc(100vh - 140px); }
  .emoji { font-size:150px; line-height:1.1; margin:8px 0; }
  .ejercicio { font-size:44px; font-weight:800; color:var(--marino); margin:4px 0; }
  .como { font-size:22px; color:#4A5866; max-width:820px; margin:4px 0 14px; }
  .tiempo { font-size:96px; font-weight:800; color:var(--naranja); font-variant-numeric:tabular-nums; }
  .barra { width:min(720px,90%); height:16px; background:#D6E3EC; border-radius:10px; overflow:hidden; margin:6px 0 18px; }
  .barra div { height:100%; background:var(--naranja); width:0; transition:width .25s linear; }
  .botones { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { font:inherit; font-size:24px; font-weight:800; border:0; border-radius:18px; padding:16px 30px; cursor:pointer; background:var(--naranja); color:#fff; }
  .btn.sec { background:#fff; color:var(--marino); border:3px solid #C9D6E0; }
  .info { font-size:18px; color:#4A5866; margin-top:14px; }
  .dado { font-size:140px; display:inline-block; }
  .gira { animation: gira .7s ease-out; }
  @keyframes gira { from { transform: rotate(0) scale(.6); } to { transform: rotate(720deg) scale(1); } }
  .simon { font-size:40px; font-weight:800; min-height:60px; }
  .simon.si { color:var(--verde); } .simon.no { color:#B3261E; }
  .lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; width:100%; max-width:1100px; text-align:left; }
  .tarj { background:#fff; border:2px solid #D6E3EC; border-radius:16px; padding:12px; }
  .tarj b { color:var(--marino); font-size:18px; } .tarj span { font-size:34px; float:right; }
  .tarj p { margin:6px 0 0; color:#4A5866; font-size:15px; }
  footer { text-align:center; color:#5F6B76; font-size:13px; padding:8px; }
.marca{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.marca img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}.marca b{display:block;font-size:14px;line-height:1.15}.marca small{display:block;font-size:11px;opacity:.75;font-style:italic}.firma{display:flex;flex-direction:column;align-items:center;gap:4px;margin:26px 0 8px;opacity:.75}.firma span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5F6B76}.firma img{width:170px;height:auto}
</style>
</head>
<body>
<header>
  <div><h1>🏃 ¡A movernos!</h1><p>Educación Física en el salón · para días de lluvia o frío</p></div>
  <div class="grados" id="grados">
    <button data-g="1">1° y 2°</button><button data-g="2" class="sel">3° y 4°</button><button data-g="3">5° y 6°</button>
  </div>
  <div class="marca"><img src="zona050.png" alt="Zona Escolar 050"><span><b>Zona Escolar 050</b><small>Responsabilidad y superación</small></span></div>
</header>
<nav class="modos" id="modos">
  <button data-m="circuito" class="sel">⏱️ Circuito</button>
  <button data-m="dado">🎲 Dado del movimiento</button>
  <button data-m="simon">🗣️ Simón dice</button>
  <button data-m="calma">🧘 Vuelta a la calma</button>
  <button data-m="lista">📋 Todos los ejercicios</button>
</nav>
<main id="zona"></main>
<footer>Antes de empezar: mueve las bancas, deja espacio y que cada alumno tenga su lugar. Si alguien se cansa, que descanse y tome agua.<div class="firma"><span>Desarrollado por</span><img src="firma-autor.svg" alt="Maestro Carlos Ortega"></div></footer>
<script>
// Ejercicios para el salón (sin material). nivel: desde qué grupo de grados aplica.
const EJ = [
  { n:'Saltos de tijera', e:'🤸', c:'Abre y cierra piernas y brazos saltando.', g:1, t:'activo' },
  { n:'Marcha en tu lugar', e:'🚶', c:'Sube las rodillas y mueve los brazos.', g:1, t:'activo' },
  { n:'Carrera en tu lugar', e:'🏃', c:'Corre sin moverte de tu lugar, rápido y suave.', g:1, t:'activo' },
  { n:'Sentadillas', e:'🏋️', c:'Baja como si te sentaras en una silla y sube. Espalda derecha.', g:1, t:'fuerza' },
  { n:'Saltos de rana', e:'🐸', c:'Agáchate y salta hacia arriba con brazos arriba.', g:1, t:'activo' },
  { n:'Toca tus pies', e:'🙆', c:'Estírate hacia arriba y luego toca tus pies, despacio.', g:1, t:'flexible' },
  { n:'Brazos de molino', e:'🌀', c:'Haz círculos grandes con los brazos, adelante y atrás.', g:1, t:'activo' },
  { n:'Equilibrio de flamenco', e:'🦩', c:'Párate en un pie. Cambia de pie a la mitad.', g:1, t:'equilibrio' },
  { n:'Boxeo al aire', e:'🥊', c:'Lanza golpes suaves al frente, alternando brazos.', g:1, t:'activo' },
  { n:'Patinador', e:'⛸️', c:'Salta de lado a lado como patinador sobre hielo.', g:2, t:'activo' },
  { n:'Rodillas al pecho', e:'🦵', c:'Salta subiendo las rodillas hacia el pecho.', g:2, t:'activo' },
  { n:'Plancha', e:'🧱', c:'Apoya antebrazos y puntas de pies. Cuerpo recto como tabla.', g:2, t:'fuerza' },
  { n:'Zancadas', e:'🦿', c:'Da un paso largo al frente y baja la rodilla de atrás. Alterna.', g:2, t:'fuerza' },
  { n:'Escalador', e:'🧗', c:'En posición de plancha alta, lleva rodillas al pecho alternando.', g:3, t:'fuerza' },
  { n:'Burpee suave', e:'⚡', c:'Agáchate, manos al piso, pies atrás, regresa y salta.', g:3, t:'activo' },
  { n:'Lagartijas en la pared', e:'🧍', c:'Manos en la pared, dobla y estira los brazos.', g:2, t:'fuerza' },
  { n:'Sentadilla con salto', e:'🚀', c:'Haz una sentadilla y sube saltando.', g:3, t:'activo' },
  { n:'Estatua', e:'🗿', c:'Quédate muy quieto en una pose divertida.', g:1, t:'equilibrio' },
  { n:'Avión', e:'✈️', c:'Párate en un pie, inclínate y abre los brazos como avión.', g:2, t:'equilibrio' },
  { n:'Gateo de oso', e:'🐻', c:'Camina en cuatro apoyos (manos y pies) en tu lugar.', g:1, t:'fuerza' },
];
const CALMA = [
  { n:'Respira como globo', e:'🎈', c:'Inhala inflando la panza en 4 tiempos y sopla despacio en 4.' },
  { n:'Estírate como gato', e:'🐱', c:'En cuatro apoyos, arquea la espalda hacia arriba y luego hacia abajo.' },
  { n:'Árbol', e:'🌳', c:'Un pie apoyado en la otra pierna, manos juntas arriba. Respira tranquilo.' },
  { n:'Estira los brazos', e:'🙌', c:'Cruza un brazo frente al pecho y sostenlo con el otro. Cambia.' },
  { n:'Cuello suave', e:'😌', c:'Lleva la oreja al hombro despacio, de un lado y del otro.' },
  { n:'Montaña', e:'⛰️', c:'De pie, brazos arriba, estírate lo más alto que puedas y respira.' },
];
const SIMON = ['salta','aplaude','toca tu nariz','levanta un pie','gira','toca el piso','marcha','pon las manos en la cabeza','haz una sentadilla','salta como canguro','abre los brazos','toca tus rodillas'];
const zona = document.getElementById('zona');
let grado = 2, modo = 'circuito', timer = null;
const lista = () => EJ.filter(x => x.g <= grado);
const al = a => a[Math.floor(Math.random() * a.length)];
function sonar(f = 880, d = .15) { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); o.frequency.value = f; o.connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) {} }
function hablar(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-MX'; speechSynthesis.speak(u); } catch (e) {} }
function parar() { clearInterval(timer); timer = null; try { speechSynthesis.cancel(); } catch (e) {} }

function circuito() {
  const trabajo = [20, 30, 40][grado - 1], descanso = [15, 15, 10][grado - 1], rondas = 6;
  zona.innerHTML = `<div class="info">Circuito de ${rondas} ejercicios · ${trabajo} segundos cada uno · ${descanso} de descanso</div>
    <div class="emoji" id="e">🏁</div><div class="ejercicio" id="n">¿Listos?</div><div class="como" id="c">Todos de pie, con espacio a su alrededor.</div>
    <div class="tiempo" id="t"></div><div class="barra"><div id="b"></div></div>
    <div class="botones"><button class="btn" id="ir">▶ Empezar</button><button class="btn sec" id="alto">■ Detener</button></div>`;
  const $ = id => document.getElementById(id);
  $('alto').onclick = () => { parar(); circuito(); };
  $('ir').onclick = () => {
    parar(); const ejs = [...lista()].sort(() => Math.random() - .5).slice(0, rondas);
    let i = 0, fase = 'prep', resto = 5;
    const pintar = (ej, txt) => { $('e').textContent = ej ? ej.e : '💧'; $('n').textContent = ej ? ej.n : 'Descanso'; $('c').textContent = txt; };
    pintar(ejs[0], 'Prepárate: ' + ejs[0].c); hablar('Prepárense. Primer ejercicio: ' + ejs[0].n);
    let total = resto;
    timer = setInterval(() => {
      resto--; $('t').textContent = resto > 0 ? resto : ''; $('b').style.width = (100 - resto / total * 100) + '%';
      if (resto <= 3 && resto > 0) sonar(660, .08);
      if (resto > 0) return;
      sonar(990, .25);
      if (fase === 'prep' || fase === 'descanso') { fase = 'trabajo'; resto = total = trabajo; pintar(ejs[i], ejs[i].c); hablar(ejs[i].n + '. ¡Ya!'); }
      else if (fase === 'trabajo') {
        i++;
        if (i >= ejs.length) { parar(); $('e').textContent = '🏆'; $('n').textContent = '¡Muy bien, terminaron!'; $('c').textContent = 'Ahora pasen a Vuelta a la calma para respirar y estirarse.'; $('t').textContent = ''; hablar('¡Muy bien! Terminaron el circuito.'); return; }
        fase = 'descanso'; resto = total = descanso; pintar(null, 'Respira. Sigue: ' + ejs[i].n + ' ' + ejs[i].e); hablar('Descanso. Sigue: ' + ejs[i].n);
      }
      $('t').textContent = resto;
    }, 1000);
  };
}

function dado() {
  zona.innerHTML = `<div class="info">Lanza el dado: sale un ejercicio y cuántas veces hacerlo.</div>
    <div class="dado" id="d">🎲</div><div class="ejercicio" id="n">&nbsp;</div><div class="como" id="c">&nbsp;</div>
    <div class="botones"><button class="btn" id="tirar">🎲 Lanzar el dado</button></div>`;
  document.getElementById('tirar').onclick = () => {
    const d = document.getElementById('d'); d.classList.remove('gira'); void d.offsetWidth; d.classList.add('gira');
    const ej = al(lista()), veces = [5, 8, 10, 12, 15, 20][Math.floor(Math.random() * 6)] * (grado === 1 ? 1 : grado === 2 ? 1 : 1.5);
    setTimeout(() => {
      d.textContent = ej.e; const n = Math.round(veces);
      const unidad = ej.t === 'equilibrio' || ej.n === 'Plancha' || ej.n === 'Estatua' ? `${n} segundos` : `${n} veces`;
      document.getElementById('n').textContent = `${ej.n}: ${unidad}`; document.getElementById('c').textContent = ej.c;
      hablar(`${ej.n}, ${unidad}`); sonar(990, .2);
    }, 650);
  };
}

function simon() {
  zona.innerHTML = `<div class="info">Hagan la acción solo si escuchan «Simón dice». Si no lo dice… ¡quietos!</div>
    <div class="emoji">🗣️</div><div class="simon" id="s">&nbsp;</div>
    <div class="botones"><button class="btn" id="sig">▶ Siguiente orden</button><button class="btn sec" id="auto">🔁 Automático</button></div>`;
  const s = document.getElementById('s');
  const orden = () => { const si = Math.random() < .7, a = al(SIMON); s.textContent = (si ? 'Simón dice: ' : '') + a; s.className = 'simon ' + (si ? 'si' : 'no'); hablar((si ? 'Simón dice ' : '') + a); };
  document.getElementById('sig').onclick = () => { parar(); orden(); };
  document.getElementById('auto').onclick = () => { parar(); orden(); timer = setInterval(orden, [6000, 5000, 4000][grado - 1]); };
}

function calma() {
  let i = 0;
  zona.innerHTML = `<div class="info">Despacio y en silencio. 30 segundos cada uno.</div>
    <div class="emoji" id="e">🧘</div><div class="ejercicio" id="n">Vuelta a la calma</div><div class="como" id="c">Respiren tranquilos.</div>
    <div class="tiempo" id="t"></div><div class="botones"><button class="btn" id="ir">▶ Empezar</button></div>`;
  document.getElementById('ir').onclick = () => {
    parar(); let resto = 30; const pon = () => { const x = CALMA[i]; e.textContent = x.e; n.textContent = x.n; c.textContent = x.c; hablar(x.n + '. ' + x.c); };
    const e = document.getElementById('e'), n = document.getElementById('n'), c = document.getElementById('c'), t = document.getElementById('t');
    pon();
    timer = setInterval(() => { resto--; t.textContent = resto; if (resto > 0) return; i++; if (i >= CALMA.length) { parar(); e.textContent = '🌟'; n.textContent = '¡Listos para seguir aprendiendo!'; c.textContent = ''; t.textContent = ''; return; } resto = 30; sonar(520, .2); pon(); }, 1000);
  };
}

function todos() {
  zona.innerHTML = `<div class="lista">${lista().map(x => `<div class="tarj"><span>${x.e}</span><b>${x.n}</b><p>${x.c}</p></div>`).join('')}${CALMA.map(x => `<div class="tarj"><span>${x.e}</span><b>${x.n}</b><p>${x.c}</p></div>`).join('')}</div>`;
}

const MODOS = { circuito, dado, simon, calma, lista: todos };
function ir() { parar(); MODOS[modo](); }
document.getElementById('modos').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; modo = b.dataset.m; document.querySelectorAll('#modos button').forEach(x => x.classList.toggle('sel', x === b)); ir(); };
document.getElementById('grados').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; grado = +b.dataset.g; document.querySelectorAll('#grados button').forEach(x => x.classList.toggle('sel', x === b)); ir(); };
ir();
</script>
</body>
</html>
