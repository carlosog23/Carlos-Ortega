/* ---------------- SisAT · Sistema de Alerta Temprana ----------------
   Resultados por grupo de cada escuela en los 3 momentos del ciclo. Se consultan por zona, grado de la zona,
   escuela, grado y grupo; cada nivel trae su diagnóstico automático y un espacio de observaciones. */
const SIS_H = [['lec', 'Lectura', 'Lectura'], ['tex', 'Producción de textos', 'Escritura'], ['cal', 'Cálculo mental', 'Cálculo']];
const SIS_N = [['ne', 'Nivel esperado'], ['ed', 'En desarrollo'], ['ra', 'Requiere apoyo']];
const SIS_PRIORIDAD = 40;   // % de «requiere apoyo» a partir del cual un grupo es prioritario
const SIS_SEMILLA = [{
  ciclo: '2026-2027', momento: 1, cct: '02DPR0210Z', fuente: 'Gráficas SISAT 1er momento Belisario Domínguez (PDF)',
  grupos: [
    ['6-B', [15, 12, 0], [18, 9, 0], [1, 15, 11], [8, 116, 146]], ['6-A', [8, 19, 0], [12, 13, 2], [4, 15, 8], [92, 51, 127]],
    ['5-B', [8, 16, 8], [0, 18, 14], [7, 10, 15], [23, 131, 166]], ['5-A', [21, 9, 1], [21, 9, 1], [3, 13, 15], [60, 67, 183]],
    ['4-B', [4, 17, 6], [0, 20, 7], [10, 7, 10], [96, 55, 119]], ['4-A', [7, 11, 5], [6, 11, 7], [3, 4, 19], [58, 20, 151]],
    ['3-B', [10, 13, 5], [3, 19, 7], [8, 15, 6], [117, 63, 101]], ['3-A', [10, 7, 9], [1, 13, 12], [9, 8, 9], [88, 51, 121]],
    ['2-B', [3, 11, 15], [0, 6, 23], [13, 9, 7], [72, 117, 101]], ['2-A', [8, 7, 12], [4, 15, 8], [10, 8, 9], [56, 103, 111]],
    ['1-B', [0, 0, 25], [0, 0, 25], [5, 13, 7], [28, 106, 116]], ['1-A', [0, 0, 29], [0, 0, 29], [5, 3, 21], [20, 76, 194]]
  ].map(([e, l, t, c, p]) => Object.assign(sisEtiqueta(e), { lec: { ne: l[0], ed: l[1], ra: l[2] }, tex: { ne: t[0], ed: t[1], ra: t[2] }, cal: { ne: c[0], ed: c[1], ra: c[2] }, tip: { sa: p[0], ca: p[1], inc: p[2] } }))
}];

function cicloActual() { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? y + '-' + (y + 1) : (y - 1) + '-' + y; }
function sisV() {
  if (!vista.sis) vista.sis = { ciclo: cicloActual(), m: 1, nivel: esDirector() ? 'escuela' : 'zona', cct: miCct(), grado: '', grupo: '', con1: false, orden: 'necesidad' };
  return vista.sis;
}
// «6-B», «6° B», «6B», «1-A» → { grado: '6', grupo: 'B' }
function sisEtiqueta(t) {
  const m = String(t || '').toUpperCase().match(/([1-6])\s*[°º.]?\s*[-–—]?\s*([A-Z0-9]{0,3})/);
  return m ? { grado: m[1], grupo: m[2] || '' } : { grado: '', grupo: String(t || '').trim() };
}
const sisNomGrupo = r => r.grado + '°' + (r.grupo ? ' ' + r.grupo : '');
const sisPc = (x, n) => n ? Math.round(x * 1000 / n) / 10 : null;
const sisFmt = v => v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('es-MX') + '%';
function sisNorm(r) {
  const n = o => ({ ne: +((o || {}).ne) || 0, ed: +((o || {}).ed) || 0, ra: +((o || {}).ra) || 0 });
  const t = r.tip || {};
  return Object.assign({}, r, { momento: +r.momento, grado: String(r.grado), grupo: String(r.grupo || ''), lec: n(r.lec), tex: n(r.tex), cal: n(r.cal), tip: { sa: +t.sa || 0, ca: +t.ca || 0, inc: +t.inc || 0 } });
}
function sisFilas(m) { const v = sisV(); return (S.sis || []).filter(r => r.ciclo === v.ciclo && +r.momento === +m).map(sisNorm); }
function sisCiclos() { const s = new Set((S.sis || []).map(r => r.ciclo)); s.add(cicloActual()); return Array.from(s).sort().reverse(); }
function sisMomentosConDatos(pred) { return [1, 2, 3].filter(m => sisFilas(m).some(pred)); }

// Qué filas entran en el nivel que se está viendo
function sisPred(v) {
  const enZona = cct => esDirector() || filtroEscuelas().some(c => c.cct === cct);
  return {
    zona: r => enZona(r.cct),
    zgrado: r => enZona(r.cct) && r.grado === v.grado,
    escuela: r => r.cct === v.cct,
    grado: r => r.cct === v.cct && r.grado === v.grado,
    grupo: r => r.cct === v.cct && r.grado === v.grado && r.grupo === v.grupo
  }[v.nivel];
}
// En el Momento 1, primer grado todavía no lee ni escribe de forma convencional: en los concentrados de varios grados se excluye de lectura y escritura (se puede activar)
const sisSin1 = (v, m) => +m === 1 && !v.con1 && (v.nivel === 'zona' || v.nivel === 'escuela');
function sisSuma(filas, sin1) {
  const a = { grupos: filas.length, tip: { sa: 0, ca: 0, inc: 0 } };
  SIS_H.forEach(([h]) => { a[h] = { ne: 0, ed: 0, ra: 0 }; });
  filas.forEach(r => {
    SIS_H.forEach(([h]) => { if (sin1 && h !== 'cal' && r.grado === '1') return; a[h].ne += r[h].ne; a[h].ed += r[h].ed; a[h].ra += r[h].ra; });
    a.tip.sa += r.tip.sa; a.tip.ca += r.tip.ca; a.tip.inc += r.tip.inc;
  });
  SIS_H.forEach(([h]) => {
    const o = a[h]; o.n = o.ne + o.ed + o.ra;
    o.pne = sisPc(o.ne, o.n); o.ped = sisPc(o.ed, o.n); o.pra = sisPc(o.ra, o.n);
    o.ind = o.n ? Math.round((o.ne * 100 + o.ed * 50) / o.n) : null;
  });
  const t = a.tip; t.n = t.sa + t.ca + t.inc; t.psa = sisPc(t.sa, t.n); t.pca = sisPc(t.ca, t.n); t.pinc = sisPc(t.inc, t.n);
  t.pcaAc = sisPc(t.ca, t.sa + t.ca);
  const inds = SIS_H.map(([h]) => a[h].ind).filter(x => x != null);
  a.ind = inds.length ? Math.round(inds.reduce((s, x) => s + x, 0) / inds.length) : null;
  a.maxRa = Math.max(0, ...SIS_H.map(([h]) => a[h].pra || 0));
  a.alumnos = filas.reduce((s, r) => s + Math.max(...SIS_H.map(([h]) => r[h].ne + r[h].ed + r[h].ra)), 0);
  return a;
}
const sisColorInd = i => i == null ? 'var(--borde)' : i >= 70 ? 'var(--ok)' : i >= 50 ? 'var(--ambar)' : 'var(--alerta)';
function sisBarra(o, alto = 12) {

function sisDelta(act, prev, inverso) {

function sisRef(v) { return { zona: '', zgrado: v.grado, escuela: v.cct, grado: v.cct + '|' + v.grado, grupo: v.cct + '|' + v.grado + '|' + v.grupo }[v.nivel]; }

/* ---- Diagnóstico automático ---- */
const SIS_SUGERENCIA = {
  lec: 'Lectura en voz alta todos los días con textos breves y el modelado del docente; lectura repetida del mismo texto para ganar fluidez; preguntas de comprensión antes, durante y después de leer, y uso de la biblioteca de aula.',
  tex: 'Escritura diaria con propósito real (recados, cartas, instructivos, notas); borrador, revisión entre pares y versión final; trabajar puntuación, conectores y ortografía dentro de los propios textos del alumnado.',
  cal: 'Rutina diaria de 10 minutos de cálculo mental (dobles, complementos a 10, descomposición, sumas y restas de memoria); pedir que expliquen su estrategia y retirar poco a poco el apoyo visual.'
};
function sisDiagListas(a, prev, hijos, ctx) {
  const F = [], A = [], G = [];
  const nom = h => SIS_H.find(x => x[0] === h)[1];
  if (!a || !a.grupos) return null;
  SIS_H.forEach(([h]) => {
    const o = a[h]; if (!o.n) return;
    if (o.pra >= SIS_PRIORIDAD) A.push(`<b>${nom(h)}:</b> ${sisFmt(o.pra)} requiere apoyo (${o.ra} de ${o.n} alumnos). Es foco rojo.`);
    else if (o.pra >= 25) A.push(`<b>${nom(h)}:</b> ${sisFmt(o.pra)} requiere apoyo (${o.ra} de ${o.n}). Conviene vigilarlo.`);
    if (o.pne >= 60) F.push(`<b>${nom(h)}:</b> ${sisFmt(o.pne)} del alumnado ya está en el nivel esperado.`);
    else if (o.pne != null && o.pra != null && o.pra < 15 && o.pne + o.ped >= 85) F.push(`<b>${nom(h)}:</b> casi nadie requiere apoyo (${sisFmt(o.pra)}); el reto es pasar de «en desarrollo» al nivel esperado.`);
  });
  const crit = SIS_H.map(([h]) => [h, a[h].pra]).filter(x => x[1] != null).sort((x, y) => y[1] - x[1])[0];
  if (crit && crit[1] >= 20) A.unshift(`La habilidad que más apoyo necesita es <b>${nom(crit[0]).toLowerCase()}</b>.`);
  if (a.lec.n && a.tex.n && a.lec.pne - a.tex.pne >= 15)
    A.push(`La <b>escritura</b> va detrás de la lectura: ${sisFmt(a.tex.pne)} en nivel esperado contra ${sisFmt(a.lec.pne)} en lectura. Leer no se está traduciendo en producir textos.`);
  const t = a.tip;
  if (t.n) {
    if (t.ca > t.sa) A.push(`<b>Cálculo mental:</b> el ${sisFmt(t.pcaAc)} de los aciertos necesitó apoyo visual; el alumnado todavía no resuelve de memoria.`);
    else if (t.psa >= 45) F.push(`<b>Cálculo mental:</b> ${sisFmt(t.psa)} de las respuestas fueron aciertos sin apoyo visual.`);
    if (t.pinc >= 50) A.push(`En cálculo mental, ${sisFmt(t.pinc)} de las respuestas fueron incorrectas.`);
  }
  const conDatos = (hijos || []).filter(x => x.a && x.a.ind != null);
  if (conDatos.length >= 2) {
    const ord = conDatos.slice().sort((x, y) => y.a.ind - x.a.ind);
    F.push(`Mejor resultado: <b>${esc(ord[0].etq)}</b> (índice ${ord[0].a.ind}). Su experiencia puede compartirse con el colectivo.`);
    A.push(`Mayor necesidad: <b>${esc(ord[ord.length - 1].etq)}</b> (índice ${ord[ord.length - 1].a.ind}).`);
  }
  if (ctx.prioritarios && ctx.prioritarios.length) A.push(`${ctx.prioritarios.length} grupo${ctx.prioritarios.length === 1 ? '' : 's'} con ${SIS_PRIORIDAD}% o más de alumnos que requieren apoyo en alguna habilidad (ver «Grupos prioritarios»).`);
  if (prev && prev.grupos) {
    SIS_H.forEach(([h]) => {
      const o = a[h], p = prev[h]; if (!o.n || !p.n) return;
      const d = Math.round((o.pra - p.pra) * 10) / 10, dn = Math.round((o.pne - p.pne) * 10) / 10;
      if (d <= -5) F.push(`<b>${nom(h)}:</b> «requiere apoyo» bajó ${Math.abs(d)} puntos desde el Momento ${ctx.mPrev}${dn >= 5 ? ` y el nivel esperado subió ${dn}` : ''}.`);
      else if (d >= 5) A.push(`<b>${nom(h)}:</b> «requiere apoyo» subió ${d} puntos desde el Momento ${ctx.mPrev}. Revise qué pasó con las acciones acordadas.`);
      else if (dn >= 5) F.push(`<b>${nom(h)}:</b> el nivel esperado subió ${dn} puntos desde el Momento ${ctx.mPrev}.`);
    });
  }
  sisDiagComp(ctx.comp, F, A, G);
  SIS_H.forEach(([h]) => { if (a[h].n && a[h].pra >= 25) G.push(`<b>${nom(h)}.</b> ${SIS_SUGERENCIA[h]}`); });
  if (t.n && t.ca > t.sa && !(a.cal.pra >= 25)) G.push(`<b>Cálculo mental.</b> ${SIS_SUGERENCIA.cal}`);
  if (A.length) G.push('Registrar en el CTE las acciones para cada alumno en «requiere apoyo» y revisar su avance en el siguiente momento del SisAT.');
  if (ctx.nivel === 'zona' && conDatos.length && !esDirector()) {
    const vis = conDatos.filter(x => x.a.maxRa >= SIS_PRIORIDAD).slice().sort((x, y) => y.a.maxRa - x.a.maxRa).slice(0, 5);
    if (vis.length) G.push(`Priorizar el acompañamiento de la Mesa Técnica en: ${vis.map(x => '<b>' + esc(x.etq) + '</b>').join(', ')}.`);
  }
  return { F, A, G };
}
function sisDiagnostico(a, prev, hijos, ctx) {
  const d = sisDiagListas(a, prev, hijos, ctx); if (!d) return '';
  const { F, A, G } = d;
  const li = l => l.length ? `<ul>${l.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="mudo peq">Nada que destacar.</p>';

      const ord = v.orden === 'nombre' ? hijos : hijos.slice().sort((x, y) => (x.a ? x.a.ind : 999) - (y.a ? y.a.ind : 999));

      .map(r => ({ etq: nombreEscuela(r.cct) + ' · ' + sisNomGrupo(r), a: g([r], false), ir: `data-sgrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));

  } else if (v.nivel === 'escuela') {

    hijos = filas.slice().sort((x, y) => x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo)).map(r => ({ etq: sisNomGrupo(r), a: g([r], false), ir: `data-sgrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));
    cobertura = `<div class="peq mudo" style="margin:-6px 0 12px">${a.grupos} grupos · ${a.alumnos} alumnos evaluados${filas[0] && filas[0].fuente ? ' · Fuente: ' + esc(filas[0].fuente) : ''}</div>`;
    tablas += sisTabla(grados, 'Por grado', 'Grado') + sisTabla(hijos, 'Por grupo', 'Grupo');
  } else if (v.nivel === 'grado') {
    hijos = filas.map(r => ({ etq: 'Grupo ' + sisNomGrupo(r), a: g([r], false), ir: `data-sgrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));
    tablas += sisTabla(hijos, 'Grupos de ' + v.grado + '.° grado', 'Grupo');
  } else {
    const prevs = [1, 2, 3].filter(x => x !== m).map(x => ({ x, f: sisFilas(x).filter(pred) })).filter(o => o.f.length);
    if (prevs.length) tablas += sisTabla([{ etq: 'Momento ' + m, a }].concat(prevs.map(o => ({ etq: 'Momento ' + o.x, a: g(o.f, false) }))), 'Este grupo en los demás momentos', 'Momento');
  }
  const prio = v.nivel === 'grupo' || esDirector() && v.nivel === 'zona' ? [] : sisPrioritarios(filas, sin1);
  const prioHtml = prio.length ? `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Grupos prioritarios (${SIS_PRIORIDAD}% o más requiere apoyo)</div>
    <div class="sis-prio">${prio.map(({ r, a: x }, i) => `${i === 8 ? `<details class="sis-mas"><summary>Ver los otros ${prio.length - 8} grupos</summary>` : ''}<button class="sis-ir sis-prio-f" data-sgrp="${r.cct}|${r.grado}|${esc(r.grupo)}">
      <span><b>${v.nivel === 'zona' || v.nivel === 'zgrado' ? esc(nombreEscuela(r.cct)) + ' · ' : ''}${sisNomGrupo(r)}</b></span>
      <span class="peq">${SIS_H.filter(([h]) => x[h].pra >= SIS_PRIORIDAD).map(([h, , c]) => `${c} <b style="color:var(--alerta)">${sisFmt(x[h].pra)}</b>`).join(' · ')}</span></button>`).join('')}${prio.length > 8 ? '</details>' : ''}</div></div>` : '';
  const nota = sin1 && filas.some(r => r.grado === '1') ? `En este concentrado <b>1.° grado no se cuenta en lectura ni en escritura</b> (sí en cálculo): al inicio del ciclo aún no leen ni escriben de forma convencional y su resultado es el punto de partida, no un rezago. <button class="boton sec chico" id="b-sis-con1" style="text-transform:none;letter-spacing:0">Contar 1.° grado</button>`
    : (+m === 1 && v.con1 && (v.nivel === 'zona' || v.nivel === 'escuela') ? `Se está contando 1.° grado en lectura y escritura. <button class="boton sec chico" id="b-sis-con1" style="text-transform:none;letter-spacing:0">Quitar 1.° grado</button>` : '');
  const comp = sisCompSuma(filas, sin1);

    sisDiagnostico(a, prev, v.nivel === 'grupo' ? [] : hijos, { nivel: v.nivel, mPrev, prioritarios: prio, nota, comp }) +
    sisComponentes(comp) + sisSeccionFocos(sisFocos(comp, sisAlumnosNivelM(v, m), m, Array.from(new Set(filas.map(r => r.grado))), filas), m) + sisSeccionAlumnos(v, m, sin1) + sisSeccionRezagoZona(v, m, filas, sin1) + prioHtml + tablas;
}
function sisMiniGrafica(serie) {   // serie: [{m, pne, pra}]
  const W = 300, H = 120, x = i => 30 + i * 120, y = p => 100 - p * 0.9;
  const pts = k => serie.map((s, i) => s[k] == null ? null : [x(s.m - 1), y(s[k])]).filter(Boolean);
  const linea = (k, col) => { const p = pts(k); return p.length ? `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${p.map(q => q.join(',')).join(' ')}"/>${p.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${col}"/>`).join('')}` : ''; };
  return `<svg viewBox="0 0 ${W} ${H}" class="sis-mini" role="img" aria-label="Tendencia de nivel esperado y requiere apoyo">
    ${[0, 50, 100].map(p => `<line x1="24" x2="276" y1="${y(p)}" y2="${y(p)}" stroke="var(--borde)"/><text x="20" y="${y(p) + 4}" text-anchor="end" font-size="9" fill="var(--gris)">${p}</text>`).join('')}
    ${[1, 2, 3].map(m => `<text x="${x(m - 1)}" y="116" text-anchor="middle" font-size="10" fill="var(--gris)">M${m}</text>`).join('')}
    ${linea('pne', '#2E7D4F')}${linea('pra', '#B3261E')}</svg>`;
}
function sisCuerpoTendencia(v, pred) {
  const ms = [1, 2, 3].map(m => { const f = sisFilas(m).filter(pred); return { m, f, a: f.length ? sisSuma(f, sisSin1(v, m)) : null }; });
  const con = ms.filter(x => x.a);
  if (!con.length) return `<div class="tarjeta vacio">Todavía no hay resultados para este nivel.</div>`;
  const tarj = `<div class="sis-kpis">${SIS_H.map(([h, nom]) => {
    const serie = ms.map(x => ({ m: x.m, pne: x.a && x.a[h].n ? x.a[h].pne : null, pra: x.a && x.a[h].n ? x.a[h].pra : null }));
    const c = serie.filter(s => s.pne != null), pri = c[0], ult = c[c.length - 1];
    return `<div class="tarjeta pad sis-kpi"><div class="sis-kpi-t">${nom}</div>${sisMiniGrafica(serie)}
      <div class="sis-ley" style="margin:2px 0 6px"><span><i class="ne"></i>Nivel esperado</span><span><i class="ra"></i>Requiere apoyo</span></div>
      <table class="sis-mt"><tr><th></th>${[1, 2, 3].map(m => `<th>M${m}</th>`).join('')}</tr>
        <tr><td>Esperado</td>${serie.map(s => `<td>${sisFmt(s.pne)}</td>`).join('')}</tr>
        <tr><td>Req. apoyo</td>${serie.map(s => `<td>${sisFmt(s.pra)}</td>`).join('')}</tr></table>
      ${c.length >= 2 ? `<div class="peq" style="margin-top:6px">Del M${pri.m} al M${ult.m}: esperado ${sisDelta(ult.pne, pri.pne)} · req. apoyo ${sisDelta(ult.pra, pri.pra, true)}</div>` : '<div class="peq mudo" style="margin-top:6px">La tendencia aparece cuando haya dos momentos.</div>'}
    </div>`; }).join('')}</div>`;
  const { F, A } = sisTendListas(con);
  const li = l => l.length ? `<ul>${l.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="mudo peq">Sin datos suficientes.</p>';
  const concl = `<div class="tarjeta pad sis-diag"><div class="seccion-t" style="padding:0 0 6px">Conclusión de la tendencia</div>
    <div class="sis-diag-g" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><h3 class="bien">Avances</h3>${li(F)}</div><div><h3 class="mal">Sin avance o retroceso</h3>${li(A)}</div></div></div>`;
  return sisTendResto(v, ms, tarj, concl);
}
function sisTendListas(con) {
  const F = [], A = [];
  if (con.length >= 2) {
    const p = con[0], u = con[con.length - 1];
    SIS_H.forEach(([h, nom]) => {
      if (!p.a[h].n || !u.a[h].n) return;
      const d = Math.round((u.a[h].pra - p.a[h].pra) * 10) / 10, dn = Math.round((u.a[h].pne - p.a[h].pne) * 10) / 10;
      const txt = `nivel esperado ${dn >= 0 ? 'subió ' + dn : 'bajó ' + Math.abs(dn)} pts y requiere apoyo ${d <= 0 ? 'bajó ' + Math.abs(d) : 'subió ' + d} pts (M${p.m} → M${u.m})`;
      if (d <= 0 && dn >= 0) F.push(`<b>${nom}:</b> ${txt}.`);
      else if (d >= 0 && dn <= 0) A.push(`<b>${nom}:</b> ${txt}.`);
      else A.push(`<b>${nom}:</b> resultado mixto: ${txt}. ${d > 0 ? 'Crece el grupo que necesita apoyo aunque otros avanzan: revisar la atención focalizada.' : ''}`);
    });
    if (u.a.ind != null && p.a.ind != null) (u.a.ind >= p.a.ind ? F : A).push(`Índice general: ${p.a.ind} en el M${p.m} → ${u.a.ind} en el M${u.m}.`);

function sisTendHijos(v, ms) {

  else if (v.nivel === 'zona' || v.nivel === 'escuela') filasH = ['1', '2', '3', '4', '5', '6'].map(gr => ({ etq: gr + '.° grado', f: r => r.grado === gr, ir: v.nivel === 'escuela' ? `data-sgr="${gr}"` : (esDirector() ? '' : `data-szg="${gr}"`) }));
  else if (v.nivel === 'grado' || v.nivel === 'zgrado') {
    const vistos = {};
    ms.forEach(x => x.f.forEach(r => { vistos[r.cct + '|' + r.grupo] = r; }));
    filasH = Object.values(vistos).map(r => ({ etq: (v.nivel === 'zgrado' ? nombreEscuela(r.cct) + ' · ' : 'Grupo ') + sisNomGrupo(r), f: q => q.cct === r.cct && q.grupo === r.grupo, ir: `data-sgrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));
  }
  return filasH.map(h => ({ h, ind: ms.map(x => { const f = x.f.filter(h.f); return f.length ? sisSuma(f, false).ind : null; }) })).filter(o => o.ind.some(x => x != null));
}
function sisTendResto(v, ms, tarj, concl) {
  const filasT = sisTendHijos(v, ms);
  const tabla = filasT.length ? `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Índice por momento</div><div class="matriz-caja"><table class="matriz sis-tab">
    <thead><tr><th class="esc-col">${v.nivel === 'zona' && !esDirector() ? 'Escuela' : v.nivel === 'grado' || v.nivel === 'zgrado' ? 'Grupo' : 'Grado'}</th><th>M1</th><th>M2</th><th>M3</th><th>Cambio</th></tr></thead>
    <tbody>${filasT.map(o => { const c = o.ind.filter(x => x != null); return `<tr><td class="esc-col">${o.h.ir ? `<button class="sis-ir" ${o.h.ir}>${esc(o.h.etq)}</button>` : esc(o.h.etq)}</td>
      ${o.ind.map(x => `<td><span class="sis-ind" style="background:${sisColorInd(x)}">${x == null ? '—' : x}</span></td>`).join('')}
      <td>${c.length >= 2 ? sisDelta(c[c.length - 1], c[0]).replace(' pts', '') : '<span class="mudo">—</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';
  return tarj + concl + sisTendenciaAlumnos(v) + tabla;
}

/* ---- Observaciones y acciones de mejora por nivel ---- */
function sisPuedeComentar(v) { return !esDirector() || (['escuela', 'grado', 'grupo'].includes(v.nivel) && v.cct === miCct()); }

  if (!sisPuedeComentar(v) && esDirector()) return '';
  const ref = sisRef(v), m = String(v.m);
  const lista = (S.sic || []).filter(c => c.ciclo === v.ciclo && String(c.momento) === m && c.nivel === v.nivel && c.ref === ref).sort((x, y) => String(x.creado).localeCompare(String(y.creado)));
  const puede = c => c.autor === S.yo.id || esAdmin();
  return `<div class="tarjeta pad" id="sis-obs" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 6px">Observaciones y acciones de mejora · ${v.m === 't' ? 'tendencia' : 'Momento ' + v.m}</div>
    ${lista.length ? lista.map(c => `<div class="sis-obs"><div class="peq mudo"><span class="chip ${c.tipo === 'accion' ? 'terra' : 'indigo'}">${c.tipo === 'accion' ? 'Acción de mejora' : 'Observación'}</span> ${esc(nombreCorto(c.autorNombre))} · ${fechaCorta(String(c.creado).slice(0, 10))}
      ${puede(c) ? `<button class="sis-mini-b" data-sobs-ed="${c.id}">Editar</button><button class="sis-mini-b" data-sobs-del="${c.id}">Borrar</button>` : ''}</div>
      <div style="white-space:pre-wrap;margin-top:4px">${esc(c.texto)}</div></div>`).join('') : '<p class="mudo peq" style="margin:0 0 10px">Aún no hay observaciones en este nivel.</p>'}

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="s-obs-tipo" aria-label="Tipo"><option value="observacion">Observación</option><option value="accion">Acción de mejora</option></select>
      <button class="boton" id="b-sis-obs">Guardar</button></div>` : ''}</div>`;
}
async function sisGuardarObs(d) {
  const v = sisV();
  const r = await accion('sisatComentar', Object.assign({ ciclo: v.ciclo, momento: v.m, nivel: v.nivel, ref: sisRef(v) }, d));
  if (r) { S.sic = r.sic; vSisat(); const o = $('#sis-obs'); if (o) o.scrollIntoView({ block: 'center' }); }

function sisEditor(cct, m, d, archivo) {
  const v = sisV();

  if (!filas.length) filas = [{ grado: '', grupo: '', lec: {}, tex: {}, cal: {}, tip: {} }];
  const CAMPOS = [['lec', 'ne'], ['lec', 'ed'], ['lec', 'ra'], ['tex', 'ne'], ['tex', 'ed'], ['tex', 'ra'], ['cal', 'ne'], ['cal', 'ed'], ['cal', 'ra'], ['tip', 'sa'], ['tip', 'ca'], ['tip', 'inc']];
  const num = x => x === '' || x == null ? null : +x;
  const leerTabla = () => { filas = $$('#e-tab tbody tr').map(tr => {
    const o = { grado: tr.querySelector('[data-k="grado"]').value.replace(/\D/g, '').slice(0, 1), grupo: tr.querySelector('[data-k="grupo"]').value.trim().toUpperCase(), lec: {}, tex: {}, cal: {}, tip: {} };
    CAMPOS.forEach(([h, k]) => { o[h][k] = num(tr.querySelector(`[data-k="${h}.${k}"]`).value); });
    return o; }); };
  const revisar = () => {
    const msgs = [];
    filas.forEach((f, i) => {
      const n = `Renglón ${i + 1}${f.grado ? ' (' + f.grado + '° ' + f.grupo + ')' : ''}`;
      if (!/^[1-6]$/.test(f.grado)) msgs.push(`${n}: falta el grado (1 a 6).`);
      if (CAMPOS.some(([h, k]) => f[h][k] == null)) msgs.push(`${n}: hay casillas vacías (si es cero, escriba 0).`);
      const t = h => (f[h].ne || 0) + (f[h].ed || 0) + (f[h].ra || 0);
      const ts = ['lec', 'tex', 'cal'].map(t), mx = Math.max(...ts), mn = Math.min(...ts);
      if (mx && mx - mn > 4) msgs.push(`${n}: el total de alumnos cambia mucho entre habilidades (${ts.join(', ')}). Revise.`);
      const r = (f.tip.sa || 0) + (f.tip.ca || 0) + (f.tip.inc || 0);
      if (t('cal') && r && Math.abs(r - t('cal') * 10) > t('cal') * 10 * 0.25) msgs.push(`${n}: las respuestas de cálculo (${r}) no corresponden a ${t('cal')} alumnos × 10 reactivos. Revise.`);
    });
    const vistos = {}; filas.forEach(f => { const k = f.grado + '-' + f.grupo; if (vistos[k]) msgs.push(`El grupo ${f.grado}° ${f.grupo} está repetido.`); vistos[k] = 1; });
    let cuadra = '';
    if (d.escuela) {
      const dif = [];
      CAMPOS.forEach(([h, k]) => { const s = filas.reduce((x, f) => x + (f[h][k] || 0), 0), e = d.escuela[h] ? d.escuela[h][k] : null; if (e != null && s !== e) dif.push(`${h === 'tip' ? 'cálculo ' + ({ sa: 'sin apoyo', ca: 'con apoyo', inc: 'incorrectas' })[k] : SIS_H.find(x => x[0] === h)[2] + ' ' + k.toUpperCase()}: grupos ${s} / escuela ${e}`); });
      cuadra = dif.length ? `<div class="aviso-caja" style="border-color:var(--alerta)"><b>No cuadra con el concentrado de la escuela:</b> ${dif.join('; ')}.</div>` : '<div class="aviso-caja" style="background:var(--ok-f);border-color:var(--ok)"><b>✓ La suma de los grupos coincide con el concentrado de la escuela.</b></div>';
    }
    $('#e-rev').innerHTML = cuadra + (msgs.length ? `<div class="aviso-caja"><b>Revise antes de guardar:</b><ul style="margin:6px 0 0 18px;padding:0">${msgs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
    return msgs;
  };
  const celda = (f, h, k) => `<td><input type="number" data-nodict min="0" inputmode="numeric" data-k="${h}.${k}" value="${f[h][k] == null ? '' : f[h][k]}" aria-label="${h} ${k}"></td>`;
  const pintarT = () => {
    $('#e-cuerpo').innerHTML = filas.map((f, i) => `<tr><td><input data-nodict data-k="grado" value="${esc(f.grado)}" aria-label="Grado" style="width:34px"></td><td><input data-nodict data-k="grupo" value="${esc(f.grupo)}" aria-label="Grupo" style="width:40px"></td>
      ${CAMPOS.map(([h, k]) => celda(f, h, k)).join('')}<td><button class="sis-mini-b" data-equi="${i}" aria-label="Quitar renglón">✕</button></td></tr>`).join('');
    $$('#e-tab input').forEach(x => x.oninput = () => { leerTabla(); revisar(); });
    $$('[data-equi]').forEach(b => b.onclick = () => { leerTabla(); filas.splice(+b.dataset.equi, 1); pintarT(); revisar(); });
  };
  const ve = modal(`${esc(nombreEscuela(cct))} · Momento ${m}`, `
    ${archivo ? `<p class="ayuda" style="margin-top:0">Leído de <b>${esc(archivo.nombre)}</b>${d.exploracion && +d.exploracion !== m ? ` · <b style="color:var(--alerta)">Ojo: la IA usó la Exploración ${d.exploracion}</b>` : ''}. Compare con las gráficas y corrija lo necesario.</p>` : '<p class="ayuda" style="margin-top:0">Un renglón por grupo: número de alumnos en cada nivel (NE esperado, ED en desarrollo, RA requiere apoyo) y, en cálculo mental, el número de respuestas por tipo.</p>'}
    ${d.notas ? `<div class="aviso-caja">${esc(d.notas)}</div>` : ''}
    <div id="e-rev"></div>
    <div class="matriz-caja"><table class="matriz sis-ed" id="e-tab"><thead>
      <tr><th colspan="2">Grupo</th><th colspan="3">Lectura</th><th colspan="3">Producción de textos</th><th colspan="3">Cálculo mental</th><th colspan="3">Cálculo: respuestas</th><th></th></tr>
      <tr><th>Gdo.</th><th>Gpo.</th>${'<th>NE</th><th>ED</th><th>RA</th>'.repeat(3)}<th>Sin apoyo</th><th>Con apoyo</th><th>Incorr.</th><th></th></tr></thead>
      <tbody id="e-cuerpo"></tbody></table></div>
    <button class="boton sec chico" id="e-mas" style="margin-top:8px">${ico('i-mas')}Agregar grupo</button>`,
    '<button class="boton sec" id="e-no">Cancelar</button><button class="boton terra" id="e-si">Guardar resultados</button>');
  ve.querySelector('.modal').classList.add('ancha');
  pintarT(); revisar();
  $('#e-mas').onclick = () => { leerTabla(); filas.push({ grado: '', grupo: '', lec: {}, tex: {}, cal: {}, tip: {} }); pintarT(); revisar(); };
  $('#e-no').onclick = cerrarModal;
  $('#e-si').onclick = async () => {
    leerTabla(); const msgs = revisar();
    if (msgs.some(x => /falta el grado|repetido/.test(x))) { aviso('Corrija los grados o grupos repetidos.', 'mal'); return; }
    if (msgs.length && !confirm('Hay ' + msgs.length + ' aviso(s) en la revisión. ¿Guardar de todos modos?')) return;
    const r = await accion('sisatGuardar', { ciclo: v.ciclo, momento: m, cct, fuente: d.fuente || (archivo ? archivo.nombre : 'Captura manual'), grupos: filas });
    if (!r) return;
    S.sis = r.sis; cerrarModal();
    Object.assign(v, { nivel: 'escuela', cct, m }); vSisat(); window.scrollTo(0, 0);
    aviso('Resultados guardados: ' + filas.length + ' grupos.', 'ok');
  };
}

/* ---- Excel de la herramienta oficial del SisAT ----
   La herramienta en línea exporta un archivo por grupo y por herramienta (herrLectura, herrTextos, herrCalculo).
   Aunque terminan en .xls son páginas HTML con una tabla: Alumno, componentes I a VI (o reactivos I a X), PTS, (PV) y NIVEL.
   No traen escuela, grado ni grupo: la escuela sale de su carpeta y el grado y grupo se asignan al revisar
   (Tequio los sugiere comparando los nombres con los momentos anteriores). */
const SIS_COMP = {
  lec: ['Fluidez', 'Precisión', 'Atención a palabras complejas', 'Uso de la voz', 'Seguridad y disposición', 'Comprensión'],
  tex: ['Legibilidad', 'Propósito comunicativo', 'Relación entre palabras y oraciones', 'Diversidad de vocabulario', 'Puntuación', 'Ortografía']
};
const SIS_ROM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const sisSinAc = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const sisClave = n => sisSinAc(n).toUpperCase().replace(/[^A-ZÑ]+/g, ' ').trim();
// «AGUILERA / ROJAS * NICOLE AITANA» → «Aguilera Rojas Nicole Aitana»
const sisNombreAlumno = n => String(n || '').replace(/[\/*]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|[\s'-])([a-zñáéíóúü])/g, (x, a, b) => a + b.toUpperCase());
const sisNivTxt = t => { t = sisSinAc(t).toUpperCase(); return /REQUIERE/.test(t) ? 'RA' : /DESARROLLO/.test(t) ? 'ED' : /ESPERADO/.test(t) ? 'NE' : ''; };
const sisNivPts = (h, p) => p == null ? '' : h === 'cal' ? (p >= 8 ? 'NE' : p >= 5 ? 'ED' : 'RA') : (p >= 15 ? 'NE' : p >= 10 ? 'ED' : 'RA');
const SIS_HERR = { lec: 'Lectura', tex: 'Producción de textos', cal: 'Cálculo mental' };

// Renglones (arreglos de texto) de un archivo: HTML disfrazado de .xls o un Excel de verdad
async function sisRenglones(nombre, bytes) {
  const inicio = new TextDecoder('utf-8').decode(bytes.slice(0, 4000)).replace(/^﻿/, '').trimStart();
  if (/^<(!doctype|html|head|body|table|meta|div|\?xml)/i.test(inicio) || /<table/i.test(inicio)) {
    let texto = new TextDecoder('utf-8').decode(bytes);
    if (/�/.test(texto.slice(0, 20000))) texto = new TextDecoder('windows-1252').decode(bytes);
    const doc = new DOMParser().parseFromString(texto, 'text/html');
    return $$('tr', doc).map(tr => Array.from(tr.cells).map(td => td.textContent.replace(/\s+/g, ' ').trim()));
  }
  await cargarScript('lib/xlsx.full.min.js');
  const wb = window.XLSX.read(bytes, { type: 'array' });
  let filas = [];
  wb.SheetNames.forEach(n => { if (!filas.length || filas.length < 3) filas = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }).map(r => r.map(c => String(c).replace(/\s+/g, ' ').trim())); });
  return filas;
}

// Lee un archivo del SisAT: herramienta (lec, tex o cal) y resultado de cada alumno
async function sisLeerArchivo(a) {   // a: { nombre, bytes, fecha, id }
  const filas = await sisRenglones(a.nombre, a.bytes);
  const hi = filas.findIndex(r => r.some(c => /^PTS$/i.test(c)) && r.some(c => c === 'I'));
  if (hi < 0) return Object.assign({}, a, { error: 'No tiene la tabla de resultados del SisAT.' });
  const cab = filas[hi].map(c => c.toUpperCase());
  const cols = SIS_ROM.map(r => cab.indexOf(r)).filter(i => i >= 0);
  const iP = cab.indexOf('PTS'), iV = cab.indexOf('PV'), iN = cab.indexOf('NIVEL');
  const nom = sisSinAc(a.nombre).toLowerCase();
  const tipo = cols.length >= 10 || iV >= 0 || /calc/.test(nom) ? 'cal' : /text|escri|produc/.test(nom) ? 'tex' : /lect/.test(nom) ? 'lec' : '';
  const num = x => { const n = parseInt(String(x).replace(/[^\d]/g, ''), 10); return isFinite(n) ? n : null; };
  const alumnos = [];
  filas.slice(hi + 1).forEach(r => {
    const nombre = r[0] || '';
    if (r.length <= iP || !/[A-Za-zÑñ]{2}/.test(nombre) || /^(alumno|total|promedio)/i.test(nombre)) return;
    const c = cols.map(i => String(r[i] || '').toLowerCase().replace(/\s+/g, ''));
    const p = num(r[iP]), v = iV >= 0 ? num(r[iV]) : null;
    const h = tipo || 'lec';
    alumnos.push({ alumno: sisNombreAlumno(nombre), clave: sisClave(nombre), c, p, v, n: (iN >= 0 && sisNivTxt(r[iN])) || sisNivPts(h, p) });
  });
  if (!alumnos.length) return Object.assign({}, a, { error: 'La tabla no tiene alumnos.' });
  return Object.assign({}, a, { tipo, componentes: cols.length, alumnos, bytes: undefined, original: a.bytes });
}

// Junta en grupos los archivos que tienen a los mismos alumnos (uno de lectura, uno de textos y uno de cálculo por grupo)
function sisAgrupar(leidos) {
  const grupos = [], avisos = [];
  const coincide = (a, b) => { const B = new Set(b); let n = 0; a.forEach(x => { if (B.has(x)) n++; }); return n / Math.max(1, Math.min(a.length, b.length)); };
  const orden = { lec: 0, tex: 1, cal: 2, '': 3 };
  leidos.filter(x => !x.error).sort((x, y) => orden[x.tipo] - orden[y.tipo]).forEach(f => {
    const claves = f.alumnos.map(x => x.clave);
    let mejor = null, mc = 0;
    grupos.forEach(g => { const c = coincide(claves, g.claves); if (c > mc) { mc = c; mejor = g; } });
    if (mejor && mc >= 0.6) {
      const t = f.tipo || (mejor.arch.lec ? 'tex' : 'lec');
      if (mejor.arch[t]) {   // el mismo grupo dos veces: se queda el más reciente
        const viejo = mejor.arch[t];
        if (String(f.fecha || '') > String(viejo.fecha || '')) mejor.arch[t] = f;
        avisos.push(`«${mejor.arch[t].nombre}» y «${(mejor.arch[t] === f ? viejo : f).nombre}» son ${SIS_HERR[t].toLowerCase()} del mismo grupo; se usa el más reciente (${mejor.arch[t].nombre}).`);
      } else mejor.arch[t] = f;
      claves.forEach(k => { if (mejor.claves.indexOf(k) < 0) mejor.claves.push(k); });
    } else grupos.push({ arch: { [f.tipo || 'lec']: f }, claves: claves.slice() });
  });
  grupos.forEach(g => {
    const porClave = {};
    ['lec', 'tex', 'cal'].forEach(h => { const f = g.arch[h]; if (!f) return;
      f.alumnos.forEach(x => { const o = porClave[x.clave] || (porClave[x.clave] = { alumno: x.alumno, clave: x.clave }); o[h] = { c: x.c, p: x.p, v: x.v, n: x.n }; }); });
    g.alumnos = Object.values(porClave).sort((x, y) => x.clave.localeCompare(y.clave, 'es'));
    g.faltan = ['lec', 'tex', 'cal'].filter(h => !g.arch[h]);
  });
  return { grupos, avisos };
}

// Concentrado de un grupo a partir de sus alumnos (lo que se guarda por grupo y alimenta zona, grado y escuela)
function sisDeAlumnos(als) {
  const g = { tip: { sa: 0, ca: 0, inc: 0 }, comp: { lec: { s: [0, 0, 0, 0, 0, 0], n: 0 }, tex: { s: [0, 0, 0, 0, 0, 0], n: 0 }, cal: { s: Array(10).fill(0), v: Array(10).fill(0), n: 0 } } };
  ['lec', 'tex', 'cal'].forEach(h => { g[h] = { ne: 0, ed: 0, ra: 0 }; });
  als.forEach(a => ['lec', 'tex', 'cal'].forEach(h => {
    const r = a[h]; if (!r || !r.n) return;
    g[h][r.n.toLowerCase()]++;
    const cp = g.comp[h]; cp.n++;
    if (h === 'cal') (r.c || []).slice(0, 10).forEach((x, i) => {
      if (x === '1v' || x === 'v') { g.tip.ca++; cp.s[i]++; cp.v[i]++; } else if (x === '1') { g.tip.sa++; cp.s[i]++; } else g.tip.inc++;
    });
    else (r.c || []).slice(0, 6).forEach((x, i) => { cp.s[i] += Math.max(0, Math.min(3, +x || 0)); });
  }));
  ['lec', 'tex', 'cal'].forEach(h => { if (!g.comp[h].n) delete g.comp[h]; });
  return g;
}

/* ---- Alumnos de una escuela (se piden al servidor solo cuando se consulta esa escuela) ---- */
const SIA = {};   // 'ciclo|cct' → { alumnos: [], cargando: Promise }
function sisAlumnosDe(ciclo, cct) { const x = SIA[ciclo + '|' + cct]; return x && x.alumnos ? x.alumnos : null; }
async function sisPedirAlumnos(ciclo, cct, forzar) {
  const k = ciclo + '|' + cct;
  if (!cct || !S) return [];
  if (S.version && S.version < 8) { SIA[k] = { alumnos: [], viejo: true }; return []; }
  if (SIA[k] && !forzar) return SIA[k].cargando || SIA[k].alumnos;
  SIA[k] = { cargando: api('sisatAlumnos', { ciclo, cct }).then(r => { SIA[k] = { alumnos: (r.alumnos || []).map(sisNormAlumno) }; return SIA[k].alumnos; })
    .catch(e => { SIA[k] = { alumnos: [], error: e.message }; return []; }) };
  return SIA[k].cargando;
}
function sisNormAlumno(a) {
  const r = x => x && typeof x === 'object' && !Array.isArray(x) ? { c: x.c || [], p: x.p == null ? null : +x.p, v: x.v == null ? null : +x.v, n: x.n || '' } : null;
  return Object.assign({}, a, { momento: +a.momento, grado: String(a.grado), grupo: String(a.grupo || ''), num: +a.num || 0, lec: r(a.lec), tex: r(a.tex), cal: r(a.cal), clave: sisClave(a.alumno) });
}

/* ---- Carga desde los Excel ---- */
// Lee de una vez todos los Excel de la carpeta del momento; si todo cuadra, guarda sin preguntar
async function sisLeerDeDrive(cct, m) {
  const r = await api('sisatArchivos', { cct, momento: m, excel: true });
  if (!r.archivos.length) return { sinArchivos: true, mensaje: r.mensaje || 'No hay Excel en ' + (r.ruta || 'la carpeta del SisAT') + '.' };
  const b = await api('sisatBajar', { cct, momento: m, ids: r.archivos.map(a => a.id) });
  return { leidos: await Promise.all(b.archivos.map(a => sisLeerArchivo({ id: a.id, nombre: a.nombre, fecha: a.fecha, bytes: b64aBytes(a.datos) }).catch(e => ({ nombre: a.nombre, error: e.message })))) };
}
async function sisImportarEscuela(cct, m) {
  const r = await conCarga(() => sisLeerDeDrive(cct, m));
  if (!r) return;
  if (r.sinArchivos) { aviso(esc(r.mensaje) + ' La escuela debe subir ahí los archivos de la herramienta del SisAT (herrLectura, herrTextos y herrCalculo de cada grupo).', 'mal', 9000); return; }
  await sisRevisarExcel(cct, m, r.leidos, { subir: false, auto: true });
}

async function sisExcelSubidos(cct, m, archivos, alTerminar) {
  const lista = Array.from(archivos || []);
  if (!lista.length) return;
  const grandes = lista.filter(f => f.size > 5 * 1024 * 1024);
  if (grandes.length) { aviso('Estos archivos pesan más de 5 MB y no parecen del SisAT: ' + esc(grandes.map(f => f.name).join(', ')), 'mal', 9000); return; }
  const leidos = await conCarga(() => Promise.all(lista.map(async f => {
    const bytes = new Uint8Array(await f.arrayBuffer());
    return sisLeerArchivo({ nombre: f.name, fecha: new Date(f.lastModified || Date.now()).toISOString().slice(0, 16), bytes, tipoMime: f.type }).catch(e => ({ nombre: f.name, error: e.message }));
  })));
  if (leidos) sisRevisarExcel(cct, m, leidos, { subir: true }, alTerminar);
}

// Sugerencia de grado y grupo: el grupo de otro momento del ciclo con más alumnos en común
function sisSugerir(claves, previos) {
  const porGrupo = {};
  previos.forEach(a => { const k = a.grado + '|' + a.grupo; (porGrupo[k] = porGrupo[k] || new Set()).add(a.clave); });
  let mejor = null, mc = 0;
  Object.entries(porGrupo).forEach(([k, set]) => { let n = 0; claves.forEach(c => { if (set.has(c)) n++; }); const c = n / Math.max(1, Math.min(claves.length, set.size)); if (c > mc) { mc = c; mejor = k; } });
  if (!mejor || mc < 0.5) return null;
  const [grado, grupo] = mejor.split('|');
  return { grado, grupo, coincidencia: Math.round(mc * 100) };
}

// Asigna grado y grupo comparando los resultados de cada Excel con los grupos ya guardados (cuántos alumnos en cada nivel)
function sisAsignarPorConteo(grupos, filas) {
  if (!filas.length) return;
  const usados = new Set(grupos.filter(g => g.grado).map(g => g.grado + '|' + g.grupo));
  const pares = [];
  grupos.filter(g => !g.grado).forEach(g => {
    const a = sisDeAlumnos(g.alumnos);
    filas.forEach(r => {
      if (usados.has(r.grado + '|' + r.grupo)) return;
      let d = 0; ['lec', 'tex', 'cal'].forEach(h => ['ne', 'ed', 'ra'].forEach(k => { d += Math.abs((r[h][k] || 0) - a[h][k]); }));
      pares.push({ g, r, d });
    });
  });
  pares.sort((x, y) => x.d - y.d);
  pares.forEach(p => {
    if (p.g.grado || usados.has(p.r.grado + '|' + p.r.grupo)) return;
    if (p.d > Math.max(3, Math.round(p.g.alumnos.length * 0.15))) return;
    // si otro grupo guardado queda igual de cerca, no se adivina
    if (pares.some(q => q.g === p.g && q.r !== p.r && q.d === p.d && !usados.has(q.r.grado + '|' + q.r.grupo))) return;
    p.g.grado = p.r.grado; p.g.grupo = p.r.grupo; p.g.sug = { grado: p.r.grado, grupo: p.r.grupo, porConteo: true };
    usados.add(p.r.grado + '|' + p.r.grupo);
  });
}

const sisTemaDe = (grado, m, i) => { const l = SIS_PREG_TEMA[sisGradoMaterial(grado, m)]; return l ? l[i] : ''; };

function sisFocos(comp, al, m, grados, filas) {

/* ---- Rezago: alumnos en rojo en las tres habilidades, o con puntajes muy bajos ---- */
const sisMuyBajo = a => (a.lec && a.lec.p != null && a.lec.p <= 7) || (a.tex && a.tex.p != null && a.tex.p <= 7) || (a.cal && a.cal.p != null && a.cal.p <= 2);

function sisRezago(al, sin1) {
  const rez = al.filter(a => sisNumRA(a, sin1) === 3), riesgo = al.filter(a => sisNumRA(a, sin1) === 2);

/* ---- Análisis por componente y por alumno (cuando los resultados vienen de los Excel) ---- */
// Suma de componentes de varios grupos. sin1: en concentrados del Momento 1, 1.° grado no cuenta en lectura ni textos.
function sisCompSuma(filas, sin1) {
  const c = { lec: { s: [0, 0, 0, 0, 0, 0], n: 0 }, tex: { s: [0, 0, 0, 0, 0, 0], n: 0 }, cal: { s: Array(10).fill(0), v: Array(10).fill(0), n: 0 } };

  filas.forEach(r => {
    const k = r.comp && !Array.isArray(r.comp) ? r.comp : null; if (!k) return;
    ['lec', 'tex', 'cal'].forEach(h => {

const sisCompPc = (c, h, i) => c && c[h] && c[h].n ? Math.round(c[h].s[i] * 1000 / (c[h].n * (h === 'cal' ? 1 : 3))) / 10 : null;
