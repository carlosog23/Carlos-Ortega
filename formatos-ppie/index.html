if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.tipo==="completo"){try{if(!e.data.fallas)localStorage.setItem("tlm-completo","1")}catch(x){}
    pintaEquipo();const m=document.getElementById("eq_msg");if(m)m.innerHTML=e.data.fallas?"<b>No se pudieron guardar algunos archivos.</b> Revise su conexión e inténtelo de nuevo.":"Listo: todos los formatos quedaron guardados en este equipo."}})}
/* aviso cuando no hay internet */
function tlmRed(){let b=document.getElementById("sinRed");if(navigator.onLine){if(b)b.remove();return}
  if(!b){b=document.createElement("div");b.id="sinRed";b.className="sin-red";b.setAttribute("role","status");b.innerHTML="<b>Sin internet.</b> Puede seguir usando Tlamatini con lo que ya está guardado en este equipo.";document.body.prepend(b)}}
window.addEventListener("online",tlmRed);window.addEventListener("offline",tlmRed);
/* respaldo: solo los datos de Tlamatini (no contraseñas ni enlaces de acceso) */
const RESP_EXACTAS=["firma-docente","libro-firmas","logo-escuela","libro-visitas","logo-zona","libro-visitas-logo","tlm-tour-visto"];
const respClave=k=>k.startsWith("ppie-")||RESP_EXACTAS.includes(k);
function respaldoDescargar(){const datos={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(respClave(k))datos[k]=localStorage.getItem(k)}}catch(e){}
  const n=Object.keys(datos).length;if(!n){alert("Todavía no hay datos guardados para respaldar.");return}
  const hoy=today(),esc0=(perfil.escuela||"").replace(/[\\/:*?"<>|«»]/g,"").trim();
  const blob=new Blob([JSON.stringify({app:"Tlamatini",tipo:"respaldo",version:1,fecha:new Date().toISOString(),escuela:perfil.escuela||"",datos})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Respaldo Tlamatini${esc0?" - "+esc0:""} - ${hoy}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  try{localStorage.setItem("tlm-ultimo-respaldo",hoy)}catch(e){}const m=document.getElementById("eq_msg");if(m)m.textContent=`Respaldo descargado (${n} apartados). Guárdelo en su Drive, correo o WhatsApp para no perderlo.`}
function respaldoRestaurar(file){const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){alert("El archivo no es un respaldo de Tlamatini.");return}
    if(!o||o.app!=="Tlamatini"||!o.datos||typeof o.datos!=="object"){alert("El archivo no es un respaldo de Tlamatini.");return}
    const ks=Object.keys(o.datos).filter(respClave);const f=o.fecha?new Date(o.fecha).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}):"";
    if(!confirm(`Se restaurarán ${ks.length} apartados del respaldo${o.escuela?" de "+o.escuela:""}${f?" del "+f:""}.\n\nLo que tenga ahora en este equipo en esos apartados se reemplazará. ¿Continuar?`))return;
    try{ks.forEach(k=>localStorage.setItem(k,o.datos[k]))}catch(e){alert("No se pudo restaurar todo: el espacio del navegador está lleno.");return}
    alert("Respaldo restaurado. Tlamatini se volverá a abrir con sus datos.");location.reload()};rd.readAsText(file)}

    :`<p class="help">Para instalarla: abra el menú del navegador (⋮) y elija <b>«Instalar aplicación»</b> o <b>«Agregar a la pantalla de inicio»</b>.</p>`;
  return`<div><h3>Tlamatini en este equipo</h3><p class="muted" style="font-size:15px">Instálela como app, úsela sin internet y respalde su información.</p></div>
   ${inst}
   <div class="eq-fila"><div><b>Sin internet</b><p class="help">${completo?"Todos los formatos están guardados: puede trabajar sin conexión.":"Los formatos principales ya se guardan solos. Para tener también el Consejo, la estadística y las demás plantillas, guárdelos una vez con internet."}</p></div>
    ${completo?"":`<button type="button" class="btn ghost" id="eq_todo">Guardar todos los formatos (5 MB)</button>`}</div>
   <div class="eq-fila"><div><b>Respaldo de mis datos</b><p class="help">Sus datos viven solo en este equipo. Descargue un respaldo para pasarlos a otro teléfono o no perderlos.${ult?` Último respaldo: ${esc(fmtDate(ult,"larga"))}.`:""}</p></div>

/* --- Excel: plantilla, descarga y lectura --- */
async function dirPlantilla(t,conDatos){await loadScript("lib/exceljs.min.js");const wb=new ExcelJS.Workbook();wb.creator="Tlamatini";
  const ws=wb.addWorksheet(DIR_HOJA[t],{views:[{state:"frozen",ySplit:1}]});const C=dirCampos(t);
  ws.columns=C.map(f=>({header:f.l,key:f.k,width:Math.max(12,Math.min(38,f.l.length+4,f.t==="area"?38:30))}));
  const h=ws.getRow(1);h.font={bold:true,color:{argb:"FFFFFFFF"}};h.alignment={vertical:"middle",wrapText:true};h.height=34;
  h.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF24427A"}};c.border={bottom:{style:"thin",color:{argb:"FF999999"}}}});
  let filas=conDatos?DIR_LISTA(t).slice().sort(t==="escuelas"?()=>0:dirOrden):[];
  if(!conDatos&&t==="alumnos"){const g=document.getElementById("dir_gr"),p=document.getElementById("dir_gp");const gr=dirGrado(g?g.value:""),gp=dirGrupo(p?p.value:"");if(gr||gp)filas=Array.from({length:30},()=>({grado:gr,grupo:gp}))}
  if(!conDatos&&t==="maestros")filas=[];
  filas.forEach(o=>ws.addRow(C.reduce((r,f)=>{let v=o[f.k];if(f.t==="check")v=v?"Sí":(conDatos?"No":"");r[f.k]=v??"";return r},{})));
  const n=Math.max(filas.length+50,100);
  C.forEach((f,ci)=>{const opts=f.opts||(f.t==="check"?["Sí","No"]:null);if(!opts)return;const col=ws.getColumn(ci+1).letter;
    for(let r=2;r<=n;r++)ws.getCell(`${col}${r}`).dataValidation={type:"list",allowBlank:true,formulae:[`"${opts.join(",").replace(/"/g,"")}"`]}});
  ["curp","rfc","celular","telefono","t1tel","t2tel","e1tel","e2tel","cct"].forEach(k=>{const ci=C.findIndex(f=>f.k===k);if(ci>=0)ws.getColumn(ci+1).numFmt="@"});
  const buf=await wb.xlsx.writeBuffer();const nom=conDatos?`Directorio de ${DIR_HOJA[t].toLowerCase()}${perfil.escuela&&t!=="escuelas"?" - "+perfil.escuela:""}.xlsx`:`Plantilla Tlamatini - ${DIR_HOJA[t]}.xlsx`;
  dirBajar(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),nom.replace(/[\\/:*?"<>|«»]/g,""));
  const m=document.getElementById("dir_msg");if(m)m.innerHTML=conDatos?"Excel descargado.":"Plantilla descargada. Llénela (un renglón por "+({escuelas:"escuela",maestros:"maestro",alumnos:"alumno"}[t])+") y súbala con «Subir Excel». También sirve su propio Excel: Tlamatini reconoce las columnas por su encabezado."}
function dirBajar(blob,nombre){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=String(nombre).replace(/[°º]/g,"").replace(/\s+/g," ");document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function dirCelda(v){if(v==null)return"";if(v instanceof Date){const d=v;return`${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`}
  if(typeof v==="object"){if(v.richText)return v.richText.map(r=>r.text).join("");if(v.text!==undefined)return dirCelda(v.text);if(v.result!==undefined)return dirCelda(v.result);if(v.hyperlink)return String(v.hyperlink).replace(/^mailto:/,"");return""}

<script>
/* ---------- Contador de uso (GoatCounter) ----------
   Cuenta aperturas, apartados visitados y formatos generados. No envía nombres, CURP ni datos de alumnos:
   solo el nombre del apartado, y la escuela (CCT) o la zona para saber de dónde se usa.

const USO_VISTA={home:"Inicio",setup:"Bienvenida",setupsub:"Configuración",setupotra:"Configuración",perfil:"Datos de mi escuela",edades:"Edades de los alumnos",libro:"Libro de visitas",firmas:"Libro de firmas",normas:"Normatividad",calendario:"Calendario escolar",salario:"Salario anual",dx:"Lectura de la realidad",pmce:"Programa de Mejora Continua",pa:"Programa Analítico",plan:"Planeación didáctica",recado:"Recados y avisos",inventario:"Inventarios",consejo:"Consejo de Participación Escolar",asistencia:"Lista de asistencia",alum:"Datos de alumnos (PDF)",eia:"EIA",dir:"Directorio",admin:"Supervisión: seguro",caladmin:"Supervisión: calendario",accadmin:"Supervisión: acceso",bloqueo:"Acceso bloqueado"};
