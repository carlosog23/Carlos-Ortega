/* ---------------- Checklist de acuerdos: consultas ---------------- */
const TIPOS_REU = { reunion: 'Reunión de directores', ctz: 'Consejo Técnico de Zona', cte: 'Consejo Técnico Escolar', mesa: 'Reunión de Mesa Técnica', otro: 'Otra reunión' };
const reuniones = () => (S.reu || []).slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
const acuerdosReu = id => (S.acu || []).filter(x => x.reunionId === id).sort((a, b) => (+a.orden || 0) - (+b.orden || 0));
const aplicaA = (x, cct) => !(x.escuelas || []).length || x.escuelas.includes(cct);
const marcaDe = (acuId, cct) => (S.cum || []).find(m => m.id === acuId + '|' + cct);
const estadoDe = (acuId, cct) => { const m = marcaDe(acuId, cct); return m ? m.estado : 'pendiente'; };
const limiteVencido = x => !!x.limite && x.limite < hoy();
function avance(lista, ccts) {
  const r = { hecho: 0, total: 0, noAplica: 0, vencidos: 0 };
  lista.forEach(x => ccts.forEach(c => {
    if (!aplicaA(x, c)) return;
    const e = estadoDe(x.id, c);
    if (e === 'no_aplica') { r.noAplica++; return; }
    r.total++;
    if (e === 'hecho') r.hecho++; else if (limiteVencido(x)) r.vencidos++;
  }));
  r.pct = r.total ? Math.round(r.hecho * 100 / r.total) : 0;
  r.pend = r.total - r.hecho;
  return r;
}
function acuerdosFiltro() {
  return (S.acu || []).filter(x => !vista.acuReu || x.reunionId === vista.acuReu);
}
function anillo(pct, tam = 128, etiqueta = 'cumplido') {
  const r = 52, c = 2 * Math.PI * r, lleno = c * pct / 100;
  return `<svg class="anillo" width="${tam}" height="${tam}" viewBox="0 0 128 128" role="img" aria-label="${pct}% ${etiqueta}">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--arena-2)" stroke-width="13"/>
    ${pct > 0 ? `<circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--indigo)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${Math.max(lleno - 0.01, 0.01)} ${c}" transform="rotate(-90 64 64)"/>` : ''}
    <text x="64" y="66" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="var(--tinta)">${pct}%</text>
    <text x="64" y="86" text-anchor="middle" font-size="12" fill="var(--gris)">${etiqueta}</text>
  </svg>`;
}
const barraAv = (a, titulo) => `<span class="barra-av" title="${esc(titulo || '')}${titulo ? ': ' : ''}${a.hecho} de ${a.total} cumplidos (${a.pct}%)"><i style="width:${a.pct}%"></i></span>`;

function tarjetaReunion(r, ccts) {
  const acs = acuerdosReu(r.id), a = avance(acs, ccts);
  const secciones = [];
  acs.forEach(x => { let s = secciones.find(y => y[0] === x.seccion); if (!s) secciones.push(s = [x.seccion, []]); s[1].push(x); });
  return `<div class="tarjeta reunion" id="r-${r.id}">
    <div class="reunion-cab">

/* Palomear un acuerdo en varias escuelas a la vez */
function palomearAcuerdo(id) {
  const x = S.acu.find(a => a.id === id); if (!x) return;
  const dirs = directores().filter(c => aplicaA(x, c.cct));
  const r = S.reu.find(y => y.id === x.reunionId);
  const cuerpo = `
  <p style="margin-top:0"><b>${esc(x.numero)}.</b> ${esc(x.texto)}</p>
  <p class="peq mudo" style="margin-top:-6px">${r ? esc(r.titulo) + ' · ' : ''}${esc(x.plazo || 'Sin fecha')}</p>
  <div class="rapidos"><button type="button" class="boton sec chico" id="p-todas">Todas cumplieron</button><button type="button" class="boton sec chico" id="p-ninguna">Quitar todas</button></div>
  <div class="checklist" id="p-lista">${dirs.map(c => { const e = estadoDe(x.id, c.cct); return `<div class="chk-fila" data-cct="${c.cct}" data-ini="${e}">
    <label class="chk"><input type="checkbox" ${e === 'hecho' ? 'checked' : ''} ${e === 'no_aplica' ? 'disabled' : ''}><span><b>${esc(c.escuela)}</b><br><span class="ayuda">${esc(c.municipio)}${c.multigrado ? ' · multigrado' : ''}</span>${S.evi ? ' ' + chipEvi(x.id, c.cct) : ''}</span></label>
    <label class="na"><input type="checkbox" ${e === 'no_aplica' ? 'checked' : ''}> No aplica</label></div>`; }).join('')}</div>`;
  modal('Palomear acuerdo', cuerpo, '<button class="boton sec" id="p-cancelar">Cancelar</button><button class="boton terra" id="p-guardar">Guardar</button>');
  $$('#p-lista .na input').forEach(n => n.onchange = () => { const h = n.closest('.chk-fila').querySelector('.chk input'); h.disabled = n.checked; if (n.checked) h.checked = false; });
  $('#p-todas').onclick = () => $$('#p-lista .chk input').forEach(i => { if (!i.disabled) i.checked = true; });
  $('#p-ninguna').onclick = () => $$('#p-lista .chk input').forEach(i => { i.checked = false; });
  $('#p-cancelar').onclick = cerrarModal;
  $('#p-guardar').onclick = () => {
    const marcas = $$('#p-lista .chk-fila').map(f => {

    if (!marcas.length) return cerrarModal();
    accion('marcar', { marcas }, res => { res.cum.forEach(m => poner(S.cum, m)); cerrarModal(); pintar(); aviso('Checklist actualizado: ' + marcas.length + ' escuela' + (marcas.length === 1 ? '' : 's') + '.', 'ok', 2500); });
  };
}

/* Asignar escuelas a cada ATP (solo Supervisión) */
function formAsignacion() {
  const lista = atps().filter(u => contactoAtp(u));
  const cuerpo = `<p class="peq" style="margin-top:0">Elija el ATP que atiende cada escuela. El avance de cada ATP se calcula con el checklist de sus escuelas.</p>
    <div class="checklist">${directores().map(c => { const a = atpDe(c.cct); return `<div class="chk-fila" style="align-items:center"><div style="flex:1;min-width:0"><b>${esc(c.escuela)}</b><br><span class="ayuda">${esc(c.municipio)}${c.multigrado ? ' · multigrado' : ''}</span></div>
      <select data-asig="${c.cct}" aria-label="ATP de ${esc(c.escuela)}" style="border:1px solid var(--borde);border-radius:8px;padding:6px 8px;background:#fff;max-width:52%"><option value="">Sin ATP</option>${lista.map(u => `<option value="${u.id}" ${a && a.id === u.id ? 'selected' : ''}>${esc(nombreCorto(u.nombre))}</option>`).join('')}</select></div>`; }).join('')}</div>`;
  modal('Escuelas de cada ATP', cuerpo, '<button class="boton sec" id="as-cancelar">Cancelar</button><button class="boton terra" id="as-guardar">Guardar</button>');
  $('#as-cancelar').onclick = cerrarModal;
  $('#as-guardar').onclick = async () => {
    const nuevo = {}; lista.forEach(u => nuevo[u.id] = []);
    $$('[data-asig]').forEach(sel => { if (sel.value) nuevo[sel.value].push(sel.dataset.asig); });
    for (const u of lista) {
      const antes = escuelasDeAtp(u).slice().sort().join(','), ahora_ = nuevo[u.id].slice().sort().join(',');
      const c = contactoAtp(u);
      if (antes === ahora_ && c.cct) continue;
      const r = await accion('guardarContacto', Object.assign({}, c, { cct: nuevo[u.id].join(',') || '-' }), res => poner(S.dir, res.contacto));
      if (!r) return;
    }
    cerrarModal(); pintar(); aviso('Asignación guardada.', 'ok', 2500);
  };
}

/* Cargar las reuniones que ya traen sus acuerdos */
async function cargarSemilla(paquetes) {
  const todas = directores();
  for (const p of paquetes) {
    const d = JSON.parse(JSON.stringify(p));
    d.actividades.forEach(a => { a.escuelas = todas.map(c => c.cct); a.destinatarios = todas.map(c => c.id); a.responsables = [S.yo.id]; });
    const r = await accion('guardarReunion', d, res => recibirReunion(res));
    if (!r) return;
  }
  vista.acuReu = ''; pintar();
  aviso('Acuerdos cargados. Ya puede palomear lo que cada escuela haya cumplido.', 'ok', 5000);
}
function recibirReunion(res) {
  poner(S.reu, res.reunion);
  S.acu = S.acu.filter(x => x.reunionId !== res.reunion.id).concat(res.acuerdos);
  (res.act || []).forEach(a => poner(S.act, a));
}

/* ---------------- Evidencias en el Drive «Supervisión 050» ---------------- */
const RAIZ_DRIVE = 'https://drive.google.com/drive/folders/1ZfvGdYObOhxG9oyixzOviuaC5OCVLc9D';
// Carpetas ligadas a acuerdos del checklist (la evidencia aparece con 📎 junto al acuerdo)
const LIGAS_EVI = [
  { ruta: '02-Evidencias 2026-2027/CTEs/01-CTE Primera sesión', acu: ['acu-0923-01'] },
  { ruta: '02-Evidencias 2026-2027/PMC', acu: ['acu-0909-05', 'acu-0923-05'] },
  { ruta: '02-Evidencias 2026-2027/Érase una vez', acu: ['acu-0923-15'] },
  { ruta: '04-CPE', acu: ['acu-0909-01'] },
  { ruta: '05-Estadística 911', acu: ['acu-0909-06'] },
  { ruta: '07-SISAT', acu: ['acu-0909-07'] },
  { ruta: '08-Niveles conceptuales', acu: ['acu-0909-07'] },
  { ruta: '09-Ejercicios Integradores del Aprendizaje', acu: ['acu-0909-08', 'acu-0909-09'] }
];
const CORTOS_EVI = { 'expedientes de trabajadores': 'Expedientes', 'ejercicios integradores del aprendizaje': 'EIA', 'inscripcion inicial': 'Inscripción', 'niveles conceptuales': 'Niveles conc.', 'sisat': 'SisAT' };
const sinNum = t => String(t || '').replace(/^\s*\d+\s*[-.]\s*/, '');
const clave = t => sinNum(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
/* Las columnas salen de las carpetas que existen en el Drive: cada carpeta del primer nivel es una columna,
   y las que se llaman «Evidencias…» se abren en sus subcarpetas. Si crea una carpeta nueva, aparece sola. */
function columnasEvi() {
  const rows = (S.evi || []).filter(e => e.ruta);
  const nivel1 = [...new Set(rows.filter(e => !e.ruta.includes('/')).map(e => e.ruta))];
  const cols = [];
  nivel1.sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).forEach(r => {
    if (/^evidencias/i.test(clave(r))) {
      const hijos = [...new Set(rows.filter(e => e.ruta.split('/').length === 2 && e.ruta.startsWith(r + '/')).map(e => e.ruta))].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
      hijos.forEach(h => cols.push({ ruta: h, corto: CORTOS_EVI[clave(h.split('/')[1])] || sinNum(h.split('/')[1]) }));
      if (!hijos.length) cols.push({ ruta: r, corto: sinNum(r) });
    } else cols.push({ ruta: r, corto: CORTOS_EVI[clave(r)] || sinNum(r) });
  });
  // la misma carpeta escrita distinto en dos escuelas cuenta como una sola columna
  const vistas = {};
  return cols.filter(c => { const k = normRuta(c.ruta); if (vistas[k]) return false; vistas[k] = 1; return true; });
}
const normRuta = r => String(r || '').normalize('NFC').toLowerCase().trim();
const eviDe = (cct, ruta) => (S.evi || []).find(e => e.cct === cct && normRuta(e.ruta) === normRuta(ruta));
const nArch = e => e ? (+e.archivos || 0) : 0;
const urlCarpeta = id => 'https://drive.google.com/drive/folders/' + id;
const urlArchivo = id => 'https://drive.google.com/file/d/' + id + '/view';
function quienSubio(correo) {
  if (!correo) return '';
  const c = S.dir.find(x => correos(x).map(m => m.toLowerCase()).includes(String(correo).toLowerCase()));
  if (c) return nombreCorto(c.nombre);
  const u = S.usr.find(x => correos(x).map(m => m.toLowerCase()).includes(String(correo).toLowerCase()));
  return u ? nombreCorto(u.nombre) : correo;
}
const fechaHora = f => /^\d{4}-\d{2}-\d{2}/.test(f || '') ? fechaCorta(f.slice(0, 10)) + (f.length > 10 ? ' ' + f.slice(11, 16) : '') : '';
// Evidencia en Drive ligada a un acuerdo del checklist
function eviAcuerdo(acuId, cct) {
  let mejor = null;
  LIGAS_EVI.filter(c => (c.acu || []).includes(acuId)).forEach(c => { const e = eviDe(cct, c.ruta); if (nArch(e) && (!mejor || e.ultimo > mejor.e.ultimo)) mejor = { c: Object.assign({ corto: sinNum(c.ruta.split('/').pop()) }, c), e }; });
  return mejor;
}
const chipEvi = (acuId, cct) => { const m = eviAcuerdo(acuId, cct); return m ? `<a class="chip ok" target="_blank" rel="noopener" href="${urlCarpeta(m.e.carpetaId)}" title="Abrir la carpeta ${esc(m.c.corto)} en Drive">📎 ${nArch(m.e)} en Drive · ${fechaCorta(m.e.ultimo.slice(0, 10))}</a>` : ''; };
function avanceEvi(ccts) {
  let con = 0, total = 0;
  const cols = columnasEvi();
  ccts.forEach(cct => cols.forEach(c => { const e = eviDe(cct, c.ruta); if (!e) return; total++; if (nArch(e)) con++; }));
  return { hecho: con, total, pct: total ? Math.round(con * 100 / total) : 0, pend: total - con, vencidos: 0 };
}

/* ---------------- SisAT · Sistema de Alerta Temprana ----------------

const SIS_N = [['ne', 'Nivel esperado'], ['ed', 'En desarrollo'], ['ra', 'Requiere apoyo']];
const SIS_PRIORIDAD = 40;   // % de «requiere apoyo» a partir del cual un grupo es prioritario
const SIS_SEMILLA = [{

    ['2-B', [3, 11, 15], [0, 6, 23], [13, 9, 7], [72, 117, 101]], ['2-A', [8, 7, 12], [4, 15, 8], [10, 8, 9], [56, 103, 111]],
    ['1-B', [0, 0, 25], [0, 0, 25], [5, 13, 7], [28, 106, 116]], ['1-A', [0, 0, 29], [0, 0, 29], [5, 3, 21], [20, 76, 194]]
  ].map(([e, l, t, c, p]) => Object.assign(sisEtiqueta(e), { lec: { ne: l[0], ed: l[1], ra: l[2] }, tex: { ne: t[0], ed: t[1], ra: t[2] }, cal: { ne: c[0], ed: c[1], ra: c[2] }, tip: { sa: p[0], ca: p[1], inc: p[2] } }))
}];

function cicloActual() { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? y + '-' + (y + 1) : (y - 1) + '-' + y; }
function sisV() {
  if (!vista.sis) vista.sis = { ciclo: cicloActual(), m: 1, nivel: esDirector() ? 'escuela' : 'zona', cct: miCct(), grado: '', grupo: '', con1: false, orden: 'necesidad' };
  return vista.sis;
}
// «6-B», «6° B», «6B», «1-A» → { grado: '6', grupo: 'B' }
function sisEtiqueta(t) {
  const m = String(t || '').toUpperCase().match(/([1-6])\s*[°º.]?\s*[-–—]?\s*([A-Z0-9]{0,3})/);
  return m ? { grado: m[1], grupo: m[2] || '' } : { grado: '', grupo: String(t || '').trim() };
}
const sisNomGrupo = r => r.grado + '°' + (r.grupo ? ' ' + r.grupo : '');
const sisPc = (x, n) => n ? Math.round(x * 1000 / n) / 10 : null;
const sisFmt = v => v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('es-MX') + '%';
function sisNorm(r) {
  const n = o => ({ ne: +((o || {}).ne) || 0, ed: +((o || {}).ed) || 0, ra: +((o || {}).ra) || 0 });
  const t = r.tip || {};
  return Object.assign({}, r, { momento: +r.momento, grado: String(r.grado), grupo: String(r.grupo || ''), lec: n(r.lec), tex: n(r.tex), cal: n(r.cal), tip: { sa: +t.sa || 0, ca: +t.ca || 0, inc: +t.inc || 0 } });
}
function sisFilas(m) { const v = sisV(); return (S.sis || []).filter(r => r.ciclo === v.ciclo && +r.momento === +m).map(sisNorm); }
function sisCiclos() { const s = new Set((S.sis || []).map(r => r.ciclo)); s.add(cicloActual()); return Array.from(s).sort().reverse(); }
function sisMomentosConDatos(pred) { return [1, 2, 3].filter(m => sisFilas(m).some(pred)); }

// Qué filas entran en el nivel que se está viendo
function sisPred(v) {
  const enZona = cct => esDirector() || filtroEscuelas().some(c => c.cct === cct);
  return {
    zona: r => enZona(r.cct),
    zgrado: r => enZona(r.cct) && r.grado === v.grado,
    escuela: r => r.cct === v.cct,
    grado: r => r.cct === v.cct && r.grado === v.grado,
    grupo: r => r.cct === v.cct && r.grado === v.grado && r.grupo === v.grupo
  }[v.nivel];
}
// En el Momento 1, primer grado todavía no lee ni escribe de forma convencional: en los concentrados de varios grados se excluye de lectura y escritura (se puede activar)
const sisSin1 = (v, m) => +m === 1 && !v.con1 && (v.nivel === 'zona' || v.nivel === 'escuela');
function sisSuma(filas, sin1) {
  const a = { grupos: filas.length, tip: { sa: 0, ca: 0, inc: 0 } };
  SIS_H.forEach(([h]) => { a[h] = { ne: 0, ed: 0, ra: 0 }; });
  filas.forEach(r => {
    SIS_H.forEach(([h]) => { if (sin1 && h !== 'cal' && r.grado === '1') return; a[h].ne += r[h].ne; a[h].ed += r[h].ed; a[h].ra += r[h].ra; });
    a.tip.sa += r.tip.sa; a.tip.ca += r.tip.ca; a.tip.inc += r.tip.inc;
  });
  SIS_H.forEach(([h]) => {
    const o = a[h]; o.n = o.ne + o.ed + o.ra;
    o.pne = sisPc(o.ne, o.n); o.ped = sisPc(o.ed, o.n); o.pra = sisPc(o.ra, o.n);
    o.ind = o.n ? Math.round((o.ne * 100 + o.ed * 50) / o.n) : null;
  });
  const t = a.tip; t.n = t.sa + t.ca + t.inc; t.psa = sisPc(t.sa, t.n); t.pca = sisPc(t.ca, t.n); t.pinc = sisPc(t.inc, t.n);
  t.pcaAc = sisPc(t.ca, t.sa + t.ca);
  const inds = SIS_H.map(([h]) => a[h].ind).filter(x => x != null);
  a.ind = inds.length ? Math.round(inds.reduce((s, x) => s + x, 0) / inds.length) : null;
  a.maxRa = Math.max(0, ...SIS_H.map(([h]) => a[h].pra || 0));
  a.alumnos = filas.reduce((s, r) => s + Math.max(...SIS_H.map(([h]) => r[h].ne + r[h].ed + r[h].ra)), 0);
  return a;
}
const sisColorInd = i => i == null ? 'var(--borde)' : i >= 70 ? 'var(--ok)' : i >= 50 ? 'var(--ambar)' : 'var(--alerta)';
function sisBarra(o, alto = 12) {
  if (!o || !o.n) return '<span class="sis-sin">Sin datos</span>';
  return `<span class="sis-barra" style="height:${alto}px" role="img" aria-label="Nivel esperado ${sisFmt(o.pne)}, en desarrollo ${sisFmt(o.ped)}, requiere apoyo ${sisFmt(o.pra)}"><i class="ne" style="width:${o.pne}%"></i><i class="ed" style="width:${o.ped}%"></i><i class="ra" style="width:${o.pra}%"></i></span>`;
}
function sisDelta(act, prev, inverso) {
  if (act == null || prev == null) return '';
  const d = Math.round((act - prev) * 10) / 10;
  if (Math.abs(d) < 0.5) return '<span class="sis-d igual">sin cambio</span>';
  const bueno = inverso ? d < 0 : d > 0;
  return `<span class="sis-d ${bueno ? 'bien' : 'mal'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString('es-MX')} pts</span>`;
}
// Etiqueta del nivel para títulos, migas y observaciones
function sisRef(v) { return { zona: '', zgrado: v.grado, escuela: v.cct, grado: v.cct + '|' + v.grado, grupo: v.cct + '|' + v.grado + '|' + v.grupo }[v.nivel]; }
function sisTitulo(v) {
  if (v.nivel === 'zona') return esDirector() ? 'Zona 050 (promedio general)' : 'Zona 050';
  if (v.nivel === 'zgrado') return v.grado + '.° grado en la zona';
  if (v.nivel === 'escuela') return nombreEscuela(v.cct);
  if (v.nivel === 'grado') return v.grado + '.° grado · ' + nombreEscuela(v.cct);
  return sisNomGrupo(v) + ' · ' + nombreEscuela(v.cct);
}

/* ---- Diagnóstico automático ---- */
const SIS_SUGERENCIA = {
  lec: 'Lectura en voz alta todos los días con textos breves y el modelado del docente; lectura repetida del mismo texto para ganar fluidez; preguntas de comprensión antes, durante y después de leer, y uso de la biblioteca de aula.',
  tex: 'Escritura diaria con propósito real (recados, cartas, instructivos, notas); borrador, revisión entre pares y versión final; trabajar puntuación, conectores y ortografía dentro de los propios textos del alumnado.',
  cal: 'Rutina diaria de 10 minutos de cálculo mental (dobles, complementos a 10, descomposición, sumas y restas de memoria); pedir que expliquen su estrategia y retirar poco a poco el apoyo visual.'
};
function sisDiagListas(a, prev, hijos, ctx) {
  const F = [], A = [], G = [];
  const nom = h => SIS_H.find(x => x[0] === h)[1];
  if (!a || !a.grupos) return null;
  SIS_H.forEach(([h]) => {
    const o = a[h]; if (!o.n) return;
    if (o.pra >= SIS_PRIORIDAD) A.push(`<b>${nom(h)}:</b> ${sisFmt(o.pra)} requiere apoyo (${o.ra} de ${o.n} alumnos). Es foco rojo.`);
    else if (o.pra >= 25) A.push(`<b>${nom(h)}:</b> ${sisFmt(o.pra)} requiere apoyo (${o.ra} de ${o.n}). Conviene vigilarlo.`);
    if (o.pne >= 60) F.push(`<b>${nom(h)}:</b> ${sisFmt(o.pne)} del alumnado ya está en el nivel esperado.`);
    else if (o.pne != null && o.pra != null && o.pra < 15 && o.pne + o.ped >= 85) F.push(`<b>${nom(h)}:</b> casi nadie requiere apoyo (${sisFmt(o.pra)}); el reto es pasar de «en desarrollo» al nivel esperado.`);
  });
  const crit = SIS_H.map(([h]) => [h, a[h].pra]).filter(x => x[1] != null).sort((x, y) => y[1] - x[1])[0];
  if (crit && crit[1] >= 20) A.unshift(`La habilidad que más apoyo necesita es <b>${nom(crit[0]).toLowerCase()}</b>.`);
  if (a.lec.n && a.tex.n && a.lec.pne - a.tex.pne >= 15)

      else if (d >= 5) A.push(`<b>${nom(h)}:</b> «requiere apoyo» subió ${d} puntos desde el Momento ${ctx.mPrev}. Revise qué pasó con las acciones acordadas.`);
      else if (dn >= 5) F.push(`<b>${nom(h)}:</b> el nivel esperado subió ${dn} puntos desde el Momento ${ctx.mPrev}.`);

  if (t.n && t.ca > t.sa && !(a.cal.pra >= 25)) G.push(`<b>Cálculo mental.</b> ${SIS_SUGERENCIA.cal}`);

function sisEditor(cct, m, d, archivo) {

    const msgs = [];

      if (!/^[1-6]$/.test(f.grado)) msgs.push(`${n}: falta el grado (1 a 6).`);
      if (CAMPOS.some(([h, k]) => f[h][k] == null)) msgs.push(`${n}: hay casillas vacías (si es cero, escriba 0).`);
      const t = h => (f[h].ne || 0) + (f[h].ed || 0) + (f[h].ra || 0);
      const ts = ['lec', 'tex', 'cal'].map(t), mx = Math.max(...ts), mn = Math.min(...ts);
      if (mx && mx - mn > 4) msgs.push(`${n}: el total de alumnos cambia mucho entre habilidades (${ts.join(', ')}). Revise.`);
      const r = (f.tip.sa || 0) + (f.tip.ca || 0) + (f.tip.inc || 0);
      if (t('cal') && r && Math.abs(r - t('cal') * 10) > t('cal') * 10 * 0.25) msgs.push(`${n}: las respuestas de cálculo (${r}) no corresponden a ${t('cal')} alumnos × 10 reactivos. Revise.`);

      cuadra = dif.length ? `<div class="aviso-caja" style="border-color:var(--alerta)"><b>No cuadra con el concentrado de la escuela:</b> ${dif.join('; ')}.</div>` : '<div class="aviso-caja" style="background:var(--ok-f);border-color:var(--ok)"><b>✓ La suma de los grupos coincide con el concentrado de la escuela.</b></div>';
    }
    $('#e-rev').innerHTML = cuadra + (msgs.length ? `<div class="aviso-caja"><b>Revise antes de guardar:</b><ul style="margin:6px 0 0 18px;padding:0">${msgs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
    return msgs;
  };
  const celda = (f, h, k) => `<td><input type="number" data-nodict min="0" inputmode="numeric" data-k="${h}.${k}" value="${f[h][k] == null ? '' : f[h][k]}" aria-label="${h} ${k}"></td>`;
  const pintarT = () => {
    $('#e-cuerpo').innerHTML = filas.map((f, i) => `<tr><td><input data-nodict data-k="grado" value="${esc(f.grado)}" aria-label="Grado" style="width:34px"></td><td><input data-nodict data-k="grupo" value="${esc(f.grupo)}" aria-label="Grupo" style="width:40px"></td>
      ${CAMPOS.map(([h, k]) => celda(f, h, k)).join('')}<td><button class="sis-mini-b" data-equi="${i}" aria-label="Quitar renglón">✕</button></td></tr>`).join('');

  };
  const ve = modal(`${esc(nombreEscuela(cct))} · Momento ${m}`, `
    ${archivo ? `<p class="ayuda" style="margin-top:0">Leído de <b>${esc(archivo.nombre)}</b>${d.exploracion && +d.exploracion !== m ? ` · <b style="color:var(--alerta)">Ojo: la IA usó la Exploración ${d.exploracion}</b>` : ''}. Compare con las gráficas y corrija lo necesario.</p>` : '<p class="ayuda" style="margin-top:0">Un renglón por grupo: número de alumnos en cada nivel (NE esperado, ED en desarrollo, RA requiere apoyo) y, en cálculo mental, el número de respuestas por tipo.</p>'}
    ${d.notas ? `<div class="aviso-caja">${esc(d.notas)}</div>` : ''}
    <div id="e-rev"></div>
    <div class="matriz-caja"><table class="matriz sis-ed" id="e-tab"><thead>
      <tr><th colspan="2">Grupo</th><th colspan="3">Lectura</th><th colspan="3">Producción de textos</th><th colspan="3">Cálculo mental</th><th colspan="3">Cálculo: respuestas</th><th></th></tr>
      <tr><th>Gdo.</th><th>Gpo.</th>${'<th>NE</th><th>ED</th><th>RA</th>'.repeat(3)}<th>Sin apoyo</th><th>Con apoyo</th><th>Incorr.</th><th></th></tr></thead>
      <tbody id="e-cuerpo"></tbody></table></div>
    <button class="boton sec chico" id="e-mas" style="margin-top:8px">${ico('i-mas')}Agregar grupo</button>`,
    '<button class="boton sec" id="e-no">Cancelar</button><button class="boton terra" id="e-si">Guardar resultados</button>');
  ve.querySelector('.modal').classList.add('ancha');
  pintarT(); revisar();
  $('#e-mas').onclick = () => { leerTabla(); filas.push({ grado: '', grupo: '', lec: {}, tex: {}, cal: {}, tip: {} }); pintarT(); revisar(); };
  $('#e-no').onclick = cerrarModal;
  $('#e-si').onclick = async () => {
    leerTabla(); const msgs = revisar();
    if (msgs.some(x => /falta el grado|repetido/.test(x))) { aviso('Corrija los grados o grupos repetidos.', 'mal'); return; }
    if (msgs.length && !confirm('Hay ' + msgs.length + ' aviso(s) en la revisión. ¿Guardar de todos modos?')) return;
    const r = await accion('sisatGuardar', { ciclo: v.ciclo, momento: m, cct, fuente: d.fuente || (archivo ? archivo.nombre : 'Captura manual'), grupos: filas });
    if (!r) return;
    S.sis = r.sis; cerrarModal();
    Object.assign(v, { nivel: 'escuela', cct, m }); vSisat(); window.scrollTo(0, 0);

}

/* ---- Excel de la herramienta oficial del SisAT ----
   La herramienta en línea exporta un archivo por grupo y por herramienta (herrLectura, herrTextos, herrCalculo).
   Aunque terminan en .xls son páginas HTML con una tabla: Alumno, componentes I a VI (o reactivos I a X), PTS, (PV) y NIVEL.
   No traen escuela, grado ni grupo: la escuela sale de su carpeta y el grado y grupo se asignan al revisar
   (Tequio los sugiere comparando los nombres con los momentos anteriores). */
const SIS_COMP = {
  lec: ['Fluidez', 'Precisión', 'Atención a palabras complejas', 'Uso de la voz', 'Seguridad y disposición', 'Comprensión'],
  tex: ['Legibilidad', 'Propósito comunicativo', 'Relación entre palabras y oraciones', 'Diversidad de vocabulario', 'Puntuación', 'Ortografía']
};
const SIS_ROM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const sisSinAc = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const sisClave = n => sisSinAc(n).toUpperCase().replace(/[^A-ZÑ]+/g, ' ').trim();
// «AGUILERA / ROJAS * NICOLE AITANA» → «Aguilera Rojas Nicole Aitana»
const sisNombreAlumno = n => String(n || '').replace(/[\/*]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|[\s'-])([a-zñáéíóúü])/g, (x, a, b) => a + b.toUpperCase());
const sisNivTxt = t => { t = sisSinAc(t).toUpperCase(); return /REQUIERE/.test(t) ? 'RA' : /DESARROLLO/.test(t) ? 'ED' : /ESPERADO/.test(t) ? 'NE' : ''; };
const sisNivPts = (h, p) => p == null ? '' : h === 'cal' ? (p >= 8 ? 'NE' : p >= 5 ? 'ED' : 'RA') : (p >= 15 ? 'NE' : p >= 10 ? 'ED' : 'RA');
const SIS_HERR = { lec: 'Lectura', tex: 'Producción de textos', cal: 'Cálculo mental' };

// Renglones (arreglos de texto) de un archivo: HTML disfrazado de .xls o un Excel de verdad
async function sisRenglones(nombre, bytes) {
  const inicio = new TextDecoder('utf-8').decode(bytes.slice(0, 4000)).replace(/^﻿/, '').trimStart();
  if (/^<(!doctype|html|head|body|table|meta|div|\?xml)/i.test(inicio) || /<table/i.test(inicio)) {
    let texto = new TextDecoder('utf-8').decode(bytes);
    if (/�/.test(texto.slice(0, 20000))) texto = new TextDecoder('windows-1252').decode(bytes);
    const doc = new DOMParser().parseFromString(texto, 'text/html');
    return $$('tr', doc).map(tr => Array.from(tr.cells).map(td => td.textContent.replace(/\s+/g, ' ').trim()));
  }
  await cargarScript('lib/xlsx.full.min.js');
  const wb = window.XLSX.read(bytes, { type: 'array' });
  let filas = [];
  wb.SheetNames.forEach(n => { if (!filas.length || filas.length < 3) filas = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }).map(r => r.map(c => String(c).replace(/\s+/g, ' ').trim())); });
  return filas;
}

// Lee un archivo del SisAT: herramienta (lec, tex o cal) y resultado de cada alumno
async function sisLeerArchivo(a) {   // a: { nombre, bytes, fecha, id }
  const filas = await sisRenglones(a.nombre, a.bytes);
  const hi = filas.findIndex(r => r.some(c => /^PTS$/i.test(c)) && r.some(c => c === 'I'));
  if (hi < 0) return Object.assign({}, a, { error: 'No tiene la tabla de resultados del SisAT.' });
  const cab = filas[hi].map(c => c.toUpperCase());
  const cols = SIS_ROM.map(r => cab.indexOf(r)).filter(i => i >= 0);
  const iP = cab.indexOf('PTS'), iV = cab.indexOf('PV'), iN = cab.indexOf('NIVEL');
  const nom = sisSinAc(a.nombre).toLowerCase();
  const tipo = cols.length >= 10 || iV >= 0 || /calc/.test(nom) ? 'cal' : /text|escri|produc/.test(nom) ? 'tex' : /lect/.test(nom) ? 'lec' : '';
  const num = x => { const n = parseInt(String(x).replace(/[^\d]/g, ''), 10); return isFinite(n) ? n : null; };
  const alumnos = [];
  filas.slice(hi + 1).forEach(r => {
    const nombre = r[0] || '';
    if (r.length <= iP || !/[A-Za-zÑñ]{2}/.test(nombre) || /^(alumno|total|promedio)/i.test(nombre)) return;
    const c = cols.map(i => String(r[i] || '').toLowerCase().replace(/\s+/g, ''));
    const p = num(r[iP]), v = iV >= 0 ? num(r[iV]) : null;
    const h = tipo || 'lec';
    alumnos.push({ alumno: sisNombreAlumno(nombre), clave: sisClave(nombre), c, p, v, n: (iN >= 0 && sisNivTxt(r[iN])) || sisNivPts(h, p) });
  });
  if (!alumnos.length) return Object.assign({}, a, { error: 'La tabla no tiene alumnos.' });
  return Object.assign({}, a, { tipo, componentes: cols.length, alumnos, bytes: undefined, original: a.bytes });
}

// Junta en grupos los archivos que tienen a los mismos alumnos (uno de lectura, uno de textos y uno de cálculo por grupo)
function sisAgrupar(leidos) {
  const grupos = [], avisos = [];
  const coincide = (a, b) => { const B = new Set(b); let n = 0; a.forEach(x => { if (B.has(x)) n++; }); return n / Math.max(1, Math.min(a.length, b.length)); };
  const orden = { lec: 0, tex: 1, cal: 2, '': 3 };
  leidos.filter(x => !x.error).sort((x, y) => orden[x.tipo] - orden[y.tipo]).forEach(f => {
    const claves = f.alumnos.map(x => x.clave);
    let mejor = null, mc = 0;
    grupos.forEach(g => { const c = coincide(claves, g.claves); if (c > mc) { mc = c; mejor = g; } });
    if (mejor && mc >= 0.6) {
      const t = f.tipo || (mejor.arch.lec ? 'tex' : 'lec');
      if (mejor.arch[t]) {   // el mismo grupo dos veces: se queda el más reciente
        const viejo = mejor.arch[t];
        if (String(f.fecha || '') > String(viejo.fecha || '')) mejor.arch[t] = f;
        avisos.push(`«${mejor.arch[t].nombre}» y «${(mejor.arch[t] === f ? viejo : f).nombre}» son ${SIS_HERR[t].toLowerCase()} del mismo grupo; se usa el más reciente (${mejor.arch[t].nombre}).`);
      } else mejor.arch[t] = f;
      claves.forEach(k => { if (mejor.claves.indexOf(k) < 0) mejor.claves.push(k); });
    } else grupos.push({ arch: { [f.tipo || 'lec']: f }, claves: claves.slice() });
  });
  grupos.forEach(g => {
    const porClave = {};
    ['lec', 'tex', 'cal'].forEach(h => { const f = g.arch[h]; if (!f) return;
      f.alumnos.forEach(x => { const o = porClave[x.clave] || (porClave[x.clave] = { alumno: x.alumno, clave: x.clave }); o[h] = { c: x.c, p: x.p, v: x.v, n: x.n }; }); });
    g.alumnos = Object.values(porClave).sort((x, y) => x.clave.localeCompare(y.clave, 'es'));
    g.faltan = ['lec', 'tex', 'cal'].filter(h => !g.arch[h]);
  });
  return { grupos, avisos };
}

// Concentrado de un grupo a partir de sus alumnos (lo que se guarda por grupo y alimenta zona, grado y escuela)
function sisDeAlumnos(als) {
  const g = { tip: { sa: 0, ca: 0, inc: 0 }, comp: { lec: { s: [0, 0, 0, 0, 0, 0], n: 0 }, tex: { s: [0, 0, 0, 0, 0, 0], n: 0 }, cal: { s: Array(10).fill(0), v: Array(10).fill(0), n: 0 } } };
  ['lec', 'tex', 'cal'].forEach(h => { g[h] = { ne: 0, ed: 0, ra: 0 }; });
  als.forEach(a => ['lec', 'tex', 'cal'].forEach(h => {
    const r = a[h]; if (!r || !r.n) return;
    g[h][r.n.toLowerCase()]++;
    const cp = g.comp[h]; cp.n++;
    if (h === 'cal') (r.c || []).slice(0, 10).forEach((x, i) => {
      if (x === '1v' || x === 'v') { g.tip.ca++; cp.s[i]++; cp.v[i]++; } else if (x === '1') { g.tip.sa++; cp.s[i]++; } else g.tip.inc++;
    });
    else (r.c || []).slice(0, 6).forEach((x, i) => { cp.s[i] += Math.max(0, Math.min(3, +x || 0)); });
  }));
  ['lec', 'tex', 'cal'].forEach(h => { if (!g.comp[h].n) delete g.comp[h]; });
  return g;
}

/* ---- Alumnos de una escuela (se piden al servidor solo cuando se consulta esa escuela) ---- */
const SIA = {};   // 'ciclo|cct' → { alumnos: [], cargando: Promise }
function sisAlumnosDe(ciclo, cct) { const x = SIA[ciclo + '|' + cct]; return x && x.alumnos ? x.alumnos : null; }
async function sisPedirAlumnos(ciclo, cct, forzar) {
  const k = ciclo + '|' + cct;
  if (!cct || !S || (S.version && S.version < 8)) return [];
  if (SIA[k] && !forzar) return SIA[k].cargando || SIA[k].alumnos;
  SIA[k] = { cargando: api('sisatAlumnos', { ciclo, cct }).then(r => { SIA[k] = { alumnos: (r.alumnos || []).map(sisNormAlumno) }; return SIA[k].alumnos; })
    .catch(e => { delete SIA[k]; aviso(esc(e.message), 'mal', 8000); return []; }) };
  return SIA[k].cargando;
}
function sisNormAlumno(a) {
  const r = x => x && typeof x === 'object' && !Array.isArray(x) ? { c: x.c || [], p: x.p == null ? null : +x.p, v: x.v == null ? null : +x.v, n: x.n || '' } : null;
  return Object.assign({}, a, { momento: +a.momento, grado: String(a.grado), grupo: String(a.grupo || ''), num: +a.num || 0, lec: r(a.lec), tex: r(a.tex), cal: r(a.cal), clave: sisClave(a.alumno) });
}

/* ---- Carga desde los Excel ---- */
async function sisExcelDesdeDrive(cct, m, alTerminar) {
  const r = await accion('sisatArchivos', { cct, momento: m, excel: true });

    return;
  }
  caja.innerHTML = `<div class="seccion-t" style="padding:12px 0 4px">En ${esc(r.ruta)} · ${r.archivos.length} archivo${r.archivos.length === 1 ? '' : 's'}</div>
    <div class="sis-arch-l">${r.archivos.map(a => `<label class="sis-arch"><span><input type="checkbox" data-cx="${a.id}" checked> <b>${esc(a.nombre)}</b><br><span class="peq mudo">${fechaCorta(a.fecha.slice(0, 10))} ${a.fecha.slice(11, 16)} · ${a.kb} KB</span></span></label>`).join('')}</div>
    <div style="margin-top:10px"><button class="boton" id="c-leer-x">Leer los seleccionados</button></div>`;
  $('#c-leer-x').onclick = async () => {

    const leidos = await conCarga(() => Promise.all(b.archivos.map(a => sisLeerArchivo({ id: a.id, nombre: a.nombre, fecha: a.fecha, bytes: b64aBytes(a.datos) }).catch(e => ({ nombre: a.nombre, error: e.message })))));
    if (leidos) sisRevisarExcel(cct, m, leidos, { ruta: b.ruta, subir: false }, alTerminar);
  };
}
async function sisExcelSubidos(cct, m, archivos, alTerminar) {
  const lista = Array.from(archivos || []);
  if (!lista.length) return;
  const grandes = lista.filter(f => f.size > 5 * 1024 * 1024);
  if (grandes.length) { aviso('Estos archivos pesan más de 5 MB y no parecen del SisAT: ' + esc(grandes.map(f => f.name).join(', ')), 'mal', 9000); return; }
  const leidos = await conCarga(() => Promise.all(lista.map(async f => {
    const bytes = new Uint8Array(await f.arrayBuffer());
    return sisLeerArchivo({ nombre: f.name, fecha: new Date(f.lastModified || Date.now()).toISOString().slice(0, 16), bytes, tipoMime: f.type }).catch(e => ({ nombre: f.name, error: e.message }));
  })));
  if (leidos) sisRevisarExcel(cct, m, leidos, { subir: true }, alTerminar);
}

// Sugerencia de grado y grupo: el grupo de otro momento del ciclo con más alumnos en común
function sisSugerir(claves, previos) {
  const porGrupo = {};
  previos.forEach(a => { const k = a.grado + '|' + a.grupo; (porGrupo[k] = porGrupo[k] || new Set()).add(a.clave); });
  let mejor = null, mc = 0;
  Object.entries(porGrupo).forEach(([k, set]) => { let n = 0; claves.forEach(c => { if (set.has(c)) n++; }); const c = n / Math.max(1, Math.min(claves.length, set.size)); if (c > mc) { mc = c; mejor = k; } });
  if (!mejor || mc < 0.5) return null;
  const [grado, grupo] = mejor.split('|');
  return { grado, grupo, coincidencia: Math.round(mc * 100) };
}

async function sisRevisarExcel(cct, m, leidos, origen, alTerminar) {
  const v = sisV();
  const previos = (await sisPedirAlumnos(v.ciclo, cct)).filter(a => a.momento !== m);
  // Si la herramienta de un archivo no se reconoce por el nombre, se elige en la revisión
  const dudosos = leidos.filter(x => !x.error && !x.tipo);
  let { grupos, avisos } = sisAgrupar(leidos);
  const errores = leidos.filter(x => x.error);
  grupos.forEach(g => {
    const s = sisSugerir(g.claves, previos);
    g.grado = s ? s.grado : ''; g.grupo = s ? s.grupo : ''; g.sug = s;
  });
  grupos.sort((x, y) => (x.grado || '9').localeCompare(y.grado || '9') || x.grupo.localeCompare(y.grupo) || y.alumnos.length - x.alumnos.length);
  const hay = (S.sis || []).filter(r => r.ciclo === v.ciclo && +r.momento === m && r.cct === cct);
  const pintar = () => {
    $('#x-grupos').innerHTML = grupos.map((g, i) => {
      const nl = g.alumnos.length;
      const herr = ['lec', 'tex', 'cal'].map(h => g.arch[h] ? `<span class="chip ok" title="${esc(g.arch[h].nombre)}">✓ ${SIS_HERR[h]}</span>` : `<span class="chip" style="background:var(--alerta-f);color:var(--alerta)">Falta ${SIS_HERR[h].toLowerCase()}</span>`).join(' ');
      const ra = h => g.alumnos.filter(a => a[h] && a[h].n === 'RA').length;
      return `<div class="sis-xg">
        <div class="sis-xg-a">
          <div class="campo" style="margin:0"><label for="x-gr${i}">Grado</label><select id="x-gr${i}" data-xgr="${i}"><option value="">—</option>${[1, 2, 3, 4, 5, 6].map(n => `<option ${String(n) === g.grado ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div class="campo" style="margin:0"><label for="x-gp${i}">Grupo</label><input id="x-gp${i}" data-xgp="${i}" value="${esc(g.grupo)}" maxlength="6" style="width:64px" placeholder="A"></div>
        </div>
        <div class="sis-xg-b"><b>${nl} alumno${nl === 1 ? '' : 's'}</b> ${g.sug ? `<span class="peq" style="color:var(--ok)">· sugerido: ${g.sug.grado}° ${esc(g.sug.grupo)} (${g.sug.coincidencia}% de los alumnos coinciden con el Momento anterior)</span>` : ''}
          <div class="peq" style="margin:4px 0">${herr}</div>
          <div class="peq mudo">Requieren apoyo: lectura ${ra('lec')} · textos ${ra('tex')} · cálculo ${ra('cal')}</div>
          <details class="peq" style="margin-top:4px"><summary>Ver alumnos</summary><div class="sis-xg-l">${g.alumnos.map(a => esc(a.alumno)).join('<br>')}</div></details>
        </div></div>`;
    }).join('') || '<div class="aviso-caja">No se encontraron resultados de alumnos en los archivos.</div>';
    $$('[data-xgr]').forEach(s => s.onchange = () => { grupos[+s.dataset.xgr].grado = s.value; revisar(); });
    $$('[data-xgp]').forEach(s => s.oninput = () => { grupos[+s.dataset.xgp].grupo = s.value.trim().toUpperCase(); revisar(); });
    revisar();
  };
  const revisar = () => {
    const msgs = [];
    grupos.forEach((g, i) => { if (!/^[1-6]$/.test(g.grado)) msgs.push(`Al grupo ${i + 1} (${g.alumnos.length} alumnos, empieza con ${g.alumnos[0] ? g.alumnos[0].alumno : '—'}) le falta el grado.`); });
    const vistos = {}; grupos.forEach(g => { const k = g.grado + '-' + g.grupo; if (g.grado && vistos[k]) msgs.push(`El grupo ${g.grado}° ${g.grupo} está dos veces.`); vistos[k] = 1; });
    grupos.forEach(g => { if (g.faltan.length && g.grado) msgs.push(`${g.grado}° ${g.grupo}: falta el archivo de ${g.faltan.map(h => SIS_HERR[h].toLowerCase()).join(' y ')}.`); });
    $('#x-rev').innerHTML = msgs.length ? `<div class="aviso-caja"><b>Revise:</b><ul style="margin:6px 0 0 18px;padding:0">${msgs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div class="aviso-caja" style="background:var(--ok-f);border-color:var(--ok)"><b>✓ Listo para guardar.</b></div>';
    return msgs;
  };
  const ve = modal(`${esc(nombreEscuela(cct))} · Momento ${m} · Excel del SisAT`, `
    <p class="ayuda" style="margin-top:0">Se leyeron ${leidos.length - errores.length} de ${leidos.length} archivos y se formaron <b>${grupos.length} grupo${grupos.length === 1 ? '' : 's'}</b> juntando los archivos que tienen a los mismos alumnos.
      Los archivos de la herramienta no dicen el grado ni el grupo: ${previos.length ? 'Tequio los sugiere comparando los nombres con el momento anterior;' : 'escríbalos para cada grupo (abra «Ver alumnos» si necesita identificarlo);'} revíselos antes de guardar.</p>
    ${hay.length ? `<div class="aviso-caja">Esta escuela ya tiene ${hay.length} grupos guardados en el Momento ${m}: <b>se reemplazarán</b> con lo que guarde aquí.</div>` : ''}
    ${errores.length ? `<div class="aviso-caja" style="border-color:var(--alerta)"><b>No se pudieron leer:</b> ${errores.map(x => esc(x.nombre) + ' (' + esc(x.error) + ')').join('; ')}.</div>` : ''}
    ${avisos.length ? `<div class="aviso-caja"><ul style="margin:0 0 0 18px;padding:0">${avisos.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${dudosos.length ? `<div class="aviso-caja">No se reconoció si ${dudosos.length === 1 ? 'este archivo es' : 'estos archivos son'} de lectura o de producción de textos; se tomaron como lectura: ${dudosos.map(x => esc(x.nombre)).join(', ')}. Si no es así, cámbieles el nombre (que diga «Lectura» o «Textos») y cárguelos otra vez.</div>` : ''}
    ${+m === 1 ? '<p class="ayuda">En el Momento 1, 1.° grado suele salir completo en «requiere apoyo» en lectura y textos: aún no leen ni escriben de forma convencional. Es el punto de partida, no un rezago.</p>' : ''}
    <div id="x-rev"></div>
    <div id="x-grupos"></div>
    ${origen.subir ? '<label class="peq" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="x-subir" checked> Guardar también los archivos en la carpeta del SisAT de la escuela (Momento ' + m + ')</label>' : ''}`,
    '<button class="boton sec" id="x-no">Cancelar</button><button class="boton terra" id="x-si">Guardar resultados</button>');
  ve.querySelector('.modal').classList.add('ancha');
  pintar();
  $('#x-no').onclick = cerrarModal;
  $('#x-si').onclick = async () => {
    const msgs = revisar();
    if (!grupos.length) return;
    if (msgs.some(x => /falta el grado|dos veces/.test(x))) { aviso('Falta el grado de algún grupo o hay grupos repetidos.', 'mal'); return; }
    if (msgs.length && !confirm('Hay ' + msgs.length + ' aviso(s). ¿Guardar de todos modos?')) return;
    const subir = origen.subir && $('#x-subir') && $('#x-subir').checked;
    const usados = new Set(); grupos.forEach(g => Object.values(g.arch).forEach(f => usados.add(f)));
    const payload = grupos.map(g => {
      const agg = sisDeAlumnos(g.alumnos);
      return Object.assign({ grado: g.grado, grupo: g.grupo }, agg, { alumnos: g.alumnos.map(a => ({ alumno: a.alumno, lec: a.lec || null, tex: a.tex || null, cal: a.cal || null })) });
    });
    const r = await accion('sisatGuardar', { ciclo: v.ciclo, momento: m, cct, fuente: 'Excel de la herramienta del SisAT (' + usados.size + ' archivos)', grupos: payload });
    if (!r) return;
    S.sis = r.sis;
    delete SIA[v.ciclo + '|' + cct];
    if (subir) {
      let ok = 0;
      await conCarga(async () => { for (const f of usados) { try { await api('sisatSubir', { cct, momento: m, nombre: f.nombre, datos: await blobAB64(new Blob([f.original])), tipo: f.tipoMime || 'application/vnd.ms-excel' }); ok++; } catch (e) {} } });
      if (ok < usados.size) aviso(`Se guardaron los resultados, pero solo ${ok} de ${usados.size} archivos se copiaron al Drive.`, 'mal', 9000);
    }
    cerrarModal();
    if (alTerminar) alTerminar();
    Object.assign(v, { nivel: 'escuela', cct, m }); vSisat(); window.scrollTo(0, 0);
    const n = payload.reduce((s, g) => s + g.alumnos.length, 0);
    aviso(`Resultados guardados: ${payload.length} grupos y ${n} alumnos.`, 'ok');
  };
}

/* ---- Análisis por componente y por alumno (cuando los resultados vienen de los Excel) ---- */
// Suma de componentes de varios grupos. sin1: en concentrados del Momento 1, 1.° grado no cuenta en lectura ni textos.
function sisCompSuma(filas, sin1) {
  const c = { lec: { s: [0, 0, 0, 0, 0, 0], n: 0 }, tex: { s: [0, 0, 0, 0, 0, 0], n: 0 }, cal: { s: Array(10).fill(0), v: Array(10).fill(0), n: 0 } };
  let hay = false;
  filas.forEach(r => {
    const k = r.comp && !Array.isArray(r.comp) ? r.comp : null; if (!k) return;
    ['lec', 'tex', 'cal'].forEach(h => {
      const o = k[h]; if (!o || !o.n) return;
      if (sin1 && h !== 'cal' && String(r.grado) === '1') return;
      hay = true; c[h].n += +o.n;
      (o.s || []).forEach((x, i) => { if (i < c[h].s.length) c[h].s[i] += +x || 0; });
      if (h === 'cal') (o.v || []).forEach((x, i) => { if (i < 10) c.cal.v[i] += +x || 0; });
    });
  });
  return hay ? c : null;
}
const sisCompPc = (c, h, i) => c && c[h] && c[h].n ? Math.round(c[h].s[i] * 1000 / (c[h].n * (h === 'cal' ? 1 : 3))) / 10 : null;
const sisCompColor = p => p == null ? 'var(--borde)' : p >= 81 ? '#2E7D4F' : p >= 56 ? '#E8A33D' : '#B3261E';
const sisCompTxt = p => p >= 81 ? 'manejo adecuado' : p >= 56 ? 'avance significativo' : 'poco avance';
// Componente más bajo y más alto de lectura o textos
function sisCompExtremos(c, h) {
  if (!c || !c[h] || !c[h].n) return null;
  const l = SIS_COMP[h].map((nom, i) => ({ nom, p: sisCompPc(c, h, i) })).sort((x, y) => x.p - y.p);
  return { bajo: l[0], alto: l[l.length - 1], lista: l };
}

function sisComponentes(c, titulo) {
  if (!c) return '';
  const barra = (nom, p, extra) => `<div class="sis-cb"><span class="sis-cb-n">${esc(nom)}</span><span class="sis-cb-b"><i style="width:${p || 0}%;background:${sisCompColor(p)}"></i></span><b class="sis-cb-p" style="color:${sisCompColor(p)}">${sisFmt(p)}</b>${extra || ''}</div>`;
  const bloque = h => {
    if (!c[h] || !c[h].n) return '';
    const e = sisCompExtremos(c, h);
    return `<div><h3>${SIS_H.find(x => x[0] === h)[1]} <span class="peq mudo" style="font-weight:400">· ${c[h].n} alumnos</span></h3>
      ${SIS_COMP[h].map((nom, i) => barra(SIS_ROM[i] + '. ' + nom, sisCompPc(c, h, i))).join('')}
      <p class="peq" style="margin:6px 0 0">Componente más bajo: <b>${esc(e.bajo.nom.toLowerCase())}</b> (${sisFmt(e.bajo.p)}, ${sisCompTxt(e.bajo.p)}).</p></div>`;
  };
  let cal = '';
  if (c.cal && c.cal.n) {
    const n = c.cal.n;
    cal = `<div><h3>Cálculo mental por reactivo <span class="peq mudo" style="font-weight:400">· ${n} alumnos</span></h3>
      ${c.cal.s.map((x, i) => { const sa = x - c.cal.v[i], ca = c.cal.v[i], inc = n - x, P = q => Math.round(q * 1000 / n) / 10;
        return `<div class="sis-cb"><span class="sis-cb-n">Reactivo ${SIS_ROM[i]}</span><span class="sis-cb-b sis-barra" role="img" aria-label="Sin apoyo ${P(sa)}%, con apoyo ${P(ca)}%, incorrectas ${P(inc)}%"><i class="ne" style="width:${P(sa)}%"></i><i class="ed" style="width:${P(ca)}%"></i><i class="ra" style="width:${P(inc)}%"></i></span><b class="sis-cb-p">${sisFmt(P(x))}</b></div>`; }).join('')}
      <div class="sis-tip" style="margin-top:6px"><span><i class="ne"></i>Acierto sin apoyo visual</span><span><i class="ed"></i>Acierto con apoyo visual</span><span><i class="ra"></i>Incorrecta</span></div>
      <p class="peq mudo" style="margin:4px 0 0">El manual advierte que los reactivos no bastan para saber qué operación se le dificulta al grupo; sirven para ver si resuelven con estrategia propia o necesitan el apoyo visual.</p></div>`;
  }
  return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 8px">${titulo || 'Componentes de cada habilidad'}</div>
    <div class="sis-comp-g">${bloque('lec')}${bloque('tex')}${cal}</div>
    <div class="sis-ley" style="margin:10px 0 0"><span><i style="background:#2E7D4F"></i>81 a 100%: manejo adecuado</span><span><i style="background:#E8A33D"></i>56 a 80%: avance significativo</span><span><i style="background:#B3261E"></i>55% o menos: poco avance</span></div></div>`;
}

// Diagnóstico por componente (se agrega a fortalezas y focos de atención)
function sisDiagComp(c, F, A, G) {
  if (!c) return;
  ['lec', 'tex'].forEach(h => {
    const e = sisCompExtremos(c, h); if (!e) return;
    const nom = SIS_H.find(x => x[0] === h)[1];
    const bajos = e.lista.filter(x => x.p <= 55);
    if (bajos.length) A.push(`<b>${nom}:</b> poco avance en ${bajos.map(x => '<b>' + esc(x.nom.toLowerCase()) + '</b> (' + sisFmt(x.p) + ')').join(', ')}.`);
    else if (e.bajo.p <= 80) A.push(`<b>${nom}:</b> el componente más bajo es ${esc(e.bajo.nom.toLowerCase())} (${sisFmt(e.bajo.p)}).`);
    if (e.alto.p >= 81) F.push(`<b>${nom}:</b> ${esc(e.alto.nom.toLowerCase())} es una fortaleza (${sisFmt(e.alto.p)}).`);
    if (h === 'lec') {
      const seg = e.lista.find(x => /Seguridad/.test(x.nom)), comp = e.lista.find(x => /Comprensi/.test(x.nom));
      if (seg && comp && seg.p - comp.p >= 15) G.push('<b>Lectura.</b> El alumnado muestra disposición ante la lectura pero comprende poco: aproveche esa disposición como punto de partida y trabaje la comprensión con preguntas antes, durante y después de leer.');
    }
  });
}

/* ---- Alumnos ---- */
const SIS_NV = { NE: 2, ED: 1, RA: 0 };
const sisChipNiv = n => n ? `<span class="sis-nv ${n.toLowerCase()}" title="${({ NE: 'Nivel esperado', ED: 'En desarrollo', RA: 'Requiere apoyo' })[n]}">${n}</span>` : '<span class="mudo">—</span>';
function sisAlumnosVista(v, m, pred) {
  const cct = v.cct;
  if (!['escuela', 'grado', 'grupo'].includes(v.nivel) || !cct) return null;
  if (esDirector() && cct !== miCct()) return null;
  const todos = sisAlumnosDe(v.ciclo, cct);
  if (!todos) { sisPedirAlumnos(v.ciclo, cct).then(() => { const w = sisV(); if (w.cct === cct && w.ciclo === v.ciclo && $('#sis-al-espera')) vSisat(); }); return { cargando: true }; }
  const enNivel = a => v.nivel === 'escuela' || (a.grado === v.grado && (v.nivel === 'grado' || a.grupo === v.grupo));
  return { todos: todos.filter(enNivel) };
}
// Cuántas habilidades en «requiere apoyo» (en el Momento 1, 1.° grado solo cuenta cálculo si así se ve el concentrado)
const sisNumRA = (a, sin1) => ['lec', 'tex', 'cal'].filter(h => a[h] && a[h].n === 'RA' && !(sin1 && h !== 'cal' && a.grado === '1')).length;
function sisCambio(a, b) {   // nivel de un alumno de un momento a otro
  if (!a || !b || !a.n || !b.n) return '';
  const d = SIS_NV[b.n] - SIS_NV[a.n];
  return d > 0 ? '<span class="sis-d bien" title="Subió de nivel">▲</span>' : d < 0 ? '<span class="sis-d mal" title="Bajó de nivel">▼</span>' : '<span class="sis-d igual" title="Mismo nivel">=</span>';
}
function sisSeccionAlumnos(v, m, sin1) {
  const r = sisAlumnosVista(v, m);
  if (!r) return '';
  if (r.cargando) return '<div class="tarjeta pad" id="sis-al-espera" style="margin-bottom:16px"><span class="mudo">Cargando los resultados por alumno…</span></div>';
  const deM = r.todos.filter(a => a.momento === m);
  if (!deM.length) return '';
  const mPrev = [1, 2].filter(x => x < m).reverse().find(x => r.todos.some(a => a.momento === x));
  const prev = {}; if (mPrev) r.todos.filter(a => a.momento === mPrev).forEach(a => { prev[a.clave] = a; });
  if (v.nivel === 'grupo') {
    const orden = v.ordenAl === 'nombre' ? deM.slice().sort((x, y) => x.alumno.localeCompare(y.alumno, 'es'))
      : deM.slice().sort((x, y) => sisNumRA(y) - sisNumRA(x) || ((x.lec ? x.lec.p : 99) + (x.cal ? x.cal.p : 99)) - ((y.lec ? y.lec.p : 99) + (y.cal ? y.cal.p : 99)));
    const celda = (a, h) => { const x = a[h]; if (!x) return '<td class="mudo">—</td>';
      const ant = prev[a.clave] ? prev[a.clave][h] : null;
      return `<td>${sisChipNiv(x.n)} <span class="peq">${x.p == null ? '' : x.p + (h === 'cal' ? '/10' : '/18')}${h === 'cal' && x.v ? ' · ' + x.v + ' con apoyo' : ''}</span> ${mPrev ? sisCambio(ant, x) : ''}</td>`; };
    const n3 = deM.filter(a => sisNumRA(a) === 3).length;
    return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Alumnos del grupo (${deM.length})
      <button class="boton sec chico" id="b-sis-oal" style="margin-left:8px;text-transform:none;letter-spacing:0">Ordenar por ${v.ordenAl === 'nombre' ? 'necesidad' : 'nombre'}</button></div>
      ${n3 ? `<div class="aviso-caja" style="margin:0 14px 10px">${n3} alumno${n3 === 1 ? ' requiere' : 's requieren'} apoyo en las tres habilidades: su atención es de la mayor prioridad (manual del SisAT, paso 2).</div>` : ''}
      <div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th><th>Lectura</th><th>Textos</th><th>Cálculo</th></tr></thead>
      <tbody>${orden.map(a => `<tr class="${sisNumRA(a) === 3 ? 'sis-al-3' : ''}"><td class="esc-col">${esc(a.alumno)}</td>${celda(a, 'lec')}${celda(a, 'tex')}${celda(a, 'cal')}</tr>`).join('')}</tbody></table></div>
      <div class="peq mudo" style="padding:8px 14px">NE nivel esperado · ED en desarrollo · RA requiere apoyo. Lectura y textos sobre 18 puntos; cálculo, aciertos de 10.${mPrev ? ` ▲ ▼ = cambio de nivel respecto al Momento ${mPrev}.` : ''}</div></div>`;
  }
  // Escuela o grado: los que más apoyo necesitan
  const cuenta = [0, 0, 0, 0]; deM.forEach(a => cuenta[sisNumRA(a, sin1)]++);
  const urg = deM.filter(a => sisNumRA(a, sin1) >= 2).sort((x, y) => sisNumRA(y, sin1) - sisNumRA(x, sin1) || x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo) || x.alumno.localeCompare(y.alumno, 'es'));
  const fila = a => `<tr><td class="esc-col">${esc(a.alumno)}</td><td>${a.grado}° ${esc(a.grupo)}</td>${['lec', 'tex', 'cal'].map(h => `<td>${a[h] ? sisChipNiv(a[h].n) : '—'}</td>`).join('')}<td>${sisNumRA(a, sin1)}</td></tr>`;
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Alumnos que requieren apoyo</div>
    <div class="sis-cuenta">${[3, 2, 1, 0].map(k => `<div><b style="color:${k >= 2 ? 'var(--alerta)' : k === 1 ? 'var(--ambar)' : 'var(--ok)'}">${cuenta[k]}</b><span>${k ? 'en ' + (k === 1 ? 'una habilidad' : k === 2 ? 'dos habilidades' : 'las tres') : 'en ninguna'}</span></div>`).join('')}</div>
    ${sin1 && deM.some(a => a.grado === '1') ? '<p class="peq mudo" style="margin:0 14px 8px">En este concentrado, a 1.° grado solo se le cuenta cálculo (Momento 1).</p>' : ''}
    ${urg.length ? `<details class="sis-mas" ${urg.length <= 15 ? 'open' : ''}><summary>${urg.length} alumno${urg.length === 1 ? '' : 's'} en «requiere apoyo» en dos o tres habilidades</summary>
      <div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th><th>Grupo</th><th>Lectura</th><th>Textos</th><th>Cálculo</th><th>Hab.</th></tr></thead><tbody>${urg.map(fila).join('')}</tbody></table></div></details>` : '<p class="peq" style="margin:0 14px 12px;color:var(--ok)">Ningún alumno requiere apoyo en dos o más habilidades.</p>'}</div>`;
}

// Tendencia por alumno: quién subió, quién sigue igual y quién no ha salido de «requiere apoyo»
function sisTendenciaAlumnos(v) {
  const r = sisAlumnosVista(v);
  if (!r) return '';
  if (r.cargando) return '<div class="tarjeta pad" id="sis-al-espera" style="margin-bottom:16px"><span class="mudo">Cargando los resultados por alumno…</span></div>';
  const ms = [1, 2, 3].filter(m => r.todos.some(a => a.momento === m));
  if (ms.length < 2) return '';
  const p = ms[0], u = ms[ms.length - 1];
  const de = m => { const o = {}; r.todos.filter(a => a.momento === m).forEach(a => { o[a.clave] = a; }); return o; };
  const A = de(p), B = de(u);
  const ambos = Object.keys(B).filter(k => A[k]);
  const filas = SIS_H.map(([h, nom]) => {
    const c = { sube: 0, igual: 0, baja: 0, siguenRA: [] };
    ambos.forEach(k => { const a = A[k][h], b = B[k][h]; if (!a || !b || !a.n || !b.n) return; const d = SIS_NV[b.n] - SIS_NV[a.n]; d > 0 ? c.sube++ : d < 0 ? c.baja++ : c.igual++; if (a.n === 'RA' && b.n === 'RA') c.siguenRA.push(B[k]); });
    return { h, nom, c };
  });
  const siempre = ambos.map(k => B[k]).filter(a => ['lec', 'tex', 'cal'].every(h => A[a.clave][h] && a[h] && A[a.clave][h].n === 'RA' && a[h].n === 'RA'));
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Movimiento de los alumnos del Momento ${p} al Momento ${u}</div>
    <div class="matriz-caja"><table class="matriz sis-tab"><thead><tr><th class="esc-col">Habilidad</th><th>Subieron de nivel</th><th>Mismo nivel</th><th>Bajaron</th><th>Siguen en «requiere apoyo»</th></tr></thead>
    <tbody>${filas.map(f => `<tr><td class="esc-col"><b>${f.nom}</b></td><td style="color:var(--ok);font-weight:700">${f.c.sube}</td><td>${f.c.igual}</td><td style="color:var(--alerta);font-weight:700">${f.c.baja}</td><td>${f.c.siguenRA.length}</td></tr>`).join('')}</tbody></table></div>
    <p class="peq mudo" style="margin:8px 14px">Se comparan ${ambos.length} alumnos que aparecen en los dos momentos.</p>
    ${siempre.length ? `<details class="sis-mas" open><summary>${siempre.length} alumno${siempre.length === 1 ? ' sigue' : 's siguen'} en «requiere apoyo» en las tres habilidades</summary>
      <div style="padding:6px 14px 12px;columns:2;column-gap:24px">${siempre.map(a => `${esc(a.alumno)} <span class="peq mudo">${a.grado}° ${esc(a.grupo)}</span>`).join('<br>')}</div></details>` : ''}</div>`;
}

/* ---- Descarga del análisis (PDF o Word) con gráficas ---- */
const SIS_FUENTE = "\"MontserratOfi\", Arial, Helvetica, sans-serif";
const SIS_COL = { ne: '#2E7D4F', ed: '#E8A33D', ra: '#B3261E', az: '#1F3A6B', gris: '#555555', linea: '#D9D2C3' };
function sisLienzo(w, h) {
  const c = document.createElement('canvas'), k = 2.5; c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d'); x.scale(k, k); x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.textBaseline = 'middle';
  return { c, x, w, h };
}
const sisPng = L => { const url = L.c.toDataURL('image/png'); return { url, bytes: b64aBytes(url.split(',')[1]), w: L.w, h: L.h }; };
function sisTexto(x, t, px, py, o = {}) { x.font = `${o.bold ? '700 ' : ''}${o.size || 11}px ${SIS_FUENTE}`; x.fillStyle = o.color || '#1E2A40'; x.textAlign = o.align || 'left'; x.fillText(t, px, py); }
function sisRecorta(x, t, max, size) { x.font = `${size || 11}px ${SIS_FUENTE}`; if (x.measureText(t).width <= max) return t; while (t.length > 3 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }

// Barras 100 % apiladas: esperado, en desarrollo, requiere apoyo
function sisGrafNiveles(filas, titulo) {
  const W = 640, izq = 170, der = 20, alto = 30, top = titulo ? 34 : 10, H = top + filas.length * alto + 44;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;
  if (titulo) sisTexto(x, titulo, 0, 14, { bold: true, size: 13, color: SIS_COL.az });
  filas.forEach((f, i) => {
    const y = top + i * alto;
    sisTexto(x, sisRecorta(x, f.etq, izq - 12, 11), 0, y + 11, { size: 11 });
    if (!f.n) { sisTexto(x, 'Sin datos', izq, y + 11, { size: 10, color: SIS_COL.gris }); return; }
    let px = izq;
    [['ne', f.pne], ['ed', f.ped], ['ra', f.pra]].forEach(([k, p]) => {
      const w = ancho * (p || 0) / 100; x.fillStyle = SIS_COL[k]; x.fillRect(px, y + 2, w, 18);
      if (p >= 7) sisTexto(x, Math.round(p) + '%', px + w / 2, y + 11, { size: 10, bold: true, align: 'center', color: k === 'ed' ? '#3B2A0A' : '#fff' });
      px += w;
    });
  });
  const ly = top + filas.length * alto + 18;
  [['ne', 'Nivel esperado'], ['ed', 'En desarrollo'], ['ra', 'Requiere apoyo']].forEach(([k, t], i) => { const lx = izq + i * 150; x.fillStyle = SIS_COL[k]; x.fillRect(lx, ly - 5, 11, 11); sisTexto(x, t, lx + 16, ly, { size: 10.5 }); });
  return sisPng(L);
}
// Componentes de lectura o textos (porcentaje del puntaje posible)
function sisGrafComp(comp, h) {
  const W = 640, izq = 230, der = 50, alto = 26, top = 34, H = top + 6 * alto + 40;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;
  sisTexto(x, SIS_H.find(q => q[0] === h)[1] + ' · componentes (' + comp[h].n + ' alumnos)', 0, 14, { bold: true, size: 13, color: SIS_COL.az });
  [55, 80].forEach(p => { const gx = izq + ancho * p / 100; x.strokeStyle = SIS_COL.linea; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(gx, top - 4); x.lineTo(gx, top + 6 * alto); x.stroke(); x.setLineDash([]); sisTexto(x, p + '%', gx, top + 6 * alto + 9, { size: 9, align: 'center', color: SIS_COL.gris }); });
  SIS_COMP[h].forEach((nom, i) => {
    const y = top + i * alto, p = sisCompPc(comp, h, i) || 0, col = p >= 81 ? SIS_COL.ne : p >= 56 ? SIS_COL.ed : SIS_COL.ra;
    sisTexto(x, sisRecorta(x, SIS_ROM[i] + '. ' + nom, izq - 10, 11), 0, y + 9, { size: 11 });
    x.fillStyle = '#F1E4CC'; x.fillRect(izq, y, ancho, 18); x.fillStyle = col; x.fillRect(izq, y, ancho * p / 100, 18);

// Cálculo mental: cada reactivo con aciertos sin apoyo, con apoyo e incorrectas
function sisGrafCalc(comp) {
  const n = comp.cal.n, W = 640, izq = 90, der = 50, alto = 22, top = 34, H = top + 10 * alto + 34;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;

    const y = top + i * alto, sa = (s - comp.cal.v[i]) / n, ca = comp.cal.v[i] / n, inc = (n - s) / n;
    sisTexto(x, 'Reactivo ' + SIS_ROM[i], 0, y + 8, { size: 11 });

  const ly = top + 10 * alto + 18;

}
// Tendencia: nivel esperado y requiere apoyo en los tres momentos, una gráfica por habilidad
function sisGrafTend(ms) {
  const W = 640, H = 230, pw = 196, gap = 26;
  const L = sisLienzo(W, H), x = L.x;
  SIS_H.forEach(([h, nom], k) => {
    const ox = k * (pw + gap), top = 30, alto = 140, X = i => ox + 30 + i * ((pw - 44) / 2), Y = p => top + alto - alto * p / 100;
    sisTexto(x, nom, ox + pw / 2, 12, { bold: true, size: 12, align: 'center', color: SIS_COL.az });
    [0, 50, 100].forEach(p => { x.strokeStyle = SIS_COL.linea; x.beginPath(); x.moveTo(ox + 26, Y(p)); x.lineTo(ox + pw - 8, Y(p)); x.stroke(); sisTexto(x, String(p), ox + 22, Y(p), { size: 9, align: 'right', color: SIS_COL.gris }); });
    [1, 2, 3].forEach((m, i) => sisTexto(x, 'M' + m, X(i), top + alto + 14, { size: 10, align: 'center', color: SIS_COL.gris }));
    [['pne', SIS_COL.ne], ['pra', SIS_COL.ra]].forEach(([q, col]) => {
      const pts = ms.map((o, i) => o.a && o.a[h].n ? [X(i), Y(o.a[h][q])] : null).filter(Boolean);
      x.strokeStyle = col; x.lineWidth = 2.5; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); x.lineWidth = 1;
      pts.forEach(p => { x.fillStyle = col; x.beginPath(); x.arc(p[0], p[1], 4, 0, 7); x.fill(); });
    });
  });
  [[SIS_COL.ne, 'Nivel esperado'], [SIS_COL.ra, 'Requiere apoyo']].forEach(([c, t], i) => { const lx = 200 + i * 140; x.fillStyle = c; x.fillRect(lx, 214, 11, 11); sisTexto(x, t, lx + 16, 219, { size: 10.5 }); });
  return sisPng(L);
}

    B.push(nivelTabla(a));

    if (a.tip.n) B.push({ t: 'p', x: `<b>Cálculo mental:</b> ${sisFmt(a.tip.psa)} de las respuestas fueron aciertos sin apoyo visual, ${sisFmt(a.tip.pca)} con apoyo visual y ${sisFmt(a.tip.pinc)} incorrectas.` });
    if (sin1 && filas.some(r => r.grado === '1')) B.push({ t: 'nota', x: 'En este concentrado 1.° grado no se cuenta en lectura ni en producción de textos (sí en cálculo): al inicio del ciclo aún no leen ni escriben de forma convencional.' });

/* ---- La hoja en HTML (vista previa y PDF). s = escala de letra y espacios (1 = normal) ---- */
// Word da a cada renglón de Montserrat 1.38 veces el tamaño de la letra; la página usa lo mismo para que ambos coincidan
const MULT_LINEA = 1.38;
function htmlOficio(o, s = 1, rec = {}, t = 0, abajo = false) {
  // s: escala de letra (para que quepa); t: 0 a 1, aire extra cuando la hoja queda vacía; abajo: C.c.p. al pie de la hoja

  const pt = v => (v * 96 / 72 * s).toFixed(2) + 'px';
  const lh = ((1.125 + 0.4 * t) * MULT_LINEA).toFixed(3), pa = 7.3 + 12 * t;
  const parr = parrafosDe(o.cuerpo).map(p => {
    const lineas = p.split('\n');
    if (lineas.every(l => /^[•\-–]\s/.test(l.trim()))) return lineas.map(l => `<p class="h-p h-vi" style="line-height:${lh};margin:0 0 ${px(4 + 3 * t)};padding-left:${px(26)};text-indent:-${px(14)}">•&nbsp;&nbsp;${esc(l.trim().replace(/^[•\-–]\s*/, ''))}</p>`).join('');
    return `<p class="h-p" style="line-height:${lh};margin:0 0 ${px(pa)}">${esc(p).replace(/\n/g, '<br>')}</p>`;
  }).join('') || `<p class="h-p" style="margin:0;color:#aaa">El texto del oficio aparecerá aquí.</p>`;
  return `<div class="hoja" style="font-size:${pt(10)};line-height:${(1.125 * MULT_LINEA).toFixed(3)}">
    <div class="h-enc">
      <img class="h-isep" src="img/isep.png" alt="ISEP">

      <img class="h-zona" src="img/zona050.png" alt="Zona 050">

        <div style="letter-spacing:.25em">${presente(o)}</div>
      </div>

          ${o.firma && rec.firma ? `<img class="h-img-firma" src="data:image/png;base64,${rec.firma}" alt="Firma">` : ''}
          ${o.sello && rec.sello ? `<img class="h-img-sello" src="data:image/png;base64,${rec.sello}" alt="Sello">` : ''}
          <div class="h-raya"></div>
        </div>
        <div class="h-nom">${OFI.firmante}</div>
        <div class="h-car">${OFI.cargo}</div>
        <div class="h-cct">C.C.T. ${OFI.cct}</div>
      </div></div>
      <div class="h-ccp">${lineasCcp(o).map(l => `<div><b>C.c.p.</b> ${esc(l)}</div>`).join('')}</div>
    </div>
    <div class="h-pie"><div>Supervisión Escolar Zona 050 · Camalú, San Quintín, B.C. · C.P. 22910</div><div>Tel. 616 165 5622 · supervision050sep@gmail.com</div></div>

// Acomoda el oficio en la hoja: si se pasa por poco, reduce un poco la letra; si queda vacía, reparte el espacio
// (más aire entre párrafos y la firma más abajo) y deja las copias (C.c.p.) al pie de la hoja.
const ALTO_UTIL = 842;
let FUENTES_OFI = null;   // la letra del oficio se carga de la propia página para medir igual que en Word
const fuentesOficio = () => FUENTES_OFI || (FUENTES_OFI = Promise.all(['400 10px MontserratOfi', '700 10px MontserratOfi', 'italic 400 10px MontserratOfi'].map(f => document.fonts.load(f))).catch(() => null));
function disposicion(o, rec, reserva = 0, escalas = [1, 0.97, 0.94, 0.91, 0.88], holgura = 0) {
  const caja = document.createElement('div');
  caja.style.cssText = 'position:fixed;left:-10000px;top:0;width:816px;visibility:hidden';
  document.body.appendChild(caja);
  const cabe = (s, t) => {
    caja.innerHTML = htmlOficio(o, s, rec, t, true);
    const pr = caja.querySelector('.h-princ').offsetHeight, cc = caja.querySelector('.h-ccp').offsetHeight;
    return pr * (1 + holgura) + (cc ? 18 + cc : 0) <= ALTO_UTIL - reserva;
  };
  try {
    let s = 0;
    for (const e of escalas) if (cabe(e, 0)) { s = e; break; }
    if (!s) return { s: 1, t: 0, unaHoja: false };   // ni reduciendo cabe: dos hojas con letra normal
    if (s < 1) return { s, t: 0, unaHoja: true };
    let lo = 0, hi = 1;
    if (cabe(1, 1)) lo = 1;
    else for (let i = 0; i < 7; i++) { const m = (lo + hi) / 2; if (cabe(1, m)) lo = m; else hi = m; }
    return { s: 1, t: Math.round(lo * 100) / 100, unaHoja: true };
  } finally { caja.remove(); }
}
