    cal = `<div><h3>Cálculo mental por reactivo <span class="peq mudo" style="font-weight:400">· ${n} alumnos</span></h3>
      ${c.cal.s.map((x, i) => { const sa = x - c.cal.v[i], ca = c.cal.v[i], inc = n - x, P = q => Math.round(q * 1000 / n) / 10;
        return `<div class="sis-cb"><span class="sis-cb-n">Reactivo ${SIS_ROM[i]}</span><span class="sis-cb-b sis-barra" role="img" aria-label="Sin apoyo ${P(sa)}%, con apoyo ${P(ca)}%, incorrectas ${P(inc)}%"><i class="ne" style="width:${P(sa)}%"></i><i class="ed" style="width:${P(ca)}%"></i><i class="ra" style="width:${P(inc)}%"></i></span><b class="sis-cb-p">${sisFmt(P(x))}</b></div>`; }).join('')}
      <div class="sis-tip" style="margin-top:6px"><span><i class="ne"></i>Acierto sin apoyo visual</span><span><i class="ed"></i>Acierto con apoyo visual</span><span><i class="ra"></i>Incorrecta</span></div>
      <p class="peq mudo" style="margin:4px 0 0">El manual advierte que los reactivos no bastan para saber qué operación se le dificulta al grupo; sirven para ver si resuelven con estrategia propia o necesitan el apoyo visual.</p></div>`;
  }
  return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 8px">${titulo || 'Componentes de cada habilidad'}</div>
    <div class="sis-comp-g">${bloque('lec')}${bloque('tex')}${cal}</div>
    <div class="sis-ley" style="margin:10px 0 0"><span><i style="background:#2E7D4F"></i>81 a 100%: manejo adecuado</span><span><i style="background:#E8A33D"></i>56 a 80%: avance significativo</span><span><i style="background:#B3261E"></i>55% o menos: poco avance</span></div></div>`;
}

// Diagnóstico por componente (se agrega a fortalezas y focos de atención)
function sisDiagComp(c, F, A, G) {
  if (!c) return;
  ['lec', 'tex'].forEach(h => {
    const e = sisCompExtremos(c, h); if (!e) return;
    const nom = SIS_H.find(x => x[0] === h)[1];
    const bajos = e.lista.filter(x => x.p <= 55);
    if (bajos.length) A.push(`<b>${nom}:</b> poco avance en ${bajos.map(x => '<b>' + esc(x.nom.toLowerCase()) + '</b> (' + sisFmt(x.p) + ')').join(', ')}.`);
    else if (e.bajo.p <= 80) A.push(`<b>${nom}:</b> el componente más bajo es ${esc(e.bajo.nom.toLowerCase())} (${sisFmt(e.bajo.p)}).`);
    if (e.alto.p >= 81) F.push(`<b>${nom}:</b> ${esc(e.alto.nom.toLowerCase())} es una fortaleza (${sisFmt(e.alto.p)}).`);
    if (h === 'lec') {
      const seg = e.lista.find(x => /Seguridad/.test(x.nom)), comp = e.lista.find(x => /Comprensi/.test(x.nom));
      if (seg && comp && seg.p - comp.p >= 15) G.push('<b>Lectura.</b> El alumnado muestra disposición ante la lectura pero comprende poco: aproveche esa disposición como punto de partida y trabaje la comprensión con preguntas antes, durante y después de leer.');
    }
  });
}

/* ---- Alumnos ---- */
const SIS_NV = { NE: 2, ED: 1, RA: 0 };
const sisChipNiv = n => n ? `<span class="sis-nv ${n.toLowerCase()}" title="${({ NE: 'Nivel esperado', ED: 'En desarrollo', RA: 'Requiere apoyo' })[n]}">${n}</span>` : '<span class="mudo">—</span>';
function sisAlumnosVista(v, m, pred) {
  const cct = v.cct;
  if (!['escuela', 'grado', 'grupo'].includes(v.nivel) || !cct) return null;
  if (esDirector() && cct !== miCct()) return null;
  const todos = sisAlumnosDe(v.ciclo, cct);
  if (!todos) { sisPedirAlumnos(v.ciclo, cct).then(() => { const w = sisV(); if (w.cct === cct && w.ciclo === v.ciclo && $('#sis-al-espera')) vSisat(); }); return { cargando: true }; }
  const enNivel = a => v.nivel === 'escuela' || (a.grado === v.grado && (v.nivel === 'grado' || a.grupo === v.grupo));
  return { todos: todos.filter(enNivel) };
}
function sisAlumnosNivelM(v, m) {
  if (!['escuela', 'grado', 'grupo'].includes(v.nivel) || !v.cct || (esDirector() && v.cct !== miCct())) return [];
  return (sisAlumnosDe(v.ciclo, v.cct) || []).filter(a => a.momento === +m && (v.nivel === 'escuela' || (a.grado === v.grado && (v.nivel === 'grado' || a.grupo === v.grupo))));
}
// Cuántas habilidades en «requiere apoyo» (en el Momento 1, 1.° grado solo cuenta cálculo si así se ve el concentrado)
const sisNumRA = (a, sin1) => ['lec', 'tex', 'cal'].filter(h => a[h] && a[h].n === 'RA' && !(sin1 && h !== 'cal' && a.grado === '1')).length;
function sisCambio(a, b) {   // nivel de un alumno de un momento a otro
  if (!a || !b || !a.n || !b.n) return '';
  const d = SIS_NV[b.n] - SIS_NV[a.n];
  return d > 0 ? '<span class="sis-d bien" title="Subió de nivel">▲</span>' : d < 0 ? '<span class="sis-d mal" title="Bajó de nivel">▼</span>' : '<span class="sis-d igual" title="Mismo nivel">=</span>';
}
function sisSeccionAlumnos(v, m, sin1) {
  const r = sisAlumnosVista(v, m);
  if (!r) return '';
  if (r.cargando) return '<div class="tarjeta pad" id="sis-al-espera" style="margin-bottom:16px"><span class="mudo">Cargando los resultados por alumno…</span></div>';
  const deM = r.todos.filter(a => a.momento === m);
  if (!deM.length) {
    const x = SIA[v.ciclo + '|' + v.cct] || {};
    const motivo = x.viejo ? `El servidor de Tequio todavía no tiene la versión nueva, por eso no se pueden ver los alumnos. ${esAdmin() ? 'Siga los pasos de <a href="instalacion.html#actualizar">«Actualizar el servidor»</a>.' : 'Avise a la Supervisión.'}`
      : x.error ? 'No se pudieron traer los alumnos: ' + esc(x.error)
      : 'Lo que se ve arriba se cargó desde las gráficas en PDF o a mano, que no traen los nombres de los alumnos ni sus respuestas.';
    const puede = !x.viejo && (!esDirector() || v.cct === miCct());
    return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 6px">Alumnos en rezago</div><div class="aviso-caja" style="margin:0">${motivo}
      ${puede ? `<div style="margin-top:10px"><button class="boton terra" data-simp="${v.cct}|${m}">Leer los Excel del Drive de esta escuela</button> <span class="peq">Tequio los lee, reconoce cada grupo y guarda a cada alumno.</span></div>` : ''}</div></div>`;
  }
  const mPrev = [1, 2].filter(x => x < m).reverse().find(x => r.todos.some(a => a.momento === x));
  const prev = {}; if (mPrev) r.todos.filter(a => a.momento === mPrev).forEach(a => { prev[a.clave] = a; });
  const conGrupo = v.nivel !== 'grupo';
  const pts = (a, h) => a[h] && a[h].p != null ? `${sisChipNiv(a[h].n)} <span class="peq">${a[h].p}${h === 'cal' ? '/10' : '/18'}</span>` : '<span class="mudo">—</span>';
  const tablaR = l => `<div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th>${conGrupo ? '<th>Grupo</th>' : ''}<th>Lectura</th><th>Textos</th><th>Cálculo</th><th>Lo que más le cuesta</th></tr></thead>
    <tbody>${l.map(a => `<tr><td class="esc-col">${esc(a.alumno)}</td>${conGrupo ? `<td>${a.grado}° ${esc(a.grupo)}</td>` : ''}<td>${pts(a, 'lec')}</td><td>${pts(a, 'tex')}</td><td>${pts(a, 'cal')}</td><td class="sis-deb">${sisDebilidades(a).map(esc).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table></div>`;
  const R = sisRezago(deM, sin1);
  const cuenta = [0, 0, 0, 0]; deM.forEach(a => cuenta[sisNumRA(a, sin1)]++);
  const nota1 = (sin1 && deM.some(a => a.grado === '1')) ? '<p class="peq mudo" style="margin:0 14px 8px">En este concentrado, a 1.° grado solo se le cuenta cálculo (Momento 1): aún no leen ni escriben de forma convencional.</p>'
    : (+m === 1 && v.grado === '1' && v.nivel !== 'escuela') ? '<p class="peq mudo" style="margin:0 14px 8px">En el Momento 1, en 1.° grado es normal que casi todos salgan en rojo en lectura y textos: es su punto de partida. Para identificar el rezago fíjese sobre todo en cálculo y en las observaciones del docente.</p>' : '';
  let html = `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Alumnos en rezago</div>
    <div class="sis-cuenta">${[[3, 'en rojo en las tres habilidades (rezago)'], [2, 'en rojo en dos (en riesgo)'], [1, 'en rojo en una'], [0, 'en ninguna']].map(([k, t]) => `<div><b style="color:${k >= 2 ? 'var(--alerta)' : k === 1 ? 'var(--ambar)' : 'var(--ok)'}">${cuenta[k]}</b><span>${t}</span></div>`).join('')}</div>
    ${nota1}
    ${R.rez.length ? `<div class="sis-sub-t">Rezago: requieren apoyo en lectura, textos y cálculo (${R.rez.length})</div>${tablaR(R.rez)}` : '<p class="peq" style="margin:0 14px 10px;color:var(--ok)">Ningún alumno está en rojo en las tres habilidades.</p>'}
    ${R.riesgo.length ? `<details class="sis-mas" ${R.riesgo.length <= 12 ? 'open' : ''}><summary>En riesgo: en rojo en dos habilidades (${R.riesgo.length})</summary>${tablaR(R.riesgo)}</details>` : ''}
    ${R.bajos.length ? `<details class="sis-mas" open><summary>Muy bajos en alguna habilidad (${R.bajos.length}): lectura o textos con 7 puntos o menos de 18, o cálculo con 2 aciertos o menos</summary>${tablaR(R.bajos)}</details>` : ''}
    <div class="peq mudo" style="padding:8px 14px">Según el manual del SisAT, los alumnos en rojo requieren atención de la mayor prioridad: conviene reunir información de asistencia, participación y apoyos anteriores, y partir de lo que sí dominan. «Lo que más le cuesta»: componentes con el puntaje más bajo (1 de 3) y preguntas de cálculo que falló.</div></div>`;
  if (v.nivel === 'grupo') {
    const orden = v.ordenAl === 'nombre' ? deM.slice().sort((x, y) => x.alumno.localeCompare(y.alumno, 'es'))
      : deM.slice().sort((x, y) => sisNumRA(y) - sisNumRA(x) || ((x.lec ? x.lec.p : 99) + (x.cal ? x.cal.p : 99)) - ((y.lec ? y.lec.p : 99) + (y.cal ? y.cal.p : 99)));
    const celda = (a, h) => { const x = a[h]; if (!x) return '<td class="mudo">—</td>';
      const ant = prev[a.clave] ? prev[a.clave][h] : null;
      return `<td>${sisChipNiv(x.n)} <span class="peq">${x.p == null ? '' : x.p + (h === 'cal' ? '/10' : '/18')}${h === 'cal' && x.v ? ' · ' + x.v + ' con apoyo' : ''}</span> ${mPrev ? sisCambio(ant, x) : ''}</td>`; };
    html += `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Todos los alumnos del grupo (${deM.length})
      <button class="boton sec chico" id="b-sis-oal" style="margin-left:8px;text-transform:none;letter-spacing:0">Ordenar por ${v.ordenAl === 'nombre' ? 'necesidad' : 'nombre'}</button></div>
      <div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th><th>Lectura</th><th>Textos</th><th>Cálculo</th></tr></thead>
      <tbody>${orden.map(a => `<tr class="${sisNumRA(a) === 3 ? 'sis-al-3' : ''}"><td class="esc-col">${esc(a.alumno)}</td>${celda(a, 'lec')}${celda(a, 'tex')}${celda(a, 'cal')}</tr>`).join('')}</tbody></table></div>
      <div class="peq mudo" style="padding:8px 14px">NE nivel esperado · ED en desarrollo · RA requiere apoyo. Lectura y textos sobre 18 puntos; cálculo, aciertos de 10.${mPrev ? ` ▲ ▼ = cambio de nivel respecto al Momento ${mPrev}.` : ''}</div></div>`;
  }
  return html;
}

/* ---- Rezago en toda la zona (solo Supervisión y Mesa Técnica): junta los alumnos de todas las escuelas con resultados ---- */
function sisAlumnosZona(v, m, filas) {
  const ccts = Array.from(new Set(filas.map(r => r.cct))).filter(Boolean);
  const faltan = ccts.filter(c => !sisAlumnosDe(v.ciclo, c));
  if (faltan.length) return { faltan, ccts };
  return { ccts, al: ccts.flatMap(c => sisAlumnosDe(v.ciclo, c)).filter(a => a.momento === +m && (v.nivel !== 'zgrado' || a.grado === v.grado)) };
}
async function sisCargarZona(v, ccts) { await Promise.all(ccts.map(c => sisPedirAlumnos(v.ciclo, c))); }
function sisSeccionRezagoZona(v, m, filas, sin1) {
  if (esDirector() || !['zona', 'zgrado'].includes(v.nivel)) return '';
  const z = sisAlumnosZona(v, m, filas);
  if (z.faltan) {
    sisCargarZona(v, z.faltan).then(() => { const w = sisV(); if (['zona', 'zgrado'].includes(w.nivel) && $('#sis-al-espera')) vSisat(); });
    return '<div class="tarjeta pad" id="sis-al-espera" style="margin-bottom:16px"><span class="mudo">Cargando a los alumnos de las escuelas…</span></div>';
  }
  if (!z.al.length) {
    const viejo = z.ccts.some(c => (SIA[v.ciclo + '|' + c] || {}).viejo);
    return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 6px">Alumnos en rezago en la zona</div><div class="aviso-caja" style="margin:0">${viejo ? `El servidor de Tequio todavía no tiene la versión nueva. ${esAdmin() ? 'Siga los pasos de <a href="instalacion.html#actualizar">«Actualizar el servidor»</a>.' : 'Avise a la Supervisión.'}` : 'Ninguna escuela tiene cargados los Excel de este momento: los resultados vienen de gráficas o captura a mano, que no traen nombres de alumnos.'}</div></div>`;
  }
  const conExcel = new Set(z.al.map(a => a.cct)).size;
  const R = sisRezagoPorEscuela(z.al, sin1);
  const cuenta = [0, 0, 0, 0]; z.al.forEach(a => cuenta[sisNumRA(a, sin1)]++);
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Alumnos en rezago ${v.nivel === 'zgrado' ? 'de ' + v.grado + '.° grado ' : ''}en la zona</div>
    <p class="peq mudo" style="margin:0 14px 6px">${conExcel} de ${z.ccts.length} escuelas con resultados por alumno (cargados con los Excel) · ${z.al.length} alumnos.</p>
    <div class="sis-cuenta">${[[3, 'en rojo en las tres habilidades (rezago)'], [2, 'en rojo en dos (en riesgo)'], [1, 'en rojo en una'], [0, 'en ninguna']].map(([k, t]) => `<div><b style="color:${k >= 2 ? 'var(--alerta)' : k === 1 ? 'var(--ambar)' : 'var(--ok)'}">${cuenta[k]}</b><span>${t}</span></div>`).join('')}</div>
    ${sin1 && z.al.some(a => a.grado === '1') ? '<p class="peq mudo" style="margin:0 14px 8px">En este concentrado, a 1.° grado solo se le cuenta cálculo (Momento 1).</p>' : ''}
    ${R.rez.length ? `<details class="sis-mas" open><summary>Rezago: en rojo en lectura, textos y cálculo (${R.rez.length})</summary>${sisTablaAlumnos(R.rez, true)}</details>` : '<p class="peq" style="margin:0 14px 10px;color:var(--ok)">Ningún alumno está en rojo en las tres habilidades.</p>'}
    ${R.riesgo.length ? `<details class="sis-mas"><summary>En riesgo: en rojo en dos habilidades (${R.riesgo.length})</summary>${sisTablaAlumnos(R.riesgo, true)}</details>` : ''}
    ${R.bajos.length ? `<details class="sis-mas"><summary>Muy bajos en alguna habilidad (${R.bajos.length})</summary>${sisTablaAlumnos(R.bajos, true)}</details>` : ''}</div>`;
}
function sisRezagoPorEscuela(al, sin1) {
  const R = sisRezago(al, sin1), o = l => l.slice().sort((x, y) => nombreEscuela(x.cct).localeCompare(nombreEscuela(y.cct), 'es') || x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo));
  return { rez: o(R.rez), riesgo: o(R.riesgo), bajos: o(R.bajos) };
}
function sisTablaAlumnos(l, conEscuela, sinGrupo) {
  const pts = (a, h) => a[h] && a[h].p != null ? `${sisChipNiv(a[h].n)} <span class="peq">${a[h].p}${h === 'cal' ? '/10' : '/18'}</span>` : '<span class="mudo">—</span>';
  return `<div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th>${conEscuela ? '<th>Escuela</th>' : ''}${sinGrupo ? '' : '<th>Grupo</th>'}<th>Lectura</th><th>Textos</th><th>Cálculo</th><th>Lo que más le cuesta</th></tr></thead>
    <tbody>${l.map(a => `<tr><td class="esc-col">${esc(a.alumno)}</td>${conEscuela ? `<td class="sis-deb">${esc(nombreEscuela(a.cct))}</td>` : ''}${sinGrupo ? '' : `<td>${a.grado}° ${esc(a.grupo)}</td>`}<td>${pts(a, 'lec')}</td><td>${pts(a, 'tex')}</td><td>${pts(a, 'cal')}</td><td class="sis-deb">${sisDebilidades(a).map(esc).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

// Tendencia por alumno: quién subió, quién sigue igual y quién no ha salido de «requiere apoyo»
function sisTendenciaAlumnos(v) {
  const r = sisAlumnosVista(v);
  if (!r) return '';
  if (r.cargando) return '<div class="tarjeta pad" id="sis-al-espera" style="margin-bottom:16px"><span class="mudo">Cargando los resultados por alumno…</span></div>';
  const ms = [1, 2, 3].filter(m => r.todos.some(a => a.momento === m));
  if (ms.length < 2) return '';
  const p = ms[0], u = ms[ms.length - 1];
  const de = m => { const o = {}; r.todos.filter(a => a.momento === m).forEach(a => { o[a.clave] = a; }); return o; };
  const A = de(p), B = de(u);
  const ambos = Object.keys(B).filter(k => A[k]);
  const filas = SIS_H.map(([h, nom]) => {
    const c = { sube: 0, igual: 0, baja: 0, siguenRA: [] };
    ambos.forEach(k => { const a = A[k][h], b = B[k][h]; if (!a || !b || !a.n || !b.n) return; const d = SIS_NV[b.n] - SIS_NV[a.n]; d > 0 ? c.sube++ : d < 0 ? c.baja++ : c.igual++; if (a.n === 'RA' && b.n === 'RA') c.siguenRA.push(B[k]); });
    return { h, nom, c };
  });
  const siempre = ambos.map(k => B[k]).filter(a => ['lec', 'tex', 'cal'].every(h => A[a.clave][h] && a[h] && A[a.clave][h].n === 'RA' && a[h].n === 'RA'));
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Movimiento de los alumnos del Momento ${p} al Momento ${u}</div>
    <div class="matriz-caja"><table class="matriz sis-tab"><thead><tr><th class="esc-col">Habilidad</th><th>Subieron de nivel</th><th>Mismo nivel</th><th>Bajaron</th><th>Siguen en «requiere apoyo»</th></tr></thead>
    <tbody>${filas.map(f => `<tr><td class="esc-col"><b>${f.nom}</b></td><td style="color:var(--ok);font-weight:700">${f.c.sube}</td><td>${f.c.igual}</td><td style="color:var(--alerta);font-weight:700">${f.c.baja}</td><td>${f.c.siguenRA.length}</td></tr>`).join('')}</tbody></table></div>
    <p class="peq mudo" style="margin:8px 14px">Se comparan ${ambos.length} alumnos que aparecen en los dos momentos.</p>
    ${siempre.length ? `<details class="sis-mas" open><summary>${siempre.length} alumno${siempre.length === 1 ? ' sigue' : 's siguen'} en «requiere apoyo» en las tres habilidades</summary>
      <div style="padding:6px 14px 12px;columns:2;column-gap:24px">${siempre.map(a => `${esc(a.alumno)} <span class="peq mudo">${a.grado}° ${esc(a.grupo)}</span>`).join('<br>')}</div></details>` : ''}</div>`;
}

/* ---- Comparativos de la zona (Supervisión y Mesa Técnica) ---- */
// Escuelas del turno vespertino (las demás se toman como matutinas)
const SIS_VESPERTINAS = ['02DPR0077J', '02DPR0150B', '02DPR0882N'];   // 13 de Septiembre, Josefa Ortiz de Domínguez, Luis Donaldo Colosio Murrieta
const sisTurno = cct => SIS_VESPERTINAS.includes(cct) ? 'Vespertino' : 'Matutino';
const SIS_CRITERIOS = [
  ['ind', 'Índice general', 1], ['lec.pne', 'Lectura · nivel esperado', 1], ['tex.pne', 'Producción de textos · nivel esperado', 1], ['cal.pne', 'Cálculo mental · nivel esperado', 1],
  ['lec.pra', 'Lectura · requiere apoyo', -1], ['tex.pra', 'Producción de textos · requiere apoyo', -1], ['cal.pra', 'Cálculo mental · requiere apoyo', -1]
];
const sisValor = (a, crit) => { if (!a) return null; if (crit === 'ind') return a.ind; const [h, k] = crit.split('.'); return a[h] && a[h].n ? a[h][k] : null; };
function sisCmpV(v) { if (!v.cmp) v.cmp = { tipo: 'multi', grado: '', sel: [], crit: 'ind', orden: 'desc' }; return v.cmp; }

// Bloques de escuelas que se comparan, según el tipo de comparativo
function sisCmpGrupos(v, filas) {
  const c = sisCmpV(v), escs = filtroEscuelas();
  const de = l => filas.filter(r => l.some(e => e.cct === r.cct));
  if (c.tipo === 'multi') return [['Multigrado', escs.filter(e => e.multigrado)], ['Organización completa', escs.filter(e => !e.multigrado)]].map(([n, l]) => ({ etq: n, escs: l, filas: de(l) }));
  if (c.tipo === 'turno') return [['Turno matutino', escs.filter(e => sisTurno(e.cct) === 'Matutino')], ['Turno vespertino', escs.filter(e => sisTurno(e.cct) === 'Vespertino')]].map(([n, l]) => ({ etq: n, escs: l, filas: de(l) }));
  if (c.tipo === 'mun') return ['San Quintín', 'Ensenada'].map(n => { const l = escs.filter(e => e.municipio === n); return { etq: 'Municipio de ' + n, escs: l, filas: de(l) }; });
  if (c.tipo === 'elegir') return c.sel.map(cct => { const e = escs.find(x => x.cct === cct) || { cct, escuela: nombreEscuela(cct) }; return { etq: e.escuela, escs: [e], filas: de([e]) }; });
  return [];
}

function sisCuerpoComparativo(v) {
  const c = sisCmpV(v), m = v.m;
  if (m === 't') return '<div class="tarjeta vacio">Los comparativos se hacen por momento: elija el Momento 1, 2 o 3.</div>';
  const sin1 = +m === 1 && !v.con1;
  let filas = sisFilas(m).filter(r => filtroEscuelas().some(e => e.cct === r.cct));
  if (c.grado) filas = filas.filter(r => r.grado === c.grado);
  const tipos = [['multi', 'Multigrado vs. organización completa'], ['turno', 'Matutino vs. vespertino'], ['mun', 'San Quintín vs. Ensenada'], ['elegir', 'Escuelas que yo elija'], ['rank', 'Jerarquizar todas las escuelas']];
  const panel = `<div class="tarjeta pad sis-cmp-p">
    <div class="sis-cmp-f">
      <div class="campo" style="margin:0"><label for="cmp-tipo">Comparar</label><select id="cmp-tipo">${tipos.map(([k, t]) => `<option value="${k}" ${c.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="campo" style="margin:0"><label for="cmp-grado">Grados</label><select id="cmp-grado"><option value="">Todos los grados</option>${[1, 2, 3, 4, 5, 6].map(g => `<option value="${g}" ${c.grado === String(g) ? 'selected' : ''}>Solo ${g}.° grado</option>`).join('')}</select></div>
      ${c.tipo === 'rank' ? `<div class="campo" style="margin:0"><label for="cmp-crit">Ordenar por</label><select id="cmp-crit">${SIS_CRITERIOS.map(([k, t]) => `<option value="${k}" ${c.crit === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="campo" style="margin:0"><label for="cmp-orden">Orden</label><select id="cmp-orden"><option value="desc" ${c.orden === 'desc' ? 'selected' : ''}>De mayor a menor</option><option value="asc" ${c.orden === 'asc' ? 'selected' : ''}>De menor a mayor</option></select></div>` : ''}
    </div>
    ${c.tipo === 'elegir' ? `<div class="sis-cmp-sel">${filtroEscuelas().map(e => `<label><input type="checkbox" data-cmpsel="${e.cct}" ${c.sel.includes(e.cct) ? 'checked' : ''}> ${esc(e.escuela)}</label>`).join('')}</div><p class="peq mudo" style="margin:4px 0 0">Marque dos o más escuelas.</p>` : ''}
    ${c.tipo === 'turno' && !SIS_VESPERTINAS.length ? '<div class="aviso-caja" style="margin:10px 0 0">Falta indicar en Tequio qué escuelas son del turno vespertino.</div>' : ''}
    ${sin1 ? '<p class="peq mudo" style="margin:8px 0 0">Momento 1: a 1.° grado solo se le cuenta cálculo (aún no leen ni escriben de forma convencional).</p>' : ''}
  </div>`;
  if (!filas.length) return panel + `<div class="tarjeta vacio">No hay resultados del Momento ${m}${c.grado ? ' en ' + c.grado + '.° grado' : ''}.</div>`;
  if (c.tipo === 'rank') return panel + sisRanking(v, filas, sin1);
  const G = sisCmpGrupos(v, filas).map(g => Object.assign(g, { a: g.filas.length ? sisSuma(g.filas, sin1) : null, comp: sisCompSuma(g.filas, sin1) }));
  if (c.tipo === 'elegir' && G.length < 2) return panel + '<div class="tarjeta vacio">Marque al menos dos escuelas para compararlas.</div>';
  return panel + sisCmpResultado(G, c);
}

function sisCmpResultado(G, c) {
  const con = G.filter(g => g.a);
  const fila = g => `<tr><td class="esc-col"><b>${esc(g.etq)}</b><div class="peq mudo">${g.escs.length} escuela${g.escs.length === 1 ? '' : 's'}${g.a ? ' · ' + g.a.grupos + ' grupos · ' + g.a.alumnos + ' alumnos' : ' · sin resultados'}</div></td>
    ${SIS_H.map(([h]) => { const o = g.a ? g.a[h] : null; return `<td class="sis-celda">${o && o.n ? `${sisBarra(o, 10)}<span class="peq"><b style="color:var(--ok)">${sisFmt(o.pne)}</b> esp. · <b style="color:var(--alerta)">${sisFmt(o.pra)}</b> apoyo</span>` : '<span class="sis-sin">—</span>'}</td>`; }).join('')}
    <td><span class="sis-ind" style="background:${sisColorInd(g.a && g.a.ind)}">${g.a && g.a.ind != null ? g.a.ind : '—'}</span></td></tr>`;
  const tabla = `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Comparativo por nivel de logro</div><div class="matriz-caja"><table class="matriz sis-tab">
    <thead><tr><th class="esc-col"></th>${SIS_H.map(([, nom]) => `<th>${nom}</th>`).join('')}<th>Índice</th></tr></thead><tbody>${G.map(fila).join('')}</tbody></table></div>
    ${sisLeyenda()}</div>`;
  // Gráfica: nivel esperado y requiere apoyo de cada bloque en cada habilidad
  const colores = ['#24427A', '#C2603A', '#2E7D4F', '#8A5BB0', '#B08A4E', '#4A90A4'];
  const graf = `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 8px">Nivel esperado por habilidad</div>
    <div class="sis-cmp-g">${SIS_H.map(([h, nom]) => `<div><h3>${nom}</h3>${G.map((g, i) => { const o = g.a ? g.a[h] : null; const p = o && o.n ? o.pne : 0;
      return `<div class="sis-cb"><span class="sis-cb-n">${esc(g.etq)}</span><span class="sis-cb-b"><i style="width:${p}%;background:${colores[i % colores.length]}"></i></span><b class="sis-cb-p">${o && o.n ? sisFmt(o.pne) : '—'}</b></div>`; }).join('')}</div>`).join('')}</div></div>`;
  const L = sisCmpConclusiones(G);
  const concl = L.length ? `<div class="tarjeta pad sis-diag" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 6px">Lo que muestra el comparativo</div><ul>${L.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
  // Detalle: escuelas de cada bloque
  const det = c.tipo !== 'elegir' ? `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Escuelas de cada bloque</div><div class="sis-cmp-det">${G.map(g => `<div><h3>${esc(g.etq)}</h3>${g.escs.map(e => { const a = g.filas.some(r => r.cct === e.cct) ? sisSuma(g.filas.filter(r => r.cct === e.cct), false) : null;
      return `<div class="sis-cmp-e"><button class="sis-ir" data-sesc="${e.cct}">${esc(e.escuela)}</button><span class="sis-ind" style="background:${sisColorInd(a && a.ind)}">${a && a.ind != null ? a.ind : '—'}</span></div>`; }).join('')}</div>`).join('')}</div></div>` : '';
  return concl + tabla + graf + det;
}

function sisCmpConclusiones(G) {
  const con = G.filter(g => g.a);
  const L = [];
  if (con.length >= 2) {
    SIS_H.forEach(([h, nom]) => {
      const vals = con.filter(g => g.a[h].n).map(g => ({ g, ne: g.a[h].pne, ra: g.a[h].pra })); if (vals.length < 2) return;
      const ord = vals.slice().sort((x, y) => y.ne - x.ne), mej = ord[0], peor = ord[ord.length - 1], dif = Math.round((mej.ne - peor.ne) * 10) / 10;
      if (dif >= 3) L.push(`<b>${nom}:</b> ${esc(mej.g.etq)} tiene ${dif} puntos más de alumnos en nivel esperado que ${esc(peor.g.etq)} (${sisFmt(mej.ne)} contra ${sisFmt(peor.ne)}); en «requiere apoyo», ${sisFmt(mej.ra)} contra ${sisFmt(peor.ra)}.`);
      else L.push(`<b>${nom}:</b> resultados parecidos (diferencia de ${dif} puntos en nivel esperado).`);
    });
    const ord = con.filter(g => g.a.ind != null).sort((x, y) => y.a.ind - x.a.ind);
    if (ord.length >= 2) L.push(`<b>Índice general:</b> ${ord.map(g => esc(g.etq) + ' ' + g.a.ind).join(' · ')}.`);
    // componentes: dónde está la mayor brecha
    ['lec', 'tex'].forEach(h => {
      const cs = con.filter(g => g.comp && g.comp[h] && g.comp[h].n); if (cs.length < 2) return;
      let mejor = null;
      SIS_COMP[h].forEach((nom, i) => { const ps = cs.map(g => sisCompPc(g.comp, h, i)); const d = Math.max(...ps) - Math.min(...ps); if (!mejor || d > mejor.d) mejor = { nom, d: Math.round(d * 10) / 10, i, ps }; });
      if (mejor && mejor.d >= 5) { const k = mejor.ps.indexOf(Math.min(...mejor.ps)); L.push(`<b>${SIS_H.find(x => x[0] === h)[1]}:</b> la mayor diferencia está en <b>${esc(mejor.nom.toLowerCase())}</b> (${mejor.d} puntos); el más bajo es ${esc(cs[k].etq)} con ${sisFmt(mejor.ps[k])}.`); }
    });
  }
  return L;
}
function sisRanking(v, filas, sin1) {
  const c = sisCmpV(v);
  const crit = SIS_CRITERIOS.find(x => x[0] === c.crit) || SIS_CRITERIOS[0];
  const l = filtroEscuelas().map(e => { const rs = filas.filter(r => r.cct === e.cct); const a = rs.length ? sisSuma(rs, sin1) : null; return { e, a, val: sisValor(a, crit[0]) }; });
  const con = l.filter(x => x.val != null).sort((x, y) => c.orden === 'asc' ? x.val - y.val : y.val - x.val), sin = l.filter(x => x.val == null);
  const max = Math.max(1, ...con.map(x => x.val));
  const pct = crit[0] !== 'ind';
  const color = x => crit[2] > 0 ? sisColorInd(x.val) : (x.val >= 40 ? 'var(--alerta)' : x.val >= 25 ? 'var(--ambar)' : 'var(--ok)');
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Escuelas por ${esc(crit[1].toLowerCase())} · ${c.orden === 'asc' ? 'de menor a mayor' : 'de mayor a menor'}</div>
    <div class="sis-rank">${con.map((x, i) => `<div class="sis-rank-f"><span class="sis-rank-n">${i + 1}</span>
      <span class="sis-rank-e"><button class="sis-ir" data-sesc="${x.e.cct}">${esc(x.e.escuela)}</button><span class="peq mudo">${x.e.multigrado ? 'Multigrado' : 'Org. completa'} · ${esc(x.e.municipio)}${SIS_VESPERTINAS.length ? ' · ' + sisTurno(x.e.cct) : ''} · ${x.a.alumnos} alumnos</span></span>
      <span class="sis-cb-b sis-rank-b"><i style="width:${Math.round(x.val * 100 / max)}%;background:${color(x)}"></i></span>
      <b class="sis-rank-v">${pct ? sisFmt(x.val) : x.val}</b></div>`).join('')}</div>
    ${sin.length ? `<p class="peq mudo" style="margin:8px 14px">Sin resultados en este momento: ${sin.map(x => esc(x.e.escuela)).join(', ')}.</p>` : ''}
    <p class="peq mudo" style="margin:8px 14px">${crit[0] === 'ind' ? 'Índice: cada alumno en nivel esperado vale 100, en desarrollo 50 y que requiere apoyo 0 (promedio de las tres habilidades).' : 'Porcentaje de alumnos de la escuela en ese nivel.'}</p></div>`;
}

// Comparativo para imprimir o descargar
async function sisInformeComparativo(v) {
  const c = sisCmpV(v), m = v.m, sin1 = +m === 1 && !v.con1, B = [];
  let filas = sisFilas(m).filter(r => filtroEscuelas().some(e => e.cct === r.cct));
  if (c.grado) filas = filas.filter(r => r.grado === c.grado);
  if (!filas.length) throw new Error('No hay resultados para comparar en este momento.');
  const nombres = { multi: 'Multigrado y organización completa', turno: 'Turno matutino y vespertino', mun: 'San Quintín y Ensenada', elegir: 'Escuelas elegidas', rank: 'Jerarquía de las escuelas' };
  if (c.tipo === 'rank') {
    const crit = SIS_CRITERIOS.find(x => x[0] === c.crit) || SIS_CRITERIOS[0];
    const l = filtroEscuelas().map(e => { const rs = filas.filter(r => r.cct === e.cct); const a = rs.length ? sisSuma(rs, sin1) : null; return { e, a, val: sisValor(a, crit[0]) }; }).filter(x => x.val != null)
      .sort((x, y) => c.orden === 'asc' ? x.val - y.val : y.val - x.val);
    B.push({ t: 'h', x: 'Escuelas por ' + crit[1].toLowerCase() + (c.orden === 'asc' ? ' (de menor a mayor)' : ' (de mayor a menor)') });
    B.push({ t: 'tabla', cab: ['Lugar', 'Escuela', 'Tipo', crit[1], 'Índice'], anchos: [9, 38, 21, 18, 14], filas: l.map((x, i) => [String(i + 1), x.e.escuela, (x.e.multigrado ? 'Multigrado' : 'Org. completa') + ' · ' + x.e.municipio, crit[0] === 'ind' ? String(x.val) : sisFmt(x.val), x.a.ind == null ? '—' : String(x.a.ind)]) });
    B.push({ t: 'img', g: sisGrafNiveles(l.map(x => Object.assign({ etq: x.e.escuela }, x.a[(crit[0].split('.')[0] === 'ind' ? 'lec' : crit[0].split('.')[0])])), 'Distribución por nivel · ' + (crit[0] === 'ind' ? 'lectura' : SIS_H.find(h => h[0] === crit[0].split('.')[0])[1].toLowerCase())) });
  } else {
    const G = sisCmpGrupos(v, filas).map(g => Object.assign(g, { a: g.filas.length ? sisSuma(g.filas, sin1) : null, comp: sisCompSuma(g.filas, sin1) })).filter(g => g.a);
    if (G.length < 2) throw new Error('Se necesitan al menos dos grupos de escuelas con resultados.');
    B.push({ t: 'h', x: 'Lo que muestra el comparativo' });
    B.push({ t: 'lista', l: sisCmpConclusiones(G) });
    B.push({ t: 'h', x: 'Comparativo por nivel de logro' });
    B.push({ t: 'tabla', cab: ['', 'Lectura (esp. / apoyo)', 'Textos (esp. / apoyo)', 'Cálculo (esp. / apoyo)', 'Índice'], anchos: [28, 19, 19, 19, 15], filas: G.map(g => [g.etq + ' (' + g.escs.length + ' esc., ' + g.a.alumnos + ' al.)', ...SIS_H.map(([h]) => g.a[h].n ? sisFmt(g.a[h].pne) + ' / ' + sisFmt(g.a[h].pra) : '—'), g.a.ind == null ? '—' : String(g.a.ind)]) });
    SIS_H.forEach(([h, nom]) => B.push({ t: 'img', g: sisGrafNiveles(G.map(g => Object.assign({ etq: g.etq }, g.a[h])), nom) }));
    if (c.tipo !== 'elegir') { B.push({ t: 'h', x: 'Escuelas de cada bloque' }); B.push({ t: 'lista', l: G.map(g => `<b>${esc(g.etq)}:</b> ${esc(g.escs.map(e => e.escuela).join(', '))}`) }); }
  }
  if (sin1) B.push({ t: 'nota', x: 'Momento 1: a 1.° grado solo se le cuenta cálculo (aún no leen ni escriben de forma convencional).' });
  return { titulo: 'Comparativo del SisAT', nivel: nombres[c.tipo] + (c.grado ? ' · ' + c.grado + '.° grado' : ''), sub: 'Ciclo escolar ' + v.ciclo + ' · Momento ' + m, fecha: fechaOficio(hoy()), B };
}

/* ---- Descarga del análisis (PDF o Word) con gráficas ---- */
const SIS_FUENTE = "\"MontserratOfi\", Arial, Helvetica, sans-serif";
const SIS_COL = { ne: '#2E7D4F', ed: '#E8A33D', ra: '#B3261E', az: '#1F3A6B', gris: '#555555', linea: '#D9D2C3' };
function sisLienzo(w, h) {
  const c = document.createElement('canvas'), k = 2.5; c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d'); x.scale(k, k); x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.textBaseline = 'middle';
  return { c, x, w, h };
}
const sisPng = L => { const url = L.c.toDataURL('image/png'); return { url, bytes: b64aBytes(url.split(',')[1]), w: L.w, h: L.h }; };
function sisTexto(x, t, px, py, o = {}) { x.font = `${o.bold ? '700 ' : ''}${o.size || 11}px ${SIS_FUENTE}`; x.fillStyle = o.color || '#1E2A40'; x.textAlign = o.align || 'left'; x.fillText(t, px, py); }
function sisRecorta(x, t, max, size) { x.font = `${size || 11}px ${SIS_FUENTE}`; if (x.measureText(t).width <= max) return t; while (t.length > 3 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }

// Barras 100 % apiladas: esperado, en desarrollo, requiere apoyo
function sisGrafNiveles(filas, titulo) {
  const W = 640, izq = 170, der = 20, alto = 30, top = titulo ? 34 : 10, H = top + filas.length * alto + 44;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;
  if (titulo) sisTexto(x, titulo, 0, 14, { bold: true, size: 13, color: SIS_COL.az });
  filas.forEach((f, i) => {
    const y = top + i * alto;
    sisTexto(x, sisRecorta(x, f.etq, izq - 12, 11), 0, y + 11, { size: 11 });
    if (!f.n) { sisTexto(x, 'Sin datos', izq, y + 11, { size: 10, color: SIS_COL.gris }); return; }
    let px = izq;
    [['ne', f.pne], ['ed', f.ped], ['ra', f.pra]].forEach(([k, p]) => {
      const w = ancho * (p || 0) / 100; x.fillStyle = SIS_COL[k]; x.fillRect(px, y + 2, w, 18);
      if (p >= 7) sisTexto(x, Math.round(p) + '%', px + w / 2, y + 11, { size: 10, bold: true, align: 'center', color: k === 'ed' ? '#3B2A0A' : '#fff' });
      px += w;
    });
  });
  const ly = top + filas.length * alto + 18;
  [['ne', 'Nivel esperado'], ['ed', 'En desarrollo'], ['ra', 'Requiere apoyo']].forEach(([k, t], i) => { const lx = izq + i * 150; x.fillStyle = SIS_COL[k]; x.fillRect(lx, ly - 5, 11, 11); sisTexto(x, t, lx + 16, ly, { size: 10.5 }); });
  return sisPng(L);
}
// Componentes de lectura o textos (porcentaje del puntaje posible)
function sisGrafComp(comp, h) {
  const W = 640, izq = 230, der = 50, alto = 26, top = 34, H = top + 6 * alto + 40;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;
  sisTexto(x, SIS_H.find(q => q[0] === h)[1] + ' · componentes (' + comp[h].n + ' alumnos)', 0, 14, { bold: true, size: 13, color: SIS_COL.az });
  [55, 80].forEach(p => { const gx = izq + ancho * p / 100; x.strokeStyle = SIS_COL.linea; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(gx, top - 4); x.lineTo(gx, top + 6 * alto); x.stroke(); x.setLineDash([]); sisTexto(x, p + '%', gx, top + 6 * alto + 9, { size: 9, align: 'center', color: SIS_COL.gris }); });
  SIS_COMP[h].forEach((nom, i) => {
    const y = top + i * alto, p = sisCompPc(comp, h, i) || 0, col = p >= 81 ? SIS_COL.ne : p >= 56 ? SIS_COL.ed : SIS_COL.ra;
    sisTexto(x, sisRecorta(x, SIS_ROM[i] + '. ' + nom, izq - 10, 11), 0, y + 9, { size: 11 });
    x.fillStyle = '#F1E4CC'; x.fillRect(izq, y, ancho, 18); x.fillStyle = col; x.fillRect(izq, y, ancho * p / 100, 18);
    sisTexto(x, (Math.round(p * 10) / 10).toLocaleString('es-MX') + '%', W - 4, y + 9, { size: 11, bold: true, align: 'right', color: col });
  });
  const ly = top + 6 * alto + 26;
  [[SIS_COL.ne, '81-100%: manejo adecuado'], [SIS_COL.ed, '56-80%: avance significativo'], [SIS_COL.ra, '55% o menos: poco avance']].forEach(([c, t], i) => { const lx = i * 205; x.fillStyle = c; x.fillRect(lx, ly - 5, 11, 11); sisTexto(x, t, lx + 16, ly, { size: 10 }); });
  return sisPng(L);
}
// Cálculo mental: cada reactivo con aciertos sin apoyo, con apoyo e incorrectas
function sisGrafCalc(comp, etq) {
  const n = comp.cal.n, W = 640, izq = etq ? 250 : 90, der = 50, alto = 22, top = 34, H = top + 10 * alto + 34;
  const L = sisLienzo(W, H), x = L.x, ancho = W - izq - der;
  sisTexto(x, 'Cálculo mental · respuestas por reactivo (' + n + ' alumnos)', 0, 14, { bold: true, size: 13, color: SIS_COL.az });
  comp.cal.s.forEach((s, i) => {
    const y = top + i * alto, sa = (s - comp.cal.v[i]) / n, ca = comp.cal.v[i] / n, inc = (n - s) / n;
    sisTexto(x, etq ? sisRecorta(x, etq(i), izq - 10, 10.5) : 'Reactivo ' + SIS_ROM[i], 0, y + 8, { size: etq ? 10.5 : 11 });
    let px = izq; [[SIS_COL.ne, sa], [SIS_COL.ed, ca], [SIS_COL.ra, inc]].forEach(([c, p]) => { x.fillStyle = c; x.fillRect(px, y, ancho * p, 16); px += ancho * p; });
    sisTexto(x, Math.round(s * 100 / n) + '%', W - 4, y + 8, { size: 11, bold: true, align: 'right' });
  });
  const ly = top + 10 * alto + 18;
  [[SIS_COL.ne, 'Acierto sin apoyo visual'], [SIS_COL.ed, 'Acierto con apoyo visual'], [SIS_COL.ra, 'Incorrecta']].forEach(([c, t], i) => { const lx = izq + i * 175; x.fillStyle = c; x.fillRect(lx, ly - 5, 11, 11); sisTexto(x, t, lx + 16, ly, { size: 10 }); });
  return sisPng(L);
}
// Tendencia: nivel esperado y requiere apoyo en los tres momentos, una gráfica por habilidad
function sisGrafTend(ms) {
  const W = 640, H = 230, pw = 196, gap = 26;
  const L = sisLienzo(W, H), x = L.x;
  SIS_H.forEach(([h, nom], k) => {
    const ox = k * (pw + gap), top = 30, alto = 140, X = i => ox + 30 + i * ((pw - 44) / 2), Y = p => top + alto - alto * p / 100;
    sisTexto(x, nom, ox + pw / 2, 12, { bold: true, size: 12, align: 'center', color: SIS_COL.az });
    [0, 50, 100].forEach(p => { x.strokeStyle = SIS_COL.linea; x.beginPath(); x.moveTo(ox + 26, Y(p)); x.lineTo(ox + pw - 8, Y(p)); x.stroke(); sisTexto(x, String(p), ox + 22, Y(p), { size: 9, align: 'right', color: SIS_COL.gris }); });
    [1, 2, 3].forEach((m, i) => sisTexto(x, 'M' + m, X(i), top + alto + 14, { size: 10, align: 'center', color: SIS_COL.gris }));
    [['pne', SIS_COL.ne], ['pra', SIS_COL.ra]].forEach(([q, col]) => {
      const pts = ms.map((o, i) => o.a && o.a[h].n ? [X(i), Y(o.a[h][q])] : null).filter(Boolean);
      x.strokeStyle = col; x.lineWidth = 2.5; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); x.lineWidth = 1;
      pts.forEach(p => { x.fillStyle = col; x.beginPath(); x.arc(p[0], p[1], 4, 0, 7); x.fill(); });
    });
  });
  [[SIS_COL.ne, 'Nivel esperado'], [SIS_COL.ra, 'Requiere apoyo']].forEach(([c, t], i) => { const lx = 200 + i * 140; x.fillStyle = c; x.fillRect(lx, 214, 11, 11); sisTexto(x, t, lx + 16, 219, { size: 10.5 }); });
  return sisPng(L);
}

}

// Texto con <b> → tramos para Word
function sisTramos(html) {
  const dec = t => { const d = document.createElement('textarea'); d.innerHTML = t; return d.value; };
  return String(html).split(/(<b>[\s\S]*?<\/b>)/).filter(Boolean).map(t => /^<b>/.test(t) ? { t: dec(t.replace(/<\/?[^>]+>/g, '')), b: true } : { t: dec(t.replace(/<[^>]+>/g, '')) });
}

  I.B.forEach(b => {

      : b.t === 'lista' ? `<ul>${b.l.map(x => `<li>${x}</li>`).join('')}</ul>` : b.t === 'tabla' ? tabla(b) : b.t === 'img' ? `<div class="ig"><img src="${b.g.url}" style="width:${Math.min(624, b.g.w)}px"></div>` : '';

// El PDF se arma por partes: una sola imagen muy larga queda en blanco en el navegador
async function sisPdfInforme(I) {
  await cargarScript('lib/html2pdf.bundle.min.js');
  try { await fuentesOficio(); } catch (e) {}
  const estilo = document.createElement('style'); estilo.textContent = SIS_INF_CSS; document.head.appendChild(estilo);
  const caja = document.createElement('div');
  caja.style.cssText = 'position:fixed;left:-10000px;top:0;width:816px;background:#fff';
  document.body.appendChild(caja);
  try {
    const trozos = [];
    for (const html of sisHtmlInforme(I)) {
      const d = document.createElement('div'); d.className = 'sis-inf'; d.innerHTML = html; caja.appendChild(d);
      await Promise.all($$('img', d).map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
      // si la parte es muy larga, se reparte en trozos de unas 8 hojas
      let actual = document.createElement('div'); actual.className = 'sis-inf'; let alto = 0;
      Array.from(d.children).forEach(el => {
        const h = el.offsetHeight + 16;
        if (alto && alto + h > 8000) { trozos.push(actual); actual = document.createElement('div'); actual.className = 'sis-inf'; alto = 0; }
        actual.appendChild(el.cloneNode(true)); alto += h;
      });
      trozos.push(actual); d.remove();
    }
    trozos.forEach(t => caja.appendChild(t));
    const opt = { margin: [0.35, 0, 0.45, 0], image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'li', '.ig', 'h2', 'h3'] } };
    let w = window.html2pdf().set(opt).from(trozos[0]).toPdf();
    for (const t of trozos.slice(1)) w = w.get('pdf').then(pdf => { pdf.addPage(); }).from(t).toContainer().toCanvas().toPdf();
    return await w.outputPdf('blob');
  } finally { caja.remove(); estilo.remove(); }
}

// Las partes de un documento con varios niveles: la escuela (o el grado) y después cada grado y cada grupo
function sisSubniveles(v, modo) {
  const m = v.m === 't' ? null : v.m;
  const filas = (m ? sisFilas(m) : [1, 2, 3].flatMap(x => sisFilas(x))).filter(sisPred(v));
  const grupos = []; const vistos = {};
  filas.slice().sort((x, y) => x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo)).forEach(r => { const k = r.grado + '|' + r.grupo; if (!vistos[k]) { vistos[k] = 1; grupos.push(r); } });
  const L = [];
  if (v.nivel === 'escuela') {
    const grados = Array.from(new Set(grupos.map(r => r.grado)));
    grados.forEach(g => {
      const gs = grupos.filter(r => r.grado === g);
      if (modo !== 'grupos' && gs.length > 1) L.push(Object.assign({}, v, { nivel: 'grado', grado: g }));
      if (modo !== 'grados') gs.forEach(r => L.push(Object.assign({}, v, { nivel: 'grupo', grado: r.grado, grupo: r.grupo })));
      else if (gs.length === 1) L.push(Object.assign({}, v, { nivel: 'grupo', grado: gs[0].grado, grupo: gs[0].grupo }));
    });
  } else if (v.nivel === 'grado') grupos.forEach(r => L.push(Object.assign({}, v, { nivel: 'grupo', grado: r.grado, grupo: r.grupo })));
  return L;
}
async function sisInformeVarios(v, modo) {
  if (v.nivel === 'zona' && v.vista === 'comp' && !esDirector()) return sisInformeComparativo(v);
  const I = await sisInforme(v);
  if (modo === 'solo') return I;
  for (const sv of sisSubniveles(v, modo)) {
    let J; try { J = await sisInforme(sv); } catch (e) { continue; }
    I.B.push({ t: 'salto' }, { t: 'titulo', x: sisTitulo(sv) });
    J.B.forEach(b => I.B.push(b));
  }
  return I;
}
function sisDescargar(v) {
  const enEscuela = ['escuela', 'grado', 'grupo'].includes(v.nivel) && v.cct;
  // Grados y grupos de la escuela con resultados en este momento (o en cualquiera, si es la tendencia)
  const filas = enEscuela ? (v.m === 't' ? [1, 2, 3].flatMap(x => sisFilas(x)) : sisFilas(v.m)).filter(r => r.cct === v.cct) : [];
  const grupos = []; const vistos = {};
  filas.slice().sort((x, y) => x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo)).forEach(r => { const k = r.grado + '|' + r.grupo; if (!vistos[k]) { vistos[k] = 1; grupos.push(r); } });
  const grados = Array.from(new Set(grupos.map(r => r.grado)));
  const op = (val, txt, extra) => `<label class="sis-dop"><input type="radio" name="d-que" value="${val}" ${(v.nivel === 'escuela' && val === 'escuela') || v.nivel === val ? 'checked' : ''}> <span>${txt}</span>${extra || ''}</label>`;
  const cuerpo = enEscuela ? `<p style="margin-top:0"><b>${esc(nombreEscuela(v.cct))}</b> · ${v.m === 't' ? 'tendencia de los tres momentos' : 'Momento ' + v.m} · ciclo ${esc(v.ciclo)}</p>
    <div><div style="font-weight:700;margin-bottom:4px">¿Qué quiere imprimir?</div>
      ${op('escuela', 'Toda la escuela', `<label class="peq sis-dsub"><input type="checkbox" id="d-esc-todo"> con cada grado y cada grupo en hojas aparte</label>`)}
      ${op('grado', 'Un grado', ` <select id="d-grado" aria-label="Grado">${grados.map(g => `<option value="${g}" ${g === v.grado ? 'selected' : ''}>${g}.° grado</option>`).join('')}</select>
        <label class="peq sis-dsub"><input type="checkbox" id="d-gr-todo"> con cada uno de sus grupos en hojas aparte</label>`)}
      ${op('grupo', 'Un grupo', ` <select id="d-grupo" aria-label="Grupo">${grupos.map(r => `<option value="${r.grado}|${esc(r.grupo)}" ${r.grado === v.grado && r.grupo === v.grupo ? 'selected' : ''}>${sisNomGrupo(r)}</option>`).join('')}</select>`)}
    </div>
    <p class="ayuda">Lleva las gráficas, el diagnóstico, dónde enfocarse, los alumnos en rezago con sus nombres y las observaciones. Compártalo solo con quien corresponda.</p>`
    : v.nivel === 'zona' && v.vista === 'comp' && !esDirector() ? `<p style="margin-top:0">Se imprime el <b>comparativo</b> que tiene en pantalla, con su tabla, gráficas y conclusiones.</p>`
    : `<p style="margin-top:0">Análisis de <b>${esc(sisTitulo(v))}</b> (${v.m === 't' ? 'tendencia' : 'Momento ' + v.m}, ciclo ${esc(v.ciclo)}) con sus gráficas, el diagnóstico, dónde enfocarse y las observaciones.${!esDirector() ? ' Para imprimir por escuela, grado o grupo, entre primero a la escuela.' : ''}</p>`;
  modal('Imprimir o descargar el análisis', cuerpo,
    '<button class="boton sec" id="d-no">Cancelar</button><button class="boton sec" id="d-word">Word</button><button class="boton sec" id="d-pdf">PDF</button><button class="boton terra" id="d-imp">Imprimir</button>');
  $('#d-no').onclick = cerrarModal;
  // Al elegir el grado o el grupo en la lista, se marca esa opción
  if ($('#d-grado')) $('#d-grado').onchange = () => { $('[name="d-que"][value="grado"]').checked = true; };
  if ($('#d-grupo')) $('#d-grupo').onchange = () => { $('[name="d-que"][value="grupo"]').checked = true; };
  const destino = () => {
    if (!enEscuela) return { w: v, modo: 'solo' };
    const que = ($('[name="d-que"]:checked') || {}).value || 'escuela';
    if (que === 'grado') { const g = $('#d-grado').value; return { w: Object.assign({}, v, { nivel: 'grado', grado: g, grupo: '' }), modo: $('#d-gr-todo').checked ? 'grupos' : 'solo' }; }
    if (que === 'grupo') { const [g, gp] = $('#d-grupo').value.split('|'); return { w: Object.assign({}, v, { nivel: 'grupo', grado: g, grupo: gp }), modo: 'solo' }; }
    return { w: Object.assign({}, v, { nivel: 'escuela', grado: '', grupo: '' }), modo: $('#d-esc-todo').checked ? 'todo' : 'solo' };
  };
  const nombre = w => ('SisAT ' + w.ciclo + ' ' + (w.m === 't' ? 'Tendencia' : 'M' + w.m) + ' ' + sisTitulo(w)).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 110);
  const hacer = async tipo => {
    const { w, modo } = destino();
    // Para imprimir se abre la ventana en el momento del clic (si no, el navegador la bloquea) y luego se carga el PDF
    const ventana = tipo === 'imp' ? window.open('', '_blank') : null;
    if (ventana) ventana.document.write('<p style="font:16px system-ui;padding:24px">Preparando el análisis para imprimir…</p>');
    cerrarModal();
    const blob = await conCarga(async () => { const I = await sisInformeVarios(w, modo); return tipo === 'word' ? sisWordInforme(I) : sisPdfInforme(I); });
    if (!blob) { if (ventana) ventana.close(); return; }
    if (tipo === 'imp') {
      const url = URL.createObjectURL(blob);
      if (ventana) { ventana.location.href = url; aviso('Se abrió el análisis en otra pestaña: imprímalo con Ctrl + P o el botón de imprimir.', 'ok', 8000); }
      else { descargarBlob(blob, nombre(w) + '.pdf'); aviso('El navegador bloqueó la pestaña nueva: se descargó el PDF para imprimirlo.', 'ok', 8000); }
      return;
    }
    descargarBlob(blob, nombre(w) + (tipo === 'pdf' ? '.pdf' : '.docx')); aviso('Análisis descargado.', 'ok');
  };
  $('#d-imp').onclick = () => hacer('imp');
  $('#d-pdf').onclick = () => hacer('pdf');
  $('#d-word').onclick = () => hacer('word');
}

/* ---- Lectura de los Excel del formato oficial de captura ---- */
const EIA_HOJAS = { PRIMERO: '1', SEGUNDO: '2', TERCERO: '3', CUARTO: '4', QUINTO: '5', SEXTO: '6' };
async function eiaLibros(nombre, bytes, prof = 0) {
  await cargarScript('lib/xlsx.full.min.js');
  const X = window.XLSX;
  if (bytes[0] === 0x50 && bytes[1] === 0x4B) {   // zip: un .xlsx o un .zip con archivos dentro
    let z = null; try { z = X.CFB.read(bytes, { type: 'array' }); } catch (e) {}
    if (z && !z.FullPaths.some(p => /\[Content_Types\]\.xml$/i.test(p))) {
      if (prof > 1) return [];
      const out = [];
      for (let i = 0; i < z.FileIndex.length; i++) {
        const f = z.FileIndex[i], p = z.FullPaths[i];
        if (f.type !== 2 || !/\.(xlsx|xlsm|xls)$/i.test(p) || /(^|\/)(__MACOSX|~\$)/.test(p)) continue;
        const b = f.content instanceof Uint8Array ? f.content : new Uint8Array(f.content);
        (await eiaLibros(nombre + ' › ' + p.split('/').pop(), b, prof + 1)).forEach(x => out.push(x));
      }
      return out;
    }
  }
  try { return [{ nombre, wb: X.read(bytes, { type: 'array' }) }]; }
  catch (e) {
    if (!/password|protect|encrypt/i.test(e.message)) throw e;
    return [{ nombre, wb: X.read(await EIA_XLS.abrir(bytes, X), { type: 'array' }) }];
  }
}
// Una hoja de grado: encabezados, criterios y alumnos
function eiaLeerHoja(nomHoja, filas) {
  const T = x => String(x == null ? '' : x).replace(/\s+/g, ' ').trim();
  const hc = filas.findIndex(r => r.filter(c => /CONSIGNA/i.test(T(c))).length >= 3);
  if (hc < 0) return null;
  const cols = [], keys = [];
  filas[hc].forEach((c, i) => { const m = T(c).toUpperCase().match(/CONSIGNA\W*(\d+)\W*INCISO\W*([A-Z])\s*(\d)/); if (m) { cols.push(i); keys.push(m[1] + m[2] + m[3]); } });
  let hn = -1;
  for (let j = hc; j >= Math.max(0, hc - 6); j--) if (filas[j].some(c => /NOMBRE/i.test(T(c)))) { hn = j; break; }
  if (hn < 0) return null;
  const cab = filas[hn].map(c => T(c).toUpperCase());
  const iNom = cab.findIndex(c => /NOMBRE/.test(c)), iGrp = cab.findIndex(c => /^GRUPO/.test(c)), iSexo = cab.findIndex(c => /^SEXO/.test(c)), iNum = cab.findIndex(c => /LISTA/.test(c));
  // grado: por el nombre de la hoja o por la celda «GRADO»
  let grado = EIA_HOJAS[sisSinAc(nomHoja).toUpperCase().trim()] || '';
  if (!grado) for (const r of filas.slice(0, hn)) { const k = r.findIndex(c => /^GRADO$/i.test(T(c))); if (k >= 0) { const g = r.slice(k + 1).map(T).find(Boolean); if (/^[1-6]/.test(g || '')) { grado = g[0]; break; } } }
  if (!grado) { const m = sisSinAc(nomHoja).match(/([1-6])/); if (m) grado = m[1]; }
  let cct = '';
  for (const r of filas.slice(0, hn)) { const k = r.findIndex(c => /^C\.?C\.?T/i.test(T(c))); if (k >= 0) { cct = r.slice(k + 1).map(T).find(x => /^\d{2}[A-Z]{3}\d{4}[A-Z]$/i.test(x)) || ''; if (cct) break; } }
  return { grado, cct: cct.toUpperCase(), hc, cols, keys, iNom, iGrp, iSexo, iNum };
}
// Coloca cada columna del archivo en su criterio oficial (por orden; si el formato cambió, por consigna e inciso)
function eiaMapa(grado, keys) {
  const def = EIA_FASES[eiaFase(grado)].cr;
  if (keys.length === def.length && keys.every((k, i) => k === def[i][1])) return keys.map((k, i) => i);
  const vistos = {};
  return keys.map(k => { const n = vistos[k] = (vistos[k] || 0) + 1; let c = 0; return def.findIndex(d => d[1] === k && ++c === n); });
}
async function eiaLeerArchivo(a) {   // a: { nombre, bytes, fecha, id }
  const res = { nombre: a.nombre, fecha: a.fecha || '', id: a.id || '', grados: {}, cct: '', avisos: [] };
  let libros;
  try { libros = await eiaLibros(a.nombre, a.bytes); } catch (e) { return Object.assign(res, { error: 'No se pudo abrir: ' + e.message }); }
  if (!libros.length) return Object.assign(res, { error: 'No trae archivos de Excel.' });
  const X = window.XLSX;
  libros.forEach(({ nombre, wb }) => {
    wb.SheetNames.forEach(sn => {
      const filas = X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
      const h = eiaLeerHoja(sn, filas);
      if (!h) return;
      if (!h.grado) { res.avisos.push(`«${nombre}», hoja ${sn}: no se pudo saber el grado.`); return; }
      if (h.cct && !res.cct) res.cct = h.cct;
      const mapa = eiaMapa(h.grado, h.keys), largo = EIA_FASES[eiaFase(h.grado)].cr.length;
      if (mapa.some(i => i < 0)) res.avisos.push(`«${nombre}», ${h.grado}.° grado: hay columnas que no corresponden al formato oficial; se omitieron.`);
      filas.slice(h.hc + 1).forEach((r, j) => {
        const nombreA = String(r[h.iNom] || '').replace(/\s+/g, ' ').trim();
        if (!/[A-Za-zÑñÁÉÍÓÚáéíóú]{2}/.test(nombreA)) return;
        const v = Array(largo).fill(null);
        let hay = 0, malos = 0;
        h.cols.forEach((c, k) => {
          const i = mapa[k]; if (i < 0) return;
          const x = r[c]; if (x === '' || x == null) return;
          const n = Number(String(x).trim());
          if ([0, 1, 2, 3].includes(n)) { v[i] = n; hay++; } else malos++;
        });
        if (!hay) return;
        const grupo = String(h.iGrp >= 0 ? r[h.iGrp] : '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        const g = res.grados[h.grado] || (res.grados[h.grado] = {});
        const al = { num: +r[h.iNum] || (j + 1), alumno: nombreA, sexo: String(h.iSexo >= 0 ? r[h.iSexo] : '').toUpperCase().trim().slice(0, 1), v, grupo };
        (g[grupo] = g[grupo] || []).push(al);
        if (malos) res.avisos.push(`${nombreA} (${h.grado}.° ${grupo}): tiene valoraciones fuera de 0 a 3; se dejaron vacías.`);
      });
    });
  });
  if (!Object.keys(res.grados).length) return Object.assign(res, { error: 'No tiene el formato oficial de captura de los EIA o no trae alumnos.' });
  return res;
}
// Junta lo leído de varios archivos de una escuela; si un alumno aparece dos veces, se queda el archivo más reciente
function eiaJuntar(leidos, cct) {
  const grupos = {}, avisos = [], fuentes = [];
  leidos.filter(x => !x.error).sort((x, y) => String(x.fecha).localeCompare(String(y.fecha))).forEach(f => {
    fuentes.push(f.nombre);
    f.avisos.forEach(x => avisos.push(x));
    if (f.cct && cct && f.cct !== cct) avisos.unshift(`<b>«${esc(f.nombre)}» dice C.C.T. ${esc(f.cct)}</b> (${esc(nombreEscuela(f.cct))}), no ${esc(cct)}. Revise que sea el archivo de esta escuela.`);
    Object.entries(f.grados).forEach(([gr, gs]) => Object.entries(gs).forEach(([gp, als]) => {
      const k = gr + '|' + gp, G = grupos[k] || (grupos[k] = { grado: gr, grupo: gp, por: {} });
      als.forEach(a => { const c = sisClave(a.alumno); if (G.por[c]) avisos.push(`${a.alumno} (${gr}.° ${gp}) aparece en más de un archivo: se usa «${f.nombre}».`); G.por[c] = a; });
    }));
  });
  const l = Object.values(grupos).map(g => ({ grado: g.grado, grupo: g.grupo, alumnos: Object.values(g.por).sort((x, y) => (x.num - y.num) || x.alumno.localeCompare(y.alumno, 'es')) }))
    .sort((x, y) => x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo));
  // si un grado trae alumnos con grupo y sin grupo, los sin grupo se marcan
  const sinGrupo = l.filter(g => !g.grupo && l.some(o => o.grado === g.grado && o.grupo));
  if (sinGrupo.length) avisos.push('Hay alumnos sin grupo en ' + sinGrupo.map(g => g.grado + '.°').join(', ') + ' grado; se guardan aparte como «sin grupo».');
  return { grupos: l, avisos, fuentes, malos: leidos.filter(x => x.error) };
}

    <div class="tarjeta pad sis-kpi"><div class="sis-kpi-t">Alumnos evaluados</div><div class="eia-num">${a.n}</div><div class="peq mudo">${a.grupos} grupo${a.grupos === 1 ? '' : 's'} · contestaron los dos EIA</div></div>
    <div class="tarjeta pad sis-kpi"><div class="sis-kpi-t">Índice general</div><div class="eia-num" style="color:${eiaColorInd(a.ind)}">${a.ind == null ? '—' : a.ind}</div>${eiaBarra(a.dist, 14)}</div>
    <div class="tarjeta pad sis-kpi"><div class="sis-kpi-t">Alumnos en rezago</div><div class="eia-num" style="color:var(--alerta)">${a.rz} <small>${sisFmt(a.prz)}</small></div><div class="peq mudo">${a.rza} con rezago alto (¾ o más de los criterios en 0 o 1)</div></div>
    <div class="tarjeta pad sis-kpi"><div class="sis-kpi-t">Aprendizaje desarrollado</div><div class="eia-num" style="color:var(--ok)">${sisFmt(a.plog)}</div><div class="peq mudo">de las valoraciones en 3 · ${sisFmt(a.pdif)} en 0 o 1</div></div>
  </div>`;
}
function eiaCampos(a, titulo) {
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">${titulo || 'Por campo formativo'}</div><div class="eia-campos">${EIA_CAMPOS.map(([k, nom]) => { const d = a.campo[k], t = d[0] + d[1] + d[2] + d[3];
    return `<div class="eia-campo"><div class="eia-campo-t"><b>${nom}</b><span class="sis-ind" style="background:${eiaColorInd(a.cind[k])}">${a.cind[k] == null ? '—' : a.cind[k]}</span></div>${eiaBarra(d, 12)}
      <div class="peq mudo">${t ? `${sisFmt(sisPc(d[0] + d[1], t))} en 0 o 1 · ${sisFmt(sisPc(d[3], t))} desarrollado` : 'Sin datos'}</div></div>`; }).join('')}</div>${eiaLeyenda()}</div>`;
}
function eiaTabla(items, titulo, primera) {
  if (!items.length) return '';
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">${titulo}</div><div class="matriz-caja"><table class="matriz sis-tab">
    <thead><tr><th class="esc-col">${primera}</th><th>Alumnos</th><th>Distribución</th>${EIA_CAMPOS.map(c => `<th>${c[2]}</th>`).join('')}<th>Rezago</th><th>Índice</th></tr></thead>
    <tbody>${items.map(it => { const a = it.a; return `<tr>
      <td class="esc-col">${it.ir ? `<button class="sis-ir" ${it.ir}>${esc(it.etq)}</button>` : `<b>${esc(it.etq)}</b>`}${it.sub ? `<div class="peq mudo">${it.sub}</div>` : ''}</td>
      <td>${a ? a.n : '—'}</td><td class="sis-celda">${a ? eiaBarra(a.dist, 9) : '<span class="sis-sin">—</span>'}</td>
      ${EIA_CAMPOS.map(([k]) => `<td><b style="color:${eiaColorInd(a && a.cind[k])}">${a && a.cind[k] != null ? a.cind[k] : '—'}</b></td>`).join('')}
      <td><span class="sis-ra" style="color:${a && a.prz >= 30 ? 'var(--alerta)' : 'var(--tinta)'}">${a ? sisFmt(a.prz) : '—'}</span></td>
      <td><span class="sis-ind" style="background:${eiaColorInd(a && a.ind)}">${a && a.ind != null ? a.ind : '—'}</span></td></tr>`; }).join('')}</tbody></table></div></div>`;
}
// Diagnóstico automático
function eiaDiagListas(a, hijos, ctx) {
  const F = [], A = [], G = [];
  if (!a || !a.n) return null;
  const camps = EIA_CAMPOS.map(([k, nom]) => ({ k, nom, ind: a.cind[k] })).filter(x => x.ind != null).sort((x, y) => y.ind - x.ind);
  if (camps.length >= 2) {
    F.push(`El campo con mejor resultado es <b>${camps[0].nom}</b> (índice ${camps[0].ind}).`);
    A.push(`El campo que más apoyo necesita es <b>${camps[camps.length - 1].nom}</b> (índice ${camps[camps.length - 1].ind}).`);
  }
  if (a.prz >= 30) A.push(`<b>${a.rz} de ${a.n} alumnos (${sisFmt(a.prz)})</b> están en rezago: la mitad o más de sus criterios en 0 o 1.${a.rza ? ` De ellos, ${a.rza} con rezago alto.` : ''}`);
  else if (a.n) F.push(`Solo ${sisFmt(a.prz)} del alumnado está en rezago (${a.rz} de ${a.n}).`);
  if (a.dist[0] && sisPc(a.dist[0], a.dist.reduce((s, x) => s + x, 0)) >= 15) A.push(`${sisFmt(sisPc(a.dist[0], a.dist.reduce((s, x) => s + x, 0)))} de las respuestas no tuvo evidencias (0): revisar si los alumnos no entendieron la consigna o no alcanzaron a responder.`);
  Object.keys(a.F).sort().forEach(f => {
    const c = eiaCriterios(a, f); if (!c.length) return;
    const gr = Array.from(a.F[f].grados).sort().map(g => g + '.°').join(' y ');
    const peores = c.filter(x => x.pdif >= 40).slice(0, 3), mejores = c.slice().sort((x, y) => y.plog - x.plog).filter(x => x.plog >= 40).slice(0, 2);
    if (peores.length) A.push(`<b>${gr} (${f.replace('F', 'fase ')}):</b> donde más fallaron fue ${peores.map(x => `«${esc(x.nom.toLowerCase())}» (${sisFmt(x.pdif)} en 0 o 1)`).join(', ')}.`);
    if (mejores.length) F.push(`<b>${gr}:</b> ${mejores.map(x => `«${esc(x.nom.toLowerCase())}» (${sisFmt(x.plog)} desarrollado)`).join(' y ')}.`);
    const cont = eiaContenidos(a, f).filter(o => o.pdif >= 35).slice(0, 2);
    cont.forEach(o => G.push(`<b>${gr} · ${eiaCampoCorto(o.campo)}:</b> retomar ${Array.from(new Set(Array.from(a.F[f].grados).sort().map(g => '«' + esc(EIA_BLOQ[o.b].g[g][0].replace(/\.$/, '')) + '»'))).join(' y ')}. ${esc(EIA_BLOQ[o.b].sug[0])}`));
  });
  const conDatos = (hijos || []).filter(x => x.a && x.a.ind != null);
  if (conDatos.length >= 2) {
    const ord = conDatos.slice().sort((x, y) => y.a.ind - x.a.ind);
    F.push(`Mejor resultado: <b>${esc(ord[0].etq)}</b> (índice ${ord[0].a.ind}).`);
    A.push(`Mayor necesidad: <b>${esc(ord[ord.length - 1].etq)}</b> (índice ${ord[ord.length - 1].a.ind}, ${sisFmt(ord[ord.length - 1].a.prz)} en rezago).`);
  }
  if (a.rz) G.push('Registrar en el CTE las acciones para cada alumno en rezago y revisarlas con la evaluación formativa del grupo.');
  if (ctx.nivel === 'zona' && conDatos.length && !esDirector()) {
    const vis = conDatos.filter(x => x.a.prz >= 35).sort((x, y) => y.a.prz - x.a.prz).slice(0, 5);
    if (vis.length) G.push(`Priorizar el acompañamiento de la Mesa Técnica en: ${vis.map(x => '<b>' + esc(x.etq) + '</b>').join(', ')}.`);
  }
  return { F, A, G };
}
function eiaDiagnostico(a, hijos, ctx) {
  const d = eiaDiagListas(a, hijos, ctx); if (!d) return '';
  const li = l => l.length ? `<ul>${l.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="mudo peq">Nada que destacar.</p>';
  return `<div class="tarjeta pad sis-diag"><div class="seccion-t" style="padding:0 0 6px">Diagnóstico</div><div class="sis-diag-g">
    <div><h3 class="bien">Fortalezas</h3>${li(d.F)}</div><div><h3 class="mal">Focos de atención</h3>${li(d.A)}</div><div><h3>Sugerencias para la asesoría</h3>${li(d.G)}</div></div></div>`;
}
// Consignas donde más fallaron (una tabla por fase)
function eiaSeccionConsignas(a) {
  const fases = Object.keys(a.F).sort();
  return fases.map(f => {
    const c = eiaCriterios(a, f); if (!c.length) return '';
    const gr = Array.from(a.F[f].grados).sort().map(g => g + '.°').join(' y ');
    const fila = x => `<tr><td class="esc-col"><b>${esc(x.nom)}</b><div class="peq mudo">${eiaEtq(x)} · ${esc(EIA_FASES[f].eias[x.e - 1])} · ${eiaCampoCorto(x.campo)}</div></td>
      <td class="sis-celda">${eiaBarra(x.d, 10)}<span class="peq">${x.d.join(' · ')}</span></td>
      <td><b style="color:${eiaColorDif(x.pdif)}">${sisFmt(x.pdif)}</b></td><td>${sisFmt(x.p0)}</td><td><span class="sis-ind" style="background:${eiaColorInd(x.ind)}">${x.ind}</span></td></tr>`;
    const tabla = l => `<div class="matriz-caja"><table class="matriz sis-tab"><thead><tr><th class="esc-col">Criterio (consigna)</th><th>Alumnos en 0 · 1 · 2 · 3</th><th>En 0 o 1</th><th>Sin evid.</th><th>Índice</th></tr></thead><tbody>${l.map(fila).join('')}</tbody></table></div>`;
    return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Consignas donde más fallaron · ${gr} grado (${f.replace('F', 'fase ')}, ${a.F[f].n} alumnos)</div>
      ${tabla(c.slice(0, 8))}${c.length > 8 ? `<details class="sis-mas"><summary>Ver los otros ${c.length - 8} criterios</summary>${tabla(c.slice(8))}</details>` : ''}</div>`;
  }).join('');
}
// Ruta de trabajo para el docente: contenidos a retomar, con su PDA del grado, sugerencias y libros
function eiaRuta(a, grado, alumnos, max = 4) {
  const f = eiaFase(grado);
  let l = eiaContenidos(a, f).filter(o => o.pdif >= 30);
  if (!l.length) l = eiaContenidos(a, f).filter(o => o.pdif >= 15).slice(0, 2);
  return l.slice(0, max).map(o => {
    const B = EIA_BLOQ[o.b], g = B.g[grado] || B.g[EIA_FASES[f].grados[0]];
    const quien = (alumnos || []).filter(al => al.grado === grado && o.cr.some(x => al.v[x.i] != null && al.v[x.i] <= 1)).map(al => al.alumno);
    return { b: o.b, campo: o.campo, pdif: o.pdif, cr: o.cr, contenido: g[0], pda: g[1], que: B.que, sug: B.sug, lib: (B.lib || {})[grado] || '', quien };
  });
}
function eiaRutaHtml(r, grado, titulo) {
  if (!r.length) return '';
  return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 8px">${titulo || `Ruta de trabajo para el docente · ${grado}.° grado`}</div>
    <p class="peq mudo" style="margin:0 0 10px">Contenidos del programa sintético que conviene retomar, del más urgente al menos, según los criterios donde más alumnos quedaron en 0 o 1.</p>
    ${r.map((x, k) => `<div class="sis-ruta"><h3>${k + 1}. ${esc(x.contenido.replace(/\.$/, ''))} <span class="peq" style="font-weight:400;color:var(--tinta)">· ${eiaCampoNom(x.campo)} · <b style="color:${eiaColorDif(x.pdif)}">${sisFmt(x.pdif)} en 0 o 1</b></span></h3>
      <p class="peq" style="margin:2px 0 6px"><b>PDA de ${grado}.°:</b> ${esc(x.pda)}</p>
      <p class="peq" style="margin:0 0 6px"><b>Lo que se observó:</b> ${x.cr.map(c => `${esc(c.nom.toLowerCase())} (${sisFmt(c.pdif)})`).join(' · ')}. ${esc(x.que)}</p>
      <div class="peq"><b>Qué trabajar:</b><ul style="margin:4px 0 6px">${x.sug.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
      ${x.lib ? `<p class="peq" style="margin:0 0 6px"><b>Libros de texto (${grado}.°):</b> ${esc(x.lib)}</p>` : ''}
      ${x.quien.length ? `<details class="peq"><summary style="cursor:pointer;color:var(--indigo)">${x.quien.length} alumno${x.quien.length === 1 ? '' : 's'} con 0 o 1 en este contenido</summary><div style="columns:2;column-gap:20px;margin-top:4px">${x.quien.map(esc).join('<br>')}</div></details>` : ''}
    </div>`).join('')}</div>`;
}
// En la zona o la escuela: los contenidos más urgentes de cada grado
function eiaRutasPorGrado(filas, alumnos, titulo) {
  const grados = Array.from(new Set(filas.map(r => r.grado))).sort();
  const filasR = grados.map(g => { const a = eiaSuma(filas.filter(r => r.grado === g)); const r = eiaRuta(a, g, alumnos, 3); return { g, a, r }; }).filter(x => x.r.length);
  if (!filasR.length) return '';
  return `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">${titulo || 'Qué retomar en cada grado'}</div><div class="matriz-caja"><table class="matriz sis-tab">
    <thead><tr><th class="esc-col">Grado</th><th style="text-align:left">Contenidos a retomar (del más urgente al menos)</th></tr></thead>
    <tbody>${filasR.map(x => `<tr><td class="esc-col"><b>${x.g}.° grado</b><div class="peq mudo">${x.a.n} alumnos</div></td><td class="sis-deb" style="max-width:none">${x.r.map((y, k) => `<div style="margin-bottom:4px"><b>${k + 1}. ${esc(y.contenido.replace(/\.$/, ''))}</b> <span class="mudo">(${eiaCampoCorto(y.campo)}, <b style="color:${eiaColorDif(y.pdif)}">${sisFmt(y.pdif)}</b> en 0 o 1)</span><br><span class="peq">PDA: ${esc(y.pda)}</span></div>`).join('')}</td></tr>`).join('')}</tbody></table></div>
    <p class="peq mudo" style="margin:8px 14px">Para ver las sugerencias, los libros y los alumnos de cada contenido, entre al grado o al grupo.</p></div>`;
}
function eiaCuerpo(v, pred) {
  const filas = eiaFilas().filter(pred);
  if (!filas.length) return `<div class="tarjeta vacio">Todavía no hay resultados de los EIA del ciclo ${esc(v.ciclo)}${v.nivel === 'zona' ? '' : ' para este nivel'}. Use «${esDirector() ? 'Cargar resultados' : 'Leer los Excel de todas las escuelas'}»: Tequio lee el Excel del formato oficial de captura que cada escuela subió a su carpeta «09-Ejercicios Integradores del Aprendizaje».</div>`;
  const a = eiaSuma(filas);
  let hijos = [], tablas = '', cobertura = '', extra = '';
  if (v.nivel === 'zona') {
    if (!esDirector()) {
      const escs = filtroEscuelas(), conD = escs.filter(c => filas.some(r => r.cct === c.cct));
      cobertura = `<div class="peq mudo" style="margin:-6px 0 12px">${conD.length} de ${escs.length} escuelas con resultados · ${a.grupos} grupos · ${a.n} alumnos${conD.length < escs.length ? ' · Sin resultados: ' + escs.filter(c => !conD.includes(c)).map(c => esc(c.escuela)).join(', ') : ''}</div>`;
      hijos = escs.map(c => { const rs = filas.filter(r => r.cct === c.cct); return { etq: c.escuela, a: rs.length ? eiaSuma(rs) : null, ir: `data-eesc="${c.cct}"`, sub: (c.multigrado ? 'Multigrado · ' : '') + c.municipio + (atpDe(c.cct) ? ' · ' + esc(nombreCorto(atpDe(c.cct).nombre)) : '') }; });
      const ord = v.orden === 'nombre' ? hijos : hijos.slice().sort((x, y) => (x.a ? x.a.ind : 999) - (y.a ? y.a.ind : 999));
      tablas += eiaTabla(ord, `Por escuela <button class="boton sec chico" id="b-eia-orden" style="margin-left:8px;text-transform:none;letter-spacing:0">Ordenar por ${v.orden === 'nombre' ? 'necesidad' : 'nombre'}</button>`, 'Escuela');
    } else cobertura = '<div class="peq mudo" style="margin:-6px 0 12px">Promedio de las escuelas de la zona con resultados. Los datos de cada escuela solo los ve la Supervisión.</div>';
    const grados = ['1', '2', '3', '4', '5', '6'].map(g => { const rs = filas.filter(r => r.grado === g); return { etq: g + '.° grado', a: rs.length ? eiaSuma(rs) : null, ir: esDirector() ? '' : `data-ezg="${g}"`, sub: rs.length ? rs.length + ' grupo' + (rs.length === 1 ? '' : 's') : '' }; }).filter(x => x.a);
    tablas += eiaTabla(grados, 'Por grado en toda la zona', 'Grado');
    if (esDirector()) hijos = grados;
    extra = eiaRutasPorGrado(filas, null, 'Contenidos a reforzar en la zona, por grado');
  } else if (v.nivel === 'zgrado') {
    hijos = filas.slice().sort((x, y) => nombreEscuela(x.cct).localeCompare(nombreEscuela(y.cct), 'es') || x.grupo.localeCompare(y.grupo))
      .map(r => ({ etq: nombreEscuela(r.cct) + ' · ' + sisNomGrupo(r), a: eiaSuma([r]), ir: `data-egrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));
    tablas += eiaTabla(hijos, 'Grupos de ' + v.grado + '.° grado en la zona', 'Escuela y grupo');
    extra = eiaRutaHtml(eiaRuta(a, v.grado, null), v.grado, `Contenidos a reforzar en ${v.grado}.° grado en la zona`);
  } else if (v.nivel === 'escuela') {
    const grados = ['1', '2', '3', '4', '5', '6'].map(g => { const rs = filas.filter(r => r.grado === g); return { etq: g + '.° grado', a: rs.length ? eiaSuma(rs) : null, ir: `data-egr="${g}"`, sub: rs.map(sisNomGrupo).join(', ') }; }).filter(x => x.a);
    hijos = filas.slice().sort((x, y) => x.grado.localeCompare(y.grado) || x.grupo.localeCompare(y.grupo)).map(r => ({ etq: sisNomGrupo(r), a: eiaSuma([r]), ir: `data-egrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` }));
    cobertura = `<div class="peq mudo" style="margin:-6px 0 12px">${a.grupos} grupos · ${a.n} alumnos${filas[0] && filas[0].fuente ? ' · Fuente: ' + esc(filas[0].fuente) : ''}</div>`;
    tablas += eiaTabla(grados, 'Por grado', 'Grado') + eiaTabla(hijos, 'Por grupo', 'Grupo');
    const al = eiaAlumnosVista(v);
    extra = eiaRutasPorGrado(filas, al && al.todos);
  } else {
    if (v.nivel === 'grado') { hijos = filas.map(r => ({ etq: 'Grupo ' + sisNomGrupo(r), a: eiaSuma([r]), ir: `data-egrp="${r.cct}|${r.grado}|${esc(r.grupo)}"` })); if (hijos.length > 1) tablas += eiaTabla(hijos, 'Grupos de ' + v.grado + '.° grado', 'Grupo'); }
    const al = eiaAlumnosVista(v);
    extra = eiaRutaHtml(eiaRuta(a, v.grado, al && al.todos), v.grado);
  }
  return cobertura + eiaTarjetas(a) + eiaCampos(a) + eiaDiagnostico(a, v.nivel === 'grupo' ? [] : hijos, { nivel: v.nivel }) + extra + eiaSeccionConsignas(a) +
    eiaSeccionAlumnos(v) + eiaSeccionRezagoZona(v, filas) + tablas;
}

/* ---- Alumnos en rezago ---- */
const EIA_NIVELES_AL = [['alto', 'Rezago alto: ¾ o más de los criterios en 0 o 1', 'var(--alerta)'], ['rezago', 'En rezago: la mitad o más de los criterios en 0 o 1', '#B26B00'], ['riesgo', 'En riesgo: entre 30 y 49% de los criterios en 0 o 1', '#7A6400'], ['ok', 'Sin rezago', 'var(--ok)']];
function eiaTablaAlumnos(l, conGrupo, conEscuela) {
  return `<div class="matriz-caja"><table class="matriz sis-al"><thead><tr><th class="esc-col">Alumno</th>${conEscuela ? '<th>Escuela</th>' : ''}${conGrupo ? '<th>Grupo</th>' : ''}<th>Índice</th><th>En 0 o 1</th><th>Lo que más le cuesta</th></tr></thead>
    <tbody>${l.map(a => `<tr><td class="esc-col">${esc(a.alumno)}</td>${conEscuela ? `<td class="sis-deb">${esc(nombreEscuela(a.cct))}</td>` : ''}${conGrupo ? `<td>${a.grado}° ${esc(a.grupo)}</td>` : ''}
      <td><span class="sis-ind" style="background:${eiaColorInd(a.est.ind)}">${a.est.ind}</span></td><td>${a.est.bajos} de ${a.est.total}</td><td class="sis-deb">${eiaDebilidades(a).map(esc).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function eiaSeccionAlumnos(v) {
  const r = eiaAlumnosVista(v);
  if (!r) return '';

  const al = r.todos.filter(a => a.est);
  if (!al.length) { const x = EIAA[v.ciclo + '|' + v.cct] || {}; return `<div class="tarjeta pad" style="margin-bottom:16px"><div class="seccion-t" style="padding:0 0 6px">Alumnos en rezago</div><div class="aviso-caja" style="margin:0">${x.error ? 'No se pudieron traer los alumnos: ' + esc(x.error) : 'No hay alumnos guardados para este nivel.'}</div></div>`; }
  const conGrupo = v.nivel !== 'grupo';
  const por = {}; EIA_NIVELES_AL.forEach(([k]) => { por[k] = al.filter(a => a.est.nivel === k).sort((x, y) => x.est.ind - y.est.ind); });
  let html = `<div class="tarjeta" style="margin-bottom:16px"><div class="seccion-t">Alumnos en rezago</div>
    <div class="sis-cuenta">${EIA_NIVELES_AL.map(([k, t, c]) => `<div><b style="color:${c}">${por[k].length}</b><span>${t.split(':')[0].toLowerCase()}</span></div>`).join('')}</div>
    ${por.alto.length ? `<div class="sis-sub-t">${EIA_NIVELES_AL[0][1]} (${por.alto.length})</div>${eiaTablaAlumnos(por.alto, conGrupo)}` : '<p class="peq" style="margin:0 14px 10px;color:var(--ok)">Ningún alumno tiene rezago alto.</p>'}
    ${por.rezago.length ? `<details class="sis-mas" open><summary>${EIA_NIVELES_AL[1][1]} (${por.rezago.length})</summary>${eiaTablaAlumnos(por.rezago, conGrupo)}</details>` : ''}

// Cruce con el SisAT: alumnos en rezago en los EIA que también requieren apoyo en el SisAT
function eiaCruceSisat(v, al) {
  const sa = sisAlumnosDe(v.ciclo, v.cct);
  if (!sa) { if (S.sis) sisPedirAlumnos(v.ciclo, v.cct).then(() => { if ($('#eia-cruce-espera')) vEia(); }); return S.sis ? '<div class="peq mudo" id="eia-cruce-espera" style="padding:0 14px 10px">Buscando los resultados del SisAT para cruzarlos…</div>' : ''; }
  const ms = [3, 2, 1].find(m => sa.some(a => a.momento === m));
  if (!ms) return '';
  const de = {}; sa.filter(a => a.momento === ms).forEach(a => { de[eiaClaveCruce(a.alumno)] = a; });
  const rz = al.filter(a => a.est.nivel === 'alto' || a.est.nivel === 'rezago');
  const ambos = rz.map(a => ({ a, s: de[a.cruce] })).filter(o => o.s && sisNumRA(o.s) >= 2);
  const enc = al.filter(a => de[a.cruce]).length;
  if (!enc) return '';
  return `<div class="eia-cruce"><div class="sis-sub-t" style="padding-left:0">Cruce con el SisAT (Momento ${ms}): atención prioritaria</div>
    <p class="peq" style="margin:0 0 6px">${ambos.length ? `<b>${ambos.length}</b> alumno${ambos.length === 1 ? ' está' : 's están'} en rezago en los EIA <b>y</b> en «requiere apoyo» en dos o más habilidades del SisAT:` : `Ningún alumno en rezago de los EIA está también en «requiere apoyo» en dos o más habilidades del SisAT.`} <span class="mudo">(${enc} de ${al.length} alumnos coinciden por nombre en ambas evaluaciones.)</span></p>
    ${ambos.length ? `<div class="peq" style="columns:2;column-gap:20px">${ambos.map(o => `${esc(o.a.alumno)} <span class="mudo">${o.a.grado}° ${esc(o.a.grupo)} · EIA ${o.a.est.ind} · SisAT: ${['lec', 'tex', 'cal'].filter(h => o.s[h] && o.s[h].n === 'RA').map(h => SIS_H.find(x => x[0] === h)[2].toLowerCase()).join(', ')}</span>`).join('<br>')}</div>` : ''}</div>`;
}
// Mapa del grupo: cada alumno y cada criterio con su valoración

// Zona: rezago por escuela (con los concentrados) y alumnos con rezago alto (cargando los alumnos de cada escuela)
function eiaSeccionRezagoZona(v, filas) {

/* ---- Comparativos (Supervisión y Mesa Técnica) ---- */
const EIA_CRITERIOS = [['ind', 'Índice general', 1], ['rez', 'Alumnos en rezago (%)', -1], ['log', 'Aprendizaje desarrollado (%)', 1]].concat(EIA_CAMPOS.map(([k, nom]) => ['c.' + k, nom + ' · índice', 1]));
const eiaValor = (a, crit) => !a ? null : crit === 'ind' ? a.ind : crit === 'rez' ? a.prz : crit === 'log' ? a.plog : a.cind[crit.slice(2)];
function eiaCmpV(v) { if (!v.cmp) v.cmp = { tipo: 'multi', grado: '', sel: [], crit: 'ind', orden: 'desc' }; return v.cmp; }
function eiaCuerpoComparativo(v) {
  const c = eiaCmpV(v);
