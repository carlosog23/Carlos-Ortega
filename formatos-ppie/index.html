<style>
/* Layout: una columna tipo app de teléfono; pantallas Inicio → Pasos → Revisión. Guinda ISEP como único acento. */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1B1D22; --muted:#5B606B; --line:#D9DCE2; --field:#FFFFFF;
  --accent:#8C2232; --accent-ink:#FFFFFF; --accent-soft:#F6E9EC; --ok:#1E7A46; --warn:#A4541A; --warn-soft:#FBEFE5;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171B; --card:#1F2228; --ink:#ECEDF0; --muted:#A3A8B3; --line:#363A43; --field:#16181D;
  --accent:#D9677A; --accent-ink:#1B0B0F; --accent-soft:#3A2228; --ok:#5CC48A; --warn:#E59A5E; --warn-soft:#3A2A1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171B; --card:#1F2228; --ink:#ECEDF0; --muted:#A3A8B3; --line:#363A43; --field:#16181D;
  --accent:#D9677A; --accent-ink:#1B0B0F; --accent-soft:#3A2228; --ok:#5CC48A; --warn:#E59A5E; --warn-soft:#3A2A1E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px}
.wrap{max-width:620px;margin:0 auto;padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:34px} h2{font-size:26px} h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.logos{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 10px;flex:none}
.logos img{height:64px;width:auto}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.group-title{font-family:var(--display);font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.anexos{display:flex;flex-direction:column;gap:10px}
.anexo{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);font:inherit;cursor:pointer;min-height:64px}
.anexo:hover{border-color:var(--accent)}
.letra{flex:none;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;font-weight:700}
.anexo .tx{display:block;min-width:0}
.anexo b{display:block;font-size:17px}
.anexo .ds{display:block;font-size:14px;color:var(--muted)}
.draft{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;min-height:50px;cursor:pointer;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.link{background:none;border:0;color:var(--accent);padding:8px 0;min-height:auto;text-decoration:underline}
.btn:focus-visible,.anexo:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;gap:10px}
.top .back{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:44px;height:44px;cursor:pointer;flex:none;font-size:20px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-weight:700}
.help{font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=url],input[type=password],input[type=search],textarea,select{font:inherit;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);min-height:50px}
textarea{min-height:130px;resize:vertical}
.meter{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.meter.over{color:var(--warn);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--field);min-height:48px;font-weight:400}
.opt input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1}
.review{display:flex;flex-direction:column;gap:6px}
.rv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.rv span:first-child{color:var(--muted)}
.rv span:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic}
.alert{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.alert b{color:var(--warn)}
.okmsg{border-radius:10px;padding:12px 14px;border:1px solid var(--ok);color:var(--ink)}
.okmsg b{color:var(--ok)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
 .acts{display:flex;flex-direction:column;gap:10px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;min-height:56px}
.act .ic{font-size:20px;line-height:1}
.sup{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sup-t{font-weight:700;font-size:15px}
.sup-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:14px}
.sup-g span{min-width:0;overflow-wrap:anywhere}
.sup-g i{display:block;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sup-g a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.sup-n{font-size:13px;color:var(--muted);font-style:italic;border-top:1px solid var(--line);padding-top:7px}
@media (max-width:380px){.sup-g{grid-template-columns:minmax(0,1fr)}}
.secs{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;color:var(--ink);font:inherit;cursor:pointer;min-height:80px}
.sec:hover{border-color:var(--accent)}
.sec:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec .sic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.sec .sic svg{width:28px;height:28px;fill:none;stroke:var(--accent-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec.off .sic{background:var(--accent-soft)}.sec.off .sic svg{stroke:var(--accent)}
.sec b{display:block;font-size:18px}.sec .ds{display:block;font-size:14px;color:var(--muted)}
.sec .cnt{display:block;font-size:13px;font-weight:700;color:var(--accent);margin-top:3px}.sec.off .cnt{color:var(--muted);font-weight:400;font-style:italic}
.sec .chev{flex:none;margin-left:auto;font-size:28px;color:var(--muted);line-height:1}
.tw{overflow-x:auto;margin:0 -4px}
.mx{border-collapse:collapse;font-size:13px;min-width:100%}
.mx th,.mx td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
.mx thead th{background:var(--accent-soft);color:var(--accent)}
.mx tbody th{text-align:left;font-weight:700;background:var(--card)}
.mx td{color:var(--muted)}.mx td.nz{color:var(--ink);font-weight:700}.mx td.tot{font-weight:700;color:var(--ink);background:var(--accent-soft)}
.mx tr.sub th,.mx tr.sub td{border-top:2px solid var(--accent)}
details.card>summary{cursor:pointer;list-style:none;font-size:16px}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸ ";color:var(--accent)}details.card[open]>summary::before{content:"▾ "}
.al{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.alr{display:flex;align-items:center;gap:10px;padding:6px 4px;font-weight:400;font-size:14px;border-bottom:1px solid var(--line)}
.alr:last-child{border-bottom:0}.alr input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.alr .an{flex:1;min-width:0}.alr .ae{flex:none;color:var(--muted);font-size:13px}
.ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.phf{width:125px;height:150px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--field);color:var(--muted);font-size:14px;flex:none}
.phf img{width:100%;height:100%;object-fit:cover}
.phb{display:flex;flex-direction:column;gap:8px;flex:1;min-width:170px}.phb.row{flex-direction:row}
.ed{display:flex;flex-direction:column;gap:10px;align-items:center}
.edf{position:relative;width:min(100%,280px);aspect-ratio:5/6;overflow:hidden;border-radius:6px;background:#222;touch-action:none;cursor:grab;user-select:none}
.edf img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.edg{position:absolute;inset:0;pointer-events:none;border:2px solid #fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
 background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.6%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.6%,transparent 66.8%)}
.edz{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--muted);width:min(100%,320px)}.edz input{flex:1;accent-color:var(--accent)}
.ed .phb.row{width:100%;flex-wrap:wrap}.ed .phb.row .btn{flex:1}
.live{position:relative;border-radius:10px;overflow:hidden;background:#000}
.live video{display:block;width:100%;max-height:60vh;object-fit:cover}
.live .frame{position:absolute;left:50%;top:6%;height:76%;aspect-ratio:5/6;transform:translateX(-50%);border:2px dashed rgba(255,255,255,.85);border-radius:6px;pointer-events:none}
.live .phb{padding:10px;background:rgba(0,0,0,.6)}
.fw{margin-top:6px}
.fw_pad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;height:150px;overflow:hidden}
.fw_pad canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.fw_hint{position:absolute;left:14px;bottom:10px;color:#9aa5b5;font-size:13px;pointer-events:none}
.fw_pv{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:center;min-height:90px}
.fw_pv img{max-height:90px;max-width:100%}
.altab{border-collapse:collapse;width:100%;font-size:13px}
.altab th,.altab td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.altab thead th{background:var(--azul-soft);color:var(--ink);font-weight:700;white-space:nowrap}
.altab td.aled:focus{outline:2px solid var(--accent);background:var(--azul-soft)}
.altab td.alnum{color:var(--muted);text-align:center}
.soon{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px}
.emer{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.emer-t{font-family:var(--display);font-size:23px;line-height:1.1}
.emer-n{display:flex;flex-direction:column;gap:8px}.emer-n a.btn{text-decoration:none;font-size:22px;letter-spacing:.03em}
.emer .help a{color:var(--accent);font-weight:700}
.nds{display:flex;flex-direction:column;gap:10px}
.nd{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.nd.on{border-color:var(--accent)}
.nd-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px;color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.nd-h .tx{display:block;min-width:0;flex:1}.nd-h b{display:block;font-size:16px;line-height:1.3}.nd-h .ds{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.nd-h .chev{flex:none;color:var(--muted);font-size:18px}.nd-h:focus-visible,.lib:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.nd-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:15px}
a.chip{text-decoration:none;color:var(--ink)}.chip.tag{cursor:default;font-size:13px;background:var(--bg)}.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.cats,.grados{gap:8px}.grados .chip{min-width:52px;font-size:16px;padding:8px 14px}
.libs{display:flex;flex-direction:column}.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px;min-height:48px}
.lib:last-child{border-bottom:0}.lib .chev{color:var(--accent);font-size:22px;flex:none}
.nd-b a.btn{text-decoration:none;font-size:16px;text-align:left}.help a{color:var(--accent)}
.ndimg{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.ndimg img{display:block;width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.adminlink{align-self:center;font-size:14px}
.piloto{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.piloto-tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.piloto p{margin:0;font-size:15px;line-height:1.5}.piloto .piloto-n{font-size:13.5px;color:var(--muted)}
.calhead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.calhead div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calhead i{display:block;font-style:normal;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calhead b{font-size:16px}
.calhead.edcorte{grid-template-columns:repeat(2,minmax(0,1fr))}
.escbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.escbox.tot{border-color:var(--accent);border-width:1.5px}
.escname{font-weight:700;margin-bottom:8px}
.pnum{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
@media (max-width:560px){.calhead.edcorte{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.calhead{grid-template-columns:minmax(0,1fr)}}
.callist{display:flex;flex-direction:column}
.calrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.calrow:first-child{border-top:0}
.calrow .f{font-weight:600;font-size:15px}.calrow .t{font-size:15px}
.calrow .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--k,var(--muted));vertical-align:0}
.calrow.hoy{background:var(--accent-soft,rgba(30,90,200,.08));border-radius:8px;padding-left:8px;padding-right:8px}
@media (max-width:560px){.calrow{grid-template-columns:minmax(0,1fr);gap:2px}}
.calleg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.calleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--k)}
.caled{display:grid;grid-template-columns:150px 150px minmax(0,1fr) auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.caled:first-of-type{border-top:0}
.caled label{font-size:12px;color:var(--muted)}.caled input{width:100%}
.caled .del{min-height:44px;padding:0 12px}
@media (max-width:640px){.caled{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.caled .tx,.caled .del{grid-column:1/-1}}
.foot{font-size:13px;color:var(--muted);text-align:center}
.homebtn{margin-left:auto;flex:none;font:inherit;font-size:15px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.homebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:60px}
.resume .ri{flex:none;font-size:22px;color:var(--accent)}.resume b{display:block}.resume span.ds{display:block;font-size:14px;color:var(--muted)}
.phf.lvlogo{background:#fff}.phf.lvlogo img{object-fit:contain;padding:6px}
.lvpv{display:flex;flex-direction:column;gap:12px}.lvpv canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ===== Diseño institucional azul: banda marino con filete azul Zona 050; interfaz sobria y precisa ===== */
:root{--bg:#F1F4F8;--card:#FFFFFF;--ink:#14213A;--muted:#5A6678;--line:#D8DEE7;--field:#FFFFFF;
  --accent:#164A86;--accent-ink:#FFFFFF;--accent-soft:#E7EEF7;--rule:#2B8FD6;--band:#0D2747;--band-ink:#FFFFFF;--band-soft:rgba(255,255,255,.74);
  --shadow:0 1px 2px rgba(13,39,71,.06),0 1px 1px rgba(13,39,71,.03)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--card:#172131;--ink:#E6ECF4;--muted:#9CA9BC;--line:#2A3649;--field:#111A28;
  --accent:#7FB2E8;--accent-ink:#0B1626;--accent-soft:#1B2B42;--rule:#3C9BE0;--band:#0A1B33;--shadow:none}}
:root[data-theme="dark"]{--bg:#0E1420;--card:#172131;--ink:#E6ECF4;--muted:#9CA9BC;--line:#2A3649;--field:#111A28;

const CENTROS=ESCUELAS_050.map((e,i)=>{const m=e[4].match(/^(.*?),?\s*C\.P\.\s*(\d{5})/);const cargo=CARGOS_050[i];
  return{label:"Esc. Prim. "+e[0],nombre:"Escuela Primaria "+e[0],cct:e[1],mun:e[2],dir:m?m[1]:e[4],cp:m?m[2]:"",resp:(/a$|Encargada/.test(cargo)?"Mtra. ":"Mtro. ")+e[5],cargo}});
CENTROS.push({label:"Supervisión Escolar Zona 050",nombre:"Supervisión Escolar Zona 050",cct:"02FIZ0094X",mun:"San Quintín",dir:"Camalú, San Quintín",cp:"22910",tel:"616 165 5622",resp:SUP_NOMBRE,cargo:"Supervisor Escolar"});
const CARGOS_RESP=["Director","Directora","Encargado de despacho","Encargada de despacho","Supervisor Escolar"];
const LEYENDA={"Director":"DEL DIRECTOR","Directora":"DE LA DIRECTORA","Encargado de despacho":"DEL ENCARGADO DE DESPACHO","Encargada de despacho":"DE LA ENCARGADA DE DESPACHO","Supervisor Escolar":"DEL SUPERVISOR ESCOLAR"};
function addWeekdays(iso,n){const p=parseDate(iso);if(!p)return"";const d=new Date(p.y,p.m-1,p.d);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function wireLicDias(g){const upd=()=>{const n=+(document.querySelector('input[name="f_dias"]:checked')?.value||0);const del=g("del").value;if(!n||!del)return;
    const al=addWeekdays(del,n-1);g("al").value=al;g("rean").value=addWeekdays(al,1)};
  document.querySelectorAll('input[name="f_dias"]').forEach(r=>r.addEventListener("change",upd));g("del").addEventListener("change",upd)}
function wireLicCentro(g){const apply=()=>{const i=g("centro").value;const dirSolicita=document.querySelector('input[name="f_quien"]:checked')?.value?.startsWith("El director");
    if(i!==""&&i!=="otra"){const c=CENTROS[+i];g("cnombre").value=c.nombre;g("ccct").value=c.cct;g("cdir").value=c.dir;g("cmun").value=c.mun;g("ccp").value=c.cp;if(c.tel)g("ctel").value=c.tel;
      g("resp").value=c.resp;g("rcargo").value=c.cargo}
    if(dirSolicita){g("resp").value=SUP_NOMBRE;g("rcargo").value="Supervisor Escolar"}
    else if(i!==""&&i!=="otra"&&g("rcargo").value==="Supervisor Escolar"&&CENTROS[+i].cargo!=="Supervisor Escolar"){const c=CENTROS[+i];g("resp").value=c.resp;g("rcargo").value=c.cargo}};
  g("centro").addEventListener("change",()=>{if(g("centro").value==="otra"){["cnombre","ccct","cdir","cmun","ccp","ctel","resp"].forEach(k=>g(k).value="");g("rcargo").value=""}apply()});
  document.querySelectorAll('input[name="f_quien"]').forEach(r=>r.addEventListener("change",apply))}

/* ---------- Fotografía (cámara del celular o cámara web) ---------- */
function recortarFoto(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const W=500,H=600,r=W/H;let sw=im.naturalWidth,sh=im.naturalHeight,sx=0,sy=0;
    if(sw/sh>r){const nw=sh*r;sx=(sw-nw)/2;sw=nw}else{const nh=sw/r;sy=Math.max(0,(sh-nh)*0.35);sh=nh}
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(im,sx,sy,sw,sh,0,0,W,H);ok(c.toDataURL("image/jpeg",0.86))};im.onerror=()=>no(new Error("No se pudo leer la imagen"));im.src=src})}
function wirePhoto(id){const inp=document.getElementById(id),pv=document.getElementById(id+"_pv"),del=document.getElementById(id+"_del"),msg=document.getElementById(id+"_m");

  const E={src:null,iw:0,ih:0,z:1,x:0,y:0,rot:0};
  const dims=()=>{const r=E.rot%180!==0;return{w:r?E.ih:E.iw,h:r?E.iw:E.ih}};
  const base=()=>{const b=box.getBoundingClientRect(),d=dims();return Math.max(b.width/d.w,b.height/d.h)};
  const clamp=()=>{const b=box.getBoundingClientRect(),d=dims(),k=base()*E.z,w=d.w*k,h=d.h*k;E.x=Math.min(0,Math.max(b.width-w,E.x));E.y=Math.min(0,Math.max(b.height-h,E.y))};
  const draw=()=>{clamp();const k=base()*E.z;img.style.width=E.iw*k+"px";img.style.height=E.ih*k+"px";const d=dims();
    img.style.transform=`translate(${E.x}px,${E.y}px) translate(${d.w*k/2}px,${d.h*k/2}px) rotate(${E.rot}deg) translate(${-E.iw*k/2}px,${-E.ih*k/2}px)`};
  const center=()=>{const b=box.getBoundingClientRect(),d=dims(),k=base()*E.z;E.x=(b.width-d.w*k)/2;E.y=(b.height-d.h*k)*0.3};

      E.src=c.toDataURL("image/jpeg",0.9);E.iw=c.width;E.ih=c.height;E.z=1;E.rot=0;zoom.value=1;S._fotoOrig=S._fotoOrig||{};S._fotoOrig[id]=E.src;img.src=E.src;ed.hidden=false;
      requestAnimationFrame(()=>{center();draw();ed.scrollIntoView({behavior:"smooth",block:"center"})});ok()};im.onerror=()=>{msg.textContent="No se pudo leer la imagen.";ok()};im.src=src});
  let drag=null;

  box.addEventListener("pointermove",e=>{if(!drag)return;E.x=drag.ox+e.clientX-drag.x;E.y=drag.oy+e.clientY-drag.y;draw()});
  box.addEventListener("pointerup",()=>drag=null);box.addEventListener("pointercancel",()=>drag=null);
  zoom.oninput=()=>{const b=box.getBoundingClientRect(),cx=b.width/2,cy=b.height/2,old=E.z;E.z=+zoom.value;const f=E.z/old;E.x=cx-(cx-E.x)*f;E.y=cy-(cy-E.y)*f;draw()};
  box.addEventListener("wheel",e=>{e.preventDefault();zoom.value=Math.min(4,Math.max(1,E.z*(e.deltaY<0?1.06:1/1.06)));zoom.oninput()},{passive:false});
  document.getElementById(id+"_rot").onclick=()=>{E.rot=(E.rot+90)%360;E.z=1;zoom.value=1;center();draw()};
  document.getElementById(id+"_ecan").onclick=()=>{ed.hidden=true};
  document.getElementById(id+"_eok").onclick=()=>{const b=box.getBoundingClientRect(),W=500,H=600,f=W/b.width,k=base()*E.z,d=dims();
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.scale(f,f);
    x.translate(E.x+d.w*k/2,E.y+d.h*k/2);x.rotate(E.rot*Math.PI/180);x.drawImage(img,-E.iw*k/2,-E.ih*k/2,E.iw*k,E.ih*k);

  document.getElementById(id+"_cam").onchange=fromFile;document.getElementById(id+"_gal").onchange=fromFile;

/* Pantalla de la Supervisión para actualizar los teléfonos (guarda en GitHub) */
const ghHdr=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const ghURL=(path=REPO_SEG.path)=>`https://api.github.com/repos/${REPO_SEG.owner}/${REPO_SEG.repo}/contents/${path}`;
const b64enc=s=>btoa(unescape(encodeURIComponent(s))),b64dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function ghLeer(t,path){const r=await fetch(ghURL(path)+"?ref="+REPO_SEG.branch+"&t="+Date.now(),{headers:ghHdr(t),cache:"no-store"});if(!r.ok){const e=new Error("http "+r.status);e.status=r.status;throw e}const j=await r.json();return{sha:j.sha,data:JSON.parse(b64dec(j.content))}}
function adminTop(){return`<div class="top"><button class="back" id="salir" aria-label="Regresar">←</button><div style="min-width:0"><div class="eyebrow">Solo Supervisión</div><h2>Teléfonos del seguro escolar</h2></div></div>`}
async function seguroAdminView(){S.view="admin";setBar("");const tok=store.get("gh-token","");
  if(!tok){app.innerHTML=`${adminTop()}<section class="card"><p>Esta pantalla es solo para la Supervisión Escolar. Lo que guarde aquí lo verán todas las escuelas.</p>
     <div class="field"><label for="tk">Clave de acceso</label><input type="password" id="tk" autocomplete="off" spellcheck="false"><p class="help">Es el token de GitHub de la Supervisión. Se guarda solo en este equipo.</p></div>
     <button class="btn primary" id="entrar">Entrar</button><div id="msg"></div></section>`;
    document.getElementById("salir").onclick=()=>sectionView("seguro");
    document.getElementById("entrar").onclick=async()=>{const t=document.getElementById("tk").value.trim();const m=document.getElementById("msg");if(!t)return;m.innerHTML=`<p class="help">Verificando…</p>`;
      try{await ghLeer(t);store.set("gh-token",t);seguroAdminView()}catch(e){m.innerHTML=`<div class="alert"><b>No se pudo entrar.</b> ${e.status===401||e.status===403||e.status===404?"La clave no es válida o no tiene acceso al repositorio.":"Revise su conexión a internet."}</div>`}};
    window.scrollTo(0,0);return}
  app.innerHTML=`${adminTop()}<p class="muted">Cargando los teléfonos vigentes…</p>`;document.getElementById("salir").onclick=()=>sectionView("seguro");
  let cur;try{cur=await ghLeer(tok)}catch(e){if(e.status===401||e.status===403){store.del("gh-token");return seguroAdminView()}
    app.innerHTML=`${adminTop()}<div class="alert"><b>No se pudieron leer los teléfonos.</b> Revise su conexión e intente de nuevo.</div>`;document.getElementById("salir").onclick=()=>sectionView("seguro");return}
  const d=cur.data;const inp=(id,lab,v,type="tel",half)=>`<div class="field"><label for="${id}">${esc(lab)}</label><input type="${type}" id="${id}" value="${esc(v||"")}" ${type==="tel"?'inputmode="tel"':""} autocomplete="off"></div>`;
  const zonas=[];d.clinicas.forEach((c,i)=>{let z=zonas.find(x=>x.n===c.zona);if(!z){z={n:c.zona,c:[]};zonas.push(z)}z.c.push([c,i])});
  app.innerHTML=`${adminTop()}
   <p class="muted">Cambie lo que haga falta y toque <b>Guardar y publicar</b>. Las escuelas verán los números nuevos al abrir la app y en el reverso de cada aviso que impriman.</p>
   <section class="card"><h3>Para reportar el accidente</h3>
    <div class="row2">${inp("rep0","Teléfono 1",d.reportar[0])}${inp("rep1","Teléfono 2",d.reportar[1])}</div>${inp("rep2","Teléfono 3 (opcional)",d.reportar[2])}
    ${inp("link","Reporte de accidente electrónico (enlace)",d.reporteElectronico,"url")}</section>
   <section class="card"><h3>Dudas y reembolsos</h3>
    <div class="row2">${inp("dud0","Dudas: teléfono 1",d.dudas[0])}${inp("dud1","Dudas: teléfono 2",d.dudas[1])}</div>
    <div class="row2">${inp("rtel","Reembolsos: teléfono",d.reembolsosTel)}${inp("rcor","Reembolsos: correo",d.reembolsosCorreo,"email")}</div></section>
   <details class="card"><summary><b>Teléfonos de las clínicas</b> · ${d.clinicas.length} clínicas</summary>
    ${zonas.map(z=>`<div class="group-title">${esc(z.n)}</div>${z.c.map(([c,i])=>inp("cl"+i,c.nombre,c.tel)).join("")}`).join("")}</details>
   <div id="msg"></div>
   <button class="btn link" id="salirSes">Cerrar la sesión de Supervisión en este equipo</button>`;
  setBar(`<button class="btn ghost" id="cancel">Cancelar</button><button class="btn primary" id="guardar">Guardar y publicar</button>`);
  const v=id=>document.getElementById(id).value.trim();
  document.getElementById("salir").onclick=document.getElementById("cancel").onclick=()=>sectionView("seguro");
  document.getElementById("salirSes").onclick=()=>{store.del("gh-token");sectionView("seguro")};
  document.getElementById("guardar").onclick=async e=>{const b=e.currentTarget;const m=document.getElementById("msg");
    const nuevo={...d,actualizado:today(),reportar:["rep0","rep1","rep2"].map(v).filter(Boolean),reporteElectronico:v("link"),dudas:["dud0","dud1"].map(v).filter(Boolean),
      reembolsosTel:v("rtel"),reembolsosCorreo:v("rcor"),clinicas:d.clinicas.map((c,i)=>({...c,tel:v("cl"+i)}))};
    if(!nuevo.reportar.length){m.innerHTML=`<div class="alert"><b>Falta al menos un teléfono para reportar el accidente.</b></div>`;return}
    b.disabled=true;b.textContent="Publicando…";
    try{let sha=cur.sha;const put=()=>fetch(ghURL(),{method:"PUT",headers:{...ghHdr(tok),"Content-Type":"application/json"},
        body:JSON.stringify({message:`Seguro escolar: actualiza teléfonos (${nuevo.actualizado})`,content:b64enc(JSON.stringify(nuevo,null,2)+"\n"),sha,branch:REPO_SEG.branch})});
      let r=await put();if(r.status===409||r.status===422){sha=(await ghLeer(tok)).sha;r=await put()}
      if(!r.ok){const er=new Error("http "+r.status);er.status=r.status;throw er}
      cur.sha=(await r.json()).content.sha;cur.data=nuevo;SEGURO=nuevo;store.set("seguro-cache",nuevo);
      m.innerHTML=`<div class="okmsg"><b>Guardado y publicado.</b> En uno o dos minutos todas las escuelas verán los números nuevos.</div>`}
    catch(er){m.innerHTML=`<div class="alert"><b>No se pudo guardar.</b> ${er.status===401||er.status===403?"La clave ya no es válida o no tiene permiso para escribir. Cierre la sesión y entre con una clave nueva.":"Revise su conexión e intente de nuevo."}</div>`}
    finally{b.disabled=false;b.textContent="Guardar y publicar";m.scrollIntoView({behavior:"smooth",block:"center"})}};
  window.scrollTo(0,0)}

const CORREO_URL="https://sites.google.com/bcedu.mx/correo-edubc";
function correoCard(){return`<section class="card" aria-label="Correo institucional"><div><h3>Correo institucional (@bcedu.mx)</h3>
   <p class="muted" style="font-size:15px">¿Olvidó su contraseña o su cuenta está desactivada? Solicite el restablecimiento o la reactivación en el formulario oficial.</p></div>
   <div class="acts"><a class="btn primary act" style="text-decoration:none" href="${CORREO_URL}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">✉️</span>Solicitar restablecimiento o reactivación</a></div>
   <p class="help">Se abre el sitio oficial «Reactivación y/o restablecimiento de contraseña del Correo Institucional».</p></section>`}
/* ---------- CURP: descarga en el sitio oficial (gob.mx no acepta la CURP desde otra página y pide verificación de seguridad) ---------- */
const CURP_URL="https://www.gob.mx/curp/";
const CURP_RE=/^[A-Z][AEIOUX][A-Z]{2}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[HMX](AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[0-9A-Z]\d$/;
function curpDV(c){const D="0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";let s=0;for(let i=0;i<17;i++)s+=D.indexOf(c[i])*(18-i);return(10-s%10)%10}
function curpRevisar(v){const c=String(v||"").toUpperCase().replace(/\s/g,"");
  if(!c)return{c,ok:false,msg:""};if(c.length<18)return{c,ok:false,msg:18-c.length===1?"Falta 1 carácter (la CURP tiene 18).":`Faltan ${18-c.length} caracteres (la CURP tiene 18).`};
  if(!CURP_RE.test(c))return{c,ok:false,msg:"La CURP no tiene el formato correcto. Revise letras y números."};
  const ci=curpInfo(c);const[y,m,d]=ci.dob.split("-");const dat=`nacimiento ${+d}/${+m}/${y} · ${ci.sexo==="H"?"hombre":ci.sexo==="M"?"mujer":"no binario"}`;
  if(curpDV(c)!==+c[17])return{c,ok:false,msg:"La CURP tiene un error: el último dígito no corresponde con el resto de la clave. Revise letra por letra; suele ser una O por un 0 o una letra cambiada."};
  return{c,ok:true,msg:`Formato correcto · ${dat}`}}
function curpCard(){return`<section class="card" aria-label="Descarga de CURP"><div><h3>Descarga de CURP</h3>
   <p class="muted" style="font-size:15px">Consulte y descargue la CURP certificada en el sitio oficial de gob.mx.</p></div>
   <div class="acts"><a class="btn primary act" style="text-decoration:none" href="${CURP_URL}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">🪪</span>Descargar CURP en gob.mx</a></div>
   <p class="help">Escriba la CURP (o busque con nombre, fecha y lugar de nacimiento), complete la verificación de seguridad y toque «Descargar PDF».</p></section>`}

async function cargarNormas(){if(NORMAS)return NORMAS;try{const r=await fetch("formatos/normatividad.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;NORMAS=await r.json();store.set("normas-cache",NORMAS)}
  catch(e){NORMAS=store.get("normas-cache",null)}return NORMAS}

function librosGrado(g){const t=GRADOS_TXT[g-1]+" grado",p="P"+g,fase=g<=2?3:g<=4?4:5,cf="P"+(g<=2?1:g<=4?3:5);
  const al=[["Nuestros saberes: Libro para alumnos, maestros y familia","SDA"],["Múltiples lenguajes","MLA"],["Proyectos de Aula","PAA"],["Proyectos Escolares","PEA"],["Proyectos Comunitarios","PCA"]];
  if(g<=2)al.push(["Múltiples lenguajes. Trazos y palabras","TPA"],["Múltiples lenguajes. Trazos y números","TNA"]);

const NV={cat:"todos",q:"",grado:1,abierto:null};

function docHTML(d){if(d.id==="calendario"&&CAL)d=calDoc(d);const open=NV.abierto===d.id;const cat=(NORMAS.categorias.find(c=>c.id===d.cat)||{}).nombre||"";

    ${d.imagen?`<a href="${esc(d.imagen)}" target="_blank" rel="noopener" class="ndimg"><img src="${esc(d.imagen)}" alt="${esc(d.titulo)}" loading="lazy" onerror="this.parentNode.hidden=true"></a>`:""}${d.nota?`<div class="alert">${esc(d.nota)}</div>`:""}${pend}<div class="acts">${links}${app}</div>${d.secciones?`<div><p class="help" style="margin-bottom:6px"><b>Ir directo a:</b></p><div class="chips">${d.secciones.map(x=>`<a class="chip" href="${esc((d.links[0]||{}).u)}#page=${x.p}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join("")}</div></div>`:""}</div>`:""}</article>`}

     <p class="help">Ciclo escolar ${esc(cicloActual())}. Los libros se abren en el lector oficial de la CONALITEG, donde también se pueden descargar. <a href="https://libros.conaliteg.gob.mx/primaria.html" target="_blank" rel="noopener">Ver el catálogo completo</a>.</p>`}
  else{const q=norm(NV.q);const docs=NORMAS.documentos.filter(d=>(NV.cat==="todos"||d.cat===NV.cat)&&(!q||norm([d.titulo,d.regula,(d.temas||[]).join(" ")].join(" ")).includes(q)));

  app.innerHTML=`<div class="top"><button class="back" id="salir" aria-label="Volver al inicio">←</button><div style="min-width:0"><div class="eyebrow">Tlamatini · Zona 050</div><h2>Normatividad</h2></div></div>

function parseDate(v){if(!v)return null;const[y,m,d]=v.split("-").map(Number);return{y,m,d}}
function fmtDate(v,fmt){const p=parseDate(v);if(!p)return fmt.startsWith("partes")?["","",""]:"";

function fmtTime(v,fmt){if(!v)return fmt==="hm"?["",""]:"";const[h,m]=v.split(":");return fmt==="hm"?[h,m]:`${h}:${m} hrs.`}
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

/* ---------- medición de texto con la fuente del PDF ---------- */
let HELV=null,HELVB=null;const okChar=new Map();
async function fonts(){if(HELV)return;const d=await PDFLib.PDFDocument.create();HELV=await d.embedFont(PDFLib.StandardFonts.Helvetica);HELVB=await d.embedFont(PDFLib.StandardFonts.HelveticaBold)}
function clean(t){t=String(t??"").replace(/\r/g,"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\t/g," ");let o="";
  for(const ch of t){if(ch==="\n"){o+=ch;continue}if(!okChar.has(ch)){let ok=true;try{HELV.widthOfTextAtSize(ch,10)}catch(e){ok=false}okChar.set(ch,ok)}o+=okChar.get(ch)?ch:""}return o}
const W=(t,s)=>HELV.widthOfTextAtSize(t,s);
function wrapWidths(text,widths,size){/* reparte el texto en renglones de anchos dados */
  const out=[];let li=0;const paras=clean(text).split("\n");
  for(let pi=0;pi<paras.length;pi++){const words=paras[pi].split(/ +/).filter(Boolean);let cur="";
    if(!words.length){if(pi<paras.length-1){out.push("");li++}continue}
    for(const w of words){const wd=widths[Math.min(li,widths.length-1)];const cand=cur?cur+" "+w:w;
      if(W(cand,size)<=wd)cur=cand;else{if(cur){out.push(cur);li++}cur=w;while(W(cur,size)>widths[Math.min(li,widths.length-1)]){/* palabra muy larga */let k=cur.length;while(k>1&&W(cur.slice(0,k),size)>widths[Math.min(li,widths.length-1)])k--;out.push(cur.slice(0,k));li++;cur=cur.slice(k)}}}
    out.push(cur);li++}
  return out}
function layoutLines(text,widths){for(const s of [10,9.5,9,8.5,8]){const l=wrapWidths(text,widths,s);if(l.length<=widths.length)return{size:s,lines:l,over:false}}
  const l=wrapWidths(text,widths,8);return{size:8,lines:l,over:true}}
function layoutBox(text,w,h){for(const s of [10,9.5,9,8.5,8,7.5,7]){const lh=s*1.2;const n=Math.floor((h-4)/lh);const l=wrapWidths(text,[w-6],s);if(l.length<=n)return{size:s,lines:l,over:false,cap:n}}
  const s=7,lh=s*1.2,n=Math.floor((h-4)/lh);return{size:s,lines:wrapWidths(text,[w-6],s),over:true,cap:n}}
function fitSingle(text,w,mx=10){const t=clean(text).replace(/\n/g," ");if(!t)return{size:mx,text:t,over:false};let s=mx;const full=W(t,mx);if(full>w-2)s=Math.max(6,Math.floor((w-2)/full*mx*2)/2);return{size:s,text:t,over:W(t,s)>w-1}}

/* ---------- geometría de los campos (se lee del PDF oficial) ---------- */
const cache={};
async function loadForm(L){if(cache[L])return cache[L];const bytes=await (await fetch(`formatos/${L}.pdf`)).arrayBuffer();
  const doc=await PDFLib.PDFDocument.load(bytes);const pages=doc.getPages();const geo={};
  for(const f of doc.getForm().getFields()){const name=f.getName().slice(2);const wd=f.acroField.getWidgets()[0];const r=wd.getRectangle();
    const ref=doc.context.getObjectRef(wd.dict);let pi=0;pages.forEach((p,i)=>{const a=p.node.Annots();if(a&&a.asArray().some(x=>x===ref))pi=i});
    let q=0;try{q=f.acroField.getQuadding()||0}catch(e){}
    geo[name]={...r,page:pi,cb:f instanceof PDFLib.PDFCheckBox,q}}
  cache[L]={bytes,geo};return cache[L]}

/* ---------- convertir respuestas en contenido del formato ---------- */
function plan(L){const A=ANEXOS[L],v=S.vals,out={single:{},lines:[],box:{},checks:[]};
  for(const st of A.steps)for(const f of st.fields){const val=v[f.id];
    if(f.type==="date"){const r=fmtDate(val,f.fmt);if(Array.isArray(f.to))f.to.forEach((n,i)=>out.single[n]=r[i]);else out.single[f.to]=r}
    else if(f.type==="time"){const r=fmtTime(val,f.fmt);if(Array.isArray(f.to))f.to.forEach((n,i)=>out.single[n]=r[i]);else out.single[f.to]=r}
    else if(f.type==="lines")out.lines.push({id:f.id,label:f.label,to:f.to,text:val||""});
    else if(f.type==="box")out.box[f.to]={id:f.id,label:f.label,text:val||""};
    else if(f.type==="checks"){(val?.sel||[]).forEach(n=>out.checks.push(n));if(f.other&&val?.otro){out.checks.push(f.other.cb);out.single[f.other.to]=val.otro}}
    else if(f.type==="choice"){const o=f.options.find(o=>o.label===val);if(o)out.checks.push(o.to)}
    else if(f.type==="check"){if(val)out.checks.push(f.to)}
    else if(f.type==="chars"){const t=clean(String(val||"")).toUpperCase().replace(/\s+/g,"");f.to.forEach((n,i)=>out.single[n]=t[i]||"");if(t.length>f.to.length)out.over=(out.over||[]).concat(`«${f.label}» tiene ${t.length} caracteres y el formato solo tiene ${f.to.length} casillas.`)}
    else if(f.type==="photo"){out.photo=val||""}
    else if(f.to)out.single[f.to]=val||""}
  for(const[n,id]of Object.entries(A.derive||{}))out.single[n]=v[id]||"";
  if(A.compute)Object.assign(out.single,A.compute(v));
  if(A.upper){const no=new Set(A.noUpper||[]);for(const k of Object.keys(out.single))if(!no.has(k)&&typeof out.single[k]==="string")out.single[k]=out.single[k].toLocaleUpperCase("es-MX");for(const k of no)if(out.single[k])out.single[k]=out.single[k].trim().toLowerCase()}
  return out}
function problems(L,geo){const p=plan(L),issues=[...(p.over||[]),...(ANEXOS[L].validate?ANEXOS[L].validate(S.vals):[])];
  for(const g of p.lines){if(!g.text)continue;const widths=g.to.map(n=>geo[n].width-3);const r=layoutLines(g.text,widths);if(r.over)issues.push(`«${g.label}» no cabe en los ${g.to.length} renglones del formato. Resuma el texto.`)}
  for(const[n,b]of Object.entries(p.box)){if(!b.text)continue;const g=geo[n];if(layoutBox(b.text,g.width,g.height).over)issues.push(`«${b.label}» no cabe en el recuadro del formato. Resuma el texto.`)}
  for(const[n,t]of Object.entries(p.single)){if(!t||!geo[n])continue;if(fitSingle(t,geo[n].width).over)issues.push(`«${n}» es demasiado largo para su espacio en el formato. Abrévielo.`)}
  return issues}

/* ---------- generar el PDF oficial ---------- */
async function generar(L){await fonts();const{bytes,geo}=await loadForm(L);const doc=await PDFLib.PDFDocument.load(bytes);
  const helv=await doc.embedFont(PDFLib.StandardFonts.Helvetica),bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const pages=doc.getPages(),ink=PDFLib.rgb(0,0,0),p=plan(L);
  const BOLD=new Set(ANEXOS[L].bold||[]);
  const put=(n,text,size)=>{const g=geo[n];if(!g||!text)return;const pg=pages[g.page];const ft=BOLD.has(n)?bold:helv;const w=ft.widthOfTextAtSize(text,size);
    let x=g.x+1.5;if(g.q===1)x=g.x+(g.width-w)/2;pg.drawText(text,{x,y:g.y+(g.height-size*0.72)/2,size,font:ft,color:ink})};
  if(p.photo&&geo.Foto){try{const img=await doc.embedJpg(p.photo);const g=geo.Foto;pages[g.page].drawImage(img,{x:g.x,y:g.y,width:g.width,height:g.height});
    pages[g.page].drawRectangle({x:g.x,y:g.y,width:g.width,height:g.height,borderColor:ink,borderWidth:0.8})}catch(e){console.warn("foto",e)}}
  for(const[n,t]of Object.entries(p.single)){if(!geo[n]||!t)continue;const r=fitSingle(t,geo[n].width,(ANEXOS[L].sizes||{})[n]||10);put(n,r.text,r.size)}
  for(const g of p.lines){if(!g.text)continue;const widths=g.to.map(n=>geo[n].width-3);const r=layoutLines(g.text,widths);r.lines.slice(0,g.to.length).forEach((t,i)=>put(g.to[i],t,r.size))}
  for(const[n,b]of Object.entries(p.box)){if(!b.text)continue;const g=geo[n];const r=layoutBox(b.text,g.width,g.height);const lh=r.size*1.2;
    r.lines.slice(0,r.cap).forEach((t,i)=>pages[g.page].drawText(t,{x:g.x+3,y:g.y+g.height-2-r.size-(i*lh),size:r.size,font:helv,color:ink}))}
  const CIRC=new Set(ANEXOS[L].circle||[]);
  for(const n of p.checks){const g=geo[n];if(!g)continue;if(CIRC.has(n)){pages[g.page].drawEllipse({x:g.x+g.width/2,y:g.y+g.height/2,xScale:g.width/2+5,yScale:g.height/2+4,borderColor:ink,borderWidth:1.3});continue}const s=Math.min(g.width,g.height)*1.05;const w=bold.widthOfTextAtSize("X",s);
    pages[g.page].drawText("X",{x:g.x+(g.width-w)/2,y:g.y+(g.height-s*0.72)/2,size:s,font:bold,color:ink})}
  if(ANEXOS[L].back)await ANEXOS[L].back(doc,helv,bold);
  const form=doc.getForm();for(const f of form.getFields())form.removeField(f);
  doc.setTitle(`${ARCHIVO[L]}`);doc.setProducer("Tlamatini · Zona 050");
  return await doc.save()}

function inputHTML(f,val){const id=`f_${f.id}`;const opt=f.opt?' <span class="muted" style="font-weight:400">(opcional)</span>':"";
  const help=f.help?`<p class="help">${esc(f.help)}</p>`:"";const lab=`<label for="${id}">${esc(f.label)}${opt}</label>`;
  if(f.type==="choice"){const options=f.options.map(o=>typeof o==="string"?o:o.label);return`<div class="field"><span class="lbl">${esc(f.label)}</span>${help}<div class="opts">${options.map((o,i)=>`<label class="opt ${val===o?"on":""}"><input type="radio" name="${id}" id="${id}_${i}" value="${esc(o)}" ${val===o?"checked":""}>${esc(o)}</label>`).join("")}</div></div>`}
  if(f.type==="chars")return`<div class="field">${lab}${help}<input type="text" id="${id}" value="${esc(val||"")}" maxlength="${f.to.length}" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.12em;font-family:ui-monospace,Menlo,Consolas,monospace"><div class="meter" id="${id}_c"></div></div>`;
  if(f.type==="photo")return`<div class="field"><span class="lbl">${esc(f.label)}</span>${help}<input type="hidden" id="${id}" value="${esc(val||"")}">
    <div class="ph"><div class="phf" id="${id}_pv">${val?`<img src="${val}" alt="Fotografía">`:`<span>Sin foto</span>`}</div>
     <div class="phb"><label class="btn primary" style="display:flex;align-items:center;justify-content:center;cursor:pointer">📷 Tomar foto<input type="file" accept="image/*" capture="user" id="${id}_cam" hidden></label>
      <button type="button" class="btn ghost" id="${id}_web">Usar cámara web</button>
      <label class="btn ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Elegir de la galería<input type="file" accept="image/*" id="${id}_gal" hidden></label>
      <button type="button" class="btn link" id="${id}_del" ${val?"":"hidden"}>Quitar foto</button></div></div>
    <div id="${id}_live" class="live" hidden><video id="${id}_vid" playsinline autoplay muted></video><div class="frame"></div><div class="phb row"><button type="button" class="btn primary" id="${id}_snap">Capturar</button><button type="button" class="btn ghost" id="${id}_stop">Cancelar</button></div></div>
    <div id="${id}_ed" class="ed" hidden><p class="help"><b>Acomode la foto:</b> arrástrela con el dedo o el mouse y use la barra para acercar o alejar. Lo que queda dentro del marco es lo que se imprime.</p>
     <div class="edf" id="${id}_box"><img id="${id}_img" alt="" draggable="false"><div class="edg"></div></div>
     <label class="edz">Alejar<input type="range" id="${id}_zoom" min="1" max="4" step="0.01" value="1">Acercar</label>
     <div class="phb row"><button type="button" class="btn ghost" id="${id}_rot">↻ Girar</button><button type="button" class="btn ghost" id="${id}_ecan">Cancelar</button><button type="button" class="btn primary" id="${id}_eok">Usar esta foto</button></div></div>
    <button type="button" class="btn link" id="${id}_adj" ${val?"":"hidden"}>Ajustar recorte</button>
    <div id="${id}_m" class="help"></div></div>`;
  if(f.type==="pick")return`<div class="field">${lab}${help}<select id="${id}"><option value="">Elija…</option>${f.options.map(o=>`<option value="${esc(o.value)}" ${val===o.value?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`;
  if(f.type==="select")return`<div class="field">${lab}${help}<select id="${id}"><option value="">Elija…</option>${f.options.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  if(f.type==="checks"){const sel=val?.sel||[];return`<div class="field"><span class="lbl">${esc(f.label)}</span>${help}<div class="opts">${f.options.map((o,i)=>`<label class="opt ${sel.includes(o.to)?"on":""}"><input type="checkbox" id="${id}_${i}" data-to="${esc(o.to)}" ${sel.includes(o.to)?"checked":""}>${esc(o.label)}</label>`).join("")}</div>
     ${f.other?`<div class="field"><label for="${id}_otro">Otro (especifique)</label><input type="text" id="${id}_otro" value="${esc(val?.otro||"")}" placeholder="Déjelo vacío si no aplica"></div>`:""}</div>`}
  if(f.type==="check")return`<div class="field"><div class="opts"><label class="opt ${val?"on":""}"><input type="checkbox" id="${id}" ${val?"checked":""}>${esc(f.text||f.label)}</label></div>${help}</div>`;
  if(f.type==="lines"||f.type==="box"){const short=f.short;return`<div class="field">${lab}${help}${short?`<input type="text" id="${id}" value="${esc(val||"")}">`:`<textarea id="${id}" rows="${f.type==="box"?5:Math.min(9,Math.max(3,f.to.length+1))}">${esc(val||"")}</textarea>`}<div class="meter" id="${id}_m"></div></div>`}
  const type=f.type==="date"?"date":f.type==="time"?"time":f.type==="tel"?"tel":f.type==="email"?"email":"text";
  const chips=f.chips?`<div class="chips">${f.chips.map(c=>`<button type="button" class="chip" data-for="${id}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:"";
  const fill=f.fillChips?`<div class="chips">${f.fillChips.map((c,i)=>`<button type="button" class="chip" data-fill="${f.id}" data-i="${i}">${esc(c.label)}</button>`).join("")}</div>`:"";
  return`<div class="field">${lab}${help}<input type="${type}" id="${id}" value="${esc(val||"")}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${type==="tel"?'inputmode="tel"':""}${type==="email"?' inputmode="email" autocapitalize="none" spellcheck="false"':""} autocomplete="off">${chips}${fill}</div>`}

function readStep(){const st=ANEXOS[S.letra].steps[S.step];for(const f of st.fields){const id=`f_${f.id}`;
  if(f.type==="choice"){const r=app.querySelector(`input[name="${id}"]:checked`);S.vals[f.id]=r?r.value:""}
  else if(f.type==="checks"){S.vals[f.id]={sel:f.options.filter((o,i)=>document.getElementById(`${id}_${i}`).checked).map(o=>o.to),otro:f.other?document.getElementById(`${id}_otro`).value.trim():""}}
  else if(f.type==="check")S.vals[f.id]=document.getElementById(id).checked;
  else S.vals[f.id]=document.getElementById(id).value}
  store.set("ppie-draft-"+S.letra,{vals:S.vals,step:S.step})}

async function meters(){const{geo}=await loadForm(S.letra);await fonts();const st=ANEXOS[S.letra].steps[S.step];
  for(const f of st.fields){if(f.type!=="lines"&&f.type!=="box")continue;const el=document.getElementById(`f_${f.id}`),m=document.getElementById(`f_${f.id}_m`);if(!el||!m)continue;
    const upd=()=>{const t=el.value;if(f.type==="lines"){const widths=f.to.map(n=>geo[n].width-3);const r=layoutLines(t,widths);const used=t?Math.min(r.lines.length,99):0;
        m.className="meter"+(r.over?" over":"");m.innerHTML=`<span>${r.over?"No cabe: resuma el texto":f.to.length>1?"Se acomoda en los renglones del formato":"Cabe en el formato"}</span><span>${used} de ${f.to.length} renglones</span>`}
      else{const g=geo[f.to];const r=layoutBox(t,g.width,g.height);m.className="meter"+(r.over?" over":"");m.innerHTML=`<span>${r.over?"No cabe en el recuadro: resuma el texto":"Cabe en el recuadro"}</span><span>${t.length} caracteres</span>`}};
    el.addEventListener("input",upd);upd()}}

function stepView(){if(S._stopCam){S._stopCam();S._stopCam=null}S.view="step";const A=ANEXOS[S.letra],st=A.steps[S.step],n=A.steps.length;
  const fields=st.fields;let html="",halfBuf=[];
  const flush=()=>{if(halfBuf.length){html+=`<div class="row2">${halfBuf.join("")}</div>`;halfBuf=[]}};
  for(const f of fields){const val=S.vals[f.id]!==undefined?S.vals[f.id]:preValue(f);const h=inputHTML(f,val);if(f.half)halfBuf.push(h);else{flush();html+=h}}flush();
  app.innerHTML=`<div class="top"><button class="back" id="salir" aria-label="Volver al inicio">←</button><div style="min-width:0"><div class="eyebrow">${A.pref?A.pref:"Anexo "+S.letra} · Paso ${S.step+1} de ${n+1}</div><h2>${esc(st.title)}</h2></div></div>
   <div class="progress" aria-hidden="true"><i style="width:${(S.step+1)/(n+1)*100}%"></i></div>
   ${st.intro&&A.intro?A.intro():""}<form class="card" id="frm" novalidate>${html}</form>`;
  setBar(`<button class="btn ghost" id="prev">${S.step?"Anterior":"Inicio"}</button><button class="btn primary" id="next">${S.step===n-1?"Revisar":"Siguiente"}</button>`);
  document.getElementById("frm").onsubmit=e=>{e.preventDefault()};
  app.querySelectorAll(".opt input").forEach(i=>i.addEventListener("change",()=>{if(i.type==="radio")app.querySelectorAll(`input[name="${i.name}"]`).forEach(r=>r.closest(".opt").classList.toggle("on",r.checked));else i.closest(".opt").classList.toggle("on",i.checked)}));
  app.querySelectorAll(".chip[data-for]").forEach(c=>c.onclick=()=>{const el=document.getElementById(c.dataset.for);const f=fields.find(x=>"f_"+x.id===c.dataset.for);if(f&&f.chipAppend){el.value=el.value.replace(/@.*$/,"")+c.dataset.v;el.focus()}else el.value=c.dataset.v});
  app.querySelectorAll(".chip[data-fill]").forEach(c=>c.onclick=()=>{const f=fields.find(x=>x.id===c.dataset.fill);const set=f.fillChips[+c.dataset.i].set;for(const[k,v]of Object.entries(set)){const el=document.getElementById("f_"+k);if(el)el.value=v}});
  document.getElementById("salir").onclick=()=>{readStep();goBack()};
  document.getElementById("prev").onclick=()=>{readStep();if(S.step===0)goBack();else{S.step--;stepView()}};
  document.getElementById("next").onclick=()=>{readStep();if(S.step===n-1)reviewView();else{S.step++;stepView()}};
  if(st.wire)st.wire(k=>document.getElementById("f_"+k));
  if(A.upper)app.querySelectorAll('#frm input[type=text]').forEach(el=>{el.style.textTransform="uppercase";el.addEventListener("change",()=>{el.value=el.value.toLocaleUpperCase("es-MX")})});
  app.querySelectorAll('#frm input[type=email]').forEach(el=>el.addEventListener("change",()=>{el.value=el.value.trim().toLowerCase()}));
  fields.filter(f=>f.type==="chars").forEach(f=>{const el=document.getElementById("f_"+f.id),m=document.getElementById("f_"+f.id+"_c");const upd=()=>{el.value=el.value.toUpperCase().replace(/\s+/g,"");const n=el.value.length,t=f.to.length;m.className="meter"+(n&&n!==t?" over":"");m.innerHTML=`<span>${n===t?"Completo":n?"Faltan "+(t-n)+" caracteres":""}</span><span>${n} de ${t}</span>`;if(f.onFull&&n===t)f.onFull(el.value)};el.addEventListener("input",upd);upd()});
  fields.filter(f=>f.type==="photo").forEach(f=>wirePhoto("f_"+f.id));
  meters();window.scrollTo(0,0);const first=app.querySelector("input[type=text],textarea");if(first&&window.innerWidth>700)first.focus()}

function showVal(f){const v=S.vals[f.id];
  if(f.type==="date")return v?fmtDate(v,"larga"):"";if(f.type==="time")return v?fmtTime(v,"hrs"):"";
  if(f.type==="checks"){const l=(v?.sel||[]).map(t=>f.options.find(o=>o.to===t)?.label);if(v?.otro)l.push("Otro: "+v.otro);return l.join("\n")}
  if(f.type==="check")return v?"Sí":"";if(f.type==="photo")return v?"Sí (se incluye en el formato)":"";if(f.type==="pick")return(f.options.find(o=>o.value===v)||{}).label||"";return v||""}
async function reviewView(){S.view="review";const A=ANEXOS[S.letra];const{geo}=await loadForm(S.letra);await fonts();const issues=problems(S.letra,geo);
  const missing=[];A.steps.forEach(st=>st.fields.forEach(f=>{if(!f.opt&&!showVal(f))missing.push(f.label)}));
  app.innerHTML=`<div class="top"><button class="back" id="salir" aria-label="Volver al inicio">←</button><div style="min-width:0"><div class="eyebrow">${A.pref||"Anexo "+S.letra} · Revisión</div><h2>${esc(A.name)}</h2></div></div>
   <div class="progress" aria-hidden="true"><i style="width:100%"></i></div>
   ${issues.length?`<div class="alert"><b>Corrija antes de descargar:</b><br>${issues.map(esc).join("<br>")}</div>`:""}

async function leerPDF(file){const L=await pdfjs();const doc=await L.getDocument({data:await file.arrayBuffer()}).promise;const lines=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows=[];
    for(const it of tc.items){if(!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str,w:it.width})}
    rows.sort((a,b)=>b.y-a.y);for(const r of rows){r.items.sort((a,b)=>a.x-b.x);let t="",end=null;for(const i of r.items){if(end!==null&&i.x-end>1.5)t+=" ";t+=i.s;end=i.x+i.w}lines.push(t.replace(/\s+/g," ").trim())}}

async function mejorarLogo(src,prog){const im=await imgLoad(src);const w=im.naturalWidth,h=im.naturalHeight,m=Math.max(w,h);const scale=m<=260?4:2;

  const base=lienzo(w,h),bx=base.getContext("2d");bx.fillStyle="#fff";bx.fillRect(0,0,w,h);bx.drawImage(im,0,0);const inp=await imgLoad(base.toDataURL("image/png"));
  await loadScript("lib/tf.min.js");await loadScript("lib/upscaler.min.js");await loadScript(`lib/esrgan/x${scale}/def.min.js`);
  const def=window[`ESRGANSlim${scale}x`];const up=new Upscaler({model:{...def,path:new URL(`lib/esrgan/x${scale}/model.json`,location.href).href}});
  try{const out=await up.upscale(inp,{output:"base64",patchSize:64,padding:6,progress:p=>prog&&prog(p)});
    const oi=await imgLoad(out);const W=oi.naturalWidth,H=oi.naturalHeight;const r=lienzo(W,H),rx=r.getContext("2d");rx.drawImage(oi,0,0);
    if(alfa){const a=lienzo(W,H),ax=a.getContext("2d");ax.imageSmoothingQuality="high";ax.drawImage(im,0,0,W,H);const ad=ax.getImageData(0,0,W,H).data,rd=rx.getImageData(0,0,W,H);
      for(let i=3;i<rd.data.length;i+=4)rd.data[i]=ad[i];rx.putImageData(rd,0,0)}

/* ---------- Control de acceso por enlaces con caducidad (personal o escuela completa) ----------
   acceso.json guarda solo la huella (SHA-256) de cada enlace, nunca el enlace mismo.
   Un enlace es válido si: existe, no está anulado, no ha vencido y es de la generación vigente.
   «Anular todos» sube la generación. Es una barrera para controlar la difusión, no un candado de servidor. */
const REPO_ACCP="formatos-ppie/formatos/acceso.json";
let ACC=null,ACC_YO=null;
const sha256=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const nuevoToken=()=>{const a=new Uint8Array(18);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const appURL=()=>location.origin+location.pathname;
function accEstado(e,gen){if(!e)return"no";if(e.anulado)return"anulado";if(e.gen!==gen)return"anulado";if(e.vence<today())return"vencido";return"vigente"}
async function accesoGate(){
  const m=(location.hash||"").match(/[#&]acceso=([A-Za-z0-9_-]{10,})/);
  if(m){store.set("acc-token",m[1]);history.replaceState(null,"",location.pathname+location.search)}
  try{const r=await fetch("formatos/acceso.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;ACC=await r.json();store.set("acc-cache",ACC)}catch(e){ACC=store.get("acc-cache",null)}
  if(!ACC||!ACC.activo)return true;
  if(store.get("gh-token",""))return true; // la Supervisión siempre entra
  const tok=store.get("acc-token","");if(!tok)return false;
  const h=await sha256(tok);const e=(ACC.enlaces||[]).find(x=>x.h===h);ACC_YO=e||null;
  return accEstado(e,ACC.generacion)==="vigente"}

const salEscuela=cct=>{const e=ESCUELAS_050.find(x=>x[1]===cct);return e?e[0]:(cct||"Sin centro de trabajo")};
async function salTexto(file){const L=await pdfjs();const doc=await L.getDocument({data:await file.arrayBuffer()}).promise;const lines=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows=[];
    for(const it of tc.items){if(!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str,w:it.width})}
    rows.sort((a,b)=>b.y-a.y);for(const r of rows){r.items.sort((a,b)=>a.x-b.x);let t="",end=null;for(const i of r.items){if(end!==null&&i.x-end>1.5)t+=" ";t+=i.s;end=i.x+i.w}lines.push(t.replace(/\s+/g," ").trim())}}
  return lines}
function salParse(lines){const txt=lines.join("\n");const r={folio:"",cct:"",nombre:"",nomina:"",fechaPago:"",periodo:"",perc:null,isr:null,seg:null,pen:null};
  let m;

  if(m=txt.match(/\b(\d{2}[A-Z]{3}\d{4}[A-Z0-9])\b/))r.cct=m[1];
  if(m=txt.match(/\b(EXTRAORDINARIA|ORDINARIA)\b/i))r.nomina=m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase();
  if(m=txt.match(/baja california\s+([A-ZÑÁÉÍÓÚ][A-ZÑÁÉÍÓÚ .]{4,}?)\s+(?:ORDINARIA|EXTRAORDINARIA)\b/i))r.nombre=m[1].replace(/\s+/g," ").trim();
  if(m=txt.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/)){

  else if(m=txt.match(/\bI\.?S\.?R\.?\b\s+([\d,]+\.\d{2})/i))r.isr=salNum(m[1]);
  if(r.isr==null&&r.perc!=null)r.isr=0;
  if(m=txt.match(/seguro\s+de\s+salud\s+([\d,]+\.\d{2})/i))r.seg=salNum(m[1]);
  if(r.seg==null&&r.perc!=null)r.seg=0;
  if(m=txt.match(/pensiones\s+y\s+otras\s+prestaciones\s+([\d,]+\.\d{2})/i))r.pen=salNum(m[1]);
  if(r.pen==null&&r.perc!=null)r.pen=0;

   <details class="card"><summary><b>¿Cómo se calcula el ingreso anual neto?</b></summary>

  const grados=grado?[grado]:((bc&&bc.fases[fase])?bc.fases[fase].grados.map(String):[]);

function plSigHabil(k){const d=new Date(k+"T12:00:00");for(let i=0;i<120;i++){const w=d.getDay(),x=isoD(d);if(w&&w<6&&!asSinClase(x))return x;d.setDate(d.getDate()+1)}return k}
function plDurCalc(){const D=PL.duracion;if(!D||!D.tipo||!D.inicio)return null;const ini=new Date(D.inicio+"T12:00:00");let fin=new Date(ini);
  const sem={semana:1,"2semanas":2,"3semanas":3}[D.tipo];
  if(D.tipo==="dia"){}else if(sem){fin.setDate(fin.getDate()+7*sem-1);while(fin.getDay()===0||fin.getDay()===6)fin.setDate(fin.getDate()-1)}
  else if(D.tipo==="mes"){fin.setMonth(fin.getMonth()+1);fin.setDate(fin.getDate()-1)}else if(D.tipo==="trimestre"){fin.setMonth(fin.getMonth()+3);fin.setDate(fin.getDate()-1)}
  else if(D.tipo==="otro"){if(!D.fin||D.fin<D.inicio)return null;fin=new Date(D.fin+"T12:00:00")}
  const dias=[],sin=[];for(const d=new Date(ini);d<=fin;d.setDate(d.getDate()+1)){const w=d.getDay();if(!w||w===6)continue;const k=isoD(d);const x=asSinClase(k);if(x)sin.push([k,x]);else dias.push(k)}
  const n=dias.length;const a=[[1,2,"una sola sesión con inicio, desarrollo y cierre","momentos"],[5,3,"una secuencia breve por sesiones o por momentos","sesiones"],[10,4,"un proyecto breve organizado por fases","fases"],[20,6,"un proyecto completo por fases, con producto final","fases"],[999,10,"conviene dividirlo en dos o tres proyectos","fases"]].find(x=>n<=x[0]);
  return{n,dias,sin,fin:isoD(fin),max:a[1],sug:a[2],fmt:a[3]}}

function firmaWidgetHTML(){const F=firmaGet();
  return`<div class="field"><span class="lbl">Firma digital</span><p class="help">Dibuje su firma con el dedo (en el celular) o con el mouse, o suba una foto de su firma. Se guarda para las próximas comunicaciones.</p>

     <div class="fw_pad" id="fw_pad" ${F?"hidden":""}><canvas id="fw_canvas"></canvas><span class="fw_hint">Firme aquí</span></div>
     <div class="fw_pv" id="fw_pv" ${F?"":"hidden"}>${F?`<img src="${F}" alt="Firma guardada">`:""}</div>
   </div>
   <div class="phb row" style="margin-top:8px">
     <button type="button" class="btn ghost" id="fw_clear" ${F?"hidden":""}>Borrar y volver a firmar</button>
     <button type="button" class="btn primary" id="fw_save" ${F?"hidden":""}>Guardar firma</button>
     <label class="btn ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Subir imagen de mi firma<input type="file" accept="image/*" id="fw_file" hidden></label>
     <button type="button" class="btn link" id="fw_del" ${F?"":"hidden"}>Quitar firma</button>
   </div>
   <div id="fw_m" class="help"></div></div>`}
function wireFirma(){const g=id=>document.getElementById(id);const cv=g("fw_canvas");if(!cv)return;
  const pad=g("fw_pad"),pv=g("fw_pv"),msg=g("fw_m");let drew=false,drawing=false,ctx;
  const setup=()=>{const r=pad.getBoundingClientRect();const w=Math.max(220,Math.floor(r.width||pad.clientWidth||300)),h=150;const dpr=window.devicePixelRatio||1;
    cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#15223a"};
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  const start=e=>{e.preventDefault();drawing=true;drew=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
  const end=()=>{drawing=false};
  if(!pad.hidden)setup();
  cv.addEventListener("pointerdown",start);cv.addEventListener("pointermove",move);window.addEventListener("pointerup",end);
  cv.addEventListener("touchstart",start,{passive:false});cv.addEventListener("touchmove",move,{passive:false});cv.addEventListener("touchend",end);
  const showPad=()=>{pad.hidden=false;pv.hidden=true;g("fw_clear").hidden=false;g("fw_save").hidden=false;g("fw_del").hidden=true;pv.innerHTML="";drew=false;setup();ctx.clearRect(0,0,cv.width,cv.height)};
  const showSaved=F=>{pad.hidden=true;pv.hidden=false;pv.innerHTML=`<img src="${F}" alt="Firma guardada">`;g("fw_clear").hidden=true;g("fw_save").hidden=true;g("fw_del").hidden=false};
  g("fw_clear").onclick=()=>{drew=false;setup();ctx.clearRect(0,0,cv.width,cv.height);msg.textContent=""};
  g("fw_save").onclick=()=>{if(!drew){msg.textContent="Dibuje su firma antes de guardar.";return}
    const u=firmaTrim(cv);const ok=firmaSet(u);msg.innerHTML=ok?"Firma guardada.":"<b>Ojo:</b> no cupo en la memoria del navegador; se usará mientras no cierre esta página.";showSaved(u)};
  g("fw_del").onclick=()=>{firmaSet(null);msg.textContent="";showPad()};
  g("fw_file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const im=await imgLoad(rd.result);const u=firmaFromImg(im);const ok=firmaSet(u);msg.innerHTML=ok?"Firma cargada.":"<b>Ojo:</b> la imagen es grande y no cupo en memoria; se usará mientras no cierre esta página.";showSaved(u)}catch(err){msg.textContent="No se pudo leer la imagen. Use un JPG o PNG."}};rd.readAsDataURL(f)};
  window.addEventListener("resize",()=>{if(!pad.hidden&&!drew)setup()})}
function firmaTrim(cv){const w=cv.width,h=cv.height,ctx=cv.getContext("2d");const d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0,any=false;for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>10){any=true;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(!any)return cv.toDataURL("image/png");const pad=8;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w,x1+pad);y1=Math.min(h,y1+pad);
  const o=document.createElement("canvas");o.width=x1-x0;o.height=y1-y0;o.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,x1-x0,y1-y0);return o.toDataURL("image/png")}
function firmaFromImg(im){const maxW=600;const sc=Math.min(1,maxW/im.width);const o=document.createElement("canvas");o.width=Math.round(im.width*sc);o.height=Math.round(im.height*sc);
  o.getContext("2d").drawImage(im,0,0,o.width,o.height);return o.toDataURL("image/png")}

    let my=y-6;for(let r=0;r<nrows;r++){const colw=W0/2;for(let i=0;i<2;i++){const p=pairs[r*2+i];if(!p)continue;const cx=M+8+i*colw;pg.drawText(p[0].toUpperCase(),{x:cx,y:my-8,size:7,font:HELV,color:gray});pg.drawText(clean(p[1]).slice(0,42),{x:cx,y:my-18,size:10.5,font:HELVB,color:ink})}my-=20}y-=mh+16;

async function rcPDF(btn){const t=btn.textContent;btn.disabled=true;btn.textContent="Preparando…";
  try{await fonts();let doc=await PDFLib.PDFDocument.create();
    if(RC.dosHoja){const PW=440,PH=1400,M=26;const r=await rcDibujar(doc,PW,PH,M);
      const top=PH,bot=Math.max(0,r.y-16);const out=await PDFLib.PDFDocument.create();const hoja=out.addPage([792,612]);
      const tmp=await PDFLib.PDFDocument.load(await doc.save());const emb=await out.embedPage(tmp.getPage(0),{left:0,bottom:bot,right:PW,top:top});
      const hw=396,pad=16;const sc=Math.min((hw-pad*2)/PW,(612-pad*2)/(top-bot));const w=PW*sc,h=(top-bot)*sc;
      for(const ox of [0,hw])hoja.drawPage(emb,{x:ox+(hw-w)/2,y:612-pad-h,width:w,height:h});
      for(let yy=10;yy<602;yy+=10)hoja.drawLine({start:{x:hw,y:yy},end:{x:hw,y:yy+5},thickness:0.6,color:PDFLib.rgb(0.6,0.6,0.6)});
      doc=out}
    else await rcDibujar(doc,612,792,50);
    const bytes=await doc.save();const blob=new Blob([bytes],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=RC.dosHoja?rcFile("pdf").replace(/\.pdf$/," (2 por hoja).pdf"):rcFile("pdf");document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  catch(e){alert("No se pudo generar el PDF: "+(e.message||e))}

async function asLineasPDF(file){const P=await pdfjs();const pdf=await P.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const it=tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({s:t.str,x:t.transform[4],y:t.transform[5]}));

async function asLeerPDF(file){const L=(await asLineasPDF(file)).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);const r={alumnos:[]};

async function extraerPDF(file){const L=await pdfjs();const buf=await file.arrayBuffer();const pdf=await L.getDocument({data:new Uint8Array(buf)}).promise;
  const out=[];for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    let last=null,line=[];const lines=[];tc.items.forEach(t=>{const y=t.transform[5];if(last!==null&&Math.abs(y-last)>3){lines.push(line.join(" "));line=[]}line.push(t.str);last=y});if(line.length)lines.push(line.join(" "));
    out.push(lines.join("\n"))}
  return out.join("\n").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}

function curpDatos(curp){curp=(curp||"").toUpperCase();if(!AL_CURP_RE.test(curp))return{fecha:"",sexo:""};
  const yy=+curp.slice(4,6),mm=+curp.slice(6,8),dd=+curp.slice(8,10);const h=curp[10];
  const sexo=h==="H"?"Hombre":h==="M"?"Mujer":"";
  const esNuevoSiglo=/[A-Z]/.test(curp[16]);let anio=(esNuevoSiglo?2000:1900)+yy;
  if(mm<1||mm>12||dd<1||dd>31)return{fecha:"",sexo};
  const fecha=`${String(dd).padStart(2,"0")}/${String(mm).padStart(2,"0")}/${anio}`;
  return{fecha,sexo}}
function alLimpiaNombre(s){return (s||"").replace(/[\*\/]+/g," ").replace(/\s{2,}/g," ").replace(/\s+,/g,",").trim()}
function alParteNombre(raw){ // separa en [paterno,materno,nombres] usando * y / como separadores
  let seg=(raw||"").split(/[\*\/]+/).map(x=>x.replace(/\s{2,}/g," ").trim()).filter(Boolean);
  if(seg.length>=3)return[seg[0],seg[1],seg.slice(2).join(" ")];
  if(seg.length===2)return[seg[0],"",seg[1]];
  const t=(raw||"").replace(/\s{2,}/g," ").trim().split(" ").filter(Boolean);
  if(t.length>=3)return[t[0],t[1],t.slice(2).join(" ")];
  if(t.length===2)return[t[0],"",t[1]];
  return["","",t.join(" ")]}
function alParse(texto){const out=[];const seen=new Set();const lines=texto.split("\n");
  lines.forEach((ln,i)=>{const up=ln.toUpperCase();const m=up.match(AL_CURP_RE);if(!m)return;
    const curp=m[0];if(seen.has(curp))return;seen.add(curp);
    // nombre: la línea sin la CURP, sin fechas, sin números sueltos, sin palabras de sexo
    let resto=ln.replace(new RegExp(curp,"i")," ");
    resto=resto.replace(/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g," ")    // fechas
               .replace(/\b(HOMBRE|MUJER|FEMENINO|MASCULINO|\d+)\b/gi," ");
    // conservar letras, espacios, acentos, * y /
    let nombreRaw=resto.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ \*\/'.-]/g," ").replace(/\s{2,}/g," ").trim();
    if(!nombreRaw){ // nombre en la línea anterior
      for(let k=i-1;k>=0&&k>=i-2;k--){const prev=lines[k];if(prev&&!AL_CURP_RE.test(prev.toUpperCase())&&/[A-Za-zÑñ]{3,}/.test(prev)){nombreRaw=prev.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ \*\/'.-]/g," ").replace(/\s{2,}/g," ").trim();break}}}
    const {fecha,sexo}=curpDatos(curp);
    nombreRaw=nombreRaw.replace(/\s+[HM]$/,"").trim();  // quita la letra de género (H/M) pegada al nombre
    const partes=alParteNombre(nombreRaw);
    out.push({curp,nombre:alLimpiaNombre(nombreRaw),pat:partes[0],mat:partes[1],nom:partes[2],fnac:fecha,sexo})});
  return out}
async function alExtraer(file){const L=await pdfjs();const buf=await file.arrayBuffer();const pdf=await L.getDocument({data:new Uint8Array(buf)}).promise;
  const out=[];for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    let last=null,line=[];const lines=[];tc.items.forEach(t=>{const y=t.transform[5];if(last!==null&&Math.abs(y-last)>3){lines.push(line.join(" "));line=[]}line.push(t.str);last=y});if(line.length)lines.push(line.join(" "));
    out.push(lines.join("\n"))}
  return out.join("\n")}
function alCols(){const c=[];if(AL.fields.nombre){if(AL.nameMode==="separado"){c.push(["pat","Apellido paterno"],["mat","Apellido materno"],["nom","Nombre(s)"])}else c.push(["nombre","Nombre completo"])}
  if(AL.fields.curp)c.push(["curp","CURP"]);if(AL.fields.fnac)c.push(["fnac","Fecha de nacimiento"]);if(AL.fields.sexo)c.push(["sexo","Sexo"]);return c}

function alRender(){const cols=alCols();const res=document.getElementById("alRes");if(!res)return;
  if(!cols.length){res.innerHTML=`<section class="card"><p class="help">Elija al menos un campo para extraer.</p></section>`;return}
  const head=`<th style="width:34px">#</th>`+cols.map(([k,l])=>`<th>${esc(l)} <button type="button" class="btn link alcopy" data-k="${k}" style="padding:0 4px">copiar</button></th>`).join("");
  const body=AL.rows.map((r,i)=>`<tr data-i="${i}"><td class="alnum">${i+1}</td>`+cols.map(([k])=>`<td contenteditable="true" class="aled" data-k="${k}">${esc(r[k]||"")}</td>`).join("")+`</tr>`).join("");
  res.innerHTML=`<section class="card"><div class="acts"><button class="btn primary act" id="alWord">⬇ Descargar Word</button><button class="btn ghost act" id="alCsv">⬇ Descargar Excel/CSV</button></div>
    <p class="help">Toque una celda para corregirla. El botón «copiar» de cada columna copia esa lista para pegarla en vertical.</p>
    <div style="overflow-x:auto"><table class="altab"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  const g=id=>document.getElementById(id);
  res.querySelectorAll(".aled").forEach(td=>td.addEventListener("input",()=>{const i=+td.closest("tr").dataset.i;AL.rows[i][td.dataset.k]=td.textContent}));
  res.querySelectorAll(".alcopy").forEach(b=>b.onclick=async()=>{const k=b.dataset.k;const vals=AL.rows.map(r=>r[k]||"").join("\n");
    try{await navigator.clipboard.writeText(vals);b.textContent="¡copiado!";setTimeout(()=>b.textContent="copiar",1200)}catch(e){b.textContent="no se pudo";setTimeout(()=>b.textContent="copiar",1200)}});
  g("alWord").onclick=()=>alWord();
  g("alCsv").onclick=()=>alCsv()}
function alWord(){const cols=alCols();if(!cols.length)return;
  const th=cols.map(([k,l])=>`<th style="background:#1f3864;color:#fff;border:1px solid #999;padding:5px 8px;text-align:left">${esc(l)}</th>`).join("");
  const rows=AL.rows.map((r,i)=>`<tr><td style="border:1px solid #999;padding:4px 8px">${i+1}</td>`+cols.map(([k])=>`<td style="border:1px solid #999;padding:4px 8px">${esc(r[k]||"")}</td>`).join("")+`</tr>`).join("");
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Datos de alumnos</title></head><body style="font-family:Arial,sans-serif;font-size:11pt">
   <h3>Datos de alumnos</h3><p style="font-size:10pt;color:#555">${AL.rows.length} registros. Fecha de nacimiento y sexo calculados desde la CURP.</p>
   <table style="border-collapse:collapse;font-size:10.5pt"><thead><tr><th style="background:#1f3864;color:#fff;border:1px solid #999;padding:5px 8px">#</th>${th}</tr></thead><tbody>${rows}</tbody></table></body></html>`;
  const blob=new Blob(["﻿"+html],{type:"application/msword"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`Datos de alumnos (${AL.rows.length}).doc`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function alCsv(){const cols=alCols();if(!cols.length)return;const q=s=>`"${String(s||"").replace(/"/g,'""')}"`;
  const head=["#",...cols.map(c=>c[1])].map(q).join(",");
  const body=AL.rows.map((r,i)=>[i+1,...cols.map(c=>r[c[0]])].map(q).join(",")).join("\n");
  const blob=new Blob(["﻿"+head+"\n"+body],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`Datos de alumnos (${AL.rows.length}).csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

let INSTALAR=null;
const tlmInstalada=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
const tlmIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
