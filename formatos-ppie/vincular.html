<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vincular celular y computadora · Tlamatini</title>
<meta name="theme-color" content="#1F3A6B">
<link rel="icon" href="img/tlamatini-icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--anil:#1F3A6B;--anil-o:#13244A;--terra:#B5532F;--ambar:#E8A33D;--crema:#FBF6EC;--tinta:#22293A;--gris:#5E6678;--verde:#2E9A6A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--tinta);background:var(--crema);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:16px 26px;background:var(--anil);color:var(--crema)}
header img{width:42px;height:42px;border-radius:11px}header b{font-size:18px;display:block}header span{font-size:12px;opacity:.8}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.caja{width:100%;max-width:980px;background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(19,36,74,.12);overflow:hidden}
.dos{display:grid;grid-template-columns:1.05fr .95fr}
.izq{padding:44px 44px 36px}.der{background:linear-gradient(160deg,#1F3A6B,#13244A);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;color:var(--crema);gap:16px}
.eti{font-size:12px;letter-spacing:3px;font-weight:700;color:var(--terra);text-transform:uppercase}
h1{font-size:34px;line-height:1.12;margin:10px 0 14px;color:var(--anil-o)}
p{line-height:1.55;color:var(--gris);margin:0 0 12px}
ol{padding-left:0;list-style:none;margin:22px 0 0;counter-reset:p}
ol li{counter-increment:p;display:flex;gap:14px;margin-bottom:16px;line-height:1.45}
ol li::before{content:counter(p);flex:none;width:30px;height:30px;border-radius:50%;background:var(--crema);color:var(--anil);font-weight:800;display:grid;place-items:center;border:2px solid var(--ambar)}
#qr{background:#fff;padding:18px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}#qr img,#qr canvas{display:block;width:300px!important;height:300px!important}
.cuenta{font-size:13px;opacity:.85}.est{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.p{width:10px;height:10px;border-radius:50%;background:var(--ambar);animation:lat 1.4s infinite}@keyframes lat{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 15px Montserrat,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.prim{background:var(--anil);color:#fff}.amb{background:var(--ambar);color:var(--anil-o)}.sec{background:var(--crema);color:var(--anil);border:1px solid #e5dcc9}
.fila{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.solo{padding:44px;text-align:center;max-width:560px;margin:0 auto}.solo .ico{width:84px;height:84px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;font-size:40px;background:var(--crema)}
.solo .fila{justify-content:center}
.cam{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:16px auto;border-radius:22px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover}.cam .mira{position:absolute;inset:16%;border:4px solid rgba(232,163,61,.95);border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.nota{font-size:12.5px;background:var(--crema);border-radius:12px;padding:12px 14px;color:var(--gris);margin-top:16px;text-align:left}
.err{color:#A23B22;font-weight:600}
footer{display:flex;justify-content:center;padding:14px 18px 20px}footer img{height:44px;opacity:.85}
@media (max-width:820px){.dos{grid-template-columns:1fr}.izq{padding:28px 24px}.der{padding:28px}h1{font-size:26px}#qr img,#qr canvas{width:240px!important;height:240px!important}}
</style>
</head>
<body>
<header><img src="img/tlamatini-icono-192.png" alt=""><div><b>Vincular celular y computadora</b><span>Tlamatini · Tlamatini Aula</span></div></header>
<main><div class="caja" id="caja"></div></main>
<footer><img src="firma-autor.svg" alt="Creado y desarrollado por el Mtro. Carlos Gabriel Ortega Gutiérrez" onerror="this.remove()"></footer>
<script src="vinculo.js?v=2026-11-21a"></script>
<script>
"use strict";
const V = window.TLMVIN, $ = s => document.querySelector(s), caja = $("#caja");
const Q = new URLSearchParams(location.search), APP = Q.get("app") === "aula" ? "aula" : "tlamatini";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const cargarJS = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const volver = () => { const v = Q.get("volver"); try { const u = new URL(v); if (u.origin === location.origin) return u.href; } catch (e) {} return V.APPS[APP]; };
function solo(ico, titulo, texto, botones) {
  caja.innerHTML = `<div class="solo"><div class="ico">${ico}</div><h1>${titulo}</h1><p>${texto}</p><div class="fila">${botones || ""}</div></div>`;
}
const botonesApps = `<a class="btn prim" href="${V.APPS.tlamatini}">Abrir Tlamatini</a><a class="btn amb" href="${V.APPS.aula}">Abrir Tlamatini Aula</a>`;

/* ============ Computadora: muestra el QR y espera al celular ============ */
let tEspera = null, tCuenta = null;
async function pantalla() {
  if (V.activo() && V.rol() === "pantalla") {
    return solo("🔗", "Esta computadora ya está vinculada", "Puede seguir trabajando en las apps. Al terminar, use el botón <b>Desvincular y borrar</b> de arriba a la derecha.", botonesApps);
  }
  if (movil) return escanear();
  caja.innerHTML = `<div class="dos"><div class="izq"><div class="eti">Paso a paso</div><h1>Trabaje aquí con sus datos de su celular</h1>
    <p>Lo que haga en esta computadora se guarda también en su celular, y al revés, mientras estén vinculados.</p>
    <ol><li><span>En su celular abra <b>Tlamatini</b> con su enlace personal.</span></li>
    <li><span>Toque <b>Respaldo</b> → <b>Vincular con una computadora</b> y apunte la cámara a este código.<br><small>También puede escanearlo con la cámara del celular.</small></span></li>
    <li><span>Al terminar, toque <b>Desvincular y borrar</b>: sus datos se borran de esta computadora.</span></li></ol>
    <div class="nota">🔒 Sus datos viajan cifrados: la llave va solo en este código. Si deja de usar la computadora 20 minutos, se desvincula y se borra sola.</div></div>
    <div class="der"><div id="qr"></div><div class="est" id="est"><span class="p"></span><span>Esperando su celular…</span></div><div class="cuenta" id="cuenta"></div></div></div>`;
  let s;
  try { s = await V.crearSala(); }
  catch (e) { $("#est").innerHTML = `<span class="err">${esc(e.message)}</span>`; $("#cuenta").innerHTML = `<button class="btn amb" onclick="location.reload()">Intentar de nuevo</button>`; return; }
  const url = V.PAGINA + "#v=" + s.sala + "." + s.k + (APP === "aula" ? ".a" : "");
  try { await cargarJS("../tlamatini-aula/qrcode.min.js"); new QRCode($("#qr"), { text: url, width: 600, height: 600, colorDark: "#13244A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { $("#qr").innerHTML = `<p class="err" style="width:260px">No se pudo dibujar el código. Revise el internet.</p>`; }
  const vence = Date.now() + 10 * 60000;
  tCuenta = setInterval(() => { const r = Math.max(0, vence - Date.now()); $("#cuenta").textContent = `El código cambia en ${Math.floor(r / 60000)}:${String(Math.floor(r / 1000) % 60).padStart(2, "0")}`; if (!r) { clearInterval(tCuenta); clearTimeout(tEspera); pantalla(); } }, 1000);
  const ciclo = async () => {
    try {
      const r = await V.esperar(s.sala, s.k, q => { $("#est").innerHTML = `<span class="p" style="background:#4CC38A"></span><span>Recibiendo los datos${q ? " de " + esc(q) : ""}…</span>`; });
      if (r.listo) { clearInterval(tCuenta); return listo(r); }
    } catch (e) { if (/venci/.test(e.message)) { clearInterval(tCuenta); return pantalla(); } }
    tEspera = setTimeout(ciclo, 2500);
  };
  ciclo();
}
function listo(r) {
  const destino = V.APPS[r.app === "aula" ? "aula" : APP];
  solo("✅", `¡Listo${r.quien ? ", " + esc(r.quien.split(" ")[0]) : ""}!`, "Sus datos ya están en esta computadora. Abriendo la app…", botonesApps);
  setTimeout(() => location.href = destino, 2500);
}

/* ============ Celular: se une con el código ============ */
async function unirse(sala, k, app) {
  history.replaceState(null, "", location.pathname + location.search);
  if (!V.tokenPersonal()) {
    return solo("🔑", "Abra primero su enlace personal", `En este navegador no está abierto su Tlamatini. Abra Tlamatini con su enlace personal y desde ahí toque <b>Respaldo</b> → <b>Vincular con una computadora</b> para escanear el código.
      <span class="nota" style="display:block">Si instaló Tlamatini en la pantalla de inicio (iPhone), use el lector desde la app y no la cámara del teléfono.</span>`, `<a class="btn prim" href="${V.APPS.tlamatini}">Abrir Tlamatini</a>`);
  }
  const n = V.nombreMaestro();
  solo("💻", "¿Vincular con esta computadora?", `${n ? "<b>" + esc(n) + "</b>, s" : "S"}e abrirán sus datos de Tlamatini en la computadora que muestra el código. Lo que haga allá se guardará también aquí.<br><br>Al terminar toque <b>Desvincular</b>: sus datos se borran de la computadora.`,
    `<button class="btn prim" id="si">Sí, vincular</button><a class="btn sec" href="${volver()}">Cancelar</a>`);
  $("#si").onclick = async () => {
    $("#si").disabled = true; $("#si").textContent = "Vinculando…";
    try { await V.unirse(sala, k, app); solo("✅", "¡Vinculado!", "Su celular y la computadora ya comparten sus datos. Puede revisar desde aquí lo que se haga allá.", `<a class="btn prim" href="${volver()}">Continuar</a>`); setTimeout(() => location.href = volver(), 2500); }
    catch (e) { solo("⚠️", "No se pudo vincular", esc(e.message === "sin-enlace" ? "Abra primero su enlace personal de Tlamatini." : e.message), `<button class="btn amb" onclick="location.reload()">Intentar de nuevo</button><a class="btn sec" href="${volver()}">Volver</a>`); }
  };
}
function leerCodigo(txt) {
  const m = String(txt || "").match(/#v=([A-Za-z0-9_-]{20,40})\.([A-Za-z0-9_-]{40,50})(\.a)?/);
  return m ? { sala: m[1], k: m[2], app: m[3] ? "aula" : "tlamatini" } : null;
}

/* ============ Celular: lector de QR ============ */
let CAM = null;
const camStop = () => { if (CAM) { CAM.vivo = false; (CAM.st.getTracks() || []).forEach(t => t.stop()); CAM = null; } };
async function escanear() {
  if (V.activo() && V.rol() === "dueno") {
    return solo("🔗", "Su celular ya está vinculado", "Para vincularlo con otra computadora, primero desvincule la actual con el botón de arriba a la derecha.", `<a class="btn prim" href="${volver()}">Volver</a>`);
  }
  caja.innerHTML = `<div class="solo"><div class="eti">Vincular con una computadora</div><h1>Apunte al código de la computadora</h1>
    <div class="cam"><video id="vid" playsinline muted></video><div class="mira"></div></div><p id="tx">Preparando la cámara…</p>
    <div class="fila"><a class="btn sec" href="${volver()}">Cancelar</a></div></div>`;
  const tx = $("#tx"), v = $("#vid");
  try { const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); CAM = { st, vivo: true }; v.srcObject = st; await v.play(); }
  catch (e) { tx.innerHTML = `<span class="err">No se pudo usar la cámara.</span> Dé permiso a la cámara en su navegador, o escanee el código con la cámara del teléfono.`; return; }
  let det = null; try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) {}
  if (!det) { try { await cargarJS("../educacion-fisica/supervision/jsQR.js"); } catch (e) { tx.textContent = "Sin internet no se pudo preparar el lector."; return; } }
  tx.textContent = "Apunte la cámara al código que muestra la computadora.";
  const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
  const leer = async () => {
    if (!CAM || !CAM.vivo) return; let txt = null;
    try { if (v.videoWidth) { if (det) { const r = await det.detect(v); txt = r[0] && r[0].rawValue; } else { const w = Math.min(720, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth); c.width = w; c.height = h; x.drawImage(v, 0, 0, w, h); const r = jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" }); txt = r && r.data; } } } catch (e) {}
    if (txt) { const o = leerCodigo(txt); if (o) { navigator.vibrate && navigator.vibrate(60); camStop(); return unirse(o.sala, o.k, o.app); } tx.innerHTML = `<span class="err">Ese código no es de vinculación.</span> Use el que aparece en la computadora.`; }
    setTimeout(leer, 220);
  };
  leer();
}

/* ============ inicio ============ */
(function () {
  const fin = Q.get("fin"), cod = leerCodigo(location.hash);
  if (cod) return unirse(cod.sala, cod.k, cod.app);
  if (fin) return solo("🧹", "Computadora desvinculada", esc(fin) + " Sus datos se borraron de esta computadora; en su celular siguen completos.", `<button class="btn prim" onclick="location.href=location.pathname">Vincular otro celular</button>`);
  if (Q.get("escanear")) return escanear();
  pantalla();
})();
</script>
</body>
</html>
