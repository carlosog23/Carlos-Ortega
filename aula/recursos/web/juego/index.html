<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tlamatini · El camino del saber</title>
<meta name="theme-color" content="#24427A">
<meta name="description" content="Videojuego educativo de Tlamatini para alumnos de primaria, grupos completos y maestros. Funciona sin internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icono-192.png">
<style>
:root{--anil:#24427A;--anil2:#1A3160;--terra:#C2603A;--ambar:#E8A33D;--crema:#FBF6EC;--crema2:#F4E1C1;--tinta:#1E2A40;--mu:#6B7280;--ok:#2E9E5B;--mal:#C0392B;--r:22px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Ubuntu","Nunito","Noto Sans","Segoe UI",system-ui,sans-serif;color:var(--tinta);background:var(--crema);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.fondo{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 85% -10%,#FCE6C4 0%,transparent 60%),radial-gradient(700px 500px at -10% 110%,#E7EEF8 0%,transparent 60%),var(--crema)}
.fondo svg{position:absolute;bottom:0;left:0;width:100%;height:120px;opacity:.12}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header .t{font-weight:800;font-size:20px;color:var(--anil);line-height:1.05}header .t small{display:block;font-size:12px;letter-spacing:.18em;color:var(--terra);font-weight:700}
header .esp{flex:1}
.ico{width:46px;height:46px;border-radius:14px;border:0;background:#fff;box-shadow:0 2px 0 rgba(36,66,122,.15);font-size:22px;display:grid;place-items:center}
.sem{display:flex;align-items:center;gap:6px;background:#fff;border-radius:30px;padding:8px 14px;font-weight:800;color:var(--terra);box-shadow:0 2px 0 rgba(36,66,122,.12)}
main{max-width:1100px;margin:0 auto;padding:6px 18px 30px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:6px 0 6px;color:var(--anil)}
h2{font-size:26px;margin:4px 0 12px;color:var(--anil)}
.sub{color:var(--mu);font-size:17px;margin:0 0 18px}
.btn{border:0;border-radius:18px;padding:16px 24px;font-size:19px;font-weight:800;background:var(--terra);color:#fff;box-shadow:0 5px 0 #8E4126;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8E4126}
.btn.az{background:var(--anil);box-shadow:0 5px 0 #13264A}.btn.az:active{box-shadow:0 2px 0 #13264A}
.btn.bl{background:#fff;color:var(--anil);box-shadow:0 5px 0 #D7CDB8}.btn.bl:active{box-shadow:0 2px 0 #D7CDB8}
.btn.am{background:var(--ambar);color:#3B2A08;box-shadow:0 5px 0 #A87420}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* ---- inicio ---- */
.portada{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center;min-height:calc(100vh - 120px)}
.tlami{width:100%;max-width:330px;display:block;margin:0 auto}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:120px 200px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.orbit{animation:spin 14s linear infinite;transform-origin:120px 112px}@keyframes spin{to{transform:rotate(360deg)}}
.halo{animation:halo 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.modos{display:grid;gap:14px}
.modo{display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:var(--r);padding:18px 20px;background:#fff;box-shadow:0 6px 0 rgba(36,66,122,.14);transition:transform .1s}
.modo:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(36,66,122,.14)}
.modo .e{font-size:46px;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;flex:none}
.modo b{display:block;font-size:22px;color:var(--anil)}.modo span{color:var(--mu);font-size:15px}
/* ---- globo de Tlami ---- */
.dice{display:flex;align-items:flex-end;gap:10px;margin:6px 0 16px}
.dice svg{width:74px;flex:none}
.globo{position:relative;background:#fff;border-radius:20px;padding:12px 16px;font-size:17px;box-shadow:0 3px 0 rgba(36,66,122,.12);max-width:640px}
.globo::before{content:"";position:absolute;left:-10px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}
/* ---- chips y campos ---- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:2px solid #E3D8C3;background:#fff;border-radius:16px;padding:12px 18px;font-size:19px;font-weight:800;color:var(--anil)}
.chip[aria-pressed=true]{background:var(--anil);border-color:var(--anil);color:#fff}
label.l{display:block;font-weight:800;font-size:17px;margin:12px 0 4px;color:var(--anil)}
input.tx{font:inherit;font-size:20px;padding:12px 16px;border-radius:14px;border:2px solid #E3D8C3;width:min(420px,100%);background:#fff}
/* ---- mapa ---- */
.camino{position:relative;display:grid;gap:18px;margin-top:8px;padding:6px 0 20px}
.camino::before{content:"";position:absolute;left:50%;top:30px;bottom:40px;width:8px;margin-left:-4px;background:repeating-linear-gradient(180deg,var(--ambar) 0 18px,transparent 18px 30px);border-radius:4px;opacity:.6}
.est{position:relative;display:flex;align-items:center;gap:16px;width:min(470px,92%);border:0;text-align:left;border-radius:26px;padding:16px 18px;background:#fff;box-shadow:0 6px 0 rgba(36,66,122,.14)}
.est:nth-child(odd){justify-self:start}.est:nth-child(even){justify-self:end}
.est .e{font-size:44px;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;flex:none}
.est b{display:block;font-size:20px;color:var(--anil)}.est small{display:block;color:var(--mu);font-size:14px}
.est .st{font-size:22px;letter-spacing:2px;color:var(--ambar);margin-top:4px}
.est[disabled]{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.est .aqui{position:absolute;right:-14px;top:-18px;width:58px}
.meta{justify-self:center!important;background:linear-gradient(135deg,#FFF4D6,#FCE0B0)!important}
/* ---- juego ---- */
.barra{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.barra .p{flex:1;height:14px;background:#EADFCB;border-radius:9px;overflow:hidden}.barra .p i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pregunta{display:flex;align-items:center;gap:12px;background:var(--anil);color:#fff;border-radius:20px;padding:14px 18px;margin-bottom:12px}
.pregunta b{flex:1;font-size:clamp(22px,3.6vw,34px);line-height:1.15}
.pregunta .ico{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.campo{position:relative;height:min(58vh,520px);border-radius:26px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(36,66,122,.12)}
.campo.valle{background:linear-gradient(#BFE3F7 0 55%,#9BCB6A 55% 100%)}
.campo.valle::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(80,120,40,.25) 46px 52px)}
.campo.mar{background:linear-gradient(#7DC4E8,#2D7FB8 60%,#1F5E8C)}
.campo.mar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 60px,rgba(255,255,255,.07) 60px 64px)}
.obj{position:absolute;z-index:2;border:0;background:#fff;border-radius:22px;padding:10px 16px;font-size:clamp(20px,3vw,28px);font-weight:800;color:var(--tinta);box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;white-space:nowrap;will-change:transform}
.obj .em{font-size:34px}
.obj.pez .em{display:inline-block;transform:scaleX(-1)}
.obj.mal{background:#FBE4E1;color:var(--mal);animation:temb .3s}
.obj.bien{background:#DDF1E6;color:var(--ok);transform:scale(1.15)!important}
@keyframes temb{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
.aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:#fff;border-radius:20px;padding:14px 22px;font-size:22px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center}
/* puertas */
.puertas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;perspective:900px}
.puerta{position:relative;border:0;background:transparent;padding:0;min-height:260px}
.puerta .marco{position:absolute;inset:0;border-radius:110px 110px 18px 18px;background:#8E6B4A;box-shadow:inset 0 0 0 10px #6F4F33}
.puerta .tras{position:absolute;inset:14px;border-radius:96px 96px 10px 10px;background:#FFF6E2;display:grid;place-items:center;font-size:60px}
.puerta .hoja{position:absolute;inset:14px;border-radius:96px 96px 10px 10px;background:linear-gradient(90deg,#C98B57,#B5773F);transform-origin:left center;transition:transform .6s;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;font-size:clamp(16px,2.2vw,22px);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 0 0 4px rgba(0,0,0,.08)}
.puerta .hoja::after{content:"";position:absolute;right:16px;top:55%;width:12px;height:12px;border-radius:50%;background:var(--ambar)}
.puerta.abierta .hoja{transform:rotateY(-105deg)}
.puerta.abierta .hoja{color:transparent;text-shadow:none}
.puerta .lbl{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-weight:800;color:var(--anil);font-size:18px}
.puertas{margin-bottom:40px}
/* memoria */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.carta{position:relative;aspect-ratio:1/1;border:0;padding:0;background:transparent;perspective:600px}
.carta .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.carta.vuelta .in,.carta.par .in{transform:rotateY(180deg)}
.carta .a,.carta .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;font-size:clamp(20px,3.4vw,32px)}
.carta .a{background:linear-gradient(135deg,var(--anil),#33589C);color:var(--ambar);font-size:38px;box-shadow:0 5px 0 #13264A}
.carta .b{background:#fff;color:var(--anil);transform:rotateY(180deg);box-shadow:0 5px 0 #D7CDB8}
.carta.par .b{background:#DDF1E6;color:var(--ok)}
/* lectura y opciones */
.texto{background:#fff;border-radius:20px;padding:18px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.55;box-shadow:0 4px 0 rgba(36,66,122,.1);margin-bottom:14px}
.texto b{display:block;color:var(--terra);font-size:1.1em;margin-bottom:4px}
.ops{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.op{border:3px solid #E3D8C3;background:#fff;border-radius:18px;padding:16px;font-size:clamp(18px,2.4vw,22px);font-weight:700;text-align:left;color:var(--tinta)}
.op .l{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--crema2);color:var(--anil);font-weight:800;margin-right:10px}
.op.bien{border-color:var(--ok);background:#DDF1E6}.op.mal{border-color:var(--mal);background:#FBE4E1}
.op:disabled{cursor:default}
.nivel{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--crema2);color:var(--terra);margin-bottom:6px}
/* resultado */
.res{text-align:center;background:#fff;border-radius:28px;padding:26px;box-shadow:0 8px 0 rgba(36,66,122,.12);max-width:620px;margin:10px auto}
.res .estrellas{font-size:64px;letter-spacing:8px;color:var(--ambar)}
.res .estrellas .off{color:#E5DCCB}
.res h2{font-size:34px}
/* duelo */
.marcador{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.eq{border-radius:18px;padding:10px 14px;color:#fff;display:flex;align-items:center;gap:10px;opacity:.6;transition:opacity .2s,transform .2s}
.eq.turno{opacity:1;transform:scale(1.04);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ambar)}
.eq .e{font-size:34px}.eq b{display:block;font-size:17px}.eq span{font-size:26px;font-weight:800}
.reloj{height:16px;border-radius:9px;background:#EADFCB;overflow:hidden;margin:6px 0 12px}.reloj i{display:block;height:100%;background:var(--ambar);transition:width 1s linear}
.duelo .op{font-size:clamp(20px,3vw,30px);padding:22px}
.podio{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:20px 0}
.podio div{border-radius:18px 18px 0 0;color:#fff;text-align:center;padding:12px;width:150px}
.podio .e{font-size:46px}.podio b{display:block}.podio span{font-size:30px;font-weight:800}
/* maestro */
.vidas{font-size:26px;letter-spacing:3px}
.plan{white-space:pre-line;font-size:clamp(18px,2.3vw,22px);line-height:1.5}
.expl{margin-top:14px;padding:16px 18px;border-radius:18px;background:#FFF8EC;border:2px solid #F3D9B1;font-size:17px;line-height:1.5}
.expl small{display:block;margin-top:8px;color:var(--mu);font-size:14px}
/* diploma */
.diploma{position:relative;background:#fff;border-radius:16px;padding:40px 36px;text-align:center;border:10px double var(--ambar);max-width:900px;margin:0 auto}
.diploma h1{font-size:46px;margin:6px 0}.diploma .nom{font-size:40px;font-weight:800;color:var(--terra);border-bottom:2px solid #E3D8C3;display:inline-block;padding:0 20px 4px;margin:10px 0}
.diploma .firma{display:flex;justify-content:center;gap:60px;margin-top:30px;flex-wrap:wrap}
.diploma .firma div{min-width:220px;border-top:2px solid var(--tinta);padding-top:6px;font-size:14px}
.pie{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px;opacity:.85}
.pie span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}.pie img{width:160px}
.confeti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
[hidden]{display:none!important}
@media(max-width:760px){.portada{grid-template-columns:1fr;min-height:0}.tlami{max-width:200px}.puertas{gap:8px}.puerta{min-height:200px}.memo{grid-template-columns:repeat(3,1fr)}.camino::before{left:30px}.est{justify-self:stretch!important;width:100%}}
@media print{header,.no-imp,.pie{display:none!important}body{background:#fff}main{padding:0}.diploma{border-width:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 <button class="ico" id="bCasa" aria-label="Inicio" hidden>🏠</button>

<script>
"use strict";
/* © 2026 Mtro. Carlos Gabriel Ortega Gutiérrez · Tlamatini · El camino del saber */
const $ = s => document.querySelector(s), app = $("#app");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const baraja = L => { L = L.slice(); for (let i = L.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [L[i], L[j]] = [L[j], L[i]]; } return L; };
const espera = ms => new Promise(r => setTimeout(r, ms));
const guarda = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lee = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const TLAMI = (w = 74) => `<svg viewBox="0 0 240 250" width="${w}" aria-hidden="true"><use href="#tlami"/></svg>`;
let GEN = 0; const nueva = () => ++GEN;
const FIRMA = `<div class="pie"><span>Desarrollado por</span><img src="firma-autor.svg" alt="Maestro Carlos Ortega"></div>`;

/* ---------------- sonido y voz ---------------- */
let sonido = lee("tlj-son", true), AC = null;
function tono(f, d = .12, tipo = "sine", v = .14) { if (!sonido) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }
const SND = { ok() { tono(660, .1); setTimeout(() => tono(990, .16), 90); }, mal() { tono(180, .25, "square", .06); }, gana() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tono(f, .2), i * 130)); }, tic() { tono(1200, .03, "sine", .05); } };
function leer(t) { try { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/[×]/g, " por ").replace(/[÷]/g, " entre ").replace(/−/g, " menos ")); u.lang = "es-MX"; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} }
$("#bSon").onclick = () => { sonido = !sonido; guarda("tlj-son", sonido); $("#bSon").textContent = sonido ? "🔊" : "🔇"; };
$("#bSon").textContent = sonido ? "🔊" : "🔇";
$("#bCasa").onclick = () => inicio();

/* ---------------- cargar los bancos (sirven en GitHub y en Aula Zona 050) ---------------- */
function cargar(src) { return new Promise(r => { const s = document.createElement("script"); s.src = src; s.onload = () => r(true); s.onerror = () => { s.remove(); r(false); }; document.head.appendChild(s); }); }
async function primero(rutas) { for (const u of rutas) if (await cargar(u)) return true; return false; }
const LISTO = (async () => {
  await primero(["trivia.js"]);
  await primero(["../retos/banco.js", "../aula/recursos/web/retos/banco.js"]);
  await primero(["../retos/lecturas.js", "../aula/recursos/web/retos/lecturas.js"]);
})();
let MAESTROS = null;
async function bancoMaestros() {

    const v = await new Promise(fin => app.querySelectorAll(".op").forEach(b => b.onclick = () => {
      app.querySelectorAll(".op").forEach(z => z.disabled = true); const bien = b.dataset.o === o[0];
      b.classList.add(bien ? "bien" : "mal"); if (!bien) app.querySelectorAll(".op").forEach(z => { if (z.dataset.o === o[0]) z.classList.add("bien"); });
      bien ? SND.ok() : SND.mal(); setTimeout(() => fin(bien), bien ? 900 : 1900);
    }));
    if (g0 !== GEN) return null;
    if (v) ok++;
  }
  return { ok, est: ok === n ? 3 : ok >= n - 1 ? 2 : ok >= 2 ? 1 : 0, texto: `Leíste «${esc(x.t)}» y contestaste bien <b>${ok} de ${n}</b>.` };
}

/* ---- reconocimiento ---- */

/* =================================================================
   DUELO EN EL SALÓN (equipos)
   ================================================================= */
const EQUIPOS = [{ n: "Águilas", e: "🦅", c: "#C2603A" }, { n: "Jaguares", e: "🐆", c: "#24427A" }, { n: "Coyotes", e: "🐺", c: "#7A5C2E" }, { n: "Ballenas", e: "🐋", c: "#1F7A8C" }];
function dueloInicio() {
  nueva();
  $("#bCasa").hidden = false; let cfg = { eq: 2, g: 3, r: 5 };
  const pinta = () => {
    app.innerHTML = `<div class="dice">${TLAMI()}<div class="globo">¡Duelo en el salón! Formen equipos. En cada turno un equipo contesta; si acierta rápido gana más puntos. El maestro toca la respuesta que diga el equipo.</div></div>
     <label class="l">¿Cuántos equipos?</label><div class="chips">${[2, 3, 4].map(k => `<button class="chip" data-eq="${k}" aria-pressed="${cfg.eq === k}">${k} equipos</button>`).join("")}</div>
     <div class="fila" style="margin:-4px 0 10px">${EQUIPOS.slice(0, cfg.eq).map(t => `<span style="background:${t.c};color:#fff;border-radius:14px;padding:8px 14px;font-weight:800">${t.e} ${t.n}</span>`).join("")}</div>
     <label class="l">Grado</label><div class="chips">${[1, 2, 3, 4, 5, 6].map(k => `<button class="chip" data-g="${k}" aria-pressed="${cfg.g === k}">${k}.°</button>`).join("")}</div>
     <label class="l">Preguntas por equipo</label><div class="chips">${[3, 5, 7].map(k => `<button class="chip" data-r="${k}" aria-pressed="${cfg.r === k}">${k}</button>`).join("")}</div>
     <div class="fila"><button class="btn" id="bJugar">¡A jugar!</button><button class="btn bl" id="bFull">⛶ Pantalla completa</button></div>`;
    app.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => { cfg.eq = +b.dataset.eq; pinta(); });
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { cfg.g = +b.dataset.g; pinta(); });
    app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { cfg.r = +b.dataset.r; pinta(); });
    $("#bFull").onclick = () => { try { document.documentElement.requestFullscreen(); } catch (e) {} };
    $("#bJugar").onclick = () => duelo(cfg);
  };
  pinta();
}
async function duelo(cfg) {
  await LISTO;
  const T = EQUIPOS.slice(0, cfg.eq).map(t => Object.assign({ p: 0 }, t)), total = cfg.eq * cfg.r, g0 = nueva();
  const gens = [mate, trivia, ortografia], banco = []; const vistos = new Set();
  for (let k = 0; banco.length < total && k < total * 20; k++) { const q = gens[banco.length % 3](cfg.g), k2 = q.q + "|" + q.c; if (!vistos.has(k2)) { vistos.add(k2); banco.push(q); } }
  for (let i = 0; i < total; i++) {
    const t = i % cfg.eq, p = banco[i], ops = p.ops.slice(0, 4); if (!ops.includes(p.c)) ops[0] = p.c;
    const marc = () => `<div class="marcador">${T.map((x, k) => `<div class="eq ${k === t ? "turno" : ""}" style="background:${x.c}"><span class="e">${x.e}</span><span><b>${x.n}</b><span>${x.p}</span></span></div>`).join("")}</div>`;
    app.innerHTML = `${marc()}<p style="margin:0;font-weight:800;color:var(--terra)">Turno de ${T[t].e} ${T[t].n} · pregunta ${Math.floor(i / cfg.eq) + 1} de ${cfg.r}</p>
     <div class="reloj"><i id="rl" style="width:100%"></i></div>
     <div class="pregunta"><b>${esc(p.q)}</b><button class="ico" id="bLeer" aria-label="Escuchar">🔈</button></div>
     <div class="ops duelo">${baraja(ops).map((o, k) => `<button class="op" data-o="${esc(o)}"><span class="l">${"ABCD"[k]}</span>${esc(o)}</button>`).join("")}</div>
     <div class="fila" style="margin-top:14px"><button class="btn am" id="bSig" hidden>Siguiente turno ➜</button></div>`;
    atarLeer(p.q);
    const LIM = 25; let quedan = LIM; requestAnimationFrame(() => { $("#rl").style.width = "100%"; });
    await new Promise(fin => {
      let hecho = false;
      const tick = setInterval(() => { quedan--; const r = $("#rl"); if (r) r.style.width = (100 * quedan / LIM) + "%"; if (quedan <= 5 && quedan > 0) SND.tic(); if (quedan <= 0) resolver(null); }, 1000);
      function resolver(b) {
        if (hecho) return; hecho = true; clearInterval(tick);
        app.querySelectorAll(".op").forEach(z => { z.disabled = true; if (z.dataset.o === p.c) z.classList.add("bien"); });
        if (b && b.dataset.o === p.c) { const pts = 100 + quedan * 4; T[t].p += pts; SND.ok(); b.insertAdjacentHTML("beforeend", ` <b style="color:var(--ok)">+${pts}</b>`); }
        else { if (b) b.classList.add("mal"); SND.mal(); }
        app.querySelector(".marcador").outerHTML = marc();
        $("#bSig").hidden = false; $("#bSig").textContent = i === total - 1 ? "Ver resultados 🏆" : "Siguiente turno ➜"; $("#bSig").onclick = fin;
      }
      app.querySelectorAll(".op").forEach(b => b.onclick = () => resolver(b));
      const vig = setInterval(() => { if (g0 !== GEN) { clearInterval(vig); clearInterval(tick); } }, 500);
    });
    if (g0 !== GEN) return;
  }
  const O = T.slice().sort((a, b) => b.p - a.p), alto = [170, 120, 90, 70], orden = O.length >= 3 ? [O[1], O[0], O[2], O[3]].filter(Boolean) : [O[0], O[1]];
  SND.gana(); confeti();
  app.innerHTML = `<h1 style="text-align:center">¡Ganan ${O[0].e} ${O[0].n}!</h1>${O[1] && O[0].p === O[1].p ? `<p class="sub" style="text-align:center">¡Empate en primer lugar!</p>` : ""}
   <div class="podio">${orden.map(x => { const pos = O.indexOf(x); return `<div style="background:${x.c};height:${alto[pos] + 80}px"><span class="e">${x.e}</span><b>${pos + 1}.° ${x.n}</b><span>${x.p}</span></div>`; }).join("")}</div>
   <div class="fila" style="justify-content:center"><button class="btn" id="bOtra">Otra ronda</button><button class="btn bl" id="bIni">Inicio</button></div>`;
  $("#bOtra").onclick = () => duelo(cfg); $("#bIni").onclick = inicio;
}

/* =================================================================
   RETO DEL MAESTRO (USICAMM)
   ================================================================= */
const PERFILES = [["", "Todos"], ["doc", "Docente"], ["dir", "Dirección"], ["sup", "Supervisión"], ["atp", "ATP"]];
async function maestroInicio() {
  nueva();
  $("#bCasa").hidden = false; app.innerHTML = `<div class="dice">${TLAMI()}<div class="globo">Preparando el banco de reactivos…</div></div>`;
  const M = await bancoMaestros();
  if (!M.banco.length) { app.innerHTML = `<div class="dice">${TLAMI()}<div class="globo">El Reto del maestro es para docentes y usa el banco de reactivos de Tlamatini Aula. Ábrelo desde la página en línea del juego (carlosog23.github.io/Carlos-Ortega/tlamatini-juego); después funciona también sin internet.</div></div><button class="btn" id="bV">Volver</button>`; $("#bV").onclick = inicio; return; }
  let cfg = lee("tlj-mcfg", { per: "", area: "" });
  const pinta = () => {
    const n = filtra(M, cfg).length;
    app.innerHTML = `<div class="dice">${TLAMI()}<div class="globo">Maestra, maestro: 10 reactivos al estilo USICAMM, tres vidas ❤️❤️❤️. Después de cada respuesta te explico por qué y en qué documento se fundamenta.</div></div>
     <label class="l">Tu perfil</label><div class="chips">${PERFILES.map(([k, t]) => `<button class="chip" data-p="${k}" aria-pressed="${cfg.per === k}">${t}</button>`).join("")}</div>
     <label class="l">Tema</label><div class="chips">${[["", "Todos los temas"], ...Object.entries(M.areas)].map(([k, t]) => `<button class="chip" data-a="${k}" aria-pressed="${cfg.area === k}" style="font-size:16px">${esc(t)}</button>`).join("")}</div>
     <p class="sub">${n} reactivos disponibles con esa elección.${lee("tlj-mejor-" + cfg.per + "-" + cfg.area, null) != null ? ` Tu mejor marca: <b>${lee("tlj-mejor-" + cfg.per + "-" + cfg.area, 0)} de 10</b>.` : ""}</p>
     <button class="btn az" id="bIniM" ${n < 10 ? "disabled" : ""}>Empezar el reto</button>`;
    app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { cfg.per = b.dataset.p; guarda("tlj-mcfg", cfg); pinta(); });
    app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { cfg.area = b.dataset.a; guarda("tlj-mcfg", cfg); pinta(); });
    $("#bIniM").onclick = () => retoMaestro(M, cfg);
  };
  pinta();
}
const filtra = (M, cfg) => M.banco.filter(x => (!cfg.area || x.a === cfg.area) && (!cfg.per || !x.per || !x.per.length || x.per.includes(cfg.per)));
async function retoMaestro(M, cfg) {
  const R = baraja(filtra(M, cfg)).slice(0, 10), g0 = nueva(); let vidas = 3, ok = 0, i = 0;
  for (; i < R.length && vidas > 0; i++) {
    const x = R[i], orden = baraja(x.o.map((t, k) => k));
    app.innerHTML = `<div class="barra"><span class="vidas">${"❤️".repeat(vidas)}${"🤍".repeat(3 - vidas)}</span><span class="p"><i style="width:${100 * i / R.length}%"></i></span><span style="font-weight:800">${i + 1}/${R.length}</span></div>
     <span class="nivel">${esc(M.areas[x.a] || "")}${M.formatos && M.formatos[x.f] ? " · " + esc(M.formatos[x.f]) : ""}</span>
     <div class="texto plan">${esc(x.p)}</div>
     <div class="ops">${orden.map((k, j) => `<button class="op" data-k="${k}"><span class="l">${"ABC"[j]}</span>${esc(x.o[k])}</button>`).join("")}</div><div id="ex"></div>`;
    await new Promise(fin => app.querySelectorAll(".op").forEach(b => b.onclick = () => {
      app.querySelectorAll(".op").forEach(z => { z.disabled = true; if (+z.dataset.k === x.k) z.classList.add("bien"); });
      const bien = +b.dataset.k === x.k; if (bien) { ok++; SND.ok(); } else { b.classList.add("mal"); vidas--; SND.mal(); }
      $("#ex").innerHTML = `<div class="expl"><b style="color:${bien ? "var(--ok)" : "var(--mal)"}">${bien ? "¡Correcto!" : "No es esa."}</b> ${esc(x.e || "")}${x.fu ? `<small>Fundamento: ${esc(x.fu)}</small>` : ""}</div>
        <div class="fila" style="margin-top:12px"><button class="btn az" id="bC">${vidas > 0 && i < R.length - 1 ? "Siguiente ➜" : "Ver resultado"}</button></div>`;
      $("#bC").onclick = fin; $("#bC").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }));
    if (g0 !== GEN) return;
  }
  const k = "tlj-mejor-" + cfg.per + "-" + cfg.area, mejor = Math.max(lee(k, 0), ok); guarda(k, mejor);
  if (ok >= 8) { SND.gana(); confeti(); }
  app.innerHTML = `<div class="res">${TLAMI(110)}<h2>${vidas > 0 ? "¡Reto completado!" : "Se acabaron las vidas"}</h2>
   <p style="font-size:22px">Acertaste <b>${ok} de ${i}</b> reactivos.</p><p>Tu mejor marca en este tema: <b>${mejor} de 10</b>.</p>
   <p class="sub">${ok >= 8 ? "Excelente dominio. ¡Sigue así!" : ok >= 5 ? "Vas bien: repasa las explicaciones de los que fallaste." : "Cada reactivo que fallas es uno que ya no se te olvidará. ¡Otra vez!"}</p>
   <div class="fila" style="justify-content:center"><button class="btn az" id="bOtra">Otro reto</button><button class="btn bl" id="bTema">Cambiar tema</button></div></div>`;
  $("#bOtra").onclick = () => retoMaestro(M, cfg); $("#bTema").onclick = maestroInicio;
}
