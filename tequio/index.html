}

/* Asignar escuelas a cada ATP (solo Supervisión) */
function formAsignacion() {
  const lista = atps().filter(u => contactoAtp(u));
  const cuerpo = `<p class="peq" style="margin-top:0">Elija el ATP que atiende cada escuela. El avance de cada ATP se calcula con el checklist de sus escuelas.</p>
    <div class="checklist">${directores().map(c => { const a = atpDe(c.cct); return `<div class="chk-fila" style="align-items:center"><div style="flex:1;min-width:0"><b>${esc(c.escuela)}</b><br><span class="ayuda">${esc(c.municipio)}${c.multigrado ? ' · multigrado' : ''}</span></div>
      <select data-asig="${c.cct}" aria-label="ATP de ${esc(c.escuela)}" style="border:1px solid var(--borde);border-radius:8px;padding:6px 8px;background:#fff;max-width:52%"><option value="">Sin ATP</option>${lista.map(u => `<option value="${u.id}" ${a && a.id === u.id ? 'selected' : ''}>${esc(nombreCorto(u.nombre))}</option>`).join('')}</select></div>`; }).join('')}</div>`;
  modal('Escuelas de cada ATP', cuerpo, '<button class="boton sec" id="as-cancelar">Cancelar</button><button class="boton terra" id="as-guardar">Guardar</button>');
  $('#as-cancelar').onclick = cerrarModal;
  $('#as-guardar').onclick = async () => {
    const nuevo = {}; lista.forEach(u => nuevo[u.id] = []);
    $$('[data-asig]').forEach(sel => { if (sel.value) nuevo[sel.value].push(sel.dataset.asig); });
    for (const u of lista) {
      const antes = escuelasDeAtp(u).slice().sort().join(','), ahora_ = nuevo[u.id].slice().sort().join(',');
      const c = contactoAtp(u);
      if (antes === ahora_ && c.cct) continue;
      const r = await accion('guardarContacto', Object.assign({}, c, { cct: nuevo[u.id].join(',') || '-' }), res => poner(S.dir, res.contacto));
      if (!r) return;
    }
    cerrarModal(); pintar(); aviso('Asignación guardada.', 'ok', 2500);
  };
}

/* Cargar las reuniones que ya traen sus acuerdos */
async function cargarSemilla(paquetes) {
  const todas = directores();
  for (const p of paquetes) {
    const d = JSON.parse(JSON.stringify(p));
    d.actividades.forEach(a => { a.escuelas = todas.map(c => c.cct); a.destinatarios = todas.map(c => c.id); a.responsables = [S.yo.id]; });
    const r = await accion('guardarReunion', d, res => recibirReunion(res));
    if (!r) return;
  }
  vista.acuReu = ''; pintar();
  aviso('Acuerdos cargados. Ya puede palomear lo que cada escuela haya cumplido.', 'ok', 5000);
}
function recibirReunion(res) {
  poner(S.reu, res.reunion);
  S.acu = S.acu.filter(x => x.reunionId !== res.reunion.id).concat(res.acuerdos);
  (res.act || []).forEach(a => poner(S.act, a));
}

      actividades: (base && base.actividades || [])
    };
    if (!d.reunion.titulo) return aviso('Escriba el nombre de la reunión.', 'mal');
    if (!d.reunion.fecha) return aviso('Elija la fecha de la reunión.', 'mal');
    if (!d.acuerdos.length) return aviso('Agregue al menos un acuerdo.', 'mal');
    const todas = directores();
    d.actividades.forEach(a => { a.escuelas = a.escuelas || todas.map(c => c.cct); a.destinatarios = a.escuelas.map(c => (escuelaDe(c) || {}).id).filter(Boolean); a.responsables = [S.yo.id]; });

}

/* Importar el código que prepara Claude a partir del PDF de una minuta o checklist */
function importarReunion() {
  modal('Importar acuerdos', `
    <p class="peq" style="margin-top:0">Pegue aquí el <b>código de importación</b> de una reunión (por ejemplo, el que le prepara Claude a partir del PDF del checklist). Antes de guardar podrá revisarlo y corregirlo.</p>
    <div class="campo"><textarea id="i-cod" style="min-height:180px;font-family:ui-monospace,monospace;font-size:13px" placeholder='{"reunion": {...}, "acuerdos": [...]}'></textarea></div>`,
    '<button class="boton sec" id="i-cancelar">Cancelar</button><button class="boton terra" id="i-revisar">Revisar</button>');
  $('#i-cancelar').onclick = cerrarModal;
  $('#i-revisar').onclick = () => {
    let d;
    try { d = JSON.parse($('#i-cod').value.trim().replace(/^```(json)?|```$/g, '')); } catch (e) { return aviso('El código no es válido. Cópielo completo, desde la primera llave { hasta la última }.', 'mal', 7000); }
    if (!d || !d.reunion || !Array.isArray(d.acuerdos)) return aviso('Al código le falta la reunión o la lista de acuerdos.', 'mal');
    const previa = d.reunion.id && S.reu.find(x => x.id === d.reunion.id);
    if (previa && !confirm('«' + previa.titulo + '» ya está en Tequio. ¿Reemplazar su lista de acuerdos con la del código? Los palomeos de los acuerdos que se conserven no se pierden.')) return;
    formReunion(null, d);
  };
}

function mostrarEnlace(u, enlace) {
  const texto = `Hola, ${nombreCorto(u.nombre)}. Este es su enlace personal para entrar a *Tequio*, la agenda de asesoría y seguimiento de la Supervisión Zona 050:\n\n${enlace}\n\nÁbralo en su teléfono y guárdelo; no lo comparta. _${LEMA}_`;
  const tels = telefonos(u.whatsapp), mails = correos(u);
  modal('Enlace de ' + esc(nombreCorto(u.nombre)), `
    <p class="peq" style="margin-top:0">Envíeselo solo a esta persona. Por seguridad, no se vuelve a mostrar; si se pierde, genere otro.</p>
    <div class="enlace-caja" id="e-enlace">${esc(enlace)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="boton sec chico" id="e-copiar">${ico('i-copiar')}Copiar enlace</button>
      ${tels.map(t => `<a class="boton wa chico" target="_blank" rel="noopener" href="${waUrl(t, texto)}">${ico('i-wa')}Enviar por WhatsApp</a>`).join('')}
      ${mails.length ? `<a class="boton sec chico" href="mailto:${mails.join(',')}?subject=${encodeURIComponent('Tequio · Su enlace personal')}&body=${encodeURIComponent(texto.replace(/[*_]/g, ''))}">${ico('i-correo')}Enviar por correo</a>` : ''}
    </div>`, '<button class="boton" id="e-listo">Listo</button>');
  $('#e-copiar').onclick = () => copiar(enlace, 'Enlace copiado');
  $('#e-listo').onclick = cerrarModal;
}
