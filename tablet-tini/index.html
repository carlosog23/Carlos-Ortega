<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Tablet-Tini · Zona 050</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);margin:0;padding:0}
html,body{height:100%}
body{font-family:"Roboto","Droid Sans",Arial,sans-serif;background:#f3f6f8;color:#23313f;font-size:18px;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.flex{display:-webkit-box;display:-webkit-flex;display:flex}
.wrap{-webkit-flex-wrap:wrap;flex-wrap:wrap}
.center{-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.between{-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.grow{-webkit-box-flex:1;-webkit-flex:1;flex:1}
#top{background:#0e5a66;background:-webkit-linear-gradient(left,#0b4a55,#13808e);background:linear-gradient(to right,#0b4a55,#13808e);color:#fff;padding:8px 16px;min-height:62px;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:2}
#top h1{font-size:23px;font-weight:bold;letter-spacing:.3px}
#top .sub{font-size:13px;opacity:.85}
#logoTT{-webkit-flex:none;flex:none;margin:0 12px 0 2px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#reloj{text-align:right;margin-left:10px;line-height:1.1}
#reloj b{font-size:26px;display:block}
#reloj small{font-size:12px;opacity:.85}
#btnBack,#btnHome{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:14px;font-size:18px;font-weight:bold;padding:9px 16px;display:none}
#btnBack{margin-right:10px}#btnHome{margin-left:8px}
#main{padding:16px 18px;max-width:1100px;margin:0 auto;min-height:calc(100% - 130px)}
#foot{font-size:12px;color:#7a8794;padding:8px 8px 12px;text-align:center}
#foot img{width:26px;height:26px;vertical-align:middle;margin-right:6px}
#foot b{color:#0e5a66}
button{font-family:inherit;cursor:pointer}
/* encabezado de pantalla */
.hola{border-radius:22px;padding:16px 22px;margin-bottom:14px;color:#fff;background:#13808e;background:-webkit-linear-gradient(left,#13808e,#2d8bd0);background:linear-gradient(to right,#13808e,#2d8bd0);position:relative;overflow:hidden}
.hola h2{color:#fff;font-size:28px;margin:0}
.hola p{font-size:16px;opacity:.92;margin-top:2px}
.hola .burbuja{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
h2{font-size:24px;margin:4px 0 14px;color:#0e5a66}
/* mosaicos */
.tiles{margin:-8px}
.tile{width:calc(33.333% - 16px);margin:8px;border:0;border-radius:22px;color:#fff;padding:14px 10px 12px;min-height:128px;font-size:21px;font-weight:bold;box-shadow:0 5px 0 rgba(0,0,0,.16),0 8px 16px rgba(0,0,0,.10);position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.18);-webkit-animation:entra .45s ease-out both;animation:entra .45s ease-out both}
.tile:active{-webkit-transform:translateY(4px) scale(.98);transform:translateY(4px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.tile svg{display:block;margin:0 auto 6px;width:52px;height:52px}
.tile .num{display:block;font-size:52px;line-height:56px;font-weight:900}
.tile small{display:block;font-size:13.5px;font-weight:normal;opacity:.95;margin-top:3px}
.tile .estrellas{position:absolute;top:8px;right:12px;font-size:14px;background:rgba(255,255,255,.22);border-radius:12px;padding:2px 8px}
.tile:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);right:-40px;bottom:-50px}
.tile.cuatro{width:calc(25% - 16px);min-height:118px}
.g1{background:#e5533d;background:-webkit-linear-gradient(top,#f26b4f,#d9412d);background:linear-gradient(#f26b4f,#d9412d)}
.g2{background:#f0932b;background:-webkit-linear-gradient(top,#f7a541,#e5821a);background:linear-gradient(#f7a541,#e5821a)}
.g3{background:#d4a017;background:-webkit-linear-gradient(top,#e3b52a,#c8920c);background:linear-gradient(#e3b52a,#c8920c)}
.g4{background:#3aa655;background:-webkit-linear-gradient(top,#4cba67,#2c9447);background:linear-gradient(#4cba67,#2c9447)}
.g5{background:#2d8bd0;background:-webkit-linear-gradient(top,#3f9fe3,#2276bb);background:linear-gradient(#3f9fe3,#2276bb)}
.g6{background:#7a55c4;background:-webkit-linear-gradient(top,#8d69d6,#6744b0);background:linear-gradient(#8d69d6,#6744b0)}
.cMat{background:#2d8bd0;background:-webkit-linear-gradient(top,#3f9fe3,#2276bb);background:linear-gradient(#3f9fe3,#2276bb)}
.cLec{background:#e5533d;background:-webkit-linear-gradient(top,#f26b4f,#d9412d);background:linear-gradient(#f26b4f,#d9412d)}
.cMem{background:#0f8f8f;background:-webkit-linear-gradient(top,#17a3a3,#0b7a7a);background:linear-gradient(#17a3a3,#0b7a7a)}
.cPal{background:#c2477a;background:-webkit-linear-gradient(top,#d4598c,#ac3667);background:linear-gradient(#d4598c,#ac3667)}
.cRel{background:#7a55c4;background:-webkit-linear-gradient(top,#8d69d6,#6744b0);background:linear-gradient(#8d69d6,#6744b0)}
.cDib{background:#f0932b;background:-webkit-linear-gradient(top,#f7a541,#e5821a);background:linear-gradient(#f7a541,#e5821a)}
.cOrt{background:#3aa655;background:-webkit-linear-gradient(top,#4cba67,#2c9447);background:linear-gradient(#4cba67,#2c9447)}
.cCie{background:#1f6fb2;background:-webkit-linear-gradient(top,#2f86cc,#185c97);background:linear-gradient(#2f86cc,#185c97)}
.cBC{background:#0e7c86;background:-webkit-linear-gradient(top,#14969f,#0a6670);background:linear-gradient(#14969f,#0a6670)}
.cHis{background:#a33a3a;background:-webkit-linear-gradient(top,#bf4a4a,#8c2d2d);background:linear-gradient(#bf4a4a,#8c2d2d)}
.cIng{background:#d4a017;background:-webkit-linear-gradient(top,#e3b52a,#c8920c);background:linear-gradient(#e3b52a,#c8920c)}
.cTab{background:#5b6abf;background:-webkit-linear-gradient(top,#6d7ccf,#4a58a8);background:linear-gradient(#6d7ccf,#4a58a8)}
.seccion{font-size:15px;font-weight:bold;color:#7a8794;letter-spacing:1.5px;text-transform:uppercase;margin:16px 4px 4px}
/* tarjetas y juegos */
.card{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 3px 12px rgba(16,60,80,.10);margin-bottom:14px;-webkit-animation:entra .35s ease-out both;animation:entra .35s ease-out both}
.q{font-size:34px;font-weight:bold;text-align:center;margin:8px 0 16px;line-height:1.3;color:#1d3a50}
.q.txt{font-size:27px}
.opts{margin:-7px}
.opt{width:calc(50% - 14px);margin:7px;border:3px solid #d9e2ea;background:#fff;border-radius:18px;font-size:28px;font-weight:bold;padding:14px 8px;color:#23313f;min-height:74px;box-shadow:0 3px 0 #d9e2ea}
.opt:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.opt.ok{background:#3aa655;border-color:#3aa655;color:#fff;box-shadow:0 3px 0 #2c8a45;-webkit-animation:salta .4s;animation:salta .4s}
.opt.bad{background:#e5533d;border-color:#e5533d;color:#fff;box-shadow:0 3px 0 #b8402e;-webkit-animation:tiembla .4s;animation:tiembla .4s}
.opt.small{font-size:21px}
.bar{height:16px;background:#e3e9ef;border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:#3aa655;background:-webkit-linear-gradient(left,#4cba67,#13808e);background:linear-gradient(to right,#4cba67,#13808e);width:0;-webkit-transition:width .3s;transition:width .3s;border-radius:8px}
.stars{font-size:64px;color:#f5b301;text-align:center;letter-spacing:8px;text-shadow:0 3px 0 rgba(0,0,0,.08)}
.stars span{display:inline-block;-webkit-animation:estrella .6s both;animation:estrella .6s both}
.big{font-size:28px;text-align:center;margin:10px 0}
.btn{border:0;border-radius:16px;background:#13808e;color:#fff;font-size:22px;padding:14px 24px;margin:6px;font-weight:bold;box-shadow:0 4px 0 #0b5560}
.btn:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #0b5560}
.btn.alt{background:#e3e9ef;color:#23313f;box-shadow:0 4px 0 #c5d0da}
.dots{font-size:40px;color:#e5533d;letter-spacing:6px;line-height:1.2}
.read{font-size:22px;line-height:1.6}
.read p{margin-bottom:10px}
.read h3{font-size:26px;color:#e5533d;margin-bottom:8px}
.list button{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:16px;padding:16px 18px;font-size:22px;margin-bottom:10px;box-shadow:0 3px 10px rgba(16,60,80,.10);color:#23313f;border-left:8px solid #e5533d}
.list button small{display:block;font-size:15px;color:#7a8794}
.memo{margin:-5px}
.mc{width:calc(25% - 10px);margin:5px;height:90px;border:0;border-radius:16px;background:#0f8f8f;background:-webkit-linear-gradient(top,#17a3a3,#0b7a7a);background:linear-gradient(#17a3a3,#0b7a7a);color:transparent;font-size:24px;font-weight:bold;box-shadow:0 4px 0 #086060}
.mc.open{background:#fff;color:#23313f;border:3px solid #0f8f8f;box-shadow:none}
.mc.done{background:#dff3e4;color:#2a7a40;border:3px solid #3aa655;box-shadow:none}
.word{font-size:40px;letter-spacing:10px;text-align:center;font-weight:bold;margin:14px 0;color:#1d3a50}
.keys{margin:-4px}
.key{width:calc(11.111% - 8px);margin:4px;height:56px;border:0;border-radius:12px;background:#e3e9ef;font-size:24px;font-weight:bold;color:#23313f;box-shadow:0 3px 0 #c5d0da}
.key.used{opacity:.3}
.key.hit{background:#3aa655;color:#fff;opacity:1;box-shadow:0 3px 0 #2c8a45}
.balloons{font-size:22px;text-align:center;color:#c2477a;margin-bottom:6px}
.palette button{width:46px;height:46px;border-radius:23px;border:3px solid #fff;margin:4px;box-shadow:0 0 0 2px #ccd}
.palette button.sel{box-shadow:0 0 0 4px #23313f}
#pad{background:#fff;border-radius:16px;display:block;width:100%;touch-action:none;box-shadow:0 3px 12px rgba(16,60,80,.10)}
.pin{font-size:40px;letter-spacing:14px;text-align:center;height:56px}
.numpad{max-width:360px;margin:0 auto}
.numpad button{width:calc(33.333% - 12px);margin:6px;height:64px;font-size:28px;border:0;border-radius:16px;background:#e3e9ef;font-weight:bold;color:#23313f;box-shadow:0 3px 0 #c5d0da}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{border-bottom:1px solid #e3e9ef;padding:8px 6px;text-align:center}
th{color:#0e5a66}
input[type=text]{font-size:20px;padding:10px;border:2px solid #d9e2ea;border-radius:12px;width:100%}
.msg{text-align:center;font-size:24px;font-weight:bold;min-height:34px;margin-top:8px}
.msg.ok{color:#3aa655}.msg.bad{color:#e5533d}

/* ajedrez */
.cAj{background:#6b4a33;background:-webkit-linear-gradient(top,#80593d,#553926);background:linear-gradient(#80593d,#553926)}
.aj{-webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start}
.tab{-webkit-flex:none;flex:none;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;border:6px solid #5a3c27;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-right:16px;overflow:hidden}
.cas{width:12.5%;height:12.5%;position:relative}
.cas svg{position:absolute;left:6%;top:4%;width:88%;height:88%}
.cla{background:#f0dcb4}.osc{background:#b5855a}
.cas.sel{background:#f4d35e!important}
.cas.ult{box-shadow:inset 0 0 0 999px rgba(255,214,0,.30)}
.cas.jaque{background:#e5533d!important}
.punto{position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:rgba(14,90,102,.55)}
.come{position:absolute;left:4%;top:4%;right:4%;bottom:4%;border-radius:50%;border:5px solid rgba(14,90,102,.55)}
.cr,.cf{position:absolute;font-size:11px;color:rgba(60,40,20,.75);font-weight:bold}
.cr{left:3px;top:2px}.cf{right:4px;bottom:1px}
.lado{min-width:220px}
.ajEst{font-size:22px;line-height:1.3}
.ajJug{font-size:17px;margin-top:8px;color:#33424f}
.fila-com{min-height:30px;margin-top:6px}
.mini{display:inline-block;width:28px;height:28px}
.velo{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:60;padding-top:20%}
.velo .card{max-width:420px;margin:0 auto}
.prom{width:76px;height:76px;margin:6px;border:3px solid #d9e2ea;border-radius:16px;background:#f0dcb4}
@media (max-width:760px){.aj{display:block}.tab{margin:0 auto 12px}}
/* bienvenida */
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:#0b4a55;background:-webkit-radial-gradient(center,circle,#16909e,#0a3f49);background:radial-gradient(circle at center,#16909e,#0a3f49);color:#fff;text-align:center;-webkit-transition:opacity .5s;transition:opacity .5s;overflow:hidden}
#splash .in{position:absolute;left:0;right:0;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
#splash .logo{width:150px;height:150px;border-radius:34px;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-animation:rebote 1s ease-out both;animation:rebote 1s ease-out both}
#splash h1{font-size:54px;font-weight:900;letter-spacing:1px;margin-top:18px;-webkit-animation:entra .7s .4s both;animation:entra .7s .4s both}
#splash .lema{font-size:19px;opacity:.9;margin-top:4px;-webkit-animation:entra .7s .6s both;animation:entra .7s .6s both}
#splash .toca{display:inline-block;margin-top:26px;font-size:20px;font-weight:bold;background:#f2b134;color:#0a3f49;border-radius:30px;padding:12px 30px;box-shadow:0 5px 0 #c98d16;-webkit-animation:late 1.4s 1.2s infinite;animation:late 1.4s 1.2s infinite}
#splash .zona{position:absolute;left:0;right:0;bottom:16px;font-size:13px;opacity:.85}
#splash .zona img{width:34px;height:34px;vertical-align:middle;margin-right:8px;background:#fff;border-radius:50%;padding:2px}
#splash .b{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
/* confeti */
.confeti{position:fixed;top:-20px;width:12px;height:18px;z-index:40;border-radius:3px;-webkit-animation:cae 2.6s linear forwards;animation:cae 2.6s linear forwards}
@-webkit-keyframes entra{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@-webkit-keyframes rebote{0%{opacity:0;-webkit-transform:scale(.3)}60%{opacity:1;-webkit-transform:scale(1.08)}100%{-webkit-transform:scale(1)}}
@keyframes rebote{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@-webkit-keyframes late{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.07)}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@-webkit-keyframes salta{50%{-webkit-transform:scale(1.07)}}
@keyframes salta{50%{transform:scale(1.07)}}
@-webkit-keyframes tiembla{25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@-webkit-keyframes estrella{0%{opacity:0;-webkit-transform:scale(.2) rotate(-40deg)}70%{-webkit-transform:scale(1.25)}100%{opacity:1;-webkit-transform:none}}
@keyframes estrella{0%{opacity:0;transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{opacity:1;transform:none}}
@-webkit-keyframes cae{to{-webkit-transform:translateY(110vh) rotate(720deg)}}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:760px){.tile,.tile.cuatro{width:calc(50% - 16px)}.q{font-size:28px}.opt{font-size:24px}.mc{height:74px;font-size:19px}.key{height:48px;font-size:20px}#reloj{display:none}}
@media (max-height:620px){.tile{min-height:112px;padding-top:10px}.tile svg{width:42px;height:42px;margin-bottom:3px}.tile .num{font-size:44px;line-height:48px}.hola{padding:10px 18px}.hola h2{font-size:24px}}
</style>
</head>
<body>
<div id="top" class="flex between">
  <button id="btnBack">&#8592; Atrás</button>
  <svg id="logoTT" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="46" height="46"> <defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16808E"/><stop offset="1" stop-color="#0E5A66"/></linearGradient></defs> <rect width="200" height="200" rx="44" fill="url(#t)"/> <rect x="44" y="34" width="112" height="140" rx="18" fill="#FBF6EC"/> <rect x="54" y="46" width="92" height="106" rx="9" fill="#F2B134"/> <circle cx="100" cy="163" r="5" fill="#0E5A66"/> <g transform="translate(5 8)"> <path d="M58 132 H70 V120 H82 V108 H95 A24 24 0 0 0 95 60 A17 17 0 0 0 95 94 A11 11 0 0 0 95 72 A5 5 0 0 0 95 82" fill="none" stroke="#1F3A6B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/> <circle cx="95" cy="77" r="3.6" fill="#FBF6EC"/> </g> <g stroke="#FBF6EC" stroke-width="5" stroke-linecap="round" fill="none"> <path d="M164 34 l8 -8"/><path d="M170 52 h11"/><path d="M152 22 v-10"/> </g> </svg>
  <div class="grow">
    <h1 id="title">Tablet-Tini</h1>
    <div class="sub" id="subtitle">Zona Escolar 050</div>
  </div>
  <button id="btnHome">Inicio</button>
  <div id="reloj"></div>

}

  var prev = history.pop();

/* convierte un banco en generador de preguntas sin repetir */
function banco(lista, tipo){
  var mazo = [];
  return function(){
    if (!mazo.length) mazo = shuffle(lista.slice());
    var it = mazo.pop();
    if (tipo === "ort") return { q: "¿Cuál palabra está bien escrita?", a: it[0], opts: shuffle(it.slice()) , txt: true };
    return { q: it[0], a: it[1], opts: shuffle(it.slice(1)), txt: true };
  };
}
function genTablas(g){
  var a = rnd(2, g <= 3 ? 5 : 10), b = rnd(1, 10);
  return { q: a + " × " + b + " =", a: a * b, opts: opciones(a * b, a, 0) };
}

function confeti(){
  var colores = ["#e5533d", "#f0932b", "#f5d000", "#3aa655", "#2d8bd0", "#7a55c4", "#13808e"];
  for (var i = 0; i < 40; i++){

    c.className = "confeti";

    c.style.background = pick(colores);

/* ---------- cuestionario genérico (10 preguntas, 4 opciones) ---------- */
function Quiz(cfg){
  setTitle(cfg.area);
  var n = 0, ok = 0, TOTAL = 10, locked = false;
  function next(){
    if (n >= TOTAL){ return fin(); }
    var p = cfg.gen(state.grado);
    locked = false;
    var opts = shuffle(p.opts.slice());
    var h = '<div class="card"><div class="between flex"><b>Pregunta ' + (n + 1) + ' de ' + TOTAL + '</b><b style="color:#3aa655">Aciertos: ' + ok + '</b></div>' +
      '<div class="bar"><i style="width:' + (n * 10) + '%"></i></div>' +
      (p.html ? p.html : '') + '<div class="q' + (p.txt ? ' txt' : '') + '">' + esc(p.q) + '</div><div class="opts flex wrap">';
    each(opts, function(o, i){ h += '<button class="opt' + (String(o).length > 8 ? ' small' : '') + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; });
    h += '</div><div class="msg" id="msg"></div></div>';
    el(h);
    each($main.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        if (locked) return; locked = true;
        var v = b.getAttribute("data-v"), bien = (v === String(p.a));
        var m = document.getElementById("msg");
        if (bien){ ok++; b.className += " ok"; m.className = "msg ok"; m.innerHTML = pick(["¡Muy bien!", "¡Excelente!", "¡Correcto!", "¡Así se hace!"]); }
        else {
          b.className += " bad"; m.className = "msg bad"; m.innerHTML = "La respuesta era: " + esc(p.a);
          each($main.querySelectorAll(".opt"), function(x){ if (x.getAttribute("data-v") === String(p.a)) x.className += " ok"; });
        }
        beep(bien);
        n++;
        setTimeout(next, bien ? 900 : 2000);
      };
    });
  }
  function fin(){
    registrar(cfg.area, ok, TOTAL);
    var estrellas = ok >= 9 ? 3 : ok >= 6 ? 2 : ok >= 3 ? 1 : 0;
    var s = ""; for (var i = 0; i < 3; i++) s += '<span style="-webkit-animation-delay:' + (i * 0.25) + 's;animation-delay:' + (i * 0.25) + 's">' + (i < estrellas ? "★" : "☆") + '</span>';
    if (ok >= 6) confeti();
    el('<div class="card" style="text-align:center"><div class="stars">' + s + '</div>' +
      '<div class="big">Tuviste <b>' + ok + '</b> de ' + TOTAL + ' aciertos</div>' +
      '<p style="margin-bottom:14px">' + (ok >= 9 ? "¡Eres un campeón!" : ok >= 6 ? "¡Muy buen trabajo! Sigue practicando." : "Vamos a intentarlo otra vez. ¡Tú puedes!") + '</p>' +
      '<button class="btn" id="otra">Otra vez</button><button class="btn alt" id="salir">Terminar</button></div>');
    on("otra", function(){ n = 0; ok = 0; next(); });
    on("salir", back);
  }
  next();
}

/* opciones cercanas a la respuesta correcta */
function opciones(a, cerca, min){
  var set = [a], tries = 0;
  min = (min === undefined) ? 0 : min;
  while (set.length < 4 && tries < 200){
    tries++;
    var d = a + rnd(-cerca, cerca);
    if (d >= min && set.indexOf(d) < 0) set.push(d);
  }
  var k = 1; while (set.length < 4){ if (set.indexOf(a + k) < 0) set.push(a + k); k++; }
  return set;
}
function puntos(n){ var s = ""; for (var i = 0; i < n; i++) s += "●"; return '<div class="dots" style="text-align:center">' + s + '</div>'; }

/* ---------- matemáticas por grado ---------- */
function genMate(g){
  var a, b, r, t;
  if (g === 1){
    t = rnd(1, 3);
    if (t === 1){ a = rnd(2, 10); return { html: puntos(a), q: "¿Cuántos puntos hay?", a: a, opts: opciones(a, 3, 1) }; }
    if (t === 2){ a = rnd(1, 10); b = rnd(1, 10); return { q: a + " + " + b + " =", a: a + b, opts: opciones(a + b, 3, 0) }; }
    a = rnd(5, 15); b = rnd(1, a); return { q: a + " − " + b + " =", a: a - b, opts: opciones(a - b, 3, 0) };
  }
  if (g === 2){
    t = rnd(1, 4);
    if (t === 1){ a = rnd(10, 60); b = rnd(5, 39); return { q: a + " + " + b + " =", a: a + b, opts: opciones(a + b, 10, 0) }; }

/* ---------- el reloj ---------- */
function relojSVG(h, m){
  var s = '<svg width="220" height="220" viewBox="0 0 220 220" style="display:block;margin:0 auto">' +
    '<circle cx="110" cy="110" r="100" fill="#fff" stroke="#7a55c4" stroke-width="8"/>';
  for (var i = 1; i <= 12; i++){
    var ang = (i * 30 - 90) * Math.PI / 180;
    s += '<text x="' + (110 + 78 * Math.cos(ang)) + '" y="' + (110 + 78 * Math.sin(ang) + 8) + '" font-size="22" text-anchor="middle" fill="#23313f" font-weight="bold">' + i + '</text>';
  }
  var am = (m * 6 - 90) * Math.PI / 180, ah = ((h % 12) * 30 + m * 0.5 - 90) * Math.PI / 180;
  s += '<line x1="110" y1="110" x2="' + (110 + 52 * Math.cos(ah)) + '" y2="' + (110 + 52 * Math.sin(ah)) + '" stroke="#23313f" stroke-width="8" stroke-linecap="round"/>';
  s += '<line x1="110" y1="110" x2="' + (110 + 78 * Math.cos(am)) + '" y2="' + (110 + 78 * Math.sin(am)) + '" stroke="#e5533d" stroke-width="5" stroke-linecap="round"/>';
  s += '<circle cx="110" cy="110" r="7" fill="#23313f"/></svg>';
  return s;
}
function hora(h, m){ return h + ":" + (m < 10 ? "0" : "") + m; }
function genReloj(g){
  var h = rnd(1, 12), m;
  if (g <= 1) m = 0; else if (g === 2) m = pick([0, 30]); else if (g === 3) m = pick([0, 15, 30, 45]); else m = rnd(0, 11) * 5;
  var correcta = hora(h, m);
  var set = [correcta];
  var cand = [hora(h, (m + 30) % 60), hora(h % 12 + 1, m), hora(m === 0 ? 12 : (m / 5 > 12 ? 12 : (m / 5 || 12)), (h * 5) % 60), hora((h + 10) % 12 + 1, m), hora(h, (m + 15) % 60)];
  each(shuffle(cand), function(c){ if (set.length < 4 && set.indexOf(c) < 0) set.push(c); });
  return { html: relojSVG(h, m), q: "¿Qué hora marca el reloj?", a: correcta, opts: set };
}

/* ---------- memorama ---------- */
function paresMemo(g){
  var pares = [], usados = {}, a, b, k;
  while (pares.length < 8){
    if (g <= 2){ a = rnd(1, g === 1 ? 9 : 20); b = rnd(1, g === 1 ? 9 : 20); k = (a + b); if (g === 1 && k > 10) continue; if (usados[k]) continue; usados[k] = 1; pares.push([a + "+" + b, String(k)]); }
    else if (g <= 4){ a = rnd(2, 9); b = rnd(2, 9); k = a * b; if (usados[k]) continue; usados[k] = 1; pares.push([a + "×" + b, String(k)]); }
    else { var d = pick([2, 4, 5, 10]); var n = rnd(1, d - 1); k = (n / d).toFixed(2).replace(/0+$/, "").replace(/\.$/, ""); if (usados[k]) continue; usados[k] = 1; pares.push([n + "/" + d, k]); }
  }
  return pares;
}
function Memorama(){

      b.className = "mc open"; abiertas.push(i);

        intentos++; document.getElementById("int").innerHTML = "Intentos: " + intentos;

        if (cartas[x].id === cartas[y].id){
          botones[x].className = "mc done"; botones[y].className = "mc done"; abiertas = []; hechas++; beep(true);

              confeti(); el('<div class="card" style="text-align:center"><div class="stars"><span>★</span><span>★</span><span>★</span></div><div class="big">¡Encontraste todas las parejas en <b>' + intentos + '</b> intentos!</div><button class="btn" id="otra">Jugar otra vez</button><button class="btn alt" id="salir">Terminar</button></div>');

  media: { "Animales": ["BALLENA", "GAVIOTA", "TORTUGA", "CONEJO", "CABALLO", "PELICANO"], "Frutas": ["SANDIA", "NARANJA", "PLATANO", "MANZANA", "CIRUELA"], "El mar": ["OLAS", "ARENA", "CONCHA", "BARCO", "PLAYA", "ESTRELLA"], "En la escuela": ["MAESTRA", "CUADERNO", "MOCHILA", "PIZARRON", "RECREO"] },
  dificil: { "Naturaleza": ["DESIERTO", "CARDON", "VOLCAN", "MONTAÑA", "LAGUNA", "ACANTILADO"], "Ciencias": ["PLANETA", "ENERGIA", "MOLECULA", "VERTEBRADO", "ECOSISTEMA"], "México": ["BANDERA", "HIMNO", "CONSTITUCION", "MUNICIPIO", "PENINSULA"], "El mar": ["CORMORAN", "ARRECIFE", "PESCADOR", "MAREA", "LANGOSTA"] }
};
function Palabra(){
  setTitle("Adivina la palabra");
  var nivel = state.grado <= 2 ? "facil" : state.grado <= 4 ? "media" : "dificil";
  var cats = Object.keys(PALABRAS[nivel]); var cat = pick(cats); var pal = pick(PALABRAS[nivel][cat]);
  var vidas = 6, usadas = [], terminado = false;
  var LETRAS = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
  function oculta(){ var s = ""; for (var i = 0; i < pal.length; i++) s += (usadas.indexOf(pal[i]) >= 0 ? pal[i] : "_") + " "; return s; }
  function globos(){ var s = ""; for (var i = 0; i < 6; i++) s += i < vidas ? "● " : "○ "; return s; }
  var h = '<div class="card"><div style="text-align:center"><b>Pista: ' + esc(cat) + '</b> · ' + pal.length + ' letras</div>' +
    '<div class="balloons" id="vid">Oportunidades: ' + globos() + '</div><div class="word" id="w">' + oculta() + '</div><div class="msg" id="msg"></div></div><div class="keys flex wrap">';
  each(LETRAS, function(l){ h += '<button class="key" data-l="' + l + '">' + l + '</button>'; });
  h += '</div>';
  el(h);
  each($main.querySelectorAll(".key"), function(b){
    b.onclick = function(){
      var l = b.getAttribute("data-l");
      if (terminado || usadas.indexOf(l) >= 0) return;
      usadas.push(l);
      if (pal.indexOf(l) >= 0){ b.className = "key hit"; beep(true); } else { b.className = "key used"; vidas--; beep(false); }
      document.getElementById("w").innerHTML = oculta();
      document.getElementById("vid").innerHTML = "Oportunidades: " + globos();
      var gano = true; for (var i = 0; i < pal.length; i++) if (usadas.indexOf(pal[i]) < 0) gano = false;
      var m = document.getElementById("msg");
      if (gano || vidas <= 0){
        terminado = true;
        registrar("Adivina la palabra", gano ? 1 : 0, 1);
        m.className = gano ? "msg ok" : "msg bad";
        m.innerHTML = (gano ? "¡Lo lograste! " : "La palabra era: " + pal + ". ") + '<br><button class="btn" id="otra">Otra palabra</button>';
        on("otra", function(){ current = null; go(Palabra, null, true); });
      }
    };
  });
}

/* ---------- dibujo ---------- */
function Dibujo(){
  setTitle("Dibujar");
  var colores = ["#23313f", "#e5533d", "#f0932b", "#f5d000", "#3aa655", "#2d8bd0", "#7a55c4", "#8b5a2b", "#ffffff"];
  var h = '<div class="flex between wrap" style="margin-bottom:8px"><div class="palette flex wrap">';
  each(colores, function(c, i){ h += '<button data-c="' + c + '" style="background:' + c + '"' + (i === 0 ? ' class="sel"' : '') + '></button>'; });
  h += '</div><div><button class="btn alt" id="grosor">Grueso</button><button class="btn" id="limpiar">Borrar todo</button></div></div><canvas id="pad"></canvas>';
  el(h);
  var cv = document.getElementById("pad"), ctx = cv.getContext("2d");
  var w = $main.clientWidth - 32, hh = Math.max(260, window.innerHeight - 240);
  cv.width = w; cv.height = hh; cv.style.height = hh + "px";
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, hh);
  var color = colores[0], ancho = 6, dibujando = false, lx = 0, ly = 0;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  function pos(e){ var r = cv.getBoundingClientRect(); var t = e.touches ? e.touches[0] : e; return [t.clientX - r.left, t.clientY - r.top]; }
  function ini(e){ e.preventDefault(); dibujando = true; var p = pos(e); lx = p[0]; ly = p[1]; ctx.beginPath(); ctx.fillStyle = color; ctx.arc(lx, ly, ancho / 2, 0, Math.PI * 2); ctx.fill(); }
  function mov(e){ if (!dibujando) return; e.preventDefault(); var p = pos(e); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function fin(){ dibujando = false; }
  cv.addEventListener("touchstart", ini, false); cv.addEventListener("touchmove", mov, false); cv.addEventListener("touchend", fin, false);
  cv.addEventListener("mousedown", ini, false); cv.addEventListener("mousemove", mov, false); window.addEventListener("mouseup", fin, false);
  each($main.querySelectorAll(".palette button"), function(b){
    b.onclick = function(){ color = b.getAttribute("data-c"); each($main.querySelectorAll(".palette button"), function(x){ x.className = ""; }); b.className = "sel"; };
  });
  on("grosor", function(){ ancho = ancho === 6 ? 16 : ancho === 16 ? 2 : 6; document.getElementById("grosor").innerHTML = ancho === 16 ? "Delgado" : ancho === 2 ? "Normal" : "Grueso"; });
  on("limpiar", function(){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, hh); });
}

/* conexión para jugar en línea: red de la escuela (Compu-Tini) o la zona (internet) */
var AJ_ZONA_URL = ""; /* dirección del servidor de ajedrez de la zona (Google Apps Script); se configura en Modo maestro */
function ajx(metodo, url, datos, cb){
  try {
    var x = new XMLHttpRequest();
    x.open(metodo, url, true);
    x.timeout = 8000;
    x.onreadystatechange = function(){ if (x.readyState !== 4) return; var r = null; try { r = JSON.parse(x.responseText); } catch(e){} cb(r); };
    x.ontimeout = function(){ cb(null); };
    if (datos){ x.setRequestHeader("Content-Type", "text/plain;charset=utf-8"); x.send(JSON.stringify(datos)); } else x.send();
  } catch(e){ cb(null); }
}
function enc(o){ var s = []; for (var k in o) if (o.hasOwnProperty(k)) s.push(k + "=" + encodeURIComponent(o[k])); return s.join("&"); }
function conexion(tipo, base){
  if (tipo === "zona"){
    var g = function(o, cb){ ajx("GET", base + (base.indexOf("?") >= 0 ? "&" : "?") + enc(o) + "&_=" + new Date().getTime(), null, cb); };
    return {
      ping: function(cb){ g({ a: "ping" }, cb); },
      listar: function(cb){ g({ a: "salas" }, cb); },
      crear: function(n, cb){ g({ a: "crear", jugador: n }, cb); },
      unirse: function(id, n, cb){ g({ a: "unirse", id: id, jugador: n }, cb); },
      ver: function(id, cb){ g({ a: "sala", id: id }, cb); },
      mover: function(id, tok, mov, num, res, cb){ g({ a: "mover", id: id, token: tok, mov: mov, num: num, resultado: res }, cb); },
      fin: function(id, tok, res, cb){ g({ a: "fin", id: id, token: tok, resultado: res }, cb); }
    };
  }
  return {
    ping: function(cb){ ajx("GET", base + "/api/ping", null, cb); },
    listar: function(cb){ ajx("GET", base + "/api/salas", null, cb); },
    crear: function(n, cb){ ajx("POST", base + "/api/salas", { jugador: n }, cb); },
    unirse: function(id, n, cb){ ajx("POST", base + "/api/salas/" + id + "/unirse", { jugador: n }, cb); },
    ver: function(id, cb){ ajx("GET", base + "/api/salas/" + id, null, cb); },
    mover: function(id, tok, mov, num, res, cb){ ajx("POST", base + "/api/salas/" + id + "/mover", { token: tok, mov: mov, num: num, resultado: res }, cb); },
    fin: function(id, tok, res, cb){ ajx("POST", base + "/api/salas/" + id + "/fin", { token: tok, resultado: res }, cb); }
  };
}

function TableroAJ(op){

  var J = juegoAJ = { P: AJ.nuevo(), sel: -1, ult: null, fin: "", modo: op.modo, nivel: op.nivel || 1, yo: op.yo || op.color || "w", hist: [], comidas: { w: [], b: [] }, sala: op.sala || null, token: op.token || "", con: op.con || null, pensando: false, nom: op.nom || "" };
  var gira = (J.modo === "tablet" || J.modo === "red") && J.yo === "b";
  setTitle("Ajedrez", J.modo === "tablet" ? "Contra la tablet · nivel " + J.nivel : J.modo === "dos" ? "Dos jugadores" : "Partida en línea");
  el('<div class="aj flex"><div id="tab" class="tab"></div><div class="lado grow"><div class="card" style="padding:14px"><div id="ajEst" class="ajEst"></div><div id="ajJug" class="ajJug"></div><div id="ajCom" class="ajCom"></div></div>' +
    '<div id="ajBot"></div></div></div>');
  function botones(){
    var h = "";
    if (J.modo !== "red") h += '<button class="btn alt" id="ajDes">↶ Regresar jugada</button>';
    if (J.modo === "red" && !J.fin) h += '<button class="btn alt" id="ajRin">Rendirme</button>';
    h += '<button class="btn" id="ajNue">' + (J.modo === "red" ? "Salir" : "Nueva partida") + '</button><button class="btn alt" id="ajGir">⇅ Girar</button>';
    document.getElementById("ajBot").innerHTML = h;
    on("ajDes", function(){
      if (J.pensando || !J.hist.length) return;
      var n = (J.modo === "tablet" && J.P.t === J.yo) ? Math.min(2, J.hist.length) : 1;
      for (var i = 0; i < n; i++){ var h0 = J.hist.pop(); J.P = h0.P; J.comidas = h0.c; }
      J.ult = J.hist.length ? J.hist[J.hist.length - 1].m : null; J.fin = ""; J.sel = -1; pinta();
    });
    on("ajRin", function(){
      var b = document.getElementById("ajRin");
      if (b.getAttribute("data-c") !== "1"){ b.setAttribute("data-c", "1"); b.innerHTML = "¿Seguro? Toca otra vez"; return; }
      J.con.fin(J.sala.id, J.token, "", function(s){ if (s && !s.error){ J.sala = s; J.fin = s.resultado || "Partida terminada"; pinta(); } });
    });
    on("ajNue", function(){ if (J.modo === "red"){ pararAJ(); back(); } else { current = null; go(TableroAJ, op, true); } });
    on("ajGir", function(){ gira = !gira; pinta(); });
  }
  function textoFin(e, quien){
    if (e === "mate") return "¡Jaque mate! Ganan las " + (quien === "w" ? "blancas" : "negras");
    if (e === "ahogado") return "Empate: rey ahogado";
    if (e === "tablas") return "Empate: no hay piezas para dar mate";
    return "";
  }
  function pinta(){
    var P = J.P, L = J.fin ? [] : AJ.legales(P), destinos = {}, i;
    if (J.sel >= 0) for (i = 0; i < L.length; i++) if (L[i].f === J.sel) destinos[L[i].t] = L[i].cap ? 2 : 1;
    var jq = AJ.enJaque(P, P.t) ? AJ.rey(P, P.t) : -1, h = "";
    for (var k = 0; k < 64; k++){
      var sq = gira ? 63 - k : k, r = Math.floor(sq / 8), f = sq % 8, p = P.b[sq];
      var cls = "cas " + ((r + f) % 2 ? "osc" : "cla");
      if (sq === J.sel) cls += " sel";
      if (J.ult && (sq === J.ult.f || sq === J.ult.t)) cls += " ult";
      if (sq === jq) cls += " jaque";
      h += '<div class="' + cls + '" data-s="' + sq + '">' + (p ? piezaSVG(p) : "") + (destinos[sq] ? '<i class="' + (destinos[sq] === 2 ? "come" : "punto") + '"></i>' : "") +
        ((gira ? f === 7 : f === 0) ? '<b class="cr">' + (8 - r) + '</b>' : "") + ((gira ? r === 0 : r === 7) ? '<b class="cf">' + "abcdefgh".charAt(f) + '</b>' : "") + '</div>';
    }
    var tab = document.getElementById("tab"); if (!tab) return;
    var lado = Math.max(260, Math.min(window.innerHeight - 96, (window.innerWidth > window.innerHeight ? $main.clientWidth * 0.62 : $main.clientWidth - 36)));
    tab.style.width = lado + "px"; tab.style.height = lado + "px";
    tab.innerHTML = h;
    each(tab.querySelectorAll(".cas"), function(c){ c.onclick = function(){ toca(parseInt(c.getAttribute("data-s"), 10)); }; });
    var est = document.getElementById("ajEst"), turno = P.t === "w" ? "blancas" : "negras";
    if (J.fin) est.innerHTML = '<b style="color:#3aa655">' + esc(J.fin) + '</b>';
    else if (J.modo === "red" && J.sala && J.sala.estado === "esperando") est.innerHTML = "Esperando a que alguien se una…";
    else if (J.pensando) est.innerHTML = "La tablet está pensando…";
    else if (J.modo === "dos") est.innerHTML = "Turno de las <b>" + turno + "</b>" + (jq >= 0 ? ' · <span style="color:#e5533d">¡Jaque!</span>' : "");
    else est.innerHTML = (P.t === J.yo ? "<b>¡Te toca!</b>" : "Turno del rival") + (jq >= 0 ? ' · <span style="color:#e5533d">¡Jaque!</span>' : "");
    var jug = "";
    if (J.modo === "red" && J.sala) jug = "♔ " + esc(J.sala.blancas || "…") + "<br>♚ " + esc(J.sala.negras || "esperando rival");
    else if (J.modo === "tablet") jug = "Tú juegas con las <b>" + (J.yo === "w" ? "blancas" : "negras") + "</b>";
    document.getElementById("ajJug").innerHTML = jug;
    var cm = "";
    each(["w", "b"], function(c){ cm += '<div class="fila-com">'; each(J.comidas[c], function(p){ cm += '<span class="mini">' + piezaSVG(p) + '</span>'; }); cm += '</div>'; });
    document.getElementById("ajCom").innerHTML = cm;
    botones();
  }
  function registraJugada(m){
    J.hist.push({ P: J.P, m: J.ult, c: { w: J.comidas.w.slice(), b: J.comidas.b.slice() } });
    var capt = m.fl === "e" ? (J.P.t === "w" ? "p" : "P") : J.P.b[m.t];
    if (capt) J.comidas[J.P.t].push(capt);
    var quien = J.P.t;
    J.P = AJ.aplicar(J.P, m); J.ult = m; J.sel = -1;
    var e = AJ.estado(J.P);
    if (e){
      J.fin = textoFin(e, quien);
      if (e === "mate" && (J.modo === "dos" || quien === J.yo)){ confeti(); beep(true); }
      if (J.modo === "tablet") registrar("Ajedrez", e === "mate" && quien === J.yo ? 1 : 0, 1);
    }
    return e;
  }
  function toca(sq){
    if (J.fin || J.pensando) return;
    var P = J.P;
    if ((J.modo === "tablet" || J.modo === "red") && P.t !== J.yo) return;
    if (J.modo === "red" && J.sala && J.sala.estado !== "jugando") return;
    if (J.sel >= 0){
      var L = AJ.legales(P), cand = [];
      for (var i = 0; i < L.length; i++) if (L[i].f === J.sel && L[i].t === sq) cand.push(L[i]);
      if (cand.length){
        if (cand.length > 1) return promueve(cand);
        return hacer(cand[0]);
      }
    }
    J.sel = (P.b[sq] && AJ.colorDe(P.b[sq]) === P.t && J.sel !== sq) ? sq : -1;
    pinta();
  }
  function promueve(cand){
    var c = J.P.t, h = '<div class="card" style="text-align:center"><b>¿En qué se convierte tu peón?</b><div class="flex center" style="margin-top:10px">';
    each(cand, function(m, i){ h += '<button class="prom" data-i="' + i + '">' + piezaSVG(c === "w" ? m.pr.toUpperCase() : m.pr) + '</button>'; });
    var v = document.createElement("div"); v.className = "velo"; v.innerHTML = h + '</div></div>';
    document.body.appendChild(v);
    each(v.querySelectorAll(".prom"), function(b){ b.onclick = function(){ document.body.removeChild(v); hacer(cand[parseInt(b.getAttribute("data-i"), 10)]); }; });
  }
  function hacer(m){
    var e = registraJugada(m);
    beep(true); pinta();
    if (J.modo === "tablet" && !e){
      J.pensando = true; pinta();
      setTimeout(function(){
        if (juegoAJ !== J) return;
        var r = AJ.jugadaTablet(J.P, J.nivel); J.pensando = false;
        if (r) registraJugada(r);
        pinta();
      }, 350);
    }
    if (J.modo === "red"){
      J.con.mover(J.sala.id, J.token, AJ.uci(m), J.hist.length - 1, J.fin, function(s){
        if (!s || s.error){ var h0 = J.hist.pop(); J.P = h0.P; J.comidas = h0.c; J.ult = h0.m; J.fin = ""; pinta(); alert((s && s.error) || "No hay conexión. Intenta otra vez."); }
        else { J.sala = s; }
      });
    }
  }
  function sondea(){
    if (juegoAJ !== J || J.modo !== "red") return;
    J.con.ver(J.sala.id, function(s){
      if (juegoAJ !== J) return;
      if (s && !s.error){
        var cambio = s.v !== J.sala.v; J.sala = s;
        while (s.movs.length > J.hist.length){ var m = AJ.desdeUci(J.P, s.movs[J.hist.length]); if (!m) break; registraJugada(m); cambio = true; }
        if (s.estado === "terminada" && !J.fin){ J.fin = s.resultado || "Partida terminada"; cambio = true; }
        if (cambio) pinta();
      }
      if (juegoAJ === J && !J.fin) sondeoAJ = setTimeout(sondea, J.con.lento ? 3000 : 1200);
    });
  }
  pinta();
  if (J.modo === "tablet" && J.yo === "b"){ J.pensando = true; pinta(); setTimeout(function(){ var r = AJ.jugadaTablet(J.P, J.nivel); J.pensando = false; if (r) registraJugada(r); pinta(); }, 400); }
  if (J.modo === "red") sondea();
}

      '<button class="btn" id="aAjustes">Ajustes de Android</button><button class="btn" id="aNav">Abrir navegador</button><button class="btn alt" id="aInicio">Dejar de ser pantalla de inicio</button></div>' : '') +
    '<div class="card" style="font-size:15px;color:#7a8794">Tablet-Tini ' + esc(window.Android && window.Android.version ? window.Android.version() : "v1") + ' · Zona Escolar 050 · Funciona sin internet. Contraseña inicial: 0500.</div>');
  if (window.Android){
    on("aAjustes", function(){ window.Android.ajustes(); });
    on("aNav", function(){ window.Android.navegador(); });
    on("aInicio", function(){ window.Android.quitarInicio(); });
  }
  on("guardar", function(){
    store.set("escuela", document.getElementById("esc").value.trim());
    store.set("numero", document.getElementById("num").value.trim());
    store.set("ajZona", document.getElementById("ajz").value.trim());
    store.set("ajEscuela", document.getElementById("aje").value.trim().replace(/\/$/, ""));
    var np = document.getElementById("npin").value.replace(/\D/g, "");
    if (np.length >= 4) store.set("pin", np);
    pie();
    var m = document.getElementById("msg"); m.className = "msg ok"; m.innerHTML = "Guardado" + (np.length >= 4 ? " (nueva contraseña: " + np + ")" : "");
  });
  on("borrar", function(){
    var b = document.getElementById("borrar");
    if (b.getAttribute("data-c") !== "1"){ b.setAttribute("data-c", "1"); b.innerHTML = "Toca otra vez para confirmar"; return; }
    store.set("avance", {}); current = null; go(Maestro, null, true);
  });
}

function pie(){
  var e = store.get("escuela", ""), n = store.get("numero", "");
  document.getElementById("footSchool").innerHTML = esc(e) + (n ? " · Tablet " + esc(n) : "");
}

/* botón atrás físico de la tablet (lo envía la app de Android) */
window.ttAtras = function(){ if (history.length) back(); };
pie();
tic(); setInterval(tic, 20000);
bienvenida();
go(Inicio);
})();
</script>
</body>
</html>
