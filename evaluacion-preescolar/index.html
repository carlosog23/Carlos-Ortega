<style>
/* Idea: una "boleta" de trabajo. Cuatro colores fijos, uno por campo formativo, guían toda la app. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#F7F9FC; --ink:#18223B; --muted:#5A6580; --line:#D8DFEB;
  --accent:#2F4BD8; --accent-ink:#FFFFFF; --accent-soft:#E6EAFC;
  --cL:#C9470D; --cS:#0B7285; --cE:#2B7A3B; --cH:#A61E4D;
  --si:#2B7A3B; --oc:#A86A00; --no:#C2332F;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(24,34,59,.06),0 6px 20px rgba(24,34,59,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141E; --surface:#182030; --surface2:#1E2738; --ink:#E9EDF6; --muted:#9BA7C0; --line:#2C374B;
    --accent:#8FA3FF; --accent-ink:#0F141E; --accent-soft:#232E52;
    --cL:#FF9A62; --cS:#5CC8DB; --cE:#7ED08E; --cH:#F283AC;
    --si:#7ED08E; --oc:#F0BC55; --no:#FF8A84; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141E; --surface:#182030; --surface2:#1E2738; --ink:#E9EDF6; --muted:#9BA7C0; --line:#2C374B;
  --accent:#8FA3FF; --accent-ink:#0F141E; --accent-soft:#232E52;
  --cL:#FF9A62; --cS:#5CC8DB; --cE:#7ED08E; --cH:#F283AC;
  --si:#7ED08E; --oc:#F0BC55; --no:#FF8A84; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}

/* Encabezado */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.top::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--cL) 0 25%,var(--cS) 25% 50%,var(--cE) 50% 75%,var(--cH) 75% 100%)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top h1{font-size:clamp(22px,4vw,30px);font-weight:700}
.top .sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.tri{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface2)}
.tri button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tri button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Pasos */
.steps{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.steps-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.steps button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.steps button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.steps button[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.steps button[aria-current="page"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{padding-top:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin-bottom:4px}
.card h3{font-size:16px}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 12px;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;color:var(--ink);font-weight:400;font-size:16px}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--no)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--si);border-color:color-mix(in srgb,var(--si) 40%,transparent)}
.pill.warn{color:var(--oc);border-color:color-mix(in srgb,var(--oc) 40%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
[data-c="L"]{--c:var(--cL)}[data-c="S"]{--c:var(--cS)}[data-c="E"]{--c:var(--cE)}[data-c="H"]{--c:var(--cH)}[data-c=""]{--c:var(--muted)}
.campo-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;color:var(--c);font-size:15.5px}
.campo-h::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.campo-box{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* Membrete */
.membrete{border:1.5px solid var(--ink);border-radius:10px;padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.membrete .esc{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.membrete .tit{text-align:center;font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.membrete .dat{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;font-size:14.5px;border-top:1px solid var(--line);padding-top:8px}
.membrete b{font-weight:700}

/* Listas */
.al{display:grid;grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.al .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
@media (max-width:560px){.al{grid-template-columns:24px 1fr auto}.al .pila{grid-column:2/3}}
.asp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:start}
.cs{display:flex;gap:4px}
.cs button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--c);background:transparent;color:var(--c);font-weight:700;cursor:pointer;font-size:13px}
.cs button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
@media (max-width:560px){.asp{grid-template-columns:1fr auto}.asp .cs{grid-column:1/2}}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}

/* Valoración */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.val{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
table.val th,table.val td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:middle}
table.val thead th{background:var(--surface2);vertical-align:bottom;min-width:118px;max-width:150px;font-weight:600;text-align:left;border-top:4px solid var(--c);line-height:1.3}
table.val th.nom{position:sticky;left:0;background:var(--surface);z-index:2;min-width:150px;max-width:190px;text-align:left;font-weight:600;border-top:0}
table.val thead th.nom{background:var(--surface2);z-index:3}
.vb{width:100%;min-height:36px;border-radius:8px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted)}
.vb[data-v="S"]{background:color-mix(in srgb,var(--si) 16%,transparent);border-color:var(--si);color:var(--si)}
.vb[data-v="O"]{background:color-mix(in srgb,var(--oc) 16%,transparent);border-color:var(--oc);color:var(--oc)}
.vb[data-v="N"]{background:color-mix(in srgb,var(--no) 14%,transparent);border-color:var(--no);color:var(--no)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .vb{min-height:42px;font-size:14px}
.seg .vb[aria-pressed="false"]{background:transparent;border-color:var(--line);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* Redacción */
.stu{display:flex;flex-direction:column;gap:10px}
.stu-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stu-h h3{font-size:18px}
.txt{min-height:92px;background:var(--surface)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.cnt{font-variant-numeric:tabular-nums}
.cnt.over{color:var(--no);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hist .col{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.hist p{margin:0;font-size:14.5px}
.empty{color:var(--muted);font-style:italic;font-size:14.5px}
.foot{color:var(--muted);font-size:13px;max-width:75ch}
.pie{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13.5px}
.pie-m{width:26px;height:26px;border-radius:6px;flex:0 0 auto;background:conic-gradient(var(--cS) 0 25%,var(--cH) 0 50%,var(--cE) 0 75%,var(--cL) 0)}
.pie-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pie-n{font-family:var(--display);font-weight:700;color:var(--ink);font-size:15.5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14.5px;max-width:min(92vw,520px);z-index:60;display:none;text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;max-width:min(92vw,440px)}
dialog::backdrop{background:rgba(10,14,24,.5)}
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);z-index:50;display:none;place-items:center;padding:16px}
.busy .card{max-width:380px;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>

function pila(full){
  const w = String(full).trim().split(/\s+/); if(w.length<3) return cap(w[0]||"");
  const P = new Set(["DE","DEL","LA","LAS","LOS","Y","SAN","SANTA","VAN","VON","DA","DI"]);
  let i=0,u=0; while(i<w.length&&u<2){ while(i<w.length-1&&P.has(w[i].toUpperCase())) i++; i++; u++; }
  return cap(w[i]||w[w.length-1]);
}

/* ev = lista ya evaluada: además del texto se conserva la imagen de cada página (las marcas casi nunca vienen como texto)
   y, en Word, la estructura de las tablas. */
async function leer(file,ev){
  const n = file.name.toLowerCase();
  if(file.type.startsWith("image/")) return {text:"",images:[file],pages:[{text:"",image:file}]};
  if(n.endsWith(".pdf")){
    await lib("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js");
    await lib("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
    const pdf = await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let text=""; const np=Math.min(pdf.numPages,8);
    for(let i=1;i<=np;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); let y=null,line="";
      for(const it of tc.items){ const yy=Math.round(it.transform[5]); if(y!==null&&Math.abs(yy-y)>3){text+=line.trim()+"\n";line="";} y=yy; line+=it.str+" "; } text+=line.trim()+"\n";
      if(ev) text+="\f"; }
    if(ev){ const tx=text.split("\f"), pages=[];
      for(let i=1;i<=np;i++){ const pg=await pdf.getPage(i); const v0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:Math.min(2.4,1900/Math.max(v0.width,v0.height))}); const c=document.createElement("canvas"); c.width=vp.width;c.height=vp.height;
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; pages.push({text:(tx[i-1]||"").trim(),image:await new Promise(r=>c.toBlob(r,"image/jpeg",.9))}); }
      return {text:tx.join("\n"),images:pages.map(p=>p.image),pages}; }
    if(text.replace(/\s/g,"").length>40) return {text,images:[]};
    const images=[];
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1.6}); const c=document.createElement("canvas"); c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; images.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.88))); }
    return {text:"",images};
  }
  if(n.endsWith(".docx")&&ev){ await lib("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");
    const h=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()}); const d=new DOMParser().parseFromString(h.value,"text/html"); let text="";
    const celda=c=>[c.textContent.replace(/\s+/g," ").trim()].concat(Array(Math.max(0,(+c.getAttribute("colspan")||1)-1)).fill(""));
    for(const el of d.body.children){ if(el.tagName==="TABLE"){ for(const tr of el.querySelectorAll("tr")) text+=[...tr.children].flatMap(celda).join(" | ")+"\n"; } else { const x=el.textContent.replace(/\s+/g," ").trim(); if(x) text+=x+"\n"; } }
    return {text,images:[],tabla:true}; }
  if(n.endsWith(".docx")){ await lib("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"); const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); return {text:r.value,images:[]}; }
  if(n.endsWith(".doc")) throw new Error("Los archivos .doc antiguos no se pueden leer. Guárdalo como .docx o PDF, o toma una foto.");
  return {text:await file.text(),images:[]};
}
const GUIA_CAMPOS = "Campos formativos (clave): L = Lenguajes (comunicación oral, escucha, narración, lectura y escritura iniciales, expresión artística); S = Saberes y Pensamiento Científico (conteo y número, formas, espacio, medida, clasificación, exploración de la naturaleza, experimentación); E = Ética, Naturaleza y Sociedades (reglas y acuerdos de convivencia, derechos, cuidado de la naturaleza y del entorno, pertenencia a la comunidad, cultura de paz); H = De lo Humano y lo Comunitario (identidad personal, emociones, interacción y juego con otras personas, movimiento y coordinación, hábitos de higiene y salud, prevención de riesgos).";
async function pedir(prompt,src,tier){

}
function lineasNombres(text){ return text.split(/\n/).map(l=>l.replace(/^[\s\d.\-)°º#]+/,"").replace(/\s+/g," ").trim()).filter(l=>/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .]+$/.test(l)&&l.split(" ").length>=2&&l.length<60&&!/^(nombre|lista|grado|grupo|docente|escuela|ciclo|jard[ií]n|n[uú]m)/i.test(l)); }

function addAlumnos(list){
  let n=0; const ya=new Set(S.alumnos.map(a=>norm(a.nombre)));
  /* Si ya hay trabajo en trimestres anteriores, quien llega ahora es un alta de este trimestre */
  const previo = [1,2,3].some(t=>t<S.tri&&(Object.keys(S.tris[t].val).length||Object.keys(S.tris[t].textos).length));
  for(const it of list){ const nombre=String(typeof it==="string"?it:it.nombre||"").replace(/\s+/g," ").trim(); if(!nombre||ya.has(norm(nombre))) continue;
    ya.add(norm(nombre)); S.alumnos.push({id:uid(),nombre,pila:cap((it&&it.pila)||"")||pila(nombre),altaTri:previo?S.tri:1,baja:false}); n++; }
  return n;
}
function addAspectos(list){
  let n=0; const t=T(); const ya=new Map(t.aspectos.map(a=>[norm(a.texto),a])); const ids=[];
  for(const it of list){ const texto=String(typeof it==="string"?it:it.texto||"").replace(/^\s*\d+[.)-]?\s*/,"").replace(/\s+/g," ").trim(); if(texto.length<4){ids.push(null);continue;}
    let a=ya.get(norm(texto)); if(!a){ a={id:uid(),texto,campo:CK.includes(it&&it.campo)?it.campo:""}; t.aspectos.push(a); ya.set(norm(texto),a); n++; } ids.push(a.id); }
  return {n,ids};
}

/* Convierte lo que devuelva la IA al nivel de la app: S (Sí), O (En ocasiones), N (No) */
const NIV = {S:"S",SI:"S",LOGRADO:"S",L:"S",O:"O","EN OCASIONES":"O","A VECES":"O","EN PROCESO":"O",EP:"O",P:"O",N:"N",NO:"N","NO LOGRADO":"N",NL:"N","REQUIERE APOYO":"N",RA:"N"};
const nivel = x => x===true?"S":x===false?"N":(NIV[norm(x)]||"");
/* Busca a un alumno ya registrado aunque el nombre venga en otro orden o con un nombre de menos */
function buscarAlumno(nombre){
  const n=norm(nombre); if(!n) return null;
  const a=S.alumnos.find(x=>norm(x.nombre)===n); if(a) return a;
  const P=new Set(["DE","DEL","LA","LAS","LOS","Y"]), tk=s=>norm(s).split(" ").filter(w=>w.length>1&&!P.has(w)), q=tk(nombre); if(q.length<2) return null;
  const c=S.alumnos.filter(x=>{ const k=tk(x.nombre), com=q.filter(w=>k.includes(w)).length; return com>=2&&com===Math.min(q.length,k.length); });
  return c.length===1?c[0]:null;
}
/* Busca un aspecto ya registrado aunque la redacción cambie un poco */
function buscarAspecto(texto){
  const t=T(), n=norm(texto); const a=t.aspectos.find(x=>norm(x.texto)===n); if(a) return a;
  const tk=s=>[...new Set(norm(s).split(" ").filter(w=>w.length>3))], q=tk(texto); if(q.length<2) return null;
  let best=null,bs=0,seg=0;
  for(const x of t.aspectos){ const k=tk(x.texto), com=q.filter(w=>k.includes(w)).length, p=com/((q.length+k.length-com)||1); if(p>bs){seg=bs;bs=p;best=x;} else if(p>seg) seg=p; }
  return bs>=.6&&bs-seg>=.1?best:null;
}
const PROMPT_EVAL = 'Este documento es una lista de cotejo de preescolar YA EVALUADA: cada fila es un alumno y cada aspecto (indicador) tiene su marca o nivel. Tu tarea es leer las marcas tal como están, sin inventar ni omitir. Primero identifica cómo está marcada la lista: subcolumnas «Sí» y «No»; una sola casilla por aspecto con palomita o tache; tres o más niveles (por ejemplo Logrado / En proceso / Requiere apoyo); colores de semáforo; letras, números o palabras escritas. Si trae una clave o simbología, úsala. La marca puede ser una palomita, un tache, una equis o la casilla rellenada o ennegrecida: en cada grupo de casillas de un aspecto, la marcada es la que se ve oscura o con trazo y las demás están vacías. Cuando hay subcolumnas (por ejemplo «Lo logra», «En proceso», «Requiere apoyo»), fíjate bajo cuál encabezado queda la casilla marcada, contando las casillas del grupo de izquierda a derecha. Lee fila por fila, siguiendo con cuidado la línea de cada alumno y la columna de cada aspecto. Convierte cada marca a uno de estos valores: "S" = lo logra (palomita en Sí, palomita en casilla única, Logrado, verde, el nivel más alto); "O" = a veces o en proceso (anotación «En ocasiones», En proceso, amarillo, niveles intermedios); "N" = no lo logra (palomita en No, tache, Requiere apoyo, rojo, el nivel más bajo, otra anotación negativa como «No interactúa»); "" = sin marca. Con encabezados «Lo logra / En proceso / Requiere apoyo»: Lo logra = "S", En proceso = "O", Requiere apoyo = "N". Si cada aspecto tiene una sola casilla y solo se palomean los logrados, la casilla vacía de un alumno que sí tiene otras marcas vale "N". Si recibes imagen y texto, las marcas se leen en la imagen; el texto solo ayuda a escribir bien nombres y enunciados. En texto de Word, «ü» o «P» sueltas en una casilla suelen ser palomita y «û» o «O» tache. Si el documento indica el campo formativo (por ejemplo en el encabezado), asígnalo a todos sus aspectos. '+GUIA_CAMPOS+' Responde solo con un objeto JSON: {"aspectos":[{"texto": enunciado completo, "campo":"L"|"S"|"E"|"H"}], "alumnos":[{"nombre": nombre completo, "pila": primer nombre de pila con mayúscula inicial, "v":[...]}]} donde "v" tiene exactamente un valor por aspecto, en el mismo orden de "aspectos".';
async function cargarEvaluada(src){
  if(!AIimg&&src.text) src={text:src.text,images:[]};
  /* Hasta 3 páginas van juntas; las listas más largas se leen de dos en dos páginas */
  const pg=src.pages||[], partes = pg.length>3 ? pg.reduce((o,p,i)=>{ if(i%2===0) o.push({text:"",images:[]}); const u=o[o.length-1]; u.text+=p.text+"\n"; u.images.push(p.image); return o; },[]) : [src];
  let aspectos=null; const filas=[];
  for(let i=0;i<partes.length;i++){
    if(partes.length>1) busy(`Leyendo la lista de cotejo evaluada… parte ${i+1} de ${partes.length}.`);
    const r = await pedir(PROMPT_EVAL + (aspectos ? "\n\nEsta parte es la continuación de la misma lista. Usa exactamente estos aspectos, en este orden, aunque aquí no se vea el encabezado:\n"+aspectos.map((a,k)=>(k+1)+". "+(a.texto||a)).join("\n") : ""), partes[i]);
    if(!r||typeof r!=="object") throw {code:"invalid_json"};
    if(!aspectos){ if(!Array.isArray(r.aspectos)||!r.aspectos.length){ if(i<partes.length-1) continue; throw new Error("No se encontraron aspectos en el documento. Revisa que sea la lista de cotejo."); } aspectos=r.aspectos; }
    (Array.isArray(r.alumnos)?r.alumnos:[]).forEach((ra,k)=>{ if(ra) filas.push({nombre:String(typeof ra==="string"?ra:ra.nombre||""),pila:ra.pila,v:Array.isArray(ra.v)?ra.v:((r.valores||[])[k]||[])}); });
  }
  if(!aspectos) throw new Error("No se encontraron aspectos en el documento. Revisa que sea la lista de cotejo.");
  const t=T(), usados=new Set();
  const ids=aspectos.map(it=>{ const texto=String(typeof it==="string"?it:(it&&it.texto)||""); let a=buscarAspecto(texto); if(a&&usados.has(a.id)) a=null;
    const id=a?a.id:addAspectos([it]).ids[0]; if(id) usados.add(id); if(a&&!a.campo&&CK.includes(it&&it.campo)) a.campo=it.campo; return id; });
  let m=0, na=0;
  for(const f of filas){ let a=buscarAlumno(f.nombre); if(!a){ addAlumnos([f]); a=S.alumnos.find(x=>norm(x.nombre)===norm(f.nombre)); } if(!a) continue;
    let k=0; ids.forEach((id,j)=>{ const v=nivel(f.v[j]); if(id&&v){ (t.val[a.id]=t.val[a.id]||{})[id]=v; k++; } }); if(k){ m+=k; na++; } }
  save(); view="valorar"; modoVal = window.innerWidth<760?"alumno":"tabla"; render();
  toast(m?`Se cargaron ${m} valoraciones de ${na} alumnos. Compara con tu lista y corrige lo necesario.`:"No se reconocieron las marcas de la lista. Prueba con una foto más clara y de frente, o con el PDF original.");
}

«Sí»: lo manifiesta de forma consistente. «En ocasiones»: está en proceso, lo logra algunas veces o con apoyo. «No»: todavía no se observa; se expresa como un proceso que requiere acompañamiento. Un aspecto sin valoración no se menciona.

function basico(al,campo,tri){
  const r=resumenVal(al,campo,tri), i=S.alumnos.indexOf(al), low=s=>{s=s.replace(/[.\s]+$/,"");return s.charAt(0).toLowerCase()+s.slice(1);};
  const g=v=>r.filter(x=>x.v===v).map(x=>low(x.a.texto)); const si=g("S"),oc=g("O"),no=g("N"); const out=[];
  const ini=[`${al.pila}`,`Durante este periodo, ${al.pila}`,`En este campo formativo, ${al.pila}`,`A lo largo del trimestre, ${al.pila}`][(i+CK.indexOf(campo))%4];
  if(si.length) out.push(`${ini} ${si.join("; además, ")}.`); else out.push(`${ini} participa en las actividades del campo y avanza a su propio ritmo.`);
  if(oc.length) out.push(`En ocasiones ${oc.join(" y ")}, por lo que se continuará favoreciendo este proceso.`);
  if(no.length) out.push(`Con acompañamiento se buscará que avance en lo siguiente: ${no.join("; ")}.`);
  if(S.op.familia) out.push("Se sugiere a la familia conversar en casa sobre lo que vive en la escuela y reconocer sus avances.");
  return out.join(" ");
}

async function redactar(objetivos){
  if(gen) return; if(!objetivos.length) return toast("No hay valoraciones registradas para redactar. Completa el paso 4.");
  const tri=S.tri, t=S.tris[tri];
  if(!AI){ for(const {al,c} of objetivos){ (t.textos[al.id]=t.textos[al.id]||{})[c]=basico(al,c,tri); } save(); render(); return toast("Se generó una redacción básica, porque la redacción con IA no está disponible por ahora."); }
  const jobs=[]; for(const c of CK){ const als=objetivos.filter(o=>o.c===c).map(o=>o.al); for(let i=0;i<als.length;i+=6) jobs.push({c,lote:als.slice(i,i+6)}); }
  gen={total:objetivos.length,done:0,ctl:new AbortController(),err:null}; const usados={L:[],S:[],E:[],H:[]}; progreso();
  const run = async job => {
    if(gen.ctl.signal.aborted||gen.err) return;
    try{ const r = await AI.json(promptCampo(job.c,job.lote,tri,usados[job.c]),{cache:false,signal:gen.ctl.signal});
      for(const al of job.lote){ let x=r&&r[al.id]; if(typeof x!=="string"||!x.trim()) continue; x=x.replace(/\s*\n+\s*/g," ").replace(/\*\*/g,"").trim();
        (t.textos[al.id]=t.textos[al.id]||{})[job.c]=x; usados[job.c].push(x.split(/\s+/).slice(0,4).join(" ")); pintar(al.id,job.c,x); }
      save();
    }catch(e){ if(e&&e.code!=="cancelled") gen.err=e; }
    gen.done+=job.lote.length; progreso();
  };
  const q=jobs.slice(); const worker=async()=>{ while(q.length&&!gen.ctl.signal.aborted&&!gen.err) await run(q.shift()); };
  /* Con el servicio gratuito (AI===IAservidor) se envía una solicitud a la vez para no rebasar su límite por minuto */
  await Promise.all(AI===IAservidor?[worker()]:[worker(),worker()]);
  const err=gen.err, stop=gen.ctl.signal.aborted; gen=null; render();
  toast(err?errAI(err):stop?"Redacción detenida. Lo ya escrito se conservó.":"Redacción terminada. Lee y ajusta cada texto antes de copiarlo.");
}
function progreso(){ const p=$("#prog"); if(!p||!gen) return render(); p.querySelector("i").style.width=Math.round(gen.done/gen.total*100)+"%"; $("#progtxt").textContent=`Redactando… ${Math.min(gen.done,gen.total)} de ${gen.total} textos`; }

/* ============ IA por servidor (fuera de Claude) ============ */
function aB64(blob){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=no; r.readAsDataURL(blob); }); }
async function reducir(blob){
  try{ const bmp=await createImageBitmap(blob); const k=Math.min(1,1900/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); const out=await new Promise(r=>c.toBlob(r,"image/jpeg",.86)); return {tipo:"image/jpeg",datos:await aB64(out)}; }
  catch(e){ return {tipo:blob.type||"image/jpeg",datos:await aB64(blob)}; }
}
function leerJson(t){ t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(); try{ return JSON.parse(t); }catch(e){}
  const a=Math.min(...["{","["].map(c=>t.indexOf(c)).filter(i=>i>=0)), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]")); if(isFinite(a)&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } throw {code:"invalid_json"}; }
const esperar=(ms,signal)=>new Promise((ok,no)=>{ if(signal&&signal.aborted) return no({code:"cancelled"}); const t=setTimeout(ok,ms); if(signal) signal.addEventListener("abort",()=>{clearTimeout(t);no({code:"cancelled"});},{once:true}); });
const IAservidor = { async json(prompt,o={}){
  const imagenes=[]; for(const b of (o.images||[])) imagenes.push(await reducir(b));
  /* El servicio gratuito admite pocas solicitudes por minuto: si avisa que está ocupado, se espera y se reintenta sola */
  const pausas=[20,35,50,65];
  for(let n=0;;n++){
    try{ return await this.una(prompt,imagenes,o); }
    catch(e){ if(!(e&&e.ocupado)||n>=pausas.length) throw e;
      toast(`El servicio de redacción está ocupado. Se reintenta en ${pausas[n]} segundos…`); await esperar(pausas[n]*1000,o.signal); }
  }
},
async una(prompt,imagenes,o){
  /* Tope de espera: si el servicio no contesta en 2 minutos (4 al leer fotos, que tardan más), se avisa en lugar de dejar la app esperando */
  const ctl=new AbortController(); let venc=false; const tm=setTimeout(()=>{venc=true;ctl.abort();},imagenes.length?240000:120000);
  if(o.signal){ if(o.signal.aborted) ctl.abort(); else o.signal.addEventListener("abort",()=>ctl.abort(),{once:true}); }
  let r; try{ r=await fetch(SERVIDOR,{method:"POST",body:JSON.stringify({accion:"ia",prompt,imagenes}),signal:ctl.signal}); }
  catch(e){ if(venc) throw new Error("El servicio de redacción tardó demasiado en responder. Intenta de nuevo en unos minutos."); if(o.signal&&o.signal.aborted) throw {code:"cancelled"}; throw new Error("No hay conexión con el servicio de redacción. Revisa tu internet e intenta de nuevo."); }
  finally{ clearTimeout(tm); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error("El servicio de redacción no respondió bien. Intenta de nuevo."); }
  if(!j.ok){ const er=new Error(j.error||"El servicio de redacción no pudo responder. Intenta de nuevo."); er.ocupado=/l[ií]mite gratuito|saturad|ocupad/i.test(er.message); throw er; }
  return leerJson(j.texto);
} };
