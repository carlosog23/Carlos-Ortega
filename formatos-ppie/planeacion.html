<script>
const BANCO4=[{"campo": "Lenguajes", "c": "Narración de sucesos del pasado y del presente.", "p3": "Identifica y comprende la función y las características principales de la narración. Reconoce y usa las estructuras narrativas: lineal, circular, in media res y otras, de acuerdo con su propia cultura y gusto para narrar. Identifica y establece relaciones causa-efecto en una narración. Usa el punto y el punto y seguido para separar oraciones en un párrafo.", "p4": "Reconoce y usa diversos estilos, recursos y estrategias narrativas. Establece relaciones causales y temporales entre acontecimientos. Reflexiona sobre los tiempos presente, pretérito y copretérito, para narrar sucesos. Infiere el significado de las palabras, a partir de la información contextual de un texto."}, {"campo": "Lenguajes", "c": "Descripción de personas, lugares, hechos y procesos.", "p3": "Comprende, a partir de la lectura de textos descriptivos, que hay formas detalladas para describir a las personas y los lugares, señalando características que van más allá de su apariencia. Reflexiona sobre el uso de palabras y frases para describir personas, lugares y hechos: adjetivos, adverbios y frases adverbiales. Planea, escribe, revisa y corrige textos en los que describe hechos en orden cronológico. Reflexiona sobre el uso de la coma al enumerar cosas o elementos y la emplea. Usa mayúsculas al inicio de las oraciones y de los nombres propios.", "p4": "Planea, escribe, revisa y corrige textos donde describe, de manera lógica, procesos con los que tiene cierta familiaridad. Reflexiona sobre el uso de palabras y frases adjetivas y adverbiales para describir procesos. Utiliza algunos conectores secuenciales, como en primer lugar, posteriormente, finalmente; y temporales, como al mismo tiempo, simultáneamente, más tarde, antes, cuando describe un proceso, a fin de dar claridad al texto. Revisa y corrige las descripciones que realiza, para transmitir ideas de forma clara, evitando repeticiones innecesarias. Reconoce el uso del punto y coma y los dos puntos, y los emplea al enumerar diferentes elementos o aspectos."}, {"campo": "Lenguajes", "c": "Diálogo para la toma de acuerdos y el intercambio de puntos de vista.", "p3": "Reconoce y usa pautas que norman los intercambios orales, como respetar el turno para hacer uso de la palabra, prestar atención, adecuar el volumen de voz, emplear fórmulas de cortesía, mantener el interés, plantear preguntas. Escucha las ideas de otras y otros, y expresa las propias con respeto. Reconoce que expresar sus ideas con claridad y acompañadas de las razones que las sustentan, son aspectos que ayudan a que otras personas las comprendan. Participa activamente en diálogos para tomar acuerdos, dando razones de sus preferencias o puntos de vista.", "p4": "Indica de manera respetuosa cuando no ha comprendido los puntos de vista o ideas de otros. Utiliza información de varias fuentes orales y escritas, para explicar y argumentar sus propias ideas y puntos de vista. Recupera de forma explícita experiencias y conocimientos, para tomar decisiones o asumir una postura. Intercambia información, practica la escucha activa, empatía y/o negociación y toma acuerdos."}, {"campo": "Lenguajes", "c": "Comprensión y producción de textos expositivos en los que se planteen: problema-solución, comparación-contraste, causa-consecuencia y enumeración.", "p3": "Identifica y reflexiona sobre la función de los textos instructivos y sus características genéricas: organización de los datos; uso de numerales para ordenar cronológicamente los pasos de un procedimiento; brevedad y secuencia de la información; y precisión en las indicaciones. Comprende la utilidad de los recursos gráficos empleados en textos instructivos: diagramas de procesos, ilustraciones, cuadros y símbolos. Identifica y reflexiona respecto del vocabulario empleado en los instructivos: verbos en infinitivo o en imperativo para redactar instrucciones y términos secuenciales, como primero, después, antes de, enseguida, finalmente. Emplea signos de puntuación, como la coma, el punto y seguido, el punto y aparte, dos puntos.", "p4": "Analiza las características de diversos textos instructivos, como reglamentos, recetas médicas y de cocina, indicaciones para participar en un juego de mesa o de patio, e interpreta la información que presentan. Emplea verbos en infinitivo o imperativo, así como términos secuenciales, para escribir instrucciones. Describe el orden secuencial de un procedimiento. Reflexiona sobre la ortografía de palabras homónimas. Emplea signos de puntuación como el punto, la coma y los dos puntos."}, {"campo": "Lenguajes", "c": "Búsqueda y manejo reflexivo de información.", "p3": "Formula preguntas para realizar la búsqueda de información y las responde luego de localizar la información correspondiente. Emplea los signos de interrogación al elaborar preguntas. Usa variadas fuentes de consulta, entre ellas medios de comunicación y personas, recupera información pertinente, en función del propósito de búsqueda: resolver dudas, profundizar en un tema, escribir un texto, preparar una exposición, generar contenido en las redes sociales, etcétera. Reflexiona sobre el orden alfabético en diccionarios e índices de otras obras de consulta y lo emplea para localizar información. Comprende el sentido general de un texto informativo.", "p4": "Elabora preguntas para localizar la información que requiere y reflexiona sobre el uso de acentos gráficos en palabras que se usan para preguntar: qué, cómo, cuándo, dónde, por qué, para qué. Emplea elementos de los textos que organizan el contenido: títulos, subtítulos, viñetas, tipografía, palabras clave, para localizar información. Hace anticipaciones sobre el contenido de un libro, a partir de la información de la portada y contraportada. Diversifica el uso de fuentes de consulta en función del propósito y el tema, y reconoce la organización de materiales informativos y sus elementos. Parafrasea y/o ejemplifica planteamientos que expone un texto informativo. Consulta diccionarios y glosarios para resolver dudas relacionadas con el uso de ciertos términos."}, {"campo": "Lenguajes", "c": "Comprensión y producción de textos discontinuos para organizar actividades y ordenar información.", "p3": "Comprende y produce tablas, cuadros y otros textos discontinuos.", "p4": "Comprende y produce tablas, cuadros y otros textos discontinuos."}, {"campo": "Lenguajes", "c": "Comprensión y producción de resúmenes.", "p3": "Reflexiona sobre las funciones y características del resumen, como un tipo de texto conciso, cuyo objetivo principal es exponer de forma clara, precisa y breve las ideas más importantes de la fuente consultada y no como un producto de una tarea mecánica, alejada de la comprensión de las ideas expuestas. Determina cuál considera que es la información más relevante del texto por resumir, en función de sus propósitos, y la registra con sus propias palabras. Establece diferencias entre paráfrasis y síntesis. Emplea el punto y aparte para organizar un texto por párrafos.", "p4": "Explora y analiza el contenido de los textos por resumir. Relaciona el contenido del texto por resumir y los recursos complementarios: recuadros, tablas, gráficas e imágenes. Registra, con sus propias palabras, la información más relevante del texto por resumir, en función de los propósitos predeterminados; por ejemplo: escribir un texto informativo o presentar una exposición. Usa signos de interrogación y exclamación para distinguir una pregunta de la expresión de una emoción. Revisa y corrige errores de concordancia de género y número."}, {"campo": "Lenguajes", "c": "Comprensión y producción de textos instructivos para realizar actividades escolares y participar en diversos juegos.", "p3": "Comprende y produce instructivos para actividades y juegos.", "p4": "Comprende y produce instructivos para actividades y juegos."}, {"campo": "Lenguajes", "c": "Exposición sobre temas diversos.", "p3": "Reconoce características de la oralidad: recursos expresivos (estilo) y paralingüísticos o no lingüísticos, como movimiento corporal y gestos. Expone sobre diversos temas considerando: Como presentador o presentadora -Planear su exposición, lo cual incluye la elaboración de materiales de apoyo. -Realizar apuntes para usar como guía. -Usar pronombres y nexos. -Valorar el interés del auditorio Como audiencia -Escuchar o atender lo que se comunica, siguiendo el hilo de lo que se dice. -Tomar nota de lo que se quiere recordar.", "p4": "Expone sobre diversos temas, considerando: Como presentador o presentadora -Planear su exposición, lo cual incluye la elaboración de materiales de apoyo. -Realizar apuntes para usar como guía. -Reflexionar sobre el uso de sinónimos y antónimos. -Mantener el interés del auditorio, ajustando el volumen de voz y usando elementos paralingüísticos. -Responder dudas y atender inquietudes. Como audiencia -Escuchar atenta y comprensivamente, tomando notas. -Plantear preguntas o comentar sobre lo expuesto."}, {"campo": "Lenguajes", "c": "Comunicación a distancia con personas y propósitos diversos.", "p3": "Lee y comenta cartas reales y/o literarias. Identifica características y funciones de las cartas y otros textos epistolares enviados o recibidos por vía postal o electrónica. Intercambia mensajes epistolares, por vía postal y/o electrónica, con otras personas a partir de propósitos determinados, como saludar, invitar, felicitar, dar recados, informar, entre otros. Reflexiona, al comunicarse a distancia, sobre la necesidad de proteger sus datos personales y propone medidas para salvaguardar su integridad física y moral.", "p4": "Lee y analiza cartas reales y/o literarias. Usa convenciones de cartas y otros textos epistolares, como lugar, fecha, destinatario, dirección, en el intercambio postal y/o electrónico de mensajes. Mantiene comunicación a distancia con interlocutores y propósitos diversos, usando invitaciones, felicitaciones, recados, tarjetas postales y documentos adjuntos. Reflexiona sobre la necesidad de proteger sus datos personales y acuerda medidas y acciones para salvaguardar su integridad física y moral."}, {"campo": "Lenguajes", "c": "Análisis e intercambio de comentarios sobre empaques de productos y anuncios publicitarios.", "p3": "Reconoce y reflexiona sobre información que contienen los empaques y otros recursos publicitarios de productos diversos. Comprende de manera particular la relevancia de leer advertencias en el etiquetado de los productos por consumir y/o adquirir. Identifica mensajes, recursos gráficos y audiovisuales utilizados en diversos anuncios publicitarios. Analiza y comenta mensajes publicitarios para identificar beneficios y perjuicios derivados del consumo de los productos publicitados. Reflexiona acerca de las ventajas del consumo responsable y de la toma de decisiones con base en la información que se señala en los productos.", "p4": "Comprende advertencias e instrucciones incluidas en empaques y etiquetas de productos, así como la finalidad de sus anuncios publicitarios. Identifica emisor, receptor y propósito de anuncios publicitarios difundidos en diferentes medios y reflexiona sobre su veracidad. Reflexiona y comenta sobre la función persuasiva del lenguaje publicitario y el desarrollo del pensamiento crítico ante la publicidad."}, {"campo": "Lenguajes", "c": "Indagación, reelaboración y difusión de notas informativas con opiniones sobre hechos que afectan a la escuela y/o a la comunidad.", "p3": "Interactúa con medios de comunicación y comenta hechos noticiosos o noticias de su interés. Identifica qué, quién, cómo, cuándo, dónde y por qué en una nota informativa o reporte de noticia. Distingue entre notas informativas sobre noticias y opiniones acerca de las mismas. Discute y comparte noticias y opiniones sobre éstas a través de medios a su alcance, como periódico mural o boletín escolar.", "p4": "Conoce hechos noticiosos o noticias por medio de noticieros de radio y/o televisión. Compara cómo se presenta una misma noticia en distintos medios de comunicación e identifica diferencias y semejanzas en su tratamiento. Comenta y comparte sus impresiones sobre diferencias y semejanzas identificadas en el tratamiento de una noticia."}, {"campo": "Lenguajes", "c": "Uso de textos formales para atender diversos asuntos personales o del bienestar común.", "p3": "Explora y reconoce características de documentos personales, como acta de nacimiento, credenciales, cartilla de vacunación y comprobantes de estudio. Reflexiona sobre las funciones que tienen los documentos personales. Reconoce situaciones en las que los documentos personales son necesarios y/o útiles. Comprende la utilidad y el significado de las siglas de las instituciones que expiden los documentos, así como el valor de los sellos y firmas de autorización.", "p4": "Identifica formularios que se emplean en la gestión de determinados trámites personales. Comprende el contenido de documentos de uso en trámites personales. Reflexiona sobre las características gráficas y de diseño de dichos documentos: tipografía, logotipos, recuadros, subrayados. Reconoce la relación entre los documentos personales, su identidad y el ejercicio de sus derechos."}, {"campo": "Lenguajes", "c": "Entrevistas con personas de la comunidad para conocer diversos temas.", "p3": "Reconoce las características de la entrevista y sus propósitos. Observa, lee y comenta entrevistas. Comprende la utilidad de elaborar cuestionarios para obtener la información que desea, y reconoce la diferencia entre plantear preguntas cerradas y abiertas. Entrevista a personas de la comunidad, o externas, con conocimiento sobre el tema y con propósitos y preguntas definidos previamente. Respeta turnos para hablar y escuchar, presta atención a la persona entrevistada, adecua tono y volumen de voz, plantea preguntas elaboradas con antelación.", "p4": "Participa en entrevistas a distintos personajes de la comunidad acerca de condiciones problemáticas que padecen y posibilidades de solución. Elabora preguntas pertinentes que recaben la información deseada y evita plantear redundantes. Usa signos de interrogación y puntuación para escribir las preguntas y respuestas. Planifica entrevistas: define propósito(s), identifica persona(s) por entrevistar, plantea pregunta(s), duración, lugar, fecha. Usa pautas que norman intercambios orales: respetar turno para hacer uso de la palabra, prestar atención, adecuar tono y volumen de voz, emplear fórmulas de cortesía, plantear preguntas, exponer opiniones."}, {"campo": "Lenguajes", "c": "Indagación sobre la diversidad lingüística en su comunidad y el resto del país.", "p3": "Reconoce nombres de lugares, objetos y otras palabras cotidianas que tienen raíces en lenguas indígenas. Emplea, en forma oral y escrita, expresiones lingüísticas identificadas. Identifica expresiones variantes de su lengua materna en comunidades diferentes. Conoce lenguas diferentes a la suya, que se hablan en su localidad y en otras regiones del país.", "p4": "Observa y reproduce expresiones, orales y escritas, con raíces en lenguas originarias, que son usuales en su comunidad y en otras. Identifica lenguas que se hablan en su municipio y en su entidad, y en qué contextos y ocasiones. Reflexiona acerca de la relevancia que tiene para la vida social hablar y escribir según el contexto y los interlocutores e interlocutoras. Identifica variantes de su lengua materna que se usan en comunidades diferentes."}, {"campo": "Lenguajes", "c": "Uso de croquis y mapas para describir trayectos o localizar lugares.", "p3": "Observa croquis e identifica sus características y función. Identifica convenciones gráficas usadas en croquis. Reconoce y usa palabras para dar indicaciones sobre lugares o trayectos, como esquina, derecha, izquierda, al lado, paralelo. Elabora croquis para representar trayectos. Describe trayectos a partir de la información contenida en croquis.", "p4": "Observa mapas e identifica sus características y función. Identifica convenciones gráficas usadas en mapas. Comprende y usa vocabulario adecuado para dar indicaciones a fin de localizar lugares en un mapa. Elabora mapas para representar lugares."}, {"campo": "Lenguajes", "c": "Reconocimiento y reflexión sobre el uso de elementos de los lenguajes artísticos, en manifestaciones culturales y artísticas de la comunidad y del resto del mundo.", "p3": "Realiza recreaciones orales o escritas, acompañadas de una representación gráfica, como dibujos, cómics, historietas, secuencias de dibujos que realizan movimientos (“folioscopio” o flip books), a partir de la observación de videos o de la asistencia a lugares en donde se lleven a cabo manifestaciones culturales y artísticas. Compara movimientos, sonidos, formas, colores, gestos y objetos de manifestaciones culturales y artísticas de su comunidad con los de otros lugares. Expresa sus gustos e intereses hacia las manifestaciones culturales y artísticas, y realiza descripciones orales o escritas, para agruparlas de acuerdo con sus similitudes en un collage de dibujos, fotografías o recortes.", "p4": "Distingue movimientos, vestuarios, aromas, gestos, sonidos u objetos, en las manifestaciones culturales y artísticas de su comunidad y otros lugares del mundo, para reflexionar sobre su sentido y significado. Interactúa con manifestaciones culturales y artísticas de su comunidad y las compara con las de otros lugares, compartiendo sus conclusiones, mediante fotografías o dibujos comentados, o bien, mediante un escrito. Aprecia la diversidad cultural y lingüística en su país y el mundo mediante la reflexión sobre algunas manifestaciones culturales y artísticas de su interés para conocer su contexto."}, {"campo": "Lenguajes", "c": "Creación de propuestas con intención artística para mejorar la escuela y el resto de la comunidad.", "p3": "Identifica aspectos por mejorar de la escuela o del resto de la comunidad a partir de gustos e intereses propios, para generar ideas sobre distintas posibilidades de transformación y las representa mediante descripciones, dibujos, bocetos o maquetas. Dialoga sobre las transformaciones que han tenido distintos espacios escolares y del resto de la comunidad a partir de cambios impulsados a través de los lenguajes artísticos, como murales, esculturas, teatro callejero, recitales o bailes al aire libre. Explora y emplea movimientos, sonidos, formas, colores, texturas, gestos, objetos y palabras, para representar situaciones del espacio escolar o de la localidad. Crea producciones con distintos lenguajes, oral, escrito, musical, visual, teatral, dancístico, en las que destaque aspectos valiosos de la escuela o la comunidad. Construye propuestas artísticas de manera colectiva, a partir del uso de formas, colores, texturas, sonidos, movimientos y gestos, que permitan generar una mejora para el bien común.", "p4": "Crea producciones con distintos lenguajes, oral, escrito, musical, visual, teatral, dancístico, que representen vínculos respetuosos con la diversidad para su participación en la mejora comunitaria. Elabora una propuesta con intención artística, en colectivo, mediante movimientos, sonidos, formas, colores, gestos y objetos, para ofrecer propuestas de solución a situaciones o problemas identificados, ya sea en la escuela o en el resto de la comunidad. Opina de manera oral y escrita sobre propuestas realizadas por sus pares, así como de los elementos y recursos de los lenguajes que emplearon, y de qué manera consideran que éstas mejoran los espacios escolares y comunitarios. Experimenta con una variedad de formas, colores, texturas, sonidos, movimientos, gestos y objetos, para crear una propuesta artística colectiva que mejore el espacio que habita."}, {"campo": "Lenguajes", "c": "Lectura y creación de poemas, canciones y juegos de palabras para su disfrute.", "p3": "Lee y escucha poemas, canciones y juegos de palabras, de acuerdo con sus gustos e intereses, para propiciar su disfrute. Reconoce la rima y la aliteración como elementos rítmicos de poemas, canciones y juegos de palabras. Explora y combina sonidos y palabras para jugar con su acomodo y entonación, y modifica las palabras o la letra de una canción, siguiendo el ritmo original. Reconoce el contenido de distintos poemas y canciones y lo relaciona con experiencias personales o colectivas, para otorgarles un sentido propio. Realiza inferencias de sentido y significado, a partir de la lectura y socialización de trabalenguas, chistes, adivinanzas, refranes y acertijos.", "p4": "Reconoce algunas características del contexto de creación de un poema, canción o juego de palabras, para realizar interpretaciones de su significado. Establece relaciones entre el texto y las experiencias de vida, a partir de lo que le sugiere su lectura (figuras de significación). Identifica y reflexiona sobre los elementos rítmicos y melódicos de los textos poéticos: ritmos y duraciones, repetición de frases, palabras, sílabas, etcétera, en los poemas, canciones y juegos de palabras. Revisa de manera lúdica las variaciones que se dan en la lectura en voz alta, en cuanto a los tonos, pausas y acentos posibles. Asimismo, interpreta los diferentes tonos, pausas y acentos que realiza cada persona al leer en voz alta. Experimenta con la creación de poemas en verso y prosa, canciones o juegos de palabras, a partir del establecimiento de un tema que le sea significativo."}, {"campo": "Lenguajes", "c": "Experimentación con elementos visuales y sonoros en producciones colectivas artísticas.", "p3": "Combina secuencias de sonidos rápidos, lentos, agudos, graves, fuertes, débiles, con pausas y acentos, producidos con objetos del entorno, el cuerpo y/o la voz, para transmitir una idea colectiva. Realiza una composición visual colectiva con objetos a su alcance para representar distintas ideas y formas mediante esculturas efímeras, performances o instalaciones. Elabora un libro de artista o libro objeto, previa selección de textos, en el que experimenta con materiales diversos, como cartón, reciclados, telas, origami; y con el uso de diferentes elementos de los lenguajes artísticos, como puntos, líneas, texturas, formas, colores e imágenes y los comparte con sus pares.", "p4": "Crea un cortometraje colectivo, utilizando objetos cotidianos en animaciones con secuencias fotográficas y lo sonoriza para compartir ideas y experiencias. Recrea una experiencia colectiva mediante la intervención o transformación de un objeto significativo, con el uso de colores, telas, materiales reciclados y elementos de la naturaleza, entre otros. Elabora una producción artística colectiva que le permita imaginar formas de incidir constructivamente en su entorno natural y social, utilizando elementos y recursos de los lenguajes artísticos."}, {"campo": "Lenguajes", "c": "Reflexión y uso de los lenguajes artísticos, para recrear experiencias estéticas que tienen lugar en la vida cotidiana.", "p3": "Utiliza elementos de los lenguajes artísticos para representar experiencias significativas de su vida cotidiana; por ejemplo, un paseo familiar, puesta de sol, comida deliciosa. Identifica y recrea mediante el uso de formas, colores, texturas y sonidos, sensaciones, emociones, sentimientos e ideas que surgen de distintas experiencias significativas que tienen lugar en la vida cotidiana.", "p4": "Utiliza formas, colores, texturas, sonidos y movimientos para recrear, mediante diferentes producciones artísticas, obras de arte que le han causado interés e impacto. Reconoce las formas, líneas, colores y texturas de su entorno natural y social, y lo recrea mediante distintas producciones artísticas individuales y colectivas para reflexionar sobre la presencia de los lenguajes artísticos en la vida cotidiana."}, {"campo": "Lenguajes", "c": "Representación de hechos y experiencias significativas mediante el empleo de recursos textuales, visuales, corporales y sonoros.", "p3": "Representa lúdicamente una experiencia significativa con el uso de movimientos, formas, gestos, sonidos, colores y objetos para construir nuevos significados. Reelabora acciones cotidianas al jugar con movimientos rápidos o lentos, fuertes o débiles, con pausas o acentos, imaginando distintos espacios donde se llevan a cabo para descubrir nuevas maneras de realizarlas. Contrasta lúdicamente el lenguaje figurado y el literal, por medio de preguntas retóricas, comparaciones y metáforas. Describe un hecho significativo mediante la estructura narrativa de su elección, estableciendo para cada parte una secuencia de movimientos, con acompañamiento musical, lo cual complementa con desplazamientos, pausas, acentos y velocidades corporales.", "p4": "Selecciona los recursos textuales que le permiten recrear un hecho significativo, de acuerdo con el énfasis que busca comunicar. Reflexiona sobre una experiencia significativa que ha transformado su manera de ser o vivir, y la recrea por medio de una historia, que representa con objetos animados y sonidos corporales. Realiza un cortometraje con imágenes de su entorno, o elabora un folioscopio (flip book), para narrar un acontecimiento significativo de la comunidad."}, {"campo": "Lenguajes", "c": "Identificación del uso de la fantasía y la realidad en diferentes manifestaciones culturales y artísticas.", "p3": "Distingue la fantasía de la realidad en manifestaciones culturales y artísticas de su comunidad, y de otros lugares del mundo. Aprecia el uso intencional de formas, colores, sonidos, texturas, movimientos, gestos u objetos, que expresan la realidad y la fantasía en manifestaciones culturales y artísticas. Comenta impresiones y sensaciones, a partir de la identificación del uso intencional de formas, colores, sonidos, texturas, movimientos o gestos, en las manifestaciones culturales y artísticas de su interés.", "p4": "Analiza la representación de distintas formas de ser y estar en el mundo, incluyendo al género, en manifestaciones culturales y artísticas que sean de su interés. Crea un personaje, empleando elementos de los lenguajes artísticos, que retome aspectos reales y fantásticos de una manifestación cultural o artística, para expresar sus gustos e intereses. Escribe comentarios críticos sobre manifestaciones culturales y artísticas, y los comparte por medio de una publicación física y/o electrónica elaborada con sus compañeras y compañeros."}, {"campo": "Lenguajes", "c": "Lectura dramatizada y representación teatral.", "p3": "Reconoce características de los textos dramáticos, como diálogos, acotaciones, listado de personajes, espacio y temporalidad, al realizar una lectura comprensiva de los mismos. Transforma objetos y recursos a su alcance de manera creativa, para utilizarlos en la representación de personajes, al realizar una lectura dramatizada. Improvisa con el uso del cuerpo y la voz algunas situaciones significativas, identificadas en distintas narraciones. Participa en juegos de roles en los que representa diferentes personajes, en espacios y tiempos definidos. Explora posibilidades expresivas del cuerpo, el espacio y el tiempo, en la construcción de historias narrativas.", "p4": "Explora en colectivo el movimiento, el gesto, la forma, el color y el sonido, para recrear fragmentos de una lectura de su interés, por medio del teatro de títeres, sombras o papel. Realiza, en colectivo, una lectura dramatizada o teatro de atril de un texto dramático, jugando con combinaciones de secuencias de sonidos rápidos, lentos, agudos, graves, fuertes, débiles, con pausa y con acentos variados. Identifica la estructura externa del texto dramático, conformada por diálogos, listado de personajes y acotaciones. Conoce otros tipos de textos en los que se puede realizar una lectura dramatizada: historieta, cómic, manga, que contienen onomatopeyas, símbolos, viñetas, etcétera."}, {"campo": "Lenguajes", "c": "Comprensión y producción de cuentos para su disfrute.", "p3": "Escucha y lee cuentos de distintos orígenes y autores. Reconoce relaciones causa-efecto entre las partes de los cuentos. Desarrolla una historia con una secuencia causal de hechos derivados de un conflicto inicial que se soluciona al final. Planea, escribe, revisa, corrige y comparte cuentos sobre temas de su interés. Reconoce semejanzas y diferencias entre los cuentos y los eventos de la vida cotidiana, para darles un sentido y significado propios.", "p4": "Selecciona, lee y escucha cuentos de distintos orígenes y autores. Reflexiona sobre el uso de los tiempos pretérito y copretérito para narrar sucesos pasados, y sobre el empleo del presente en diálogos directos. Planea, escribe, revisa, corrige y comparte cuentos sobre diversos temas. Escribe un cuento de manera colectiva y elabora los personajes con objetos cotidianos y realiza una presentación frente a un público."}, {"campo": "Saberes y Pensamiento Científico", "c": "Estructura y funcionamiento del cuerpo humano: sistemas locomotor y digestivo, así como prácticas para su cuidado.", "p3": "Describe semejanzas y diferencias entre los órganos sexuales de las personas, sus nombres correctos y en su lengua materna, e identifica que estos determinan el sexo biológico; propone o practica acciones y hábitos de higiene para su cuidado como parte de la salud sexual. Comprende que los cuerpos cambian a lo largo del tiempo, al reconocer la variabilidad en tamaño, forma, funciones y características; explica que todas las culturas tienen maneras diferentes de ver los cuerpos y que todos merecen respeto, incluido el de las personas con discapacidad, como parte del derecho a una vida libre de violencia.", "p4": "Indaga, describe y representa mediante modelos, los caracteres sexuales primarios y secundarios, al comparar los cuerpos de niñas y niños con los de adolescentes; establece relaciones entre los cambios que se presentan durante la pubertad y la adolescencia, con el desarrollo biológico del ser humano. Comprende la importancia de llevar a cabo hábitos de higiene de los sistemas sexuales; practica acciones de autocuidado y toma decisiones para fortalecerlas. Comprende que la menstruación es un ciclo natural de desa rrollo físico de las niñas a partir de describir y representar sus fases; explica la diversidad de síntomas físicos y sensaciones que se pueden experimentar, algunas creencias y tabúes alrededor de ésta, así como medidas de cuidado e higiene personal. Indaga y comunica ideas, valores, prácticas, costumbres y estereotipos que existen en las familias y la comunidad, en torno a los cambios anatómicos y fisiológicos que se presentan tanto en la pubertad como en la adolescencia, para distinguir entre las niñas y los niños, de las y los adolescentes."}, {"campo": "Saberes y Pensamiento Científico", "c": "Estructura y funcionamiento del cuerpo humano: sistema sexual; cambios en la pubertad e implicaciones socioculturales.", "p3": "Reconoce los cambios de la pubertad y su cuidado.", "p4": "Reconoce los cambios de la pubertad y su cuidado."}, {"campo": "Saberes y Pensamiento Científico", "c": "Alimentación saludable, con base en el Plato del Bien Comer, así como prácticas culturales y la toma de decisiones.", "p3": "Explica la importancia del consumo de una alimentación higiénica y variada que incluya verduras y frutas; cereales y tubérculos; leguminosas y alimentos de origen animal acorde con el Plato del Bien Comer y sus prácticas culturales, para el buen funcionamiento del cuerpo. Propone y practica acciones para favorecer una alimentación saludable, como consumir alimentos naturales, de la localidad y de temporada, en la cantidad recomendada para su edad, beber agua simple potable; disminuir el consumo de alimentos con exceso de grasas, azúcares y sal, entre otras. Comprende que las personas tienen diferentes necesidades alimentarias, de acuerdo con su edad y actividad física, y que satisfacerlas impacta en la economía familiar.", "p4": "Indaga y describe los nutrimentos que proporcionan los alimentos que consume e identifica los que necesita incluir en su alimentación, así como los beneficios para su salud y para realizar sus actividades diarias. Identifica y analiza la influencia de diversos medios de comunicación o redes sociales en el consumo de alimentos con alto contenido de grasa, azúcares y sal, así como su impacto en la salud, y toma decisiones que mejoren tanto su alimentación como la economía personal y familiar. Reconoce y valora las prácticas culturales, relacionadas con la alimentación saludable presentes en su comunidad, como la milpa, y la rotación de cultivos, que favorecen la producción y consumo responsable, la obtención de una variedad de alimentos y el cuidado del medio ambiente. Indaga y explica qué productos y alimentos son convenientes adquirir o consumir en su familia, por su costo económico y el impacto medio ambiental que provocan."}, {"campo": "Saberes y Pensamiento Científico", "c": "Interacciones entre plantas, animales y el entorno natural: nutrición y locomoción.", "p3": "Indaga y describe la locomoción de animales, a partir de reconocer las formas en las que se mueven y desplazan en la búsqueda de alimento, agua o refugio y su relación con las características del lugar donde viven. Clasifica animales en vertebrados e invertebrados, a partir de sus características, y reconoce que los seres humanos pertenecen al grupo de los vertebrados, con base en similitudes y diferencias en la locomoción de otros animales. Explica el movimiento y desplazamiento de algún animal vertebrado de su interés, con modelos que muestran la acción coordinada de los sistemas óseo y muscular.", "p4": "Identifica y clasifica animales, con base en su tipo de alimentación: herbívoros, carnívoros y omnívoros, y su relación con el lugar donde viven. Identifica, representa y explica el proceso de nutrición de plantas, en el que intervienen la luz solar, el agua, las sales minerales y el dióxido de carbono, sin llegar al uso de fórmulas químicas. Analiza y describe la estructura de cadenas alimentarias: productores (plantas), consumidores (animales), y descomponedores (hongos y bacterias), así como su relación con el lugar donde habitan. Explica las condiciones del entorno propicias para la existencia y sobrevivencia de plantas y animales, entre ellos el ser humano; reconociendo su compromiso para cuidarlo."}, {"campo": "Saberes y Pensamiento Científico", "c": "Relaciones entre los factores físicos y biológicos que conforman los ecosistemas y favorecen la preservación de la vida.", "p3": "Describe la importancia del aire, el agua, el suelo y el Sol para todos los seres vivos, a partir de representar las relaciones que establecen para su alimentación y protección. Reconoce y describe las condiciones en las que se encuentra el aire, el suelo y el agua en el lugar en donde vive; y argumenta acerca del impacto de dichas condiciones en la vida de plantas, animales y personas. Identifica y valora la presencia del aire, agua, suelo y Sol en las expresiones culturales de diversas personas y grupos.", "p4": "Identifica, representa y explica las interacciones entre los factores biológicos (plantas, animales, incluido el ser humano, hongos y organismos microscópicos como bacterias), y los factores físicos (agua, aire, suelo y Sol) en la conformación de los ecosistemas. Compara y describe la dinámica de distintos ecosistemas de México, a partir de la diversidad de seres vivos que habitan en ellos y las características de los factores físicos que los conforman. Reconoce y explica la importancia de los ecosistemas en la vida cotidiana de las personas y pueblos, así como en sus manifestaciones culturales."}, {"campo": "Saberes y Pensamiento Científico", "c": "Impacto de las actividades humanas en la naturaleza y en la salud.", "p3": "Indaga y describe el impacto de las actividades humanas del entorno natural del lugar donde vive, y establece relaciones causaefecto en la naturaleza y en la salud de las personas. Indaga saberes y prácticas de diversos pueblos y culturas, para cuidar la naturaleza y establecer una relación armónica. Propone y practica acciones que favorecen el cuidado de la naturaleza, la salud de las personas y el bienestar animal.", "p4": "Indaga y describe los problemas de contaminación de agua, aire y suelo, y generación de residuos sólidos en su comunidad; establece relaciones causa-efecto en los ecosistemas, así como en la salud de las personas y en el bienestar de pueblos y culturas. Propone y practica acciones de consumo responsable para prevenir o mitigar la contaminación de agua, aire y suelo, así como la generación de residuos sólidos."}, {"campo": "Saberes y Pensamiento Científico", "c": "Propiedades de los materiales: masa y longitud; relación entre estados físicos y la temperatura.", "p3": "Describe la masa y la longitud como propiedades medibles de los materiales, a partir de experimentar con distintos objetos y materiales y el uso de instrumentos como balanza y regla, y establece relaciones entre el material, tamaño y forma. Reconoce al kilogramo (kg) como la unidad básica de medida de la masa, y al metro (m) como la unidad básica de medición de la longitud (distancia entre dos puntos), así como otras unidades que se utilizan en su comunidad para medir la masa y la longitud.", "p4": "Describe y representa los cambios físicos del ciclo del agua: evaporación, condensación, solidificación, y su relación con la variación de la temperatura. Indaga y describe los cambios de estado físico de los materiales, a partir de experimentar con la variación de la temperatura y sus efectos en diversos materiales (chocolate, mantequilla, agua, hielo, vela -cera-, alcohol, gelatina, otros). Reconoce los avances tecnológicos en el diseño de termómetros más precisos y su aplicación en la vida cotidiana, la industria, la medicina y la investigación."}, {"campo": "Saberes y Pensamiento Científico", "c": "Formación de mezclas y sus propiedades.", "p3": "Identifica al agua como disolvente a partir de experimentar con distintos materiales como aceite, talco, azúcar, sal, arena, y los clasifica en solubles o insolubles en agua. Describe la aplicación de la solubilidad del agua en actividades cotidianas y en la industria.", "p4": "Comprende que una mezcla está formada por diversos materiales en diferentes proporciones, a partir de experimentar con mezclas de materiales como agua y arena, agua y aceite, semillas y clips. Experimenta con mezclas de diversos materiales y proporciones, para identificar sus propiedades de color y sabor."}, {"campo": "Saberes y Pensamiento Científico", "c": "Efectos de la aplicación de fuerzas y del calor sobre los objetos.", "p3": "Describe y representa los movimientos de personas, objetos y animales, considera la dirección (izquierda a derecha, de arriba a abajo), la rapidez (lento o rápido), y su trayectoria (recta, curva o zigzag), así como los puntos de referencia. Describe el efecto de las fuerzas sobre los objetos: movimiento y reposo, al experimentar con los cambios en la rapidez o la dirección del movimiento, sin llegar a la noción de intensidad de la fuerza. Experimenta con la aplicación de fuerzas y el movimiento, con base en el diseño de distintos recorridos (circuitos), en los que interaccionan diversos objetos que chocan, son jalados o empujados, además de considerar diferentes distancias.", "p4": "Comprende algunas formas de generar calor, como la fricción y el contacto, e indaga su importancia en la vida cotidiana. Describe los efectos del calor sobre los objetos, a partir de experimentar con ellos al frotarlos unos con otros; reconoce que la transferencia de calor va del objeto de mayor al de menor temperatura. Diseña y construye un dispositivo o juguete sencillo que funcione con calor, y explica su funcionamiento."}, {"campo": "Saberes y Pensamiento Científico", "c": "Sistema Tierra-Luna-Sol: interacciones, cambios y regularidades.", "p3": "Indaga y representa con modelos, los movimientos de rotación y traslación de la Tierra, y los asocia con la sucesión del día y la noche, con las estaciones del año y el cambio del punto de aparición y ocultamiento del Sol en el horizonte. Describe y representa mediante modelos el movimiento de rotación y traslación de la Luna y su relación con sus fases. Indaga aportaciones de diversas culturas en relación con el movimiento de la Tierra, la Luna y el Sol, y su influencia en aspectos socioculturales.", "p4": "Indaga la formación de eclipses de Sol y de Luna, y describe las similitudes y diferencias entre ellos. Describe y representa con modelos, la formación de eclipses solares y lunares, en los que considera los movimientos de la Tierra y la Luna con respecto al Sol, los tamaños de los cuerpos celestes, las distancias a las que se encuentran, las propiedades de la luz, en particular su propagación rectilínea, así como el punto de referencia del observador. Reconoce que hay diversas maneras de explicar los fenómenos naturales, al recuperar narraciones y descripciones desde otras perspectivas culturales, alrededor de las causas y consecuencias de la formación de eclipses."}, {"campo": "Saberes y Pensamiento Científico", "c": "Estudio de los números.", "p3": "Expresa oralmente la sucesión numérica hasta cuatro cifras, en español y hasta donde sea posible, en su lengua materna, de manera ascendente y descendente a partir de un número natural dado. Identifica y usa los números ordinales, en español y en su lengua materna para ordenar objetos o para indicar el lugar que ocupan dentro de una colección de hasta diez elementos. A través de situaciones cotidianas cuenta, representa de diferentes formas, interpreta, ordena, lee y escribe números naturales de hasta cuatro cifras; identifica regularidades en los números que representan decenas, centenas y millares. Representa, con apoyo de material concreto y modelos gráficos, fracciones: medios, cuartos, octavos, dieciseisavos, para expresar el resultado de mediciones y repartos en situaciones vinculadas a su contexto. Identifica la unidad de referencia en representaciones de medios, cuartos, octavos, dieciseisavos que expresan el resultado de mediciones y repartos. Propone expresiones aditivas equivalentes de medios, cuartos, octavos o dieciseisavos; también compara fracciones (con igual numerador o igual denominador) utilizando los signos > (mayor que), < (menor que) o = (igual). Conoce y usa las fracciones 1/10 y 1/100 con el apoyo del metro graduado.", "p4": "Expresa oralmente la sucesión numérica hasta cinco cifras, en español y hasta donde sea posible, en su lengua materna, de manera ascendente y descendente a partir de un número natural dado. Identifica y usa los números ordinales, en español y en su lengua materna para ordenar objetos, o para indicar el lugar que ocupan dentro de una colección de hasta veinte elementos. A través de situaciones cotidianas y de diversos contextos, cuenta, representa de diferentes formas, interpreta, ordena, lee y escribe números naturales de hasta cinco cifras; identifica regularidades en los números. A partir de situaciones vinculadas a diferentes contextos, representa, interpreta, lee, escribe y ordena números decimales hasta centésimos en notación decimal y con letras apoyándose en modelos gráficos; comprende la equivalencia entre décimos, centésimos y la unidad. Representa, con el apoyo de material concreto y modelos gráficos, fracciones: tercios, quintos, sextos, novenos y décimos, para expresar el resultado de mediciones y repartos en diversos contextos. Propone expresiones aditivas equivalentes de tercios, quintos, sextos, novenos y décimos; también compara fracciones (con igual numerador o igual denominador) utilizando los signos > (mayor que), < (menor que) o = (igual). Identifica y representa la unidad de referencia, a partir de una fracción dada de esta en la resolución de situaciones problemáticas."}, {"campo": "Saberes y Pensamiento Científico", "c": "Suma y resta, su relación como operaciones inversas.", "p3": "Resuelve situaciones problemáticas vinculadas a su contexto que implican sumas de números naturales de hasta tres cifras utilizando el algoritmo convencional. Resuelve situaciones problemáticas vinculadas a su contexto que implican restas de números naturales de hasta tres cifras utilizando agrupamientos y el algoritmo convencional. Utiliza, explica y comprueba sus estrategias para calcular mentalmente sumas o restas de números naturales de hasta tres cifras. Resuelve problemas de suma o resta vinculados a su contexto, que impliquen el uso de fracciones (medios, cuartos, octavos, dieciseisavos), con el apoyo de material concreto o representaciones gráficas.", "p4": "Resuelve situaciones problemáticas vinculadas a su contexto que implican sumas o restas de números naturales de hasta cuatro cifras utilizando los algoritmos convencionales. Resuelve situaciones problemáticas vinculadas a su contexto que implican sumas o restas de dos números decimales hasta centésimos, con apoyo de material concreto y representaciones gráficas. Resuelve situaciones problemáticas que implican sumas o restas de fracciones con diferente denominador (tercios, quintos, sextos, novenos y décimos) vinculados a su contexto, mediante diversos procedimientos, en particular, la equivalencia."}, {"campo": "Saberes y Pensamiento Científico", "c": "Multiplicación y división, su relación como operaciones inversas.", "p3": "Resuelve multiplicaciones cuyo producto es un número natural de tres cifras, mediante diversos procedimientos (suma de multiplicaciones parciales, multiplicaciones por 10, 20, 30, entre otros). Resuelve situaciones problemáticas vinculadas a su contexto que implican divisiones (reparto y agrupamiento), mediante diversos procedimientos, en particular con la multiplicación; representa la división como: a ÷ b = c. Construye y usa un repertorio multiplicativo de factores de una cifra, para resolver multiplicaciones y divisiones (cuántas veces está contenido el divisor en el dividendo). Utiliza, explica y comprueba sus estrategias para calcular mentalmente productos de números naturales de una cifra.", "p4": "Resuelve situaciones problemáticas vinculadas a su contexto que implican multiplicaciones de números naturales de hasta tres por dos cifras, a partir de diversas descomposiciones aditivas y el algoritmo convencional. Resuelve situaciones problemáticas vinculadas a su contexto que impliquen el uso de un algoritmo para dividir números naturales de hasta tres cifras entre un número de una o dos cifras; reconoce al cociente y al residuo como resultado de una división. Utiliza, explica y comprueba sus estrategias para calcular mentalmente el doble o el triple de un número natural de dos cifras y la mitad de un número natural par de dos cifras."}, {"campo": "Saberes y Pensamiento Científico", "c": "Cuerpos geométricos y sus características.", "p3": "Identifica las figuras geométricas que componen diversos objetos (edificios, casas, cajas, muebles, y cuerpos geométricos); construye prismas rectos a partir de reconocer la configuración de cuadrados y rectángulos que lo componen.", "p4": "Reconoce y describe las características de distintos prismas rectos (números de vértices y aristas, número y formas de caras); reconoce los desarrollos planos que permiten construirlos, en particular el cubo."}, {"campo": "Saberes y Pensamiento Científico", "c": "Figuras geométricas y sus características.", "p3": "A partir de retículas de triángulos, cuadrados o puntos, construye, analiza y clasifica figuras geométricas a partir de sus lados y su simetría, en particular a los triángulos; explica los criterios utilizados para la clasificación.", "p4": "Con el apoyo de instrumentos geométricos, construye, analiza y clasifica cuadriláteros a partir de sus lados, ángulos y diagonales; explica los criterios utilizados para la clasificación."}, {"campo": "Saberes y Pensamiento Científico", "c": "Medición de longitud, masa y capacidad.", "p3": "Resuelve situaciones problemáticas vinculadas a su contexto que impliquen, medición, estimación y comparación, de longitudes, masas y capacidades, con el uso del metro, kilogramo, litro, medios y cuartos de estas unidades; en el caso de la longitud, el decímetro y centímetro.", "p4": "Mide y estima longitud, masa y capacidad."}, {"campo": "Saberes y Pensamiento Científico", "c": "Cálculo de perímetro y área.", "p3": "Calcula perímetros y áreas de figuras.", "p4": "Distingue entre contorno y superficie de caras de objetos de su entorno y de figuras y cuerpos geométricos; reconoce al perímetro como la suma de las longitudes de sus lados y área como la medida de la superficie; estima y compara áreas de manera directa, con unidades no convencionales y con retículas de cuadrados."}, {"campo": "Saberes y Pensamiento Científico", "c": "Medición del tiempo.", "p3": "Lee relojes de manecillas y digitales; compara y ordena la duración de diferentes actividades cotidianas o acontecimientos de la comunidad, usando la hora, media hora, cuarto de hora y los minutos.", "p4": "Resuelve situaciones problemáticas que implican el uso de equivalencias entre diferentes escalas de tiempo: día, hora, minuto y segundo; reconoce al segundo como unidad básica de tiempo. Comprende y utiliza expresiones que indican temporalidad como quincena, bimestre, semestre, novenario, lustro, quinquenio, siglo, milenio, decenio, sexenio."}, {"campo": "Saberes y Pensamiento Científico", "c": "Organización e interpretación de datos.", "p3": "Recolecta, organiza, representa e interpreta datos en tablas de frecuencias o pictogramas para responder preguntas de su interés.", "p4": "Interpreta tablas de frecuencias y gráficas de barras, y reconoce la moda de un conjunto de datos para responder preguntas."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Representaciones cartográficas de la localidad y/o comunidad.", "p3": "Elabora representaciones cartográficas de la localidad o pueblo donde vive, considerando los puntos cardinales dentro de la entidad. Indaga sobre los ecosistemas locales y sus características, y los concibe como espacios vivos y complejos de la naturaleza. Comprende las relaciones e interdependencias de sus componentes, como sustento de la vida en la Tierra y de los seres vivos que la habitamos. Reflexiona situaciones de riesgo o amenazas a la preservación de los ecosistemas, y sus posibles causas locales. Conoce cómo se puede contribuir a preservar los ecosistemas, así como sobre la importancia del respeto, responsabilidad y colaboración en su cuidado y aprovechamiento sustentable, a través del tiempo, con equidad y justicia social.", "p4": "Elabora representaciones cartográficas de la entidad y el territorio nacional, considerando los puntos cardinales. Indaga sobre los cambios en los componentes del ecosistema (suelo, agua, aire y seres vivos, entre otros), por causas físicas o sociales. Comprende que las personas de distintas culturas interactúan de diferente manera con los ecosistemas, distinguiendo las formas de trabajo en que las mujeres y las personas de los pueblos originarios, afrodescendientes y otras culturas de su entidad o país, conviven de manera más armónica con los ecosistemas, protegiéndolos y preservándolos. Valora la importancia del respeto y colaboración en su cuidado y aprovechamiento sustentable, con equidad y justicia social. Propone acciones para contribuir en la preservación de los ecosistemas, de manera personal y comunitaria, desde el trabajo y en la convivencia cotidiana de la comunidad, el barrio, el pueblo o la ciudad."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Valoración de los ecosistemas: características del territorio.", "p3": "Representa cartográficamente las características del territorio de su comunidad, como espacio de vida. Indaga las interacciones de la comunidad con los ecosistemas del territorio, reconociendo: rasgos físicos, altitud, biodiversidad local (tipo de animales y plantas), tipos de suelo, tipos de cultivos, aire, agua (de dónde llega el agua que toman en su comunidad, manantiales, ríos, lagunas, barrancas). Analiza críticamente cómo interactúa con ellos cotidianamente, así como los beneficios que obtiene para su supervivencia junto con su comunidad (alimentación, salud, vestido, economía, bienestar), su buen manejo (valores culturales de bienestar y conservación del territorio y sus ecosistemas en la vida cotidiana), su manejo inadecuado (valores culturales que degradan el territorio, sus ecosistemas, la vida, la salud y la tradición cultural de la comunidad), y evalúa los impactos positivos y negativos de sus interacciones y de la sociedad con la naturaleza. Comprende la importancia de que las personas actuemos con responsabilidad, disminuyendo el deterioro de los ecosistemas, a partir de prácticas para la preservación de la vida y el bienestar de la comunidad.", "p4": "Representa la visión de su comunidad respecto a su relación con la naturaleza y las tradiciones culturales construidas, a partir de su interacción con los ecosistemas del territorio. Analiza críticamente otras formas de interacción de las sociedades con la naturaleza, que afectan los sistemas de vida en su territorio y en su comunidad, reconociendo que la vida humana y la de otros seres vivos depende de que se establezcan prácticas que reduzcan el impacto negativo, no sólo en la naturaleza, sino también en la sociedad, tales como el consumo sustentable, el comercio justo o economía solidaria, la agroecología y la protección del patrimonio biocultural. Dialoga sobre el derecho humano a un ambiente sano, adecuado para su desarrollo y bienestar y cómo es posible ejercerlo."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Interculturalidad y sustentabilidad: formas en las que los pueblos originarios cuidan la naturaleza.", "p3": "Reconoce y analiza otras cosmovisiones o formas de relación de la sociedad con la naturaleza de pueblos originarios, campesinos y de otras culturas del país, que han establecido patrones de uso de los ecosistemas, sustentados en valores que tienen como principio una relación de respeto, equilibrio y reciprocidad con los ecosistemas de la Tierra y los otros seres vivos, así como su contribución en un manejo responsable o sustentable de su riqueza natural y en su preservación.", "p4": "Indaga y analiza formas diversas en que las mujeres contribuyen en el cuidado y la preservación del ambiente y la salud, así como acciones sociales y políticas que se orientan a recuperar prácticas tradicionales que ayuden a reducir y a transformar el deterioro que ocasiona la cultura capitalista dominante en la naturaleza y la sociedad. Comprende la importancia de una alimentación saludable y revalora la cultura de la Milpa y el Maíz en México, desarrollando"}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Cuidado de los ecosistemas para su regeneración, preservación responsable y sustentable.", "p3": "Reflexiona situaciones de riesgo o amenazas a la preservación de los ecosistemas, y sus posibles causas locales. Indaga y analiza cómo se puede contribuir a regenerar y preservar los ecosistemas, y argumenta la importancia de que las personas actuemos con responsabilidad y colaboración, disminuyendo el deterioro de los ecosistemas, a partir de prácticas para la preservación de la vida y el bienestar de la comunidad.", "p4": "Indaga y analiza formas diversas en que las mujeres de diversas culturas contribuyen en el cuidado, la regeneración y la preservación del ambiente y la salud, así como acciones sociales y políticas que se orientan a recuperar prácticas que ayuden a reducir el deterioro en la naturaleza. Construye juicios éticos y dialoga respecto de la importancia del respeto y colaboración en el cuidado y aprovechamiento sustentable de los ecosistemas, con equidad y justicia. Propone y lleva a la práctica acciones para contribuir en la regeneración y preservación de los ecosistemas, de manera personal y comunitaria en la convivencia cotidiana. Reconoce que muchas de las especies endémicas que se han ido perdiendo fueron producto de desarrollos históricos de largo tiempo; identifica la relación de esos procesos con la historia de las personas y los pueblos."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Acciones de prevención ante peligros o amenazas de fenómenos naturales y acciones humanas.", "p3": "Indaga en fuentes orales, bibliográficas, hemerográficas, y en medios digitales, desastres ocurridos en la localidad o en la entidad, localiza en mapas los lugares en los que ocurrieron los desastres y los relaciona con los fenómenos naturales, muestra empatía y solidaridad con las personas afectadas. Participa en acciones individuales y colectivas, en la escuela, barrio, pueblo, comunidad y entidad como parte de una cultura de prevención y autoprotección. Identifica zonas de seguridad o albergues ante peligros o amenazas en la localidad donde vive, asociados a fenómenos naturales como: sismos, huracanes, deslaves, inundaciones, tsunamis e incendios, entre otros. Elabora croquis y mapas para localizarlos y describe las rutas para llegar a ellos. Comprende la necesidad de participar en acciones individuales y colectivas, encaminadas a la prevención de riesgos, al autocuidado y cuidado de la familia, y otras personas en la casa, la escuela y la comunidad, como la implementación de una mochila de emergencia.", "p4": "Indaga en fuentes orales, bibliográficas, hemerográficas, digitales algunos desastres asociados a fenómenos naturales y/o generados por acciones humanas ocurridos en la entidad y el país, a lo largo de la historia; utiliza entrevistas generacionales como recursos para obtener los testimonios. Elabora mapas para localizar los lugares en los que ocurrieron los desastres y los relaciona con los fenómenos naturales o con acciones humanas. Identifica qué desastres han ocurrido en algunas entidades que no se presentan en otras y argumenta acerca de las causas. Indaga sobre planes y protocolos de emergencia, (sismos, terremotos, huracanes, inundaciones, tsunamis, entre otros); participa acciones colectivas encaminadas a una cultura de prevención y autoprotección y muestra empatía por las personas afectadas por un desastre para proponer acciones de ayuda solidaria."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Caracterización y localización del territorio donde vive, la entidad y México.", "p3": "Identifica las características de la comunidad y la entidad como suelo, clima, animales y plantas, cuerpos de agua, relieve; las representa en dibujos, croquis y mapas. Localiza y reconoce la forma, extensión y límites territoriales, la", "p4": "Localiza y reconoce características del territorio de México, como suelo, clima, regiones naturales, relieve, cuerpos de agua, extensión, límites terrestres, marítimos y aéreos, así como las entidades federativas que lo integran."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Composición sociocultural de la entidad federativa y de México.", "p3": "Dialoga acerca de las aportaciones de pueblos originarios, afromexicanos, migrantes y diversas comunidades, entre otros, al patrimonio cultural y a la memoria colectiva de la comunidad y entidad. Identifica formas de pensar, hablar, convivir, vestir, celebrar y compartir en su comunidad y la entidad. Reconoce que las leyes garantizan el derecho a vivir con igualdad y dignidad, así como a expresar sus prácticas culturales y lingüísticas, y a respetar y valorar las prácticas de otras personas o grupos.", "p4": "Analiza la conformación pluricultural y plurilingüe de México que se expresa en pueblos originarios, afromexicanos, migrantes y diversas comunidades que habitan México, que tienen prácticas culturales e historias que se manifiestan en formas de pensar, hablar, convivir, vestir, celebrar y compartir, apreciando sus aportaciones al patrimonio cultural del país y reconociendo los problemas y dificultades que enfrentan. Representa en mapas la ubicación de los pueblos originarios y afromexicanos que habitan en su entidad y el territorio nacional. Reconoce que en la Constitución Política de los Estados Unidos Mexicanos se garantiza el derecho a vivir con igualdad y dignidad, así como a expresar prácticas culturales y lingüísticas de los pueblos originarios y afromexicanos, y a respetar y valorar las prácticas de diversos grupos y personas."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "La vida cotidiana antes de la primera invasión europea y en el México colonial.", "p3": "Indaga en fuentes primarias o secundarias bibliográficas, orales, hemerográficas, digitales, iconográficas, materiales (objetos de uso cotidiano, edificaciones), sobre pueblos originarios que habitaron lo que hoy es el territorio nacional, antes de la primera invasión europea, por ejemplo, Olmecas, Teotihuacanos, Mayas, Zapotecas, Toltecas, Mixtecas y Mexicas. Si es el caso, identifica los pueblos originarios que habitaban el territorio que hoy ocupa su entidad antes de la primera invasión europea. Reconoce la ubicación de pueblos originarios en mapas, códices y narraciones, analiza algunos aspectos de la vida cotidiana: ¿cómo vivían?, ¿cómo eran sus casas y a qué se dedicaban?, ¿cómo se alimentaban y vestían?, ¿cómo se organizaban y trabajaban en la familia y la comunidad?, ¿cuáles eran sus creencias?, ¿cómo se divertían?, ¿cómo educaban a sus hijas e hijos?, ¿cuáles eran las tareas de las mujeres? Identifica personas y grupos relevantes que incidieron en la historia de los pueblos que habitaban el territorio que hoy conocemos como México, antes de la primera invasión europea.", "p4": "Indaga en fuentes primarias o secundarias bibliográficas, hemerográficas, digitales, orales sobre la invasión española, y analiza algunos de sus impactos en las poblaciones originarias. Identifica, en el período de la conquista, cómo contribuyeron los diversos grupos sociales y cuáles fueron los que tuvieron más poder y mejores condiciones, en contraste a la situación de injusticia y dialoga acerca de la desigualdad que vivieron mujeres, hombres, niñas y niños de los pueblos originarios, afrodescendientes y personas esclavizadas. Reflexiona de manera intercultural crítica sobre el 12 de octubre para desmontar la idea del “encuentro de dos mundos o día de la raza” y la resistencia de los pueblos originarios y afrodescendientes. Indaga en diversas fuentes bibliográficas, hemerográficas o digitales sobre el México colonial, ¿cómo era la vida cotidiana?, ¿qué eran las castas y qué implicaciones tuvieron en la vida de las personas?, ¿en qué trabajaban?, ¿cómo educaban a sus hijas e hijos?, ¿qué papel tuvo la religión en la vida de las personas y los pueblos? Relaciona las leyes de castas del periodo colonial como organización social que ayuda a explicar el racismo mexicano como fenómeno histórico y contemporáneo."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Origen histórico de algunos símbolos (territorio, lugares sagrados, figuras y colores).", "p3": "Indaga acerca de los símbolos de identidad y pertenencia en la comunidad, localidad o pueblo y en la entidad federativa, para comprender que la identidad nacional es un conjunto de identidades plurales, que pueden convivir respetuosamente, en la medida que exista igualdad de condiciones sociales, culturales, educativas, entre otras. Dialoga acerca de la importancia de los símbolos para las comunidades, la entidad y para México, y reconoce la forma en que se representan.", "p4": "Reconoce los símbolos nacionales que identifican a México como país (himno, escudo y bandera); indaga sobre su significado, cómo y dónde surgieron, los elementos que los conforman, así como su transformación histórica, para comprender cómo ayudaron a construir una identidad nacional. Dialoga sobre la importancia que tiene reconocer a la diversidad de símbolos, como el territorio, los lugares sagrados, las banderas, los himnos, entre otros, para respetar la diversidad de identidades socioculturales que conforman al país. Analiza de manera crítica posibles efectos negativos de los nacionalismos en las sociedades multiculturales como México."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "El derecho a la protección de la integridad propia y la de todas las personas.", "p3": "Identifica situaciones y personas que representan un riesgo para la protección de la dignidad y la integridad física y mental de niñas y niños. Reconoce que tiene derecho a la protección ante situaciones que ponen en riesgo su integridad como maltrato, abuso o explotación de tipo sexual y expresa lo que siente al respecto. Propone acciones individuales y colectivas para ejercer su derecho a la protección y minimizar situaciones de riesgo en el aula, la escuela y la comunidad.", "p4": "Dialoga acerca del derecho a que la niñez sea protegida contra toda forma de maltrato, abuso o explotación de tipo sexual. Propone y practica algunas medidas preventivas ante situaciones o personas que representan un riesgo para la protección de la integridad. Analiza situaciones de maltrato, abuso o explotación de tipo sexual, que puedan ocurrir en el aula, la escuela y la comunidad, y propone acciones para su denuncia y erradicación."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Experiencias de organización comunitaria del pasado y del presente.", "p3": "Indaga en fuentes orales o escritas acerca de formas de organización participativa, en el pasado y el presente de su comunidad, e identifica la importancia de la colaboración, la reciprocidad, el respeto y el cuidado mutuo. Propone para su aplicación en la escuela formas de organización participativa, que contribuyan al bienestar de la colectividad escolar.", "p4": "Analiza críticamente el papel que juegan los valores y actitudes, así como las capacidades y responsabilidades de las personas en los procesos de organización participativa, para la conformación de ambientes igualitarios que permitan contribuir al bienestar de la comunidad."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Situaciones de discriminación en el aula, la escuela, la comunidad.", "p3": "Analiza e identifica en el aula, la escuela, la comunidad y la entidad, situaciones de discriminación y exclusión por motivo de diversidad de género, física, sensorial, intelectual, mental, cultural, étnica, lingüística o social. Promueve en su entorno próximo de convivencia, acciones de trato igualitario, de respeto a la dignidad humana, a la diversidad cultural y a los derechos de niñas y niños.", "p4": "Conoce y analiza críticamente situaciones de discriminación y exclusión por género, física, sensorial, intelectual, mental, cultural, étnica, lingüística o social. Analiza las causas de la discriminación y exclusión, y propone acciones para promover ambientes igualitarios, de respeto a la dignidad humana, a las diversidades y a los derechos de todas las personas, en la comunidad, entidad y en el país."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Retos en el reconocimiento y ejercicio de los derechos humanos.", "p3": "Analiza las necesidades básicas: físicas, sociales, de seguridad, emocionales y cognitivas de niñas, niños y adolescentes, las relaciona con el ejercicio de sus derechos, comparte experiencias sobre cómo éstas son satisfechas en las familias y en la comunidad. Dialoga acerca de lo que ocurre cuando esas necesidades no son satisfechas, identifica a quiénes corresponde generar condiciones para que todas las personas satisfagan sus necesidades y garantizar que puedan ejercer sus derechos humanos.", "p4": "Comprende y analiza críticamente sobre las condiciones de diversos grupos sociales del país, que en el presente y el pasado no han podido satisfacer sus necesidades básicas, cómo los distintos colectivos históricamente demandaron que sus necesidades fueran satisfechas y por el reconocimiento de sus derechos. Dialoga y elabora conclusiones acerca de las causas por las que determinados grupos no han cubierto sus necesidades, y reconoce que esta situación es injusta. Propone alternativas para superar la desigualdad y favorecer la justicia, desde la comprensión de los derechos humanos, cuyo ejercicio no está condicionado y el Estado tiene la obligación a garantizarlos. Identifica a quiénes corresponde generar condiciones para que todas las personas satisfagan sus necesidades."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "La construcción colectiva de la paz: situaciones que generan diferencias y conflictos.", "p3": "Reconoce que la paz se construye al dialogar sobre tensiones surgidas por diferencias de intereses, puntos de vista, formas de vida y de organización, acceso a servicios, entre otros, que dan lugar a conflictos entre las personas con las que se convive, en los ámbitos escolar, con los pares, miembros de la familia y otras personas del entorno, e identifica las causas y formas de resolverlos sin violencia mediante la comunicación y la empatía sus-", "p4": "Comprende que la paz es una construcción colectiva que demanda analizar críticamente las causas, desarrollo y consecuencias, de conflictos entre personas y/o grupos de pertenencia, y realiza propuestas para enfrentar las tensiones sin violencia, mediante la comunicación dialógica y la empatía."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Formas y procedimientos mediante las que se eligen a las autoridades de gobierno.", "p3": "Indaga y analiza sobre cuáles son las autoridades de gobierno de su comunidad, municipio y entidad, cómo se eligen, cuáles son sus funciones y cómo colaboran con las personas y comunidad, empleando diversas formas de organización local para contribuir al bienestar colectivo. Indaga acerca de cómo se designaban o elegían las autoridades que gobernaban algunos pueblos que habitaban el territorio de México antes de la llegada de los españoles, así como cuáles eran sus funciones y cómo se relacionaban estas formas con una visión cultural diversa.", "p4": "Indaga cómo se designaron las autoridades que gobernaban en el México colonial, cuáles eran sus funciones, cuáles son las características de la monarquía, qué eran los ayuntamientos, las encomiendas y cuáles fueron sus funciones en la Nueva España. Compara y analiza críticamente cómo se eligen actualmente las autoridades de gobierno en nuestro país, y nuestra comunidad y/o pueblo, bajo el régimen democrático y/o de asambleas comunitarias, qué son los ayuntamientos o alcaldías en la actualidad y cuáles son sus funciones, reconoce las formas tradicionales de organización que se emplean en su contexto."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Democracia en la vida cotidiana: construcción, cumplimiento y aplicación justa de acuerdos.", "p3": "Comprende que la democracia se ejerce en la vida cotidiana al participar en la construcción, el cumplimiento y la aplicación justa y honesta de los acuerdos y las normas, en los espacios de convivencia como la escuela y la familia. Dialoga acerca de la importancia de participar y contribuir a la protección de los derechos de todas las personas, conforme a los principios democráticos de igualdad, justicia y responsabilidad.", "p4": "Comprende y argumenta sobre la importancia de la participación democrática en la construcción, el cumplimiento y la aplicación justa de acuerdos, normas y leyes en el ámbito de la escuela, la comunidad, el barrio, la colonia, la vecindad, el pueblo o la localidad, entre otros, para contribuir a la protección de los derechos humanos de todas las personas y colectivos, como los pueblos indígenas, afromexicanos, grupos LGBTTTIQ+, religiosos, migrantes, entre otros, así como a la sana convivencia, conforme a los principios democráticos que nos rigen."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "La toma de decisiones ante situaciones cotidianas y de riesgos.", "p3": "Analiza críticamente y distingue situaciones cotidianas en las que se ejerce la capacidad para tomar decisiones, empleando los criterios de valoración de los riesgos del entorno. Dialoga y analiza posibles consecuencias de las acciones, para actuar con responsabilidad.", "p4": "Analiza situaciones cotidianas para la toma de decisiones, con base en criterios que priorizan el cuidado de la dignidad propia, así como de otras personas y colectivos. Comprende y valora los riesgos del entorno y las posibles consecuencias de las acciones, para actuar con responsabilidad."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Desigualdades por diferencias de género: causas y consecuencias en la vida cotidiana.", "p3": "Analiza en la casa, la escuela y la comunidad desigualdades de género, así como sus causas y consecuencias. Identifica casos en los que expresan desigualdades en el acceso a servicios educativos, de salud, recreación, deporte o cultura. Propone acciones en favor de la igualdad, en las que se respeten los derechos de todas las personas y colectivos con los que convive.", "p4": "Analiza críticamente situaciones de desigualdad de género, en los ámbitos educativo, laboral, cultural o de participación política, comparando cómo ocurrían en el pasado y el presente. Argumenta en favor de la igualdad, con base en el reconocimiento y el respeto de la dignidad y los derechos de todas las personas."}, {"campo": "Ética, Naturaleza y Sociedades", "c": "Situaciones de riesgo social en la comunidad y región donde vive.", "p3": "Distingue situaciones de riesgo social en la región, y propone algunas medidas para el autocuidado. Analiza situaciones de riesgo social en la comunidad y el contexto donde vive, como la violencia doméstica y el vandalismo, y analiza estrategias de prevención.", "p4": "Analiza situaciones de riesgo social en la comunidad y región donde vive. Distingue situaciones de riesgo social en la región, y propone algunas medidas para el autocuidado. Reconoce que la violencia doméstica y el vandalismo son situaciones que ponen en riesgo la sana convivencia, y analiza estrategias de prevención al respecto. Organiza campañas en su grupo y escuela, para prevenir problemas sociales, como la violencia escolar, el vandalismo, las adicciones, entre otros. Investiga problemas sociales en su contexto y país, para analizar sus causas y efectos."}, {"campo": "De lo Humano y lo Comunitario", "c": "La comunidad como el espacio en el que se vive y se encuentra la escuela.", "p3": "Indaga acerca de ideas, conocimientos, prácticas culturales, formas de organización y acuerdos familiares, escolares y comunitarios, para compartir su importancia en la socialización.", "p4": "Reconoce ideas, conocimientos, prácticas culturales y formas de organización, para explicar el significado que tienen en su familia, escuela y comunidad."}, {"campo": "De lo Humano y lo Comunitario", "c": "Las familias como espacio de protección, cuidado, afecto y sustento para el desarrollo personal.", "p3": "Identifica formas de convivencia y socialización en las familias, para distinguir formas de participación y colaboración. Identifica los valores que posee y que han sido heredados de su familia, para fomentar cuidados afectivos.", "p4": "Reflexiona sobre el valor de la familia y de la aportación de sus integrantes, para favorecer su desarrollo personal y afectivo. Describe los valores que distinguen a su familia, para entenderlos como elementos de desarrollo social y personal."}, {"campo": "De lo Humano y lo Comunitario", "c": "Entendimiento mutuo en la escuela.", "p3": "Participa en distintas situaciones para acordar reglas en su familia, escuela y comunidad. Reflexiona sobre el seguimiento de reglas para expresar las semejanzas y diferencias. Expresa la importancia del entendimiento, para la convivencia pacífica.", "p4": "Comparte ideas y experiencias sobre diferentes temas, para aprender la importancia de escuchar. Conoce distintos puntos de vista, para favorecer el entendimiento y la negociación con las demás personas."}, {"campo": "De lo Humano y lo Comunitario", "c": "La escuela como espacio de convivencia, colaboración y aprendizaje.", "p3": "Participa en la organización del aula y en la generación de no l y colectivo."}, {"campo": "De lo Humano y lo Comunitario", "c": "Equidad de género en las familias, la escuela y la comunidad.", "p3": "Analiza prácticas equitativas que favorecen la convivencia en diversos contextos, como la distribución de las tareas y responsabilidades cotidianas para identificar y proponer mejores formas de relación entre hombres y mujeres.", "p4": "Reflexiona acerca de los estilos de relación y distribución de responsabilidades, para tomar decisiones respecto de aquellos que inciden positivamente en el bienestar de todas y todos."}, {"campo": "De lo Humano y lo Comunitario", "c": "Educación Integral en Sexualidad.", "p3": "Explora formas de vivir y sentir el cuerpo, así como de los afectos, para identificar la diversidad de expresiones que agradan, incomodan y/o ponen en riesgo la integridad de las personas.", "p4": "Valora y aprecia las formas de expresar el carácter y los afectos para tomar decisiones orientadas a salvaguardar su integridad."}, {"campo": "De lo Humano y lo Comunitario", "c": "Efectos en la vida de las personas, derivados de cambios sociales, culturales y en la salud.", "p3": "Reflexiona sobre hechos y sucesos que han afectado a su familia, para proponer posibles alternativas que permitan afrontarlos.", "p4": "Dialoga acerca de situaciones que conoce o ha vivido en su familia o comunidad, para comprender causas y efectos en la vida de las personas."}, {"campo": "De lo Humano y lo Comunitario", "c": "Reconocimiento de las necesidades y características propias y de las demás personas.", "p3": "Valora las características cognitivas, motrices, afectivas y sociales, así como las necesidades de sus compañeras y compañeros para expresar lo que les une como grupo. Expresa con que personas se identifica, para reconocer la identidad del grupo. Expresa lo que puede hacer para tener la oportunidad de reconocer a otras personas.", "p4": "Aprecia lo que las personas le aportan en la atención de sus necesidades e intereses para reconocer l onoce sus capacidades y habilidades motrices, al representar con el cuerpo situaciones e historias, a fin de favorecer la construcción de la imagen corporal."}, {"campo": "De lo Humano y lo Comunitario", "c": "Estilos de vida activos y saludables.", "p3": "Socializa actividades físicas que practica de manera cotidiana, con la intención de valorar su incidencia en el bienestar y cuidado de la salud.", "p4": "Organiza juegos y otras actividades físicas, para analizar avances y logros personales o grupales, en favor de asumir una vida saludable."}, {"campo": "De lo Humano y lo Comunitario", "c": "Pensamiento lúdico, estratégico y creativo.", "p3": "Toma decisiones estratégicas a partir de las características de las situaciones de juego y cotidianas, con el fin de solucionarlas asertivamente.", "p4": "Diseña estrategias para atender situaciones o resolver problemas y conflictos que se presentan en el juego y en actividades cotidianas."}, {"campo": "De lo Humano y lo Comunitario", "c": "Interacción motriz.", "p3": "Establece acuerdos ante situaciones de juego y cotidianas, a partir de la interacción, para valorar su aplicación y los resultados alcanzados.", "p4": "Experimenta situaciones caracterizadas por la cooperación y oposición, con el fin de reconocer sus implicaciones en la interacción y el logro de metas."}, {"campo": "De lo Humano y lo Comunitario", "c": "Los afectos y su influencia en el bienestar.", "p3": "Reconoce los factores presentes en el contexto que influyen en la expresión de las emociones para favorecer reacciones asertivas. Analiza situaciones previas y resultados obtenidos para adecuar su reacción emocional a favor del bienestar personal y social.", "p4": "Utiliza conocimientos previos sobre las diferentes expresiones emocionales para aprovechar su función en situaciones cotidianas. Considera las reacciones emocionales ante situaciones comunes e identifica las más adecuadas para lograr sus metas y el bien común."}];
