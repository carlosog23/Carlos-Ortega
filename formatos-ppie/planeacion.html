  for (let k = ses.length; k < n; k++) ses.push({ fase: 'Flexible', t: 'Sesión de consolidación', para: 'Repasar lo que más trabajo costó, según «¿Cómo le fue?» de las sesiones anteriores.', inicio: [10, ['Retomar el criterio de éxito con menor logro.']], des: [35, ['Actividad de práctica en parejas sobre ese criterio.', 'Retroalimentación grupal.']], cierre: [10, ['Boleto de salida.']], sabre: 'Mejora en el criterio repasado.', mat: ['Según lo que se repase'], mg: {}, fecha: dias[k], aj: [], hecha: null });

/* El telar: cada día del periodo es un hilo; los días sin clase quedan como hueco */
function telar(dias, fuera, ses, clase) {
  const todos = [...dias.map(k => ({ k, d: 1 })), ...fuera.map(([k, t]) => ({ k, t }))].sort((a, b) => a.k.localeCompare(b.k));
  return `<div class="telar ${clase}" role="list">${todos.map(x => {
    const d = new Date(x.k + 'T12:00:00');
    if (!x.d) return `<div class="hilo hueco" role="listitem" title="${esc(fCorta(x.k))}: sin clases (${motivo(x.t)})"><b>${d.getDate()}</b><span>${clase === 'grande' ? motivo(x.t).split(' ')[0] : 'sin'}</span></div>`;
    const i = ses ? ses.findIndex(s => s.fecha === x.k) : -1, s = ses && ses[i];
    const c = s ? (s.col || FASE_COL[s.fase]) : '#3A5A92';
    return clase === 'grande' ? `<button class="hilo ${s && s.hecha ? 'hecha' : ''}" role="listitem" style="--c:${c}" data-ir="${i}" title="Sesión ${i + 1} · ${esc(s.fase)} · ${esc(fCorta(x.k))}"><span>${DIAS[d.getDay()]}</span><b>${d.getDate()}</b><span>S${i + 1}</span></button>`
      : `<div class="hilo" role="listitem" style="--c:${c}" title="${esc(fCorta(x.k))}"><b>${d.getDate()}</b><span>${DIAS[d.getDay()]}</span></div>`;
  }).join('')}</div>`;
}

function ajustar(i, tipo) {
  const s = E.plan.ses[i];
  if (tipo === 'ia') { const t = prompt('¿Qué cambio quiere en esta sesión? (Ej.: «que trabajen en el patio», «agrega un video corto»)'); if (t) toast('En la versión final, la IA reescribe la sesión con: <b>' + esc(t) + '</b>'); return; }
  if (s.aj.includes(tipo)) { toast('Ese ajuste ya está aplicado.'); return; }
  if (tipo === 'corta') { s.inicio[0] = Math.max(5, Math.round(s.inicio[0] * .7)); s.des[0] = Math.round(s.des[0] * .7); s.cierre[0] = Math.max(5, Math.round(s.cierre[0] * .7)); if (s.des[1].length > 2) s.des[1].pop(); toast(`Sesión ${i + 1}: ahora dura <b>${s.inicio[0] + s.des[0] + s.cierre[0]} min</b>.`); }
  if (tipo === 'ludica') { s.inicio[1] = [s.ludica || 'Juego de inicio relacionado con el tema.']; toast(`Sesión ${i + 1}: el inicio ahora es un juego.`); }
  if (tipo === 'sin') { s.mat = s.mat.filter(m => !/copia|hoja con|proyector|video|internet/i.test(m)).concat(['Pizarrón']); s.mat = [...new Set(s.mat)]; if (s.sin) s.des[1].unshift(s.sin); toast(`Sesión ${i + 1}: sin copias ni internet.`); }
  if (tipo === 'lectura') { s.des[1].push('Lectura breve en voz alta (5 min) de un texto informativo sobre el agua; preguntar: «¿Qué dato nuevo encontraste?».'); s.des[0] += 5; toast(`Sesión ${i + 1}: se agregó una lectura de 5 minutos.`); }
  s.aj.push(tipo); repintarPanel();
}

  if (tipo === 'dispersos') { for (let i = 0; i < 14; i++) g += dot(18 + R() * 132, 16 + R() * 68, i < 3 ? B : A); g += `<path d="M60 40l14 8M110 60l-12-6" stroke="${B}" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#fl)"/>`; }

   <table><tr><th>Docente</th><td>Prof. Jorge Ramírez</td><th>Grados</th><td>${gr.map(g => g + '.°').join(', ')}</td></tr><tr><th>Periodo</th><td>${esc(fCorta(P.ses[0].fecha))} al ${esc(fCorta(P.ses[P.ses.length - 1].fecha))}</td><th>Sesiones</th><td>${P.ses.length} de ${E.efMin} minutos</td></tr><tr><th>Estrategias</th><td colspan="3">${[...new Set(P.ses.flatMap(s => s.ppal.map(j => JUEGOS[j].est)))].join(', ')}</td></tr></table>
   <h3>Contenidos y PDA (De lo Humano y lo Comunitario)</h3><table><tr><th style="width:30%">Contenido</th><th>PDA</th></tr>${pdas.map(x => `<tr><td>${esc(x.c)}</td><td>${gr.filter(g => x.pda[g]).map(g => `<b>${g}.°</b> ${esc(x.pda[g])}`).join('<br>')}</td></tr>`).join('')}</table>
   <h3>Secuencia de sesiones</h3><table><tr><th style="width:17%">Sesión</th><th>Activación · Parte principal · Vuelta a la calma</th><th style="width:24%">Evaluación</th></tr>${P.ses.map((s, i) => `<tr><td><b>${i + 1}. ${esc(s.t)}</b><br>${esc(fCorta(s.fecha))}</td><td>${esc(JUEGOS[s.act].n)} · ${s.ppal.map(j => esc(JUEGOS[j].n)).join(', ')} · ${esc(JUEGOS[s.calma].n)}. Reflexión: ${esc(s.cierre.join(' '))}</td><td>${esc(s.eval)}</td></tr>`).join('')}</table>
   <h3>Evaluación formativa</h3><p>Indicadores: ${EF_CRIT.map(x => esc(x[0])).join(' ')} Instrumentos: lista de cotejo, registro de observación y autoevaluación con semáforo de manos.</p>
   ${incDocHTML()}<h3>Inclusión y cuidados</h3><p>Juegos sin eliminación, versiones más fáciles y más difíciles de cada juego, roles alternativos con la misma participación, hidratación entre juegos y plan B bajo sombra en días de calor.</p>
   <div class="firmas"><div>Prof. Jorge Ramírez<br>Docente de Educación Física</div><div>Vo. Bo. Director(a) de la escuela</div></div></div>`;
}
function cablearEF() {
  incCablear(repintaPanelEF);
  $$('[data-proto]').forEach(b => b.onclick = () => toast('Esta opción estará disponible en la siguiente versión.')); docBotones();
  $$('.ses-cab').forEach(b => b.onclick = () => { const i = +b.closest('.ses').dataset.i; E.abierta = E.abierta === i ? -1 : i; E.jAb = null; repintaPanelEF(); });
  $$('[data-jab]').forEach(b => b.onclick = () => { E.jAb = E.jAb === b.dataset.jab ? null : b.dataset.jab; repintaPanelEF(); });
  $$('[data-clase]').forEach(b => b.onclick = () => abrirClaseEF(+b.dataset.clase));
  $$('[data-planb]').forEach(b => b.onclick = () => { const i = +b.dataset.planb; E.planB[i] = !E.planB[i]; repintaPanelEF(); toast(E.planB[i] ? 'Plan B activo: juego bajo sombra, sin carreras.' : 'Se regresó al plan original.'); });
  $$('[data-fil]').forEach(b => b.onclick = () => { E.fFil = b.dataset.fil; repintaPanelEF(); });
  $$('[data-efaj]').forEach(b => b.onclick = () => { const i = +b.closest('.ses').dataset.i, s = E.plan.ses[i], t = b.dataset.efaj;
    if (t === 'ia') { const x = prompt('¿Qué cambio quiere en esta sesión? (Ej.: «solo tengo una pelota», «agrega un juego tradicional»)'); if (x) toast('En la versión final, la IA rehace la sesión con: <b>' + esc(x) + '</b>'); return; }
    if (t === 'cambiar') { const ops = Object.keys(JUEGOS).filter(k => !['globo', 'espejo', 'rally', 'encantados'].includes(k) && !s.ppal.includes(k)); const nuevo = ops[(ops.indexOf(s.ppal[0]) + 1 + i) % ops.length] || ops[0]; s.ppal[0] = nuevo; if (!s.aj.includes('cambio')) s.aj.push('cambio'); toast(`Sesión ${i + 1}: ahora el juego principal es <b>${esc(JUEGOS[nuevo].n)}</b>.`); }
    if (t === 'intensa') { s.aj = s.aj.filter(x => x !== 'tranquila'); if (!s.aj.includes('intensa')) s.aj.push('intensa'); s.act = 'cola'; toast(`Sesión ${i + 1}: activación más intensa (Atrapa la cola) y juegos en su versión difícil.`); }
    if (t === 'tranquila') { s.aj = s.aj.filter(x => x !== 'intensa'); if (!s.aj.includes('tranquila')) s.aj.push('tranquila'); s.act = 'pelotaAire'; toast(`Sesión ${i + 1}: activación tranquila (Pelota al aire) y juegos en su versión fácil.`); }
    repintaPanelEF(); });
}
function repintaPanelEF() { const y = scrollY; $('#panel').innerHTML = panelEF(); cablearEF(); scrollTo(0, y); }

/* ---------- Inclusión por alumno (opcional) ----------
   La necesidad o situación de cada alumno se registra en «Mis alumnos» de Tlamatini (BAP, USAER, otro apoyo, padecimientos)
   o aquí mismo. En cada planeación el docente marca, si quiere, a quién incluye y con qué ajuste. Nada sale del dispositivo. */
const INC_AJ = ['Ajuste razonable', 'Adecuación curricular', 'Adecuación de acceso', 'Apoyo específico', 'Seguimiento cercano'];
const INC_NEE = ['Barreras para el aprendizaje y la participación (BAP)', 'Discapacidad', 'Condición del neurodesarrollo (TEA, TDAH u otra)', 'Dificultad de aprendizaje', 'Aptitudes sobresalientes', 'Situación de salud', 'Situación socioemocional o familiar', 'Conducta', 'Otra'];
const incLS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const incIni = n => String(n || '').split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + '.').join(' ');
function incNecesidad(a) { if (a.nee) return a.nee; const t = [a.bap ? 'BAP: ' + a.bap : '', a.usaer ? 'Recibe apoyo de USAER' : '', a.apoyo ? 'Apoyo: ' + a.apoyo : '', a.padec ? 'Condición: ' + a.padec : ''].filter(Boolean); return t.join(' · '); }
function incAlumnos() { const dir = incLS.get('ppie-dir', {}) || {}, per = incLS.get('ppie-perfil', {}) || {}, al = (dir.alumnos || []).filter(a => !String(a.baja || '').trim());
  const gr = String(per.grado || '').replace(/\D/g, ''), gp = String(per.grupo || '').trim().toUpperCase();
  const mios = gr ? al.filter(a => String(a.grado || '').replace(/\D/g, '') === gr && (!gp || String(a.grupo || '').trim().toUpperCase() === gp)) : al;
  return { todos: mios.length ? mios : al, dir }; }
function incPlan() { const P = E.plan; if (!P.inc) P.inc = { sel: {}, extra: [], ini: true }; return P.inc; }
function incLista() { const I = incPlan(), { todos } = incAlumnos();
  const conNee = todos.filter(a => incNecesidad(a)), marcados = Object.keys(I.sel).filter(id => I.sel[id].on);
  const otros = todos.filter(a => !incNecesidad(a) && marcados.includes(a.id));
  return { I, todos, lista: conNee.concat(otros).map(a => ({ id: a.id, nombre: a.nombre, nee: incNecesidad(a), apoyo: a.apoyo || '' })).concat(I.extra.map(x => ({ id: x.id, nombre: x.nombre, nee: x.nee, extra: true }))) }; }
function incCard() { const { I, todos, lista } = incLista(), sel = lista.filter(x => (I.sel[x.id] || {}).on).length;
  return `<div class="card"><h3>Inclusión: alumnos con necesidad específica o situación</h3><p class="sub">Opcional. Marque a quién incluye en esta planeación y con qué ajuste. Las necesidades se registran una vez en <b>Mis alumnos</b> de Tlamatini (BAP, USAER, otro apoyo) o aquí abajo.</p>
   ${lista.length ? lista.map(x => { const o = I.sel[x.id] || {}; return `<div style="border-top:1px solid var(--hilo);padding:10px 0"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-inc="${x.id}" ${o.on ? 'checked' : ''} style="width:22px;height:22px;margin-top:2px">
     <span><b>${esc(x.nombre)}</b>${x.extra ? ' <span class="chip">agregado aquí</span>' : ''}<br><span style="color:var(--muted);font-size:14px">${esc(x.nee || 'Sin necesidad registrada')}</span></span></label>
     ${o.on ? `<div style="display:grid;gap:8px;grid-template-columns:minmax(0,1fr);margin:8px 0 0 32px"><select data-inc-t="${x.id}" style="min-height:44px;border:1px solid var(--hilo);border-radius:12px;padding:0 10px;background:#fff">${INC_AJ.map(t => `<option ${t === (o.ajuste || INC_AJ[0]) ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <textarea data-inc-d="${x.id}" placeholder="Qué hará en las sesiones: apoyos, cambios en la actividad, en la evaluación…" style="min-height:76px;border:1px solid var(--hilo);border-radius:12px;padding:8px 10px;font:inherit;font-size:15px">${esc(o.desc != null ? o.desc : (x.apoyo || ''))}</textarea></div>` : ''}</div>`; }).join('')
    : `<p style="color:var(--muted)">Ningún alumno de su grupo tiene registrada una necesidad. Puede registrarla en Mis alumnos o agregar aquí a un alumno.</p>`}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${todos.filter(a => !incNecesidad(a) && !(I.sel[a.id] || {}).on).length ? `<select data-inc-add style="min-height:44px;border:1px solid var(--hilo);border-radius:12px;padding:0 10px;background:#fff;max-width:100%"><option value="">+ Incluir a otro alumno de mi lista…</option>${todos.filter(a => !incNecesidad(a) && !(I.sel[a.id] || {}).on).map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select>` : ''}
    <button class="btn sec chico" data-inc-nuevo>+ Agregar un alumno a mano</button></div>
   ${sel ? `<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14.5px"><input type="checkbox" data-inc-ini ${I.ini !== false ? 'checked' : ''}> En el documento, mostrar solo las iniciales</label>` : ''}
   <p class="privado">${ic('candado', 'style="width:16px;height:16px"')}Los nombres y las necesidades de los alumnos se ven solo en su dispositivo; no se envían a ningún lado.</p></div>`; }
function incLeer() { const I = incPlan(); $$('[data-inc-t]').forEach(s => { (I.sel[s.dataset.incT] = I.sel[s.dataset.incT] || {}).ajuste = s.value; }); $$('[data-inc-d]').forEach(t => { (I.sel[t.dataset.incD] = I.sel[t.dataset.incD] || {}).desc = t.value.trim(); }); }
function incCablear(re) { if (!E.plan || !$('[data-inc-nuevo]')) return; const I = incPlan();
  $$('[data-inc]').forEach(c => c.onchange = () => { incLeer(); (I.sel[c.dataset.inc] = I.sel[c.dataset.inc] || {}).on = c.checked; re(); });
  $$('[data-inc-t],[data-inc-d]').forEach(e => e.addEventListener('change', incLeer));
  $$('[data-inc-add]').forEach(s => s.onchange = () => { if (!s.value) return; incLeer(); I.sel[s.value] = { on: true, ajuste: INC_AJ[0] }; re(); });
  $$('[data-inc-ini]').forEach(c => c.onchange = () => { I.ini = c.checked; });
  $('[data-inc-nuevo]').onclick = () => { const v = document.createElement('div'); v.style.cssText = 'position:fixed;inset:0;background:rgba(20,25,40,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px';
    v.innerHTML = `<div style="background:var(--papel2,#fff);border-radius:20px;padding:18px;max-width:520px;width:100%"><h3 style="margin:0 0 10px">Agregar un alumno</h3>
     <label style="display:block;margin-bottom:10px">Nombre<br><input id="incN" style="width:100%;min-height:44px;border:1px solid var(--hilo);border-radius:12px;padding:0 10px"></label>
     <label style="display:block;margin-bottom:12px">Necesidad o situación<br><select id="incT" style="width:100%;min-height:44px;border:1px solid var(--hilo);border-radius:12px;padding:0 10px">${INC_NEE.map(t => `<option>${t}</option>`).join('')}</select></label>
     <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec chico" id="incX">Cancelar</button><button class="btn pri chico" id="incOk">Agregar</button></div></div>`;
    document.body.appendChild(v); v.querySelector('#incX').onclick = () => v.remove();
    v.querySelector('#incOk').onclick = () => { const n = v.querySelector('#incN').value.trim(); if (!n) return; incLeer(); const id = 'm' + Date.now().toString(36); I.extra.push({ id, nombre: n, nee: v.querySelector('#incT').value }); I.sel[id] = { on: true, ajuste: INC_AJ[0] }; v.remove(); re(); }; }; }
function incDocHTML() { if (!E.plan || !E.plan.inc) return ''; const { I, lista } = incLista(), L = lista.filter(x => (I.sel[x.id] || {}).on); if (!L.length) return '';
  return `<h3>Atención a la diversidad: ajustes razonables y adecuaciones</h3><table><tr><th style="width:22%">Alumno(a)</th><th style="width:26%">Necesidad o situación</th><th style="width:16%">Tipo</th><th>Ajuste o adecuación en las sesiones</th></tr>${L.map(x => { const o = I.sel[x.id]; return `<tr><td>${esc(I.ini !== false ? incIni(x.nombre) : x.nombre)}</td><td>${esc(x.nee || '')}</td><td>${esc(o.ajuste || INC_AJ[0])}</td><td>${esc(o.desc != null ? o.desc : (x.apoyo || ''))}</td></tr>`; }).join('')}</table>`; }

/* ---------- Mi clase de hoy (EF): tarjeta por actividad, cronómetro, silbato y equipos al azar ---------- */
function abrirClaseEF(i) { E.clase = { i, paso: -1, resta: 0, como: '', nota: '', equipos: null, nEq: 4 }; vClaseEF(); }
let AUD = null;
function silbato() { try { AUD = AUD || new (window.AudioContext || window.webkitAudioContext)(); const t = AUD.currentTime, o = AUD.createOscillator(), g = AUD.createGain(), l = AUD.createOscillator(), lg = AUD.createGain();
  o.type = 'square'; o.frequency.value = 2900; l.frequency.value = 38; lg.gain.value = 260; l.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(AUD.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.setValueAtTime(.18, t + .55); g.gain.linearRampToValueAtTime(0, t + .65); o.start(t); l.start(t); o.stop(t + .7); l.stop(t + .7); } catch (e) { } }
function vClaseEF() {
  const C = E.clase, s = E.plan.ses[C.i], T = efTiempos(s), pb = E.planB[C.i];
  const pasos = [['Activación', s.act, T.act], ...(pb ? [s.planB] : s.ppal).map((j, k, a) => ['Parte principal' + (a.length > 1 ? ` ${k + 1}` : ''), j, Math.round(T.ppal / a.length)]), ['Hidratación', null, T.hid], ['Vuelta a la calma', s.calma, T.calma]];
  let el = $('#clase'); if (!el) { el = document.createElement('section'); el.id = 'clase'; el.className = 'clase'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Mi clase de hoy'); document.body.appendChild(el); document.body.style.overflow = 'hidden'; }
  const mm = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  const k = C.paso, tot = k >= 0 ? pasos[k][2] * 60 : 1, R = 88, L = 2 * Math.PI * R, frac = k >= 0 ? C.resta / tot : 1;
  const nombres = [...EF_NOMBRES], cols = ['#2D5491', '#C2603A', '#1B7560', '#B07A14'];
  el.innerHTML = `<div class="clase-in"><div class="cab"><span>Educación Física. Sesión ${C.i + 1} de ${E.plan.ses.length}</span><button class="cerrar" id="cCerrar" aria-label="Cerrar">${ic('x')}</button></div>
   <h1>${esc(s.t)}</h1><p style="color:#C9D3E6">${esc(fCorta(s.fecha))}, ${T.tot} minutos${pb ? ', plan B bajo sombra' : ''}</p>
   <div class="di"><small>Plática inicial en círculo</small>${esc(s.charla)}</div>
   <div class="herr"><button class="btn maiz" id="silbar">${ic('chispa')}Silbato</button><button class="btn sec-osc" id="equipos">${ic('grupo')}Formar equipos al azar</button>
     <label class="sel-osc">Equipos <select id="nEq">${[2, 3, 4].map(x => `<option ${C.nEq === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
   ${C.equipos ? `<div class="equipos">${C.equipos.map((e, j) => `<div style="--c:${cols[j]}"><b>Equipo ${j + 1}</b>${e.map(x => `<span>${esc(x)}</span>`).join('')}</div>`).join('')}</div><p style="color:#AAB6CF;font-size:13.5px;margin:6px 0 0">Nombres de ejemplo. En Tlamatini salen de la lista de cada grupo, solo en su dispositivo.</p>` : ''}
   <div class="cronos" style="margin-top:16px"><div class="dial"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/><circle id="arco" cx="100" cy="100" r="${R}" fill="none" stroke="#E3A63B" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L * frac} ${L}"/></svg>
     <div class="c"><b id="crono">${k >= 0 ? mm(C.resta) : T.tot + "'"}</b><span>${k >= 0 ? esc(pasos[k][0]) + (RELOJ ? '' : ', en pausa') : 'Toque «Iniciar»'}</span></div></div>
    <div>${pasos.map(([l, j, m], x) => { const J = j && JUEGOS[j]; return `<div class="paso ${k === x ? 'activo' : ''}"><div class="ph"><b>${esc(l)}${J ? `: ${esc(J.n)}` : ''}</b><small>${m} min</small><button class="go" data-go="${x}">${k === x ? (RELOJ ? 'Pausa' : 'Seguir') : 'Iniciar'}</button></div>
      ${J ? `<div class="paso-j">${plano(J.plano, 120, 72)}<ol>${J.reglas.map(r => `<li>${esc(r)}</li>`).join('')}</ol></div><p style="margin-top:6px;color:#9FE0C9;font-size:15px"><b>Más fácil:</b> ${esc(J.facil)}<br><b>Más difícil:</b> ${esc(J.dificil)}</p>` : '<p style="font-size:17px">Agua simple y sombra. Aproveche para preguntar: «¿Qué estrategia vamos a usar ahora?».</p>'}</div>`; }).join('')}</div></div>
   <div class="paso"><div class="ph"><b>Reflexión en círculo</b></div><ol>${s.cierre.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>
   <div class="paso" style="border-color:rgba(240,186,85,.5)"><div class="ph"><b>¿Cómo le fue?</b></div>
    <div class="como" role="group" aria-label="Cómo le fue"><button data-como="si" aria-pressed="${C.como === 'si'}"><span class="em" style="background:#1B7560">${ic('bien')}</span>Se logró</button><button data-como="medio" aria-pressed="${C.como === 'medio'}"><span class="em" style="background:#B07A14">${ic('medio')}</span>A medias</button><button data-como="no" aria-pressed="${C.como === 'no'}"><span class="em" style="background:#A3322A">${ic('no')}</span>No se logró</button></div>
    <label class="sr" for="cNota">Nota</label><textarea id="cNota" placeholder="¿Algo que deba recordar? Ej.: el pañuelo con multiplicaciones fue difícil para 3.°.">${esc(C.nota)}</textarea>
    <button class="btn maiz" id="cTerminar" style="width:100%;margin-top:10px" ${C.como ? '' : 'disabled'}>Terminar clase</button></div></div>`;
  const rep = () => { const y = el.scrollTop; vClaseEF(); el.scrollTop = y; };
  $('#cCerrar').onclick = cerrarClase; $('#silbar').onclick = silbato;
  $('#nEq').onchange = e => { C.nEq = +e.target.value; if (C.equipos) $('#equipos').click(); };
  $('#equipos').onclick = () => { const a = nombres.sort(() => Math.random() - .5); C.equipos = Array.from({ length: C.nEq }, (_, j) => a.filter((_, x) => x % C.nEq === j)); rep(); };
  $$('#clase [data-go]').forEach(b => b.onclick = () => { const x = +b.dataset.go; if (C.paso === x) { if (RELOJ) { clearInterval(RELOJ); RELOJ = null; } else correr(); } else { clearInterval(RELOJ); RELOJ = null; C.paso = x; C.resta = pasos[x][2] * 60; correr(); silbato(); } rep(); });
  $$('#clase [data-como]').forEach(b => b.onclick = () => { C.como = b.dataset.como; C.nota = $('#cNota').value; rep(); });
  $('#cNota').oninput = e => { C.nota = e.target.value; };
  $('#cTerminar').onclick = () => { const s2 = E.plan.ses[C.i + 1]; s.hecha = C.como; s.notaClase = C.nota.trim(); let msg = '<b>Clase registrada.</b>';
    if (C.como !== 'si' && s2) { if (!s2.aj.includes('repaso')) s2.aj.push('repaso'); s2.charla = `Antes de empezar: retomamos lo de la clase pasada${C.nota.trim() ? ' (' + C.nota.trim() + ')' : ''}. ` + s2.charla; msg += ` Agregué un repaso en la plática inicial de la sesión ${C.i + 2}.`; }
    cerrarClase(); E.abierta = Math.min(C.i + 1, E.plan.ses.length - 1); E.tab = 'sesiones'; pintar(); toast(msg, 5200); };
  function correr() { RELOJ = setInterval(() => { C.resta = Math.max(0, C.resta - 1); const r = $('#crono'), a = $('#arco'); if (r) r.textContent = mm(C.resta); if (a) a.setAttribute('stroke-dasharray', `${L * C.resta / tot} ${L}`); if (!C.resta) { clearInterval(RELOJ); RELOJ = null; silbato(); toast(`Terminó: <b>${esc(pasos[C.paso][0].toLowerCase())}</b>.`); vClaseEF(); } }, 1000); }
}

/* ---------- Avisos ---------- */
let tT = null;
function toast(h, ms = 3200) { const t = $('#toast'); t.innerHTML = h; t.classList.add('ver'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('ver'), ms); }
if (/mia/.test(location.hash)) E.modo = 'mia';
pintar();
</script>
