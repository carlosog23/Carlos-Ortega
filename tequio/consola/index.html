<title>Consola de Tequio</title>

<style>
:root{--indigo:#24427A;--indigo-d:#1F3A6B;--tinta:#1E2A40;--terra:#C2603A;--terra-d:#A9512F;--ambar:#E8A33D;--crema:#FBF6EC;--arena:#F4E1C1;--arena-2:#F1E4CC;--papel:#FFFDF8;--borde:#E4D8C3;--gris:#5E5142;--ok:#2E7D4F;--ok-f:#E5F2E9;--mal:#B3261E;--mal-f:#FBE7E5;--aviso-f:#FDF1DC}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--terra-d)}
.hd{background:var(--tinta);color:var(--crema);border-bottom:4px solid var(--ambar)}
.hdin{max-width:1360px;margin:0 auto;padding:10px 16px;min-height:68px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd svg{width:40px;height:40px}.brand{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600}.hsub{color:#E9D8BA;font-size:15px}
.me{margin-left:auto;font-size:14.5px}
.wrap{max-width:1360px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.nav{flex:1 1 200px;max-width:230px;min-width:0;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;color:#3D3428;background:transparent;border:0;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.nav button[aria-current="true"]{background:var(--indigo);color:#fff}.nav button:hover:not([aria-current="true"]){background:var(--arena-2)}
.cnt{margin-left:auto;background:var(--terra);color:#fff;border-radius:999px;font-size:12px;padding:0 8px}
@media (max-width:800px){.nav{max-width:none;flex-direction:row;flex-wrap:wrap}}
.main{flex:999 1 640px;min-width:0}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--indigo);font-size:30px;line-height:1.2;margin:0 0 4px}
h2{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--indigo);font-size:20px;line-height:1.3;margin:0 0 14px}
.lead{color:var(--gris);margin:0 0 20px}.small{font-size:13.5px;color:var(--gris)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--papel);border:1px solid var(--borde);border-radius:12px;padding:14px 16px}.kpi b{display:block;font-family:'Fraunces',Georgia,serif;font-size:32px;line-height:1.1;color:var(--indigo-d);margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.card{background:var(--papel);border:1px solid var(--borde);border-radius:14px;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.flt button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CDBFA6;background:#fff;font:inherit;font-size:14px;cursor:pointer;color:#3D3428}.flt button[aria-pressed="true"]{background:var(--indigo-d);border-color:var(--indigo-d);color:#fff}
label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input,select,textarea{width:100%;min-height:44px;border:1px solid #CDBFA6;border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:var(--tinta)}textarea{min-height:100px;resize:vertical}
::placeholder{color:#76685A}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;border:1px solid var(--borde);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}th{background:var(--arena);text-align:left;padding:9px 12px;font-weight:700;white-space:nowrap}td{padding:10px 12px;border-top:1px solid #EFE5D3;vertical-align:middle}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.s-activa,.s-usada{background:var(--ok-f);color:#22603C}.s-suspendida,.s-anulada{background:var(--mal-f);color:#8E1F18}.s-pendiente{background:#E8EDF6;color:var(--indigo-d)}.s-vencida,.s-vieja{background:var(--aviso-f);color:#7A4A0B}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:0;text-decoration:none}
.pri{background:var(--indigo);color:#fff}.terra{background:var(--terra);color:#fff}.sec{background:transparent;color:var(--indigo);border:1.5px solid var(--indigo)}.danger{background:var(--mal);color:#fff}.ghost{background:transparent;color:#3D3428;border:1px solid #CDBFA6}
.lk{min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid #CDBFA6;background:#fff;color:var(--indigo);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.code{background:var(--indigo-d);color:var(--crema);border-radius:14px;padding:20px;text-align:center}.code b{display:block;font-family:ui-monospace,monospace;font-size:30px;letter-spacing:.08em;margin:6px 0}
.msg{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px 14px;font-size:14.5px;white-space:pre-line}
.seg{display:flex;flex-wrap:wrap;border:1px solid #CDBFA6;border-radius:10px;overflow:hidden}.seg button{flex:1 1 140px;min-height:44px;border:0;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:#3D3428}.seg button[aria-pressed="true"]{background:var(--indigo-d);color:#fff;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0}.facts div{padding:9px 0;border-top:1px solid #EFE5D3}.facts dt{font-size:13.5px;color:var(--gris)}.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
@media (max-width:600px){.facts{grid-template-columns:minmax(0,1fr)}}
.dz{border:2px solid #E7B4AF;background:#FFF8F7;border-radius:14px;padding:20px}.dz h2{color:#8E1F18}
.okb{background:var(--ok-f);border-radius:10px;padding:12px 14px}.malb{background:var(--mal-f);color:#8E1F18;border-radius:10px;padding:12px 14px}.note{background:var(--aviso-f);border-radius:10px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:10px;z-index:9;max-width:90vw}
.vacia{max-width:560px;margin:10vh auto;padding:0 16px;text-align:center}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="#F4E1C1"/><g fill="none" stroke-width="13" stroke-linecap="round"><path d="M79.7 56.5 A48 48 0 0 1 120.3 56.5" stroke="#24427A"/><path d="M127.5 60.7 A48 48 0 0 1 147.8 95.8" stroke="#C2603A"/><path d="M147.8 104.2 A48 48 0 0 1 127.5 139.3" stroke="#24427A"/><path d="M120.3 143.5 A48 48 0 0 1 79.7 143.5" stroke="#C2603A"/><path d="M72.5 139.3 A48 48 0 0 1 52.2 104.2" stroke="#24427A"/><path d="M52.2 95.8 A48 48 0 0 1 72.5 60.7" stroke="#C2603A"/></g><circle cx="100" cy="30" r="11" fill="#24427A"/><circle cx="160.6" cy="65" r="11" fill="#C2603A"/><circle cx="160.6" cy="135" r="11" fill="#24427A"/><circle cx="100" cy="170" r="11" fill="#C2603A"/><circle cx="39.4" cy="135" r="11" fill="#24427A"/><circle cx="39.4" cy="65" r="11" fill="#C2603A"/><circle cx="100" cy="100" r="13" fill="#E8A33D"/></symbol></svg>
<header class="hd"><div class="hdin"><svg aria-hidden="true"><use href="#logo"/></svg><span class="brand">Tequio</span><span class="hsub">Consola del administrador</span><span class="me">Mtro. Carlos Gabriel Ortega Gutiérrez</span></div></header>
<div id="app"></div>
<script>
'use strict';
const CLAVE = 'tequio.consola';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const aviso = (t, ms) => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3500); };
const fecha = f => { if (!f) return '—'; const d = new Date(String(f).length <= 10 ? f + 'T12:00' : f); return isNaN(d) ? f : d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }); };
const hace = f => { if (!f) return '—'; const dias = Math.floor((Date.now() - new Date(f)) / 864e5); return dias <= 0 ? 'Hoy' : dias === 1 ? 'Ayer' : 'Hace ' + dias + ' días'; };

function leerCfg() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('r') && h.get('k')) { const c = { r: h.get('r'), k: h.get('k') }; try { localStorage.setItem(CLAVE, JSON.stringify(c)); } catch (e) {} history.replaceState(null, '', location.pathname); return c; }
  try { return JSON.parse(localStorage.getItem(CLAVE) || 'null'); } catch (e) { return null; }
}
const CFG = leerCfg();
async function api(accion, datos) {
  let r;
  try { const res = await fetch(CFG.r, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, k: CFG.k, datos: datos || {} }) }); r = await res.json(); }
  catch (e) { throw new Error('No hay conexión con el registro central. Revise su internet.'); }
  if (!r.ok) throw new Error(r.mensaje || 'Error del registro central.');
  return r;
}

let D = null, vista = { sec: 'inicio', filtro: 'todas', buscar: '', zona: null, nueva: null };
async function cargar() {
  $('#app').innerHTML = '<p class="vacia">Cargando…</p>';
  try { D = await api('resumen'); pintar(); }
  catch (e) { $('#app').innerHTML = `<div class="vacia"><h1>No se pudo abrir la consola</h1><p>${esc(e.message)}</p><button class="btn sec" onclick="cargar()">Intentar de nuevo</button></div>`; }
}
const vieja = z => D.versionVigente && z.version && +z.version < +D.versionVigente;
const invPend = () => D.invitaciones.filter(i => i.estado === 'pendiente');

function pintar() {
  const SEC = [['inicio', 'Inicio'], ['invitaciones', 'Invitaciones'], ['versiones', 'Versiones y avisos']];
  $('#app').innerHTML = `<div class="wrap"><nav class="nav" aria-label="Secciones de la consola">${SEC.map(([k, n]) => `<button data-sec="${k}" aria-current="${vista.sec === k || (k === 'inicio' && vista.sec === 'zona')}">${n}${k === 'invitaciones' && invPend().length ? `<span class="cnt">${invPend().length}</span>` : ''}</button>`).join('')}</nav><main class="main" id="vista"></main></div>`;
  $$('[data-sec]').forEach(b => b.onclick = () => { vista.sec = b.dataset.sec; vista.zona = null; pintar(); });
  ({ inicio: vInicio, invitaciones: vInvitaciones, versiones: vVersiones, zona: vZona })[vista.sec]();
}

/* ---------- Inicio ---------- */
function vInicio() {
  const zs = D.zonas, act = zs.filter(z => z.estado === 'activa');
  const sinUso = act.filter(z => z.ultimoUso && (Date.now() - new Date(z.ultimoUso)) / 864e5 > 30);
  const venceProx = invPend().filter(i => (new Date(i.vence + 'T23:59') - Date.now()) / 864e5 < 2);
  const f = vista.filtro, q = vista.buscar.toLowerCase();
  const lista = zs.filter(z => (f === 'todas' || z.estado === f || (f === 'Federalizada' || f === 'Estatal') && z.sostenimiento === f) && (!q || (z.numero + ' ' + z.supervisor + ' ' + z.municipios).toLowerCase().includes(q)));
  $('#vista').innerHTML = `
  <h1>Buen día, Mtro. Carlos</h1><p class="lead">Así va Tequio en todas las zonas. Aquí solo ve cómo está cada instalación, nunca los datos de las escuelas.</p>
  <div class="kpis">
    <div class="kpi"><span class="small">Zonas activas</span><b>${act.length}</b><span class="small">de ${zs.length} registradas</span></div>
    <div class="kpi"><span class="small">Invitaciones pendientes</span><b>${invPend().length}</b><span class="small">${venceProx.length} vencen pronto</span></div>
    <div class="kpi"><span class="small">Zonas en versión anterior</span><b>${zs.filter(vieja).length}</b><span class="small">Vigente: versión ${esc(D.versionVigente || '—')}</span></div>
    <div class="kpi"><span class="small">Sin uso en 30 días</span><b>${sinUso.length}</b><span class="small">zonas activas</span></div>
  </div>
  <div class="row">
    <section class="card" style="flex:3 1 560px;min-width:0">
      <div class="bar"><h2 style="margin:0">Zonas</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="buscar" value="${esc(vista.buscar)}" placeholder="Buscar zona o supervisor" aria-label="Buscar zona o supervisor" style="width:240px;max-width:100%"><button class="btn terra" id="invitar">+ Invitar zona</button></div></div>
      <div class="flt">${[['todas', 'Todas'], ['activa', 'Activas'], ['suspendida', 'Suspendidas'], ['Federalizada', 'Federalizadas'], ['Estatal', 'Estatales']].map(([k, n]) => `<button data-f="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div>
      ${lista.length ? `<div class="tbl"><table><thead><tr><th>Zona</th><th>Supervisor(a)</th><th>Sostenimiento</th><th>Municipio(s)</th><th>Versión</th><th>Último uso</th><th>Estado</th><th><span style="position:absolute;left:-9999px">Acción</span></th></tr></thead><tbody>
        ${lista.map(z => `<tr><td><b>${esc(z.numero)}</b></td><td>${esc(z.supervisor)}</td><td>${esc(z.sostenimiento)}</td><td>${esc(z.municipios)}</td><td><span class="st ${vieja(z) ? 's-vieja' : 's-activa'}">${esc(z.version || '—')}</span></td><td>${hace(z.ultimoUso)}</td><td><span class="st s-${esc(z.estado)}">${z.estado === 'activa' ? 'Activa' : 'Suspendida'}</span></td><td><button class="lk" data-z="${esc(z.numero)}">Ver</button></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="small">${zs.length ? 'Ninguna zona coincide con el filtro.' : 'Todavía no hay zonas registradas. Empiece con «Invitar zona».'}</p>`}
    </section>
    <aside class="card" style="flex:1 1 260px;min-width:0"><h2>Pendientes</h2>
      ${[...sinUso.map(z => `<p class="note" style="margin:0 0 8px"><b>Zona ${esc(z.numero)}</b> no usa Tequio desde ${fecha(z.ultimoUso)}.</p>`),
        ...venceProx.map(i => `<p class="note" style="margin:0 0 8px">La invitación <b>${esc(i.codigo)}</b> (Zona ${esc(i.numero)}) vence el ${fecha(i.vence)}.</p>`),
        ...zs.filter(vieja).map(z => `<p class="note" style="margin:0 0 8px"><b>Zona ${esc(z.numero)}</b> sigue en la versión ${esc(z.version)}.</p>`)].join('') || '<p class="small">Nada pendiente por ahora.</p>'}
    </aside>
  </div>`;
  $('#buscar').oninput = e => { vista.buscar = e.target.value; const p = e.target.selectionStart; vInicio(); const b = $('#buscar'); b.focus(); b.setSelectionRange(p, p); };
  $$('[data-f]').forEach(b => b.onclick = () => { vista.filtro = b.dataset.f; vInicio(); });
  $$('[data-z]').forEach(b => b.onclick = () => { vista.sec = 'zona'; vista.zona = b.dataset.z; pintar(); });
  $('#invitar').onclick = () => { vista.sec = 'invitaciones'; pintar(); };
}

/* ---------- Invitaciones ---------- */
function vInvitaciones() {
  const n = vista.nueva, sos = vista.sos || 'Federalizada', ESTADO = { pendiente: 'Pendiente', usada: 'Usada', vencida: 'Vencida', anulada: 'Anulada' };
  $('#vista').innerHTML = `
  <h1>Invitaciones</h1><p class="lead">Cada supervisión entra solo con un código que se genera aquí. Es de un solo uso y vence.</p>
  <div class="row">
    <section class="card" style="flex:3 1 440px;min-width:0"><h2>Nueva invitación</h2>
      <div class="g2">
        <div><label for="i-para">Supervisor(a), con título</label><input id="i-para" placeholder="Ej. Mtra. Nombre Apellidos"></div>
        <div><label for="i-cor">Correo</label><input id="i-cor" type="email" placeholder="nombre@bcedu.mx"></div>
        <div><label for="i-num">Número de zona</label><input id="i-num" inputmode="numeric" placeholder="Ej. 031"></div>
        <div><label for="i-niv">Nivel</label><select id="i-niv"><option>Primaria</option><option>Preescolar</option><option>Secundaria</option></select></div>
      </div>
      <div style="margin-top:12px"><label>Sostenimiento</label><div class="seg" role="group" aria-label="Sostenimiento"><button data-s="Federalizada" aria-pressed="${sos === 'Federalizada'}">Federalizada · 02DPR</button><button data-s="Estatal" aria-pressed="${sos === 'Estatal'}">Estatal · 02EPR</button></div>
        <p class="small" style="margin:6px 0 0">Define el formato de C.C.T. y el logo institucional: ISEP para federalizadas, Secretaría de Educación para estatales.</p></div>
      <div class="g2" style="margin-top:12px">
        <div><label for="i-dias">El código vence en</label><select id="i-dias"><option value="7">7 días</option><option value="3">3 días</option><option value="15">15 días</option></select></div>
        <div><label for="i-gr">Grupo de actualizaciones</label><select id="i-gr"><option value="general">General</option><option value="piloto">Piloto</option></select></div>
      </div>
      <div style="margin-top:18px"><button class="btn terra" id="generar">Generar invitación</button></div>
    </section>
    <section style="flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px">
      ${n ? `<div class="code"><span style="font-size:14px;color:#E9D8BA">Código para la Zona ${esc(n.numero)}</span><b>${esc(n.codigo)}</b><span style="font-size:14px;color:#E9D8BA">Vence el ${fecha(n.vence)} · un solo uso</span></div>
        <div class="msg" id="msg">${esc(mensajeInv(n))}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">${n.correo ? '<button class="btn pri" id="mandar">Enviar por correo</button>' : ''}<a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(mensajeInv(n))}">Enviar por WhatsApp</a><button class="btn sec" id="copiar">Copiar</button></div>`
      : '<div class="card"><p class="small" style="margin:0">Al generar la invitación aparecerá aquí el código con el mensaje listo para enviar.</p></div>'}
    </section>
  </div>
  <section class="card" style="margin-top:18px"><h2>Invitaciones enviadas</h2>
    ${D.invitaciones.length ? `<div class="tbl"><table><thead><tr><th>Código</th><th>Zona</th><th>Para</th><th>Sostenimiento</th><th>Vence</th><th>Estado</th><th><span style="position:absolute;left:-9999px">Acción</span></th></tr></thead><tbody>
      ${D.invitaciones.slice().reverse().map(i => `<tr><td style="font-family:ui-monospace,monospace">${esc(i.codigo)}</td><td>${esc(i.numero)}</td><td>${esc(i.para)}</td><td>${esc(i.sostenimiento)}</td><td>${fecha(i.vence)}</td><td><span class="st s-${esc(i.estado)}">${ESTADO[i.estado] || esc(i.estado)}</span></td>
        <td>${i.estado === 'pendiente' ? `<button class="lk" data-ver="${esc(i.codigo)}">Ver</button> <button class="lk" data-anular="${esc(i.codigo)}">Anular</button>` : i.estado === 'usada' ? '' : `<button class="lk" data-renovar="${esc(i.codigo)}">Renovar</button>`}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="small">Aún no hay invitaciones.</p>'}
  </section>`;
  $$('[data-s]').forEach(b => b.onclick = () => { vista.sos = b.dataset.s; $$('[data-s]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#generar').onclick = () => accion($('#generar'), async () => {
    const r = await api('crearInvitacion', { para: $('#i-para').value, correo: $('#i-cor').value, numero: $('#i-num').value, nivel: $('#i-niv').value, sostenimiento: vista.sos || 'Federalizada', dias: $('#i-dias').value, grupo: $('#i-gr').value });
    D.invitaciones.push(r.invitacion); vista.nueva = r.invitacion; vInvitaciones(); pintarCuenta();
  });
  if ($('#mandar')) $('#mandar').onclick = () => accion($('#mandar'), async () => { await api('enviarInvitacion', { codigo: n.codigo }); aviso('Invitación enviada a ' + n.correo + '.'); });
  if ($('#copiar')) $('#copiar').onclick = async () => { try { await navigator.clipboard.writeText(mensajeInv(n)); aviso('Mensaje copiado.'); } catch (e) { aviso('No se pudo copiar.'); } };
  $$('[data-ver]').forEach(b => b.onclick = () => { vista.nueva = D.invitaciones.find(i => i.codigo === b.dataset.ver); vInvitaciones(); });
  $$('[data-anular]').forEach(b => b.onclick = () => { if (!confirm('¿Anular la invitación ' + b.dataset.anular + '? Ya no servirá para instalar.')) return;
    accion(b, async () => { const r = await api('anularInvitacion', { codigo: b.dataset.anular }); Object.assign(D.invitaciones.find(i => i.codigo === r.invitacion.codigo), r.invitacion); if (vista.nueva && vista.nueva.codigo === r.invitacion.codigo) vista.nueva = null; vInvitaciones(); pintarCuenta(); }); });
  $$('[data-renovar]').forEach(b => b.onclick = () => accion(b, async () => { const r = await api('renovarInvitacion', { codigo: b.dataset.renovar }); D = await api('resumen'); vista.nueva = r.invitacion; vInvitaciones(); pintarCuenta(); }));
}
const mensajeInv = n => `Estimado(a) ${n.para}:\nLe comparto su acceso para instalar Tequio en la Zona ${n.numero}.\n1. Entre a: ${D.instalador}\n2. Escriba el código ${n.codigo}\n3. Use la cuenta de Google de su supervisión.\nEl código es de un solo uso y vence el ${fecha(n.vence)}.\n\nMtro. Carlos Gabriel Ortega Gutiérrez`;
function pintarCuenta() { const b = $('[data-sec="invitaciones"]'); if (b) b.innerHTML = 'Invitaciones' + (invPend().length ? `<span class="cnt">${invPend().length}</span>` : ''); }

/* ---------- Versiones y avisos ---------- */
function vVersiones() {
  const v = +D.versionVigente || 0, cuenta = {};
  D.zonas.forEach(z => { cuenta[z.version || '—'] = (cuenta[z.version || '—'] || 0) + 1; });
  const a = D.aviso;
  $('#vista').innerHTML = `
  <h1>Versiones y avisos</h1><p class="lead">La versión vigente es la que deben tener todas las zonas. Las que se queden atrás aparecen en Inicio.</p>
  <div class="row">
    <section class="card" style="flex:3 1 440px;min-width:0"><h2>Versión vigente</h2>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div style="flex:0 1 160px"><label for="v-num">Número</label><input id="v-num" type="number" min="1" value="${esc(v || '')}"></div><button class="btn terra" id="v-ok">Marcar como vigente</button></div>
      <p class="small">Al publicar un Código.gs nuevo en la página, marque aquí su número. Cada zona lo ve en su aviso diario y su supervisor sabe que debe actualizar su servidor.</p>
      <h2 style="margin-top:20px;font-size:17px">Zonas por versión</h2>
      ${Object.keys(cuenta).length ? Object.keys(cuenta).sort((x, y) => y.localeCompare(x, 'es', { numeric: true })).map(k => `<p style="margin:4px 0"><span class="st ${v && k !== '—' && +k < v ? 's-vieja' : 's-activa'}">Versión ${esc(k)}</span> ${cuenta[k]} zona${cuenta[k] === 1 ? '' : 's'}</p>`).join('') : '<p class="small">Sin zonas todavía.</p>'}
    </section>
    <section class="card" style="flex:2 1 320px;min-width:0"><h2>Aviso a supervisores</h2>
      ${a ? `<div class="okb" style="margin-bottom:12px"><b>Publicado (${a.grupo === 'piloto' ? 'grupo piloto' : 'todas las zonas'}):</b> ${esc(a.texto)}</div>` : ''}
      <label for="a-txt">Mensaje</label><textarea id="a-txt" placeholder="Ej. El lunes de 7:00 a 8:00 Tequio estará en mantenimiento.">${esc(a ? a.texto : '')}</textarea>
      <div class="g2" style="margin-top:10px"><div><label for="a-gr">Para</label><select id="a-gr"><option value="todas">Todas las zonas</option><option value="piloto" ${a && a.grupo === 'piloto' ? 'selected' : ''}>Grupo piloto</option></select></div>
        <div><label style="visibility:hidden">Correo</label><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="a-cor" style="width:20px;min-height:20px;height:20px">También por correo</label></div></div>
      <p class="small">Aparece dentro del Tequio de cada zona al día siguiente (o al revisar su estado). Déjelo vacío y publique para quitarlo.</p>
      <button class="btn pri" id="a-ok">Publicar aviso</button>
    </section>
  </div>`;
  $('#v-ok').onclick = () => accion($('#v-ok'), async () => { const r = await api('versionVigente', { version: $('#v-num').value }); D.versionVigente = r.versionVigente; aviso('Versión ' + r.versionVigente + ' marcada como vigente.'); vVersiones(); });
  $('#a-ok').onclick = () => accion($('#a-ok'), async () => { const r = await api('publicarAviso', { texto: $('#a-txt').value, grupo: $('#a-gr').value, correo: $('#a-cor').checked }); D.aviso = r.aviso; aviso(r.aviso ? 'Aviso publicado.' : 'Aviso retirado.'); vVersiones(); });
}

/* ---------- Detalle de zona ---------- */
function vZona() {
  const z = D.zonas.find(x => x.numero === vista.zona);
  if (!z) { vista.sec = 'inicio'; return pintar(); }
  const susp = z.estado === 'suspendida';
  $('#vista').innerHTML = `
  <p class="small" style="margin:0 0 6px"><a href="#" id="volver">Zonas</a> › Zona ${esc(z.numero)}</p>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1 style="margin:0">Zona Escolar No. ${esc(z.numero)}</h1><span class="st s-${esc(z.estado)}">${susp ? 'Suspendida' : 'Activa'}</span></div>
  <p class="lead" style="margin-top:4px">${esc(z.supervisor)} · ${esc(z.nivel)} ${esc(z.sostenimiento)} (${z.sostenimiento === 'Estatal' ? '02EPR' : '02DPR'}) · ${esc(z.municipios)}</p>
  <div class="row">
    <section class="card" style="flex:3 1 420px;min-width:0"><h2>Lo que ve de esta zona</h2>
      <dl class="facts">
        <div><dt>Versión</dt><dd>${esc(z.version || '—')}${vieja(z) ? ' · vigente ' + esc(D.versionVigente) : ''}</dd></div><div><dt>Grupo</dt><dd>${z.grupo === 'piloto' ? 'Piloto' : 'General'}</dd></div>
        <div><dt>Instalada el</dt><dd>${fecha(z.instalada)}</dd></div><div><dt>Último uso</dt><dd>${fecha(z.ultimoUso)}</dd></div>
        <div><dt>Entradas este mes</dt><dd>${esc(z.entradasMes || '0')}</dd></div><div><dt>Escuelas registradas</dt><dd>${esc(z.escuelas || '0')}</dd></div>
        <div><dt>Correo de la supervisión</dt><dd>${esc(z.correo)}</dd></div><div><dt>Código con que se instaló</dt><dd>${esc(z.codigo)}</dd></div>
      </dl>
      ${susp ? `<div class="malb" style="margin-top:12px"><b>Motivo de la suspensión:</b> ${esc(z.motivo)}</div>` : ''}
      <h2 style="margin-top:18px;font-size:17px">Lo que nunca ve</h2><p class="small" style="margin:0">Alumnos, personal y expedientes, evidencias, SisAT y EIA, oficios, permisos y tablón: todo eso vive solo en el Drive de la supervisión.</p>
    </section>
    <section class="card" style="flex:2 1 300px;min-width:0"><h2>Acciones</h2>
      <p style="margin:0 0 10px"><b>Grupo de actualizaciones</b><br><span class="small">Ahora: ${z.grupo === 'piloto' ? 'piloto' : 'general'}</span></p>
      <button class="btn ghost" id="grupo">Pasar a ${z.grupo === 'piloto' ? 'general' : 'piloto'}</button>
      ${susp ? '<p style="margin:18px 0 10px"><b>Reactivar la zona</b><br><span class="small">Vuelve a abrir para todo su equipo en menos de 30 minutos.</span></p><button class="btn pri" id="reactivar">Reactivar zona</button>' : ''}
    </section>
  </div>
  ${susp ? '' : `<section class="dz" style="margin-top:18px"><h2>Suspender esta zona</h2>
    <p style="margin:0 0 14px">Nadie de la zona podrá entrar a Tequio hasta que la reactive (tarda hasta 30 minutos en aplicarse). <b>Sus datos no se borran</b>: se quedan en su Drive.</p>
    <div class="g2"><div><label for="mo">Motivo</label><select id="mo"><option>Cambio de titular</option><option>Solicitud del supervisor(a)</option><option>Uso indebido de los enlaces</option><option>Otro</option></select></div>
      <div><label for="cf">Para confirmar, escriba el número de zona</label><input id="cf" placeholder="${esc(z.numero)}"></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn danger" id="suspender">Suspender zona</button></div></section>`}`;
  $('#volver').onclick = e => { e.preventDefault(); vista.sec = 'inicio'; pintar(); };
  const actualizar = r => { Object.assign(z, r.zona); vZona(); };
  $('#grupo').onclick = () => accion($('#grupo'), async () => actualizar(await api('estadoZona', { numero: z.numero, grupo: z.grupo === 'piloto' ? 'general' : 'piloto' })));
  if ($('#reactivar')) $('#reactivar').onclick = () => accion($('#reactivar'), async () => { actualizar(await api('estadoZona', { numero: z.numero, estado: 'activa' })); aviso('Zona reactivada.'); });
  if ($('#suspender')) $('#suspender').onclick = () => {
    if ($('#cf').value.trim().replace(/^0+/, '') !== z.numero.replace(/^0+/, '')) return aviso('Escriba el número de zona para confirmar.');
    accion($('#suspender'), async () => { actualizar(await api('estadoZona', { numero: z.numero, estado: 'suspendida', motivo: $('#mo').value })); aviso('Zona suspendida.'); });
  };
}

async function accion(b, f) {
  const t = b.innerHTML; b.disabled = true; b.textContent = 'Un momento…';
  try { await f(); } catch (e) { aviso(e.message, 5000); } finally { if (document.body.contains(b)) { b.disabled = false; b.innerHTML = t; } }
}

if (!CFG) $('#app').innerHTML = '<div class="vacia"><h1>Consola de Tequio</h1><p>Abra esta página desde el enlace de administrador que llegó por correo a tequio023@gmail.com.</p></div>';
else cargar();
</script>
</body>
</html>
