<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tablet-Tini: una tableta que revive con la luz de Tlamatini -->
  <defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16808E"/><stop offset="1" stop-color="#0E5A66"/></linearGradient></defs>
  <rect width="200" height="200" rx="44" fill="url(#t)"/>
  <!-- tableta -->
  <rect x="44" y="34" width="112" height="140" rx="18" fill="#FBF6EC"/>
  <rect x="54" y="46" width="92" height="106" rx="9" fill="#F2B134"/>
  <circle cx="100" cy="163" r="5" fill="#0E5A66"/>
  <!-- espiral de Tlamatini en pantalla -->
  <g transform="translate(5 8)">
    <path d="M58 132 H70 V120 H82 V108 H95 A24 24 0 0 0 95 60 A17 17 0 0 0 95 94 A11 11 0 0 0 95 72 A5 5 0 0 0 95 82" fill="none" stroke="#1F3A6B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="77" r="3.6" fill="#FBF6EC"/>
  </g>
  <!-- chispas: «volver a la vida» -->
  <g stroke="#FBF6EC" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M164 34 l8 -8"/><path d="M170 52 h11"/><path d="M152 22 v-10"/>
  </g>
</svg>
