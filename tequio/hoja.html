<script>
'use strict';
const WA_ADMIN = '526618501585';
const MUNICIPIOS_BC = ['Ensenada', 'San Quintín', 'Tijuana', 'Playas de Rosarito', 'Tecate', 'Mexicali', 'San Felipe'];
const COLS = [['cct', 'C.C.T.'], ['escuela', 'Escuela'], ['localidad', 'Localidad'], ['municipio', 'Municipio'], ['turno', 'Turno'], ['organizacion', 'Organización'], ['director', 'Director(a) o encargado(a)'], ['correo', 'Correo'], ['whatsapp', 'WhatsApp'], ['domicilio', 'Domicilio']];
const RE_MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, esCct = c => /^\d{2}[A-Z]{3}\d{4}[A-Z]$/.test(c);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function avisar(t, ms) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3800); }

/* ---------- código de invitación (#inv=TQ-XXXX-XXXX) ---------- */
function codigoUrl() { const m = (location.hash || '').match(/[#&]inv=([A-Za-z0-9-]{6,})/); return m ? m[1].toUpperCase() : ''; }

/* ---------- borrador en el dispositivo ---------- */
const nuevaEsc = () => ({ cct: prefijo(), escuela: '', localidad: '', municipio: H.p.autoridades[0] && H.p.autoridades[0].municipio || H.p.municipioSede || '', turno: 'Matutino', organizacion: 'Completa', director: '', cargo: 'Director(a)', correo: '', whatsapp: '', domicilio: '' });
const vacia = () => ({ codigo: '', inv: null, cuenta: '', obs: '', logo: '', firma: '', sello: '', escuelas: [], atps: [], enviado: null,
  p: { sede: '', municipioSede: '', codigoPostal: '', telefono: '', cctSupervision: '', titulo: 'Mtro.', nombre: '', cargoSupervisor: 'Supervisor Escolar', correoInstitucional: '', whatsappAdmin: '', lemaZona: '', autoridades: [] } });
let H = vacia();
const clave = c => 'tequio.hoja.' + (c || 'x');
function cargar(c) { try { const g = JSON.parse(localStorage.getItem(clave(c)) || 'null'); if (g && g.p) { H = Object.assign(vacia(), g); H.p = Object.assign(vacia().p, g.p); return true; } } catch (e) {} H = vacia(); H.codigo = c; return false; }
let _t; function guardar() { clearTimeout(_t); _t = setTimeout(() => {
  try { localStorage.setItem(clave(H.codigo), JSON.stringify(H)); $('#est').textContent = 'Guardado en este dispositivo.'; }
  catch (e) { try { localStorage.setItem(clave(H.codigo), JSON.stringify(Object.assign({}, H, { firma: '', sello: '' }))); } catch (e2) {} $('#est').textContent = 'Sus datos se guardan; las imágenes pesan mucho para este dispositivo: no cierre antes de enviar.'; } }, 350); }
const get = p => p.split('.').reduce((o, k) => o == null ? o : o[k], H);
function set(p, v) { const k = p.split('.'), u = k.pop(), o = k.reduce((a, b) => a[b], H); o[u] = v; guardar(); }
const estatal = () => H.inv && H.inv.sostenimiento === 'Estatal';
const prefijo = () => estatal() ? '02EPR' : '02DPR';

/* ---------- registro central (su dirección se lee del código publicado del servidor) ---------- */
let REGISTRO = '';
async function registro() {
  if (REGISTRO) return REGISTRO;
  const r = await fetch('servidor/Codigo.gs', { cache: 'no-store' });
  if (!r.ok) throw new Error('No se pudo conectar. Revise su internet.');
  const m = (await r.text()).match(/const REGISTRO_URL = '([^']*)'/); REGISTRO = m ? m[1] : '';
  if (!REGISTRO) throw new Error('El registro de Tequio no está disponible. Avise al administrador.');
  return REGISTRO;
}
async function post(accion, datos) {
  let r; try { const res = await fetch(await registro(), { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, datos }) }); r = await res.json(); }
  catch (e) { throw new Error(e.message && /registro/i.test(e.message) ? e.message : 'No hubo respuesta. Revise su internet.'); }
  if (!r.ok) throw new Error(r.mensaje || 'Ocurrió un error.');
  return r;
}

/* ---------- qué falta ---------- */
let MARCAR = false;
function faltas() {
  const F = [], p = H.p;
  if (!p.sede.trim()) F.push(['p.sede', 'Sede de la supervisión']);
  if (!p.municipioSede) F.push(['p.municipioSede', 'Municipio de la sede']);
  if (!p.nombre.trim()) F.push(['p.nombre', 'Nombre de quien firma']);
  if (!RE_MAIL.test(p.correoInstitucional)) F.push(['p.correoInstitucional', 'Correo institucional']);
  if (String(p.whatsappAdmin).replace(/\D/g, '').length !== 10) F.push(['p.whatsappAdmin', 'WhatsApp a 10 dígitos']);
  if (!RE_MAIL.test(H.cuenta)) F.push(['cuenta', 'Cuenta de Google de la supervisión']);
  p.autoridades.forEach((a, i) => { if (!a.municipio) F.push([`p.autoridades.${i}.municipio`, `Autoridad ${i + 1}: municipio`]); if (!a.nombre.trim()) F.push([`p.autoridades.${i}.nombre`, `Autoridad ${i + 1}: nombre`]); });
  if (!p.autoridades.length) F.push(['', 'Autoridad inmediata de al menos un municipio']);
  if (!H.logo) F.push(['logo', 'Logo de la zona']);
  if (!H.escuelas.length) F.push(['', 'Sus escuelas']);
  H.escuelas.forEach((e, i) => { const n = e.escuela || `Escuela ${i + 1}`, q = `escuelas.${i}.`;
    if (!esCct(e.cct) || !e.cct.startsWith(prefijo())) F.push([q + 'cct', `${n}: C.C.T. (${prefijo()}0000X)`]);
    if (!e.escuela.trim()) F.push([q + 'escuela', `Escuela ${i + 1}: nombre`]);
    if (!e.director.trim()) F.push([q + 'director', `${n}: director(a) o encargado(a)`]);
    if (!RE_MAIL.test(e.correo)) F.push([q + 'correo', `${n}: correo`]); });
  const dup = H.escuelas.map(e => e.cct).find((c, i, a) => c && a.indexOf(c) !== i); if (dup) F.push(['', `La clave ${dup} está repetida`]);
  H.atps.forEach((a, i) => { const n = a.nombre || `ATP ${i + 1}`;
    if (!a.nombre.trim()) F.push([`atps.${i}.nombre`, `ATP ${i + 1}: nombre`]); if (!RE_MAIL.test(a.correo)) F.push([`atps.${i}.correo`, `${n}: correo`]); });
  return F;
}
const malo = p => MARCAR && faltas().some(f => f[0] === p) ? ' mal' : '';

/* ---------- piezas ---------- */
const campo = (lbl, p, ex = '', req = true) => `<label class="campo${malo(p)}"><span>${lbl}${req ? ' <b class="req">*</b>' : '<span class="opt">opcional</span>'}</span><input data-p="${p}" value="${esc(get(p))}" ${ex}></label>`;
const sel = (lbl, p, ops, req = true) => `<label class="campo${malo(p)}"><span>${lbl}${req ? ' <b class="req">*</b>' : ''}</span><select data-p="${p}"><option value="">Elija…</option>${ops.map(o => `<option ${String(get(p)) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
const img = (k, et, ay, req) => `<div class="campo"><span>${et}${req ? ' <b class="req">*</b>' : '<span class="opt">opcional</span>'}</span><div class="drop${req ? malo(k) : ''}">${H[k] ? `<img src="${H[k]}" alt="">` : ''}<span>${H[k] ? 'Cambiar imagen' : 'Toque para <u>elegir una imagen</u>'}<br>${ay}</span><input type="file" data-img="${k}" accept="image/png,image/jpeg,image/webp"></div>${H[k] ? `<div><button class="btn s r" data-qi="${k}" style="margin-top:6px">Quitar</button></div>` : ''}</div>`;
const munZona = () => { const m = H.p.autoridades.map(a => a.municipio).filter(Boolean); return m.length ? m : (H.p.municipioSede ? [H.p.municipioSede] : MUNICIPIOS_BC); };
const casillas = (a, i) => H.escuelas.length ? H.escuelas.map(e => `<label><input type="checkbox" data-t="${i}" value="${esc(e.cct)}" ${a.escuelas.includes(e.cct) ? 'checked' : ''}>${esc(e.escuela || e.cct)}</label>`).join('') : '<span class="sub" style="margin:0">Primero capture sus escuelas (sección 5).</span>';
const totales = () => { const ml = H.escuelas.filter(e => /multi/i.test(e.organizacion)).length; return `<span><b>${H.escuelas.length}</b> escuelas</span><span>Multigrado <b>${ml}</b></span><span>Organización completa <b>${H.escuelas.length - ml}</b></span><span>Vespertinas <b>${H.escuelas.filter(e => /vesp/i.test(e.turno)).length}</b></span>`; };
const supervisor = () => [H.p.titulo, H.p.nombre.trim()].filter(Boolean).join(' ');

/* ---------- pantallas ---------- */
function pintar() {
  $('#chip').textContent = H.inv ? `Zona Escolar No. ${H.inv.numero} · ${H.inv.sostenimiento}` : 'Supervisión nueva';
  if (!H.inv) return pintarCodigo();
  if (H.enviado) { $('#barra').classList.add('oculto');
    $('#app').innerHTML = `<section class="card"><h2>✓ Su hoja se envió</h2><p class="sub">El administrador de Tequio recibió los datos de la Zona ${esc(H.inv.numero)} el ${new Date(H.enviado).toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' })}.</p>
      <p>Cuando instale Tequio con su código <b style="font-family:ui-monospace,monospace">${esc(H.codigo)}</b>, el asistente cargará solos estos datos; solo tendrá que revisarlos y conectar la cuenta de Google de su supervisión.</p>
      <div class="fila" style="margin-top:16px"><a class="btn ind" href="instalar/">Ir a instalar Tequio</a><button class="btn" id="editar">Corregir algo y volver a enviar</button></div></section>`;
    $('#editar').onclick = () => { H.enviado = null; guardar(); pintar(); }; return; }
  $('#barra').classList.remove('oculto');
  const F = MARCAR ? faltas() : [], p = H.p;
  $('#app').innerHTML = `<section class="intro"><h1>Hoja de captura de la Zona ${esc(H.inv.numero)}</h1>
    <p class="lead">Llénela con calma: se guarda sola en este dispositivo y puede terminarla después. Al final toque <b>Enviar hoja</b>. Cuando instale Tequio, todo esto se carga solo.</p></section>` +
  (F.length ? `<div class="malb"><b>Le falta:</b><br>${F.slice(0, 15).map(f => '· ' + esc(f[1])).join('<br>')}${F.length > 15 ? `<br>… y ${F.length - 15} más (marcados en rojo)` : ''}</div>` : '') +

  `<section class="card"><h2><span class="n">1</span>Datos de la supervisión</h2><p class="sub">Con esto Tequio arma los encabezados, oficios, informes y correos de su zona. Los campos con <b class="req">*</b> son obligatorios.</p><div class="rej">
    <label class="campo"><span>Zona</span><input readonly value="${esc(H.inv.numero)} · ${esc(H.inv.nivel)} ${esc(H.inv.sostenimiento)}"></label>
    ${campo('Sede (localidad)', 'p.sede', 'placeholder="Ej. Vicente Guerrero"')}${sel('Municipio de la sede', 'p.municipioSede', MUNICIPIOS_BC)}
    ${campo('Código postal', 'p.codigoPostal', 'inputmode="numeric" maxlength="5"', false)}${campo('Teléfono de la supervisión', 'p.telefono', 'type="tel"', false)}
    ${campo('C.C.T. de la supervisión', 'p.cctSupervision', 'placeholder="02FIZ…" style="text-transform:uppercase"', false)}</div>
    <div class="bloque"><h3>Cuenta de Google de la supervisión</h3><p class="sub" style="margin-top:-4px">Ahí se instala Tequio: en su Drive quedan las carpetas de las escuelas y de ahí salen los correos. Use una cuenta de la supervisión, no la personal.</p>
    <div class="rej">${campo('Correo de la cuenta (Gmail)', 'cuenta', 'type="email" inputmode="email" placeholder="supervisionzona000@gmail.com"')}</div></div></section>

  <section class="card"><h2><span class="n">2</span>Quién firma</h2><p class="sub">Como aparecerá en los oficios y correos.</p><div class="rej">
    ${sel('Título', 'p.titulo', ['Mtro.', 'Mtra.', 'Profr.', 'Profra.', 'Lic.', 'Dr.', 'Dra.'])}${campo('Nombre completo', 'p.nombre', 'autocomplete="name"')}
    ${campo('Cargo', 'p.cargoSupervisor')}${campo('Correo institucional', 'p.correoInstitucional', 'type="email" inputmode="email" placeholder="nombre@bcedu.mx"')}
    ${campo('WhatsApp (10 dígitos)', 'p.whatsappAdmin', 'type="tel" inputmode="numeric"')}</div></section>

  <section class="card"><h2><span class="n">3</span>Autoridad inmediata por municipio</h2><p class="sub">A quién se dirigen los oficios de cada municipio de su zona. Si su zona abarca dos municipios, agregue los dos: los oficios nunca los mezclan.</p>
    ${p.autoridades.map((a, i) => `<div class="bloque"><h3><span data-tit="aut.${i}">${esc(a.municipio || 'Municipio ' + (i + 1))}</span>${i ? `<button class="btn s r" data-qa="${i}">Quitar</button>` : ''}</h3><div class="rej">
      ${sel('Municipio', `p.autoridades.${i}.municipio`, MUNICIPIOS_BC)}${campo('Nombre con título', `p.autoridades.${i}.nombre`, 'placeholder="Ej. PROFR. NOMBRE APELLIDOS"')}
      ${campo('Cargo', `p.autoridades.${i}.cargo`, '', false)}${campo('Institución', `p.autoridades.${i}.institucion`, '', false)}</div></div>`).join('')}
    <div class="fila" style="margin-top:12px"><button class="btn" id="addAut">＋ Agregar otro municipio</button></div></section>

  <section class="card"><h2><span class="n">4</span>Identidad de su zona</h2><p class="sub">El logo institucional (${estatal() ? 'Secretaría de Educación' : 'ISEP'}) lo pone Tequio según el sostenimiento de su zona; aquí va el de su supervisión.</p>
    <div class="rej">${img('logo', 'Logo de la zona', 'PNG o JPG', true)}${img('firma', 'Firma digital', 'PNG sin fondo')}${img('sello', 'Sello', 'PNG sin fondo')}</div>
    <div class="rej">${campo('Lema de la zona', 'p.lemaZona', '', false)}</div></section>

  <section class="card"><h2><span class="n">5</span>Sus escuelas</h2><p class="sub">Una fila por escuela. Si ya las tiene en Excel, súbalo y se llenan solas; luego revise. Claves ${estatal() ? 'estatales: 02EPR' : 'federalizadas: 02DPR'}.</p>
    <div class="fila"><label class="btn ind s" style="position:relative;overflow:hidden">📎 Subir Excel de escuelas<input type="file" id="xls" accept=".xlsx,.xls,.csv" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><button class="btn s" id="plantilla">Descargar plantilla</button></div>
    <div class="tot" id="tot">${totales()}</div>
    <div class="ren e-ren cab"><span>C.C.T.</span><span>Escuela</span><span>Localidad</span><span>Municipio</span><span>Turno</span><span>Organización</span><span>Director(a) o encargado(a)</span><span>Correo</span><span>WhatsApp</span><span>Domicilio</span><span></span></div>
    ${H.escuelas.map((e, i) => `<div class="ren e-ren"><div class="tit" data-tit="esc.${i}">${esc(e.escuela || 'Escuela ' + (i + 1))}</div>
      ${campo('C.C.T.', `escuelas.${i}.cct`, 'style="text-transform:uppercase;font-family:ui-monospace,monospace"')}<div class="ancho">${campo('Escuela', `escuelas.${i}.escuela`)}</div>
      ${campo('Localidad', `escuelas.${i}.localidad`, '', false)}${sel('Municipio', `escuelas.${i}.municipio`, munZona(), false)}
      ${sel('Turno', `escuelas.${i}.turno`, ['Matutino', 'Vespertino'], false)}${sel('Organización', `escuelas.${i}.organizacion`, ['Completa', 'Multigrado'], false)}
      <div class="ancho">${campo('Director(a) o encargado(a)', `escuelas.${i}.director`, 'placeholder="Con título: MTRO. …"')}</div><div class="ancho">${campo('Correo', `escuelas.${i}.correo`, 'type="email" inputmode="email"')}</div>
      ${campo('WhatsApp', `escuelas.${i}.whatsapp`, 'type="tel" inputmode="numeric"', false)}<div class="ancho">${campo('Domicilio', `escuelas.${i}.domicilio`, '', false)}</div>
      <button class="quitar" data-qe="${i}" title="Quitar escuela" aria-label="Quitar escuela">✕</button></div>`).join('')}
    <div class="fila" style="margin-top:10px"><button class="btn" id="addEsc">＋ Agregar escuela</button></div></section>

  <section class="card"><h2><span class="n">6</span>Sus ATP</h2><p class="sub">Agregue a sus Asesores Técnico Pedagógicos y marque las escuelas que acompaña cada uno. Si aún no tiene, déjelo vacío y los agrega después en Tequio.</p>
    ${H.atps.map((a, i) => `<div class="bloque"><h3><span data-tit="atp.${i}">${esc(a.nombre || 'ATP ' + (i + 1))}</span><button class="btn s r" data-qt="${i}">Quitar</button></h3><div class="rej">
      ${campo('Nombre con título', `atps.${i}.nombre`, 'placeholder="Ej. Mtra. Nombre Apellidos"')}${campo('Correo', `atps.${i}.correo`, 'type="email" inputmode="email" placeholder="nombre@bcedu.mx"')}${campo('WhatsApp', `atps.${i}.whatsapp`, 'type="tel" inputmode="numeric"', false)}</div>
      <div class="campo" style="margin:0"><span>Escuelas que acompaña</span><div class="casillas" data-cas="${i}">${casillas(a, i)}</div></div></div>`).join('')}
    <div class="fila" style="margin-top:12px"><button class="btn" id="addAtp">＋ Agregar ATP</button></div></section>

  <section class="card"><h2><span class="n">7</span>Algo más para el administrador</h2><label class="campo" style="margin-top:10px"><span>Comentarios<span class="opt">opcional</span></span><textarea data-p="obs" placeholder="Ej. dos escuelas comparten edificio; una está en proceso de cambio de director…">${esc(H.obs)}</textarea></label></section>`;
  enlazar();
}

function pintarCodigo(error) {
  $('#barra').classList.add('oculto');
  $('#app').innerHTML = `<section class="card" style="max-width:640px"><h2>Bienvenido a Tequio</h2>
    <p class="sub">Esta hoja junta los datos de su supervisión para dejar Tequio listo. Escriba el código de invitación que le mandó el administrador.</p>
    <div class="note"><b>Tenga a la mano:</b> la lista de sus escuelas (en Excel, si la tiene), los correos de sus directores y ATP, el nombre de su autoridad inmediata y el logo de su zona.</div>
    <label class="campo" style="margin-top:14px"><span>Código de invitación</span><input id="cod" value="${esc(H.codigo || codigoUrl())}" placeholder="TQ-XXXX-XXXX" autocomplete="off" style="font-family:ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase"></label>
    <div id="res">${error ? `<div class="malb">${esc(error)}</div>` : ''}</div>
    <div class="fila" style="margin-top:14px"><button class="btn pri" id="entrar">Abrir mi hoja</button>
    <a class="btn" href="https://wa.me/${WA_ADMIN}?text=${encodeURIComponent('Hola, necesito mi código para la hoja de captura de Tequio.')}" target="_blank" rel="noopener">Pedir código por WhatsApp</a></div></section>`;
  $('#entrar').onclick = () => entrar($('#cod').value.trim().toUpperCase());
}

async function entrar(c) {
  if (!c) return avisar('Escriba el código de invitación.');
  const b = $('#entrar'); if (b) { b.disabled = true; b.textContent = 'Revisando…'; }
  try {
    const r = await post('validarInvitacion', { codigo: c });
    let habia = cargar(c);
    if (!habia) {   // código renovado: se aprovecha el borrador que ya tenía con el código anterior de la misma zona
      try { for (let k = 0; k < localStorage.length; k++) { const n = localStorage.key(k); if (!/^tequio\.hoja\.TQ-/.test(n)) continue;
        const g = JSON.parse(localStorage.getItem(n) || 'null'); if (g && g.inv && g.inv.numero === r.invitacion.numero && g.p) { H = Object.assign(vacia(), g, { enviado: null }); H.p = Object.assign(vacia().p, g.p); habia = true; break; } } } catch (e) {}
    }
    H.codigo = c; H.inv = r.invitacion;
    if (!habia) {   // en otro dispositivo: si ya había enviado su hoja, se recupera
      try { const g = await post('hojaLeer', { codigo: c }); if (g.hoja && g.hoja.p) Object.assign(H, { p: Object.assign(vacia().p, g.hoja.p), cuenta: g.hoja.cuenta || '', logo: g.hoja.logo || '', firma: g.hoja.firma || '', sello: g.hoja.sello || '', escuelas: g.hoja.escuelas || [], atps: g.hoja.atps || [], obs: g.hoja.obs || '' }); } catch (e) {}
      if (!H.p.nombre && H.inv.para) { const m = H.inv.para.match(/^(Mtro\.|Mtra\.|Profr\.|Profra\.|Lic\.|Dr\.|Dra\.)\s*(.*)$/i); if (m) { H.p.titulo = m[1]; H.p.nombre = m[2]; } else H.p.nombre = H.inv.para; }
      if (!H.p.correoInstitucional && /@bcedu\.mx$/i.test(H.inv.correo || '')) H.p.correoInstitucional = H.inv.correo;
      if (!H.cuenta && /@gmail\.com$/i.test(H.inv.correo || '')) H.cuenta = H.inv.correo;
    }
    if (!H.p.autoridades.length) H.p.autoridades = [{ municipio: H.p.municipioSede || '', nombre: '', cargo: 'Jefe(a) del Departamento de Educación Primaria', institucion: estatal() ? 'Secretaría de Educación' : 'ISEP' }];
    try { localStorage.setItem('tequio.hoja.ultimo', c); } catch (e) {}
    if (codigoUrl() !== c) history.replaceState(null, '', '#inv=' + c);
    guardar(); pintar();
  } catch (e) { pintarCodigo(e.message); }
}

/* ---------- eventos ---------- */
function enlazar() {
  $$('[data-p]').forEach(i => {
    i.oninput = () => { let v = i.value; if (/\.cct$|cctSupervision$/.test(i.dataset.p)) v = v.toUpperCase().replace(/\s/g, ''); if (/whatsapp/i.test(i.dataset.p)) v = v.replace(/\D/g, '').slice(-10); set(i.dataset.p, v); };
    i.onchange = () => refrescar(i.dataset.p);
  });
  $$('[data-img]').forEach(i => i.onchange = async () => { const f = i.files[0]; if (!f) return; if (f.size > 8e6) return avisar('La imagen es muy grande (máximo 8 MB).');
    try { H[i.dataset.img] = await achicar(f, i.dataset.img === 'logo' ? 600 : 500); guardar(); repintar(); } catch (e) { avisar(e.message); } });
  $$('[data-qi]').forEach(b => b.onclick = () => { H[b.dataset.qi] = ''; guardar(); repintar(); });
  $$('[data-qa]').forEach(b => b.onclick = () => { H.p.autoridades.splice(+b.dataset.qa, 1); guardar(); repintar(); });
  $$('[data-qe]').forEach(b => b.onclick = () => { const e = H.escuelas[+b.dataset.qe]; if ((e.escuela || e.director) && !confirm('¿Quitar ' + (e.escuela || 'esta escuela') + '?')) return;
    H.escuelas.splice(+b.dataset.qe, 1); H.atps.forEach(a => a.escuelas = a.escuelas.filter(c => c !== e.cct)); guardar(); repintar(); });
  $$('[data-qt]').forEach(b => b.onclick = () => { H.atps.splice(+b.dataset.qt, 1); guardar(); repintar(); });
  enlazarCasillas();
  $('#addAut').onclick = () => { H.p.autoridades.push({ municipio: '', nombre: '', cargo: 'Jefe(a) del Departamento de Educación Primaria', institucion: estatal() ? 'Secretaría de Educación' : 'ISEP' }); guardar(); repintar(); };
  $('#addEsc').onclick = () => { H.escuelas.push(nuevaEsc()); guardar(); repintar(); };
  $('#addAtp').onclick = () => { H.atps.push({ nombre: '', correo: '', whatsapp: '', escuelas: [] }); guardar(); repintar(); };
  $('#plantilla').onclick = plantilla;
  $('#xls').onchange = ev => leerLista(ev.target.files[0]);
}
/* Actualiza títulos, totales y casillas sin volver a dibujar la hoja (así no se pierde el campo en el que se está escribiendo) */
function refrescar(p) {
  const tit = (k, t) => { const el = document.querySelector(`[data-tit="${k}"]`); if (el) el.textContent = t; };
  let m;
  if ((m = p.match(/^escuelas\.(\d+)\.(escuela|cct)$/))) {
    const i = +m[1], e = H.escuelas[i];
    if (m[2] === 'cct') { const viejo = e._cct; if (viejo && viejo !== e.cct) H.atps.forEach(a => a.escuelas = a.escuelas.map(c => c === viejo ? e.cct : c)); e._cct = e.cct; }
    tit('esc.' + i, e.escuela || 'Escuela ' + (i + 1));
    H.atps.forEach((a, j) => { const c = document.querySelector(`[data-cas="${j}"]`); if (c) { c.innerHTML = casillas(a, j); enlazarCasillas(); } });
  }
  if (/^escuelas\.\d+\.(organizacion|turno)$/.test(p)) $('#tot').innerHTML = totales();
  if ((m = p.match(/^p\.autoridades\.(\d+)\.municipio$/))) { tit('aut.' + m[1], H.p.autoridades[+m[1]].municipio || 'Municipio ' + (+m[1] + 1));
    const L = munZona(); $$('select[data-p$=".municipio"]').forEach(s => { if (!/^escuelas/.test(s.dataset.p)) return; const v = s.value; s.innerHTML = '<option value="">Elija…</option>' + L.map(o => `<option>${esc(o)}</option>`).join(''); s.value = L.includes(v) ? v : ''; }); }
  if (p === 'p.municipioSede') { const a = H.p.autoridades[0]; if (a && !a.municipio && H.p.municipioSede) { a.municipio = H.p.municipioSede; guardar(); const s = document.querySelector('[data-p="p.autoridades.0.municipio"]'); if (s) s.value = a.municipio; refrescar('p.autoridades.0.municipio'); } }
  if ((m = p.match(/^atps\.(\d+)\.nombre$/))) tit('atp.' + m[1], H.atps[+m[1]].nombre || 'ATP ' + (+m[1] + 1));
}
function enlazarCasillas() { $$('[data-t]').forEach(c => c.onchange = () => { const a = H.atps[+c.dataset.t]; a.escuelas = $$(`[data-t="${c.dataset.t}"]:checked`).map(x => x.value); guardar(); }); }
function repintar() { const y = scrollY, a = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.p : null; pintar(); scrollTo(0, y); if (a) { const el = document.querySelector(`[data-p="${a}"]`); if (el && el.tagName === 'INPUT') el.focus(); } }

// Imagen → PNG de tamaño razonable (conserva la transparencia de firma y sello)
function achicar(file, max) {
  return new Promise((ok, mal) => { const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/png')); };
    im.onerror = () => mal(new Error('No se pudo leer la imagen.')); im.src = u; });
}

/* ---------- Excel de escuelas (mismas columnas que el asistente de instalación) ---------- */
function plantilla() {
  if (!window.XLSX) return avisar('Un momento: se está cargando el lector de Excel.');
  const ej = { cct: prefijo() + '0000A', escuela: 'Nombre de la escuela', localidad: H.p.sede, municipio: H.p.municipioSede, turno: 'Matutino', organizacion: 'Completa', director: 'MTRO. NOMBRE APELLIDOS', correo: 'escuela@bcedu.mx', whatsapp: '6160000000', domicilio: 'Calle, colonia' };
  const ws = XLSX.utils.aoa_to_sheet([COLS.map(c => c[1]), COLS.map(c => ej[c[0]])]); ws['!cols'] = COLS.map(() => ({ wch: 22 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Escuelas'); XLSX.writeFile(wb, 'Plantilla de escuelas · Tequio.xlsx');
}
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const ALIAS = { cct: ['cct', 'clave', 'clavect', 'clavedelcentrodetrabajo', 'cctescuela'], escuela: ['escuela', 'nombre', 'nombredelaescuela', 'nombreescuela', 'centrodetrabajo'], localidad: ['localidad', 'poblado', 'comunidad', 'colonia'],
  municipio: ['municipio', 'mpio'], turno: ['turno'], organizacion: ['organizacion', 'organiza', 'tipo', 'multigrado', 'tipodeorganizacion'], director: ['director', 'directora', 'directoroencargado', 'nombredeldirector', 'responsable', 'encargado'],
  correo: ['correo', 'email', 'correoelectronico', 'correoinstitucional'], whatsapp: ['whatsapp', 'telefono', 'celular', 'tel'], domicilio: ['domicilio', 'direccion', 'calle'] };
async function leerLista(f) {
  if (!f) return; if (!window.XLSX) return avisar('Un momento: se está cargando el lector de Excel.');
  try {
    const wb = /\.csv$/i.test(f.name) ? XLSX.read(await f.text(), { type: 'string' }) : XLSX.read(await f.arrayBuffer(), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    const ih = filas.findIndex(r => r.some(c => ALIAS.cct.includes(norm(c))));
    if (ih < 0) throw new Error('No encontré la columna de la clave (C.C.T.). Use la plantilla.');
    const mapa = {}; filas[ih].forEach((h, i) => { const n = norm(h); Object.keys(ALIAS).forEach(k => { if (mapa[k] == null && (ALIAS[k].includes(n) || ALIAS[k].some(a => a.length > 4 && n.startsWith(a)))) mapa[k] = i; }); });
    const mun = munZona();
    let n = 0; filas.slice(ih + 1).filter(r => String(r[mapa.cct] || '').trim()).forEach(r => {
      const g = k => mapa[k] == null ? '' : String(r[mapa[k]]).trim(), o = g('organizacion');
      const e = { cct: g('cct').toUpperCase().replace(/\s/g, ''), escuela: g('escuela'), localidad: g('localidad'), municipio: mun.find(x => norm(x) === norm(g('municipio'))) || mun[0] || '', turno: /vesp/i.test(g('turno')) ? 'Vespertino' : 'Matutino',
        organizacion: /multi|unitari|bidoc|tridoc|^s[ií]$/i.test(o) && !/complet/i.test(o) ? 'Multigrado' : 'Completa', director: g('director'), cargo: 'Director(a)', correo: g('correo'), whatsapp: g('whatsapp').replace(/\D/g, '').slice(-10), domicilio: g('domicilio') };
      const i = H.escuelas.findIndex(x => x.cct === e.cct); if (i >= 0) H.escuelas[i] = e; else { const v = H.escuelas.findIndex(x => !x.escuela && !x.director); if (v >= 0) H.escuelas[v] = e; else H.escuelas.push(e); } n++; });
    guardar(); repintar(); avisar('Se leyeron ' + n + ' escuelas. Revíselas en la tabla.');
  } catch (e) { avisar(e.message || 'No se pudo leer el archivo.'); }
}

/* ---------- envío ---------- */
function resumen() { const p = H.p;
  return `Zona ${H.inv.numero} · ${H.inv.nivel} ${H.inv.sostenimiento}\nSupervisor(a): ${supervisor()} (${p.cargoSupervisor})\nSede: ${p.sede}, ${p.municipioSede}${p.telefono ? ' · Tel. ' + p.telefono : ''}\nCorreo institucional: ${p.correoInstitucional} · WhatsApp: ${p.whatsappAdmin}\nCuenta de Google de la supervisión: ${H.cuenta}\n` +
    `Autoridades: ${p.autoridades.map(a => `${a.municipio}: ${a.nombre}`).join('; ')}\n` +
    `Escuelas (${H.escuelas.length}):\n${H.escuelas.map(e => `  · ${e.cct} ${e.escuela} (${e.turno}, ${e.organizacion}) · ${e.director}`).join('\n')}\n` +
    `ATP (${H.atps.length}): ${H.atps.map(a => `${a.nombre} (${a.escuelas.length} escuelas)`).join('; ') || 'ninguno por ahora'}\n` +
    `Logo: ${H.logo ? 'sí' : 'no'} · Firma: ${H.firma ? 'sí' : 'no'} · Sello: ${H.sello ? 'sí' : 'no'}` + (H.obs.trim() ? `\nComentarios: ${H.obs.trim()}` : ''); }
async function enviar() {
  MARCAR = true; const F = faltas();
  if (F.length) { pintar(); scrollTo(0, 0); if (!confirm(`Le faltan ${F.length} dato(s), marcados en rojo.\n\n¿Quiere enviarla así? Podrá completarlos después o en el asistente de instalación.`)) return; }
  const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
  const hoja = { version: 1, fecha: new Date().toISOString(), supervision: { supervisor: supervisor() }, p: H.p, cuenta: H.cuenta.trim(), logo: H.logo, firma: H.firma, sello: H.sello,
    escuelas: H.escuelas.map(e => { const o = Object.assign({}, e, { cct: e.cct.toUpperCase() }); delete o._cct; return o; }), atps: H.atps, obs: H.obs };
  try {
    if (navigator.onLine === false) throw new Error('No hay internet en este momento.');
    await post('hojaGuardar', { codigo: H.codigo, hoja, resumen: resumen() });
    H.enviado = new Date().toISOString(); MARCAR = false; guardar(); scrollTo(0, 0); pintar();
  } catch (e) {
    if (confirm(`No se pudo enviar: ${e.message}\n\n¿Descargar su hoja como archivo para mandarla por WhatsApp al administrador?`)) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ codigo: H.codigo, zona: H.inv.numero }, hoja))], { type: 'application/json' }));
      a.download = `tequio-hoja-zona-${H.inv.numero}.json`; a.click();
      setTimeout(() => open(`https://wa.me/${WA_ADMIN}?text=${encodeURIComponent(resumen() + '\n\n(Adjunto mi hoja de captura de Tequio.)')}`, '_blank'), 800);
    }
  } finally { b.disabled = false; b.textContent = 'Enviar hoja'; }
}

/* ---------- inicio ---------- */
$('#enviar').onclick = enviar;
(function () { const c = codigoUrl() || (() => { try { return localStorage.getItem('tequio.hoja.ultimo') || ''; } catch (e) { return ''; } })();
  if (c) { cargar(c); H.codigo = c; if (H.inv) { pintar(); entrar(c).catch(() => {}); } else entrar(c); } else pintarCodigo(); })();
</script>
