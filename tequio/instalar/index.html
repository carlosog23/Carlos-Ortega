<style>
:root{--indigo:#24427A;--indigo-d:#1F3A6B;--tinta:#1E2A40;--terra:#C2603A;--terra-d:#A9512F;--ambar:#E8A33D;--crema:#FBF6EC;--arena:#F4E1C1;--arena-2:#F1E4CC;--papel:#FFFDF8;--borde:#E4D8C3;--gris:#5E5142;--ok:#2E7D4F;--ok-f:#E5F2E9;--mal:#B3261E;--mal-f:#FBE7E5;--aviso-f:#FDF1DC}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--terra-d)}a:hover{color:var(--indigo)}

.hd svg{width:40px;height:40px}.brand{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600}.hsub{color:#E9D8BA;font-size:15px}
.chip{margin-left:auto;border:1px solid #6F86B3;border-radius:999px;padding:4px 12px;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.rail{flex:1 1 240px;max-width:300px;min-width:0}.main{flex:999 1 560px;min-width:0}
@media (max-width:820px){.rail{max-width:none}.steps{flex-direction:row!important;flex-wrap:wrap}.step span:last-child{display:none}.step.cur span:last-child{display:inline}}

.step{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--gris);border:1px solid transparent}
.num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #D9CBB2;background:var(--papel);flex:none}
.done .num{background:var(--ok);border-color:var(--ok);color:#fff}.cur{background:var(--papel);border-color:var(--borde);color:var(--tinta);font-weight:600}.cur .num{background:var(--terra);border-color:var(--terra);color:#fff}
.bar{height:6px;background:var(--arena-2);border-radius:6px;overflow:hidden;margin:18px 0 6px}.bar span{display:block;height:100%;background:var(--terra)}
.small{font-size:13.5px;color:var(--gris)}
.card{background:var(--papel);border:1px solid var(--borde);border-radius:14px;padding:24px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--indigo);font-size:30px;line-height:1.2;margin:0 0 6px}
h2{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--indigo);font-size:20px;line-height:1.3;margin:0 0 12px}
.lead{color:var(--gris);margin:0 0 22px;font-size:17px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input,select,textarea{width:100%;min-height:44px;border:1px solid #CDBFA6;border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:var(--tinta)}
input::placeholder,textarea::placeholder{color:#76685A}
.hint{font-size:13.5px;color:var(--gris);margin:5px 0 0}
.opt{font-size:12px;font-weight:600;color:var(--gris);background:var(--arena-2);border-radius:999px;padding:1px 8px;margin-left:6px}
.sect{border-top:1px solid var(--borde);margin-top:24px;padding-top:20px}
.btns{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--borde)}
.btn{min-height:44px;padding:10px 20px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:0}
.pri{background:var(--indigo);color:#fff}.terra{background:var(--terra);color:#fff}.sec{background:transparent;color:var(--indigo);border:1.5px solid var(--indigo)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chico{min-height:36px;padding:4px 12px;font-size:14px}
.note{background:var(--aviso-f);border-radius:10px;padding:13px 15px;font-size:15px}.okb{background:var(--ok-f);border-radius:10px;padding:13px 15px;font-size:15px}.malb{background:var(--mal-f);border-radius:10px;padding:13px 15px;font-size:15px;color:#8E1F18}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}.check input{width:20px;min-height:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--indigo)}
.drop{border:2px dashed #CDBFA6;border-radius:12px;background:var(--crema);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;color:var(--gris);font-size:14px;cursor:pointer;position:relative}
.drop img{max-height:80px;max-width:100%}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid var(--borde);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
th{background:var(--arena);text-align:left;padding:9px 8px;font-weight:700;white-space:nowrap}
td{padding:6px 6px;border-top:1px solid #EFE5D3;vertical-align:top}
td input,td select{min-height:38px;padding:6px 8px;font-size:14px}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}.st.ok{background:var(--ok-f);color:#22603C}.st.av{background:var(--aviso-f);color:#7A4A0B}
.tot{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tot span{background:var(--arena-2);border-radius:999px;padding:4px 12px;font-size:14px}
.atp{border:1px solid var(--borde);border-radius:10px;background:#fff;padding:14px;margin-bottom:10px}
.casillas{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.casillas label{font-weight:400;display:flex;gap:6px;align-items:center;font-size:14px;margin:0}.casillas input{width:18px;min-height:18px;height:18px;accent-color:var(--indigo)}
.w{display:grid;grid-template-columns:140px minmax(0,1fr) 80px;gap:12px;align-items:center;padding:4px 0}.w input[type=range]{accent-color:var(--terra);min-height:28px;padding:0}
.paso{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--borde);border-radius:10px;background:#fff;margin-bottom:8px}
.pn{width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
code{background:var(--arena-2);border-radius:5px;padding:1px 6px;font-size:14px}
.tarea{display:flex;gap:10px;align-items:center;padding:8px 0}.tarea .d{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid #D9CBB2}.tarea.ok .d{background:var(--ok);border-color:var(--ok)}.tarea.run .d{border-color:var(--terra);border-right-color:var(--arena-2);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;z-index:9;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tbl{position:relative}
td input,td select{min-width:110px}td input.ancho{min-width:190px}
</style>

<header class="hd"><div class="hdin"><svg aria-hidden="true"><use href="#logo"/></svg><span class="brand">Tequio</span><span class="hsub">Asistente de instalación</span><span class="chip" id="chip">Supervisión nueva</span></div></header>
<div class="wrap">
  <aside class="rail" aria-label="Pasos de la instalación"><ol class="steps" id="pasos"></ol><div class="bar"><span id="barra"></span></div><p class="small" id="pasoTxt" style="margin:0"></p>
    <p class="small" style="margin:22px 0 0;padding-top:14px;border-top:1px solid var(--borde)">Tequio es una obra del Mtro. Carlos Gabriel Ortega Gutiérrez, administrador general.<br>Soporte: tequio023@gmail.com</p></aside>
  <main class="main"><div class="card" id="vista"></div></main>

<script>
'use strict';
const PASOS = ['Bienvenida', 'Supervisión', 'Escuelas', 'Equipo y accesos', 'Criterios y módulos', 'Conexión con Google', '¡Listo!'];
const MODULOS = [['pendientes', 'Tablón de la Mesa Técnica'], ['acuerdos', 'Acuerdos y checklist'], ['evidencias', 'Evidencias'], ['sisat', 'SisAT'], ['eia', 'EIA'], ['cte', 'CTE'], ['seguimiento', 'Visitas y seguimiento'], ['personal', 'Personal y expedientes'], ['oficios', 'Oficios'], ['permisos', 'Permisos y facilidades']];
const MUNICIPIOS_BC = ['Ensenada', 'San Quintín', 'Tijuana', 'Playas de Rosarito', 'Tecate', 'Mexicali', 'San Felipe'];
const DIAS = [[1, 'Lunes'], [2, 'Martes'], [3, 'Miércoles'], [4, 'Jueves'], [5, 'Viernes']];
const CLAVE = 'tequio.instalacion';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const aviso = (t, ms) => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3500); };

let E = cargarEstado();
function nuevo() {
  return { paso: 1, codigo: '', inv: null, acepta1: false, acepta2: false,
    p: { sede: '', municipioSede: '', titulo: 'Mtro.', nombre: '', cargoSupervisor: 'Supervisor Escolar', correoInstitucional: '', whatsappAdmin: '', telefono: '', codigoPostal: '', cctSupervision: '', lemaZona: '',
      autoridades: [] },
    logo: '', firma: '', sello: '', escuelas: [], atps: [], pesos: { acu: 70, evi: 20, sis: 5, eia: 5 }, informe: { dia: 1, hora: 7, ccAtp: true, vacaciones: true },
    modulos: MODULOS.map(m => m[0]), sedeMultigrado: '', url: '', cuenta: '', resultado: null };
}
function cargarEstado() { try { const g = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (g && g.p) return Object.assign(nuevo(), g); } catch (e) {} return nuevo(); }
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(E)); } catch (e) { try { const c = Object.assign({}, E, { firma: '', sello: '' }); localStorage.setItem(CLAVE, JSON.stringify(c)); } catch (e2) {} } }

// La dirección del registro central se lee del código del servidor publicado (una sola fuente)
let REGISTRO = '', CODIGO_SERVIDOR = '';
async function leerCodigo() {
  if (CODIGO_SERVIDOR) return CODIGO_SERVIDOR;
  const r = await fetch('../servidor/Codigo.gs', { cache: 'no-store' });
  if (!r.ok) throw new Error('No se pudo leer el código del servidor. Revise su conexión.');
  CODIGO_SERVIDOR = await r.text();
  const m = CODIGO_SERVIDOR.match(/const REGISTRO_URL = '([^']*)'/);
  REGISTRO = m ? m[1] : '';
  return CODIGO_SERVIDOR;
}
async function post(url, cuerpo) {
  let r;
  try { const res = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) }); r = await res.json(); }
  catch (e) { throw new Error('No hubo respuesta. Revise su internet y que la dirección sea la correcta.'); }
  if (!r.ok) throw new Error(r.mensaje || 'Ocurrió un error.');
  return r;
}

const supervisor = () => (E.p.titulo ? E.p.titulo + ' ' : '') + E.p.nombre.trim();
const prefijo = () => E.inv && E.inv.sostenimiento === 'Estatal' ? '02EPR' : '02DPR';
const esCct = c => /^\d{2}[A-Z]{3}\d{4}[A-Z]$/.test(c);

function pintar() {
  const n = E.paso;
  $('#pasos').innerHTML = PASOS.map((t, i) => `<li class="step ${i + 1 < n ? 'done' : i + 1 === n ? 'cur' : ''}"${i + 1 === n ? ' aria-current="step"' : ''}><span class="num">${i + 1 < n ? '✓' : i + 1}</span><span>${t}</span></li>`).join('');
  $('#barra').style.width = Math.round(n / 7 * 100) + '%';
  $('#pasoTxt').textContent = n < 7 ? 'Paso ' + n + ' de 7 · lo capturado se guarda en este equipo' : 'Instalación completa';
  $('#chip').textContent = E.inv ? 'Zona Escolar No. ' + E.inv.numero + ' · ' + E.inv.sostenimiento : 'Supervisión nueva';
  [p1, p2, p3, p4, p5, p6, p7][n - 1]();
  $('#vista').focus && window.scrollTo({ top: 0, behavior: 'smooth' });
}
const ir = n => { guardar(); E.paso = n; guardar(); pintar(); };
const botones = (atras, sig, txt) => `<div class="btns">${atras ? '<button class="btn sec" id="atras">Atrás</button>' : '<span></span>'}${sig ? `<button class="btn pri" id="sig">${txt || 'Guardar y continuar'}</button>` : ''}</div>`;
function enlazar(atras, sig) { if ($('#atras')) $('#atras').onclick = () => ir(E.paso - 1); if ($('#sig')) $('#sig').onclick = sig; }

/* ---------- 1. Bienvenida ---------- */
function p1() {
  $('#vista').innerHTML = `
  <p style="margin:0 0 8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--terra-d)">Lo que acordamos juntos, lo caminamos juntos</p>
  <h1>Bienvenido a Tequio</h1>
  <p class="lead">En unos pasos tu supervisión tendrá su propio espacio de asesoría y seguimiento: agenda, acuerdos, evidencias, SisAT, EIA, oficios y más, con los datos de tus escuelas.</p>
  <div class="note" style="margin-bottom:20px"><b>Ten a la mano:</b> la cuenta de Google de tu supervisión, la lista de tus escuelas (en Excel o en la plantilla que te damos), los correos de tus ATP y el logo de tu zona. Tus datos se guardan en el Drive de tu supervisión; nadie más los ve.</div>
  <div class="g2">
    <div><label for="cod">Código de invitación</label><input id="cod" value="${esc(E.codigo)}" placeholder="TQ-XXXX-XXXX" autocomplete="off" style="font-family:ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase">
      <p class="hint">Te lo entrega el administrador de Tequio. Es para una sola supervisión y vence.</p></div>
    <div id="invRes" aria-live="polite">${E.inv ? invTxt() : ''}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
    <label class="check"><input type="checkbox" id="a1" ${E.acepta1 ? 'checked' : ''}><span>Acepto las condiciones de uso de Tequio: es una herramienta de apoyo a la supervisión, obra del Mtro. Carlos Gabriel Ortega Gutiérrez, que no puede copiarse ni distribuirse sin su autorización.</span></label>
    <label class="check"><input type="checkbox" id="a2" ${E.acepta2 ? 'checked' : ''}><span>Entiendo que mi supervisión es responsable de los datos personales de su zona (alumnos y personal) y de a quién comparte los enlaces de acceso.</span></label>
  </div>
  ${botones(false, true, 'Comenzar la instalación')}`;
  $('#sig').onclick = async () => {
    E.acepta1 = $('#a1').checked; E.acepta2 = $('#a2').checked;
    const c = $('#cod').value.trim().toUpperCase();
    if (!c) return aviso('Escribe el código de invitación.');
    if (!E.acepta1 || !E.acepta2) return aviso('Marca las dos casillas para continuar.');
    const b = $('#sig'); b.disabled = true; b.textContent = 'Revisando el código…';
    try {
      await leerCodigo();
      if (!REGISTRO) throw new Error('El administrador todavía no activa las instalaciones. Inténtalo más tarde.');
      const r = await post(REGISTRO, { accion: 'validarInvitacion', datos: { codigo: c } });
      E.codigo = c; E.inv = r.invitacion;
      if (!E.p.nombre && r.invitacion.para) { const m = r.invitacion.para.match(/^(Mtro\.|Mtra\.|Profr\.|Profra\.|Lic\.|Dr\.|Dra\.)\s*(.*)$/i); if (m) { E.p.titulo = m[1]; E.p.nombre = m[2]; } else E.p.nombre = r.invitacion.para; }
      if (!E.p.correoInstitucional && /@bcedu\.mx$/i.test(r.invitacion.correo || '')) E.p.correoInstitucional = r.invitacion.correo;
      ir(2);
    } catch (e) { b.disabled = false; b.textContent = 'Comenzar la instalación'; $('#invRes').innerHTML = `<div class="malb">${esc(e.message)}</div>`; }
  };
}
const invTxt = () => `<div class="okb"><b>Código válido.</b> Zona Escolar No. ${esc(E.inv.numero)} · ${esc(E.inv.nivel)} ${esc(E.inv.sostenimiento)}${E.inv.para ? '<br>Para: ' + esc(E.inv.para) : ''}<br><span class="small">Vence el ${esc(E.inv.vence)}</span></div>`;

/* ---------- 2. Supervisión ---------- */
function p2() {
  const p = E.p;
  if (!p.autoridades.length) p.autoridades = [{ municipio: p.municipioSede || '', nombre: '', cargo: 'Jefe(a) del Departamento de Educación Primaria', institucion: E.inv && E.inv.sostenimiento === 'Estatal' ? 'Secretaría de Educación' : 'ISEP' }];
  const estatal = E.inv && E.inv.sostenimiento === 'Estatal';
  $('#vista').innerHTML = `
  <h1>Datos de la supervisión</h1>
  <p class="lead">Con esto Tequio arma los encabezados, oficios, informes y correos de tu zona.</p>
  <div class="g3">
    <div><label>Zona</label><input value="${esc(E.inv.numero)} · ${esc(E.inv.nivel)} ${esc(E.inv.sostenimiento)}" readonly style="background:var(--arena-2)"></div>
    <div><label for="sd">Sede (localidad)</label><input id="sd" value="${esc(p.sede)}" placeholder="Ej. Vicente Guerrero"></div>
    <div><label for="ms">Municipio de la sede</label><select id="ms"><option value="">Elige…</option>${MUNICIPIOS_BC.map(m => `<option ${p.municipioSede === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    <div><label for="cp">Código postal <span class="opt">opcional</span></label><input id="cp" value="${esc(p.codigoPostal)}" inputmode="numeric" maxlength="5"></div>
    <div><label for="tel">Teléfono de la supervisión <span class="opt">opcional</span></label><input id="tel" value="${esc(p.telefono)}" inputmode="tel"></div>
    <div><label for="cct">C.C.T. de la supervisión <span class="opt">opcional</span></label><input id="cct" value="${esc(p.cctSupervision)}" placeholder="02FIZ…" style="text-transform:uppercase"></div>
  </div>
  <div class="sect"><h2>Quién firma</h2>
    <div class="g2">
      <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px">

function enlazarImg(k) {

// Imagen → PNG de tamaño razonable (conserva la transparencia)
function achicar(file, max) {
  return new Promise((ok, mal) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/png')); };
    img.onerror = () => mal(new Error('No se pudo leer la imagen.')); img.src = u;
  });
}

const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const ALIAS = { cct: ['cct', 'clave', 'clavect', 'clavedelcentrodetrabajo', 'cctescuela'], escuela: ['escuela', 'nombre', 'nombredelaescuela', 'nombreescuela', 'centrodetrabajo'], localidad: ['localidad', 'poblado', 'comunidad', 'colonia'],
  municipio: ['municipio', 'mpio'], turno: ['turno'], organizacion: ['organizacion', 'organiza', 'tipo', 'multigrado', 'tipodeorganizacion'], director: ['director', 'directora', 'directoroencargado', 'nombredeldirector', 'responsable', 'encargado'],
  cargo: ['cargo', 'funcion', 'puesto'], correo: ['correo', 'email', 'correoelectronico', 'correoinstitucional'], whatsapp: ['whatsapp', 'telefono', 'celular', 'tel'], domicilio: ['domicilio', 'direccion', 'calle'] };
async function leerLista(f) {
  if (!f) return;
  if (!window.XLSX) return aviso('Un momento: se está cargando el lector de Excel.');
  try {
    const wb = /\.csv$/i.test(f.name) ? XLSX.read(await f.text(), { type: 'string' }) : XLSX.read(await f.arrayBuffer(), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    const ih = filas.findIndex(r => r.some(c => ALIAS.cct.includes(norm(c))));
    if (ih < 0) throw new Error('No encontré la columna de la clave (C.C.T.). Usa la plantilla.');
    const mapa = {}; filas[ih].forEach((h, i) => { const n = norm(h); Object.keys(ALIAS).forEach(k => { if (mapa[k] == null && (ALIAS[k].includes(n) || ALIAS[k].some(a => a.length > 4 && n.startsWith(a)))) mapa[k] = i; }); });
    const mun = E.p.autoridades.map(a => a.municipio);
    const nuevas = filas.slice(ih + 1).filter(r => String(r[mapa.cct] || '').trim()).map(r => {
      const g = k => mapa[k] == null ? '' : String(r[mapa[k]]).trim();
      const m = mun.find(x => norm(x) === norm(g('municipio'))) || mun[0] || E.p.municipioSede;
      return { cct: g('cct').toUpperCase().replace(/\s/g, ''), escuela: g('escuela'), localidad: g('localidad'), municipio: m, turno: /vesp/i.test(g('turno')) ? 'Vespertino' : 'Matutino',

  tot();
  enlazar(true, () => {
    if (tot() !== 100) return aviso('Los porcentajes deben sumar 100 %.');
    ['acu', 'evi', 'sis', 'eia'].forEach(k => { E.pesos[k] = +$('#w-' + k).value; });
    E.informe.dia = +$('#dia').value; E.informe.hora = +$('#hora').value;
    E.sedeMultigrado = $('#smg') ? $('#smg').value : '';
    E.modulos = $$('[data-m]:checked').map(c => c.dataset.m);
    ir(6);
  });
}

/* ---------- 6. Conexión ---------- */
function p6() {
  $('#vista').innerHTML = `
  <h1>Conectar tu espacio</h1>
  <p class="lead">Tequio se instala en la cuenta de Google de tu supervisión. Son 4 pasos de una sola vez; después todo funciona solo.</p>
  <div class="paso"><span class="pn">1</span><div><b>Abre Google Apps Script con la cuenta de tu supervisión.</b><br><span class="small">Si tienes varias cuentas abiertas, revisa arriba a la derecha que sea la de la supervisión.</span><br><a class="btn sec chico" href="https://script.google.com/home/projects/create" target="_blank" rel="noopener" style="margin-top:8px">Crear proyecto nuevo</a></div></div>
  <div class="paso"><span class="pn">2</span><div><b>Borra lo que trae el editor y pega el código de Tequio.</b><br><span class="small">Ponle de nombre «Tequio» y guarda (Ctrl + S).</span><br><button class="btn sec chico" id="copiar" style="margin-top:8px">Copiar el código de Tequio</button> <span id="copiado" class="small" aria-live="polite"></span></div></div>
  <div class="paso"><span class="pn">3</span><div><b>Publícalo como aplicación web.</b><br><span class="small">Botón azul <b>Implementar</b> › <b>Nueva implementación</b> › tipo <b>Aplicación web</b>. En «Ejecutar como» elige <b>Yo</b>; en «Quién tiene acceso», <b>Cualquier usuario</b>. Pulsa <b>Implementar</b> y autoriza con la cuenta de la supervisión (si Google dice que la app no está verificada: <i>Configuración avanzada › Ir a Tequio</i>).</span></div></div>
  <div class="paso"><span class="pn">4</span><div style="flex:1;min-width:0"><b>Copia la «URL de la aplicación web» y pégala aquí.</b>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input id="url" value="${esc(E.url)}" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1 1 280px"><button class="btn pri" id="probar">Comprobar</button></div>
    <div id="res" aria-live="polite" style="margin-top:10px"></div></div></div>
  <div id="inst"></div>
  ${botones(true, false)}`;
  enlazar(true);
  $('#copiar').onclick = async () => {
    try { const t = await leerCodigo(); if (!REGISTRO) { $('#copiado').textContent = 'El administrador aún no activa las instalaciones.'; return; }
      await navigator.clipboard.writeText(t); $('#copiado').textContent = '✓ Código copiado. Pégalo en el editor.'; }
    catch (e) { $('#copiado').textContent = 'No se pudo copiar automáticamente; ábrelo aquí: '; const a = document.createElement('a'); a.href = '../servidor/Codigo.gs'; a.target = '_blank'; a.textContent = 'código de Tequio'; $('#copiado').appendChild(a); }
  };
  $('#probar').onclick = async () => {
    const u = $('#url').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) { $('#res').innerHTML = '<div class="malb">La dirección debe empezar con https://script.google.com/macros/s/ y terminar en /exec.</div>'; return; }
    const b = $('#probar'); b.disabled = true; b.textContent = 'Comprobando…';
    try {
      const r = await post(u, { accion: 'estadoInstalacion' });
      if (r.instalada) throw new Error('Esa cuenta ya tiene Tequio instalado. Si necesitas reinstalar, escribe al administrador.');
      E.url = u; E.cuenta = r.cuenta || ''; guardar();
      $('#res').innerHTML = `<div class="okb"><b>Conectado.</b> El servidor responde en la cuenta <b>${esc(r.cuenta)}</b>. De aquí saldrán los correos de Tequio.</div>`;
      $('#inst').innerHTML = `<div class="sect"><h2>Todo listo para instalar</h2><p class="small" style="margin-top:-6px">Se creará la carpeta «Tequio · Zona ${esc(E.inv.numero)}» en el Drive de <b>${esc(r.cuenta)}</b>, con una carpeta por escuela, la hoja de datos, ${E.escuelas.length} escuelas, ${E.atps.length} ATP y el informe semanal.</p>
        <button class="btn terra" id="instalar">Instalar Tequio</button><div id="tareas" style="margin-top:12px"></div></div>`;
      $('#instalar').onclick = instalar;
    } catch (e) { $('#res').innerHTML = `<div class="malb">${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = 'Comprobar';
  };
}
async function instalar() {
  const b = $('#instalar'); b.disabled = true; b.textContent = 'Instalando…';
  const T = ['Revisar el código de invitación', 'Guardar los datos de la supervisión', 'Crear carpetas en el Drive', 'Cargar escuelas y equipo', 'Programar tareas y registrar la zona'];
  $('#tareas').innerHTML = T.map((t, i) => `<div class="tarea ${i ? '' : 'run'}" id="t${i}"><span class="d" aria-hidden="true"></span><span>${t}</span></div>`).join('') + '<p class="small">Puede tardar uno o dos minutos; no cierres esta ventana.</p>';
  let k = 0; const tic = setInterval(() => { if (k < T.length - 1) { $('#t' + k).className = 'tarea ok'; k++; $('#t' + k).className = 'tarea run'; } }, 6000);
  try {
    const p = E.p;
    const r = await post(E.url, { accion: 'instalarZona', datos: { codigo: E.codigo, url: E.url,
      perfil: { sede: p.sede, municipioSede: p.municipioSede, codigoPostal: p.codigoPostal, telefono: p.telefono, supervisor: supervisor(), cargoSupervisor: p.cargoSupervisor,
        correoInstitucional: p.correoInstitucional, whatsappAdmin: p.whatsappAdmin, lemaZona: p.lemaZona, cctSupervision: p.cctSupervision, autoridades: p.autoridades, pesos: E.pesos, sedeMultigrado: E.sedeMultigrado },
      escuelas: E.escuelas, atps: E.atps, logo: E.logo, firma: E.firma, sello: E.sello, informe: E.informe, modulos: E.modulos } });
    clearInterval(tic); T.forEach((t, i) => { $('#t' + i).className = 'tarea ok'; });
    E.resultado = r; ir(7);
  } catch (e) {
    clearInterval(tic); b.disabled = false; b.textContent = 'Intentar de nuevo';
    $('#tareas').insertAdjacentHTML('beforeend', `<div class="malb">${esc(e.message)}</div>`);
  }
}

/* ---------- 7. Listo ---------- */
function p7() {
  const r = E.resultado || {};
  $('#vista').innerHTML = `
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px"><svg width="72" height="72" aria-hidden="true"><use href="#logo"/></svg>
    <div style="flex:1 1 280px"><h1>Tu zona ya camina con Tequio</h1><p class="lead" style="margin:0">Lo que acordamos juntos, lo caminamos juntos.</p></div></div>
  <div class="sect"><h2>Tu enlace de supervisor(a)</h2>
    <div class="okb">También te lo enviamos por correo. Ábrelo en tu teléfono y en tu computadora; no lo compartas.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><a class="btn terra" href="${esc(r.enlace || '#')}" target="_blank" rel="noopener">Entrar a mi Tequio</a><button class="btn sec" id="copEnl">Copiar enlace</button>${r.carpeta ? `<a class="btn sec" href="${esc(r.carpeta)}" target="_blank" rel="noopener">Ver la carpeta en Drive</a>` : ''}</div></div>
  <div class="sect"><h2>Primeros pasos sugeridos</h2><ol style="padding-left:20px;margin:0">
    <li><b>Enlaces:</b> en Tequio › Enlaces genera y envía los de tus ATP y directores.</li>
    <li><b>Agenda:</b> agrega las actividades del mes; los recordatorios salen solos.</li>
    <li><b>Acuerdos:</b> sube el checklist de tu última reunión de directores o CTZ.</li>
    <li><b>Evidencias:</b> revisa las carpetas por escuela en tu Drive y ajusta sus subcarpetas si lo necesitas.</li></ol></div>
  <div class="btns"><span class="small">Las actualizaciones de Tequio las publica el administrador. Soporte: tequio023@gmail.com</span><button class="btn sec" id="borrar">Borrar los datos de este asistente</button></div>`;
  $('#copEnl').onclick = async () => { try { await navigator.clipboard.writeText(r.enlace); aviso('Enlace copiado.'); } catch (e) { aviso('No se pudo copiar.'); } };
  $('#borrar').onclick = () => { if (confirm('¿Borrar lo capturado en este asistente? Tu Tequio ya instalado no se modifica.')) { localStorage.removeItem(CLAVE); E = nuevo(); pintar(); } };
}

if (E.paso > 1 && !E.inv) E.paso = 1;
pintar();
</script>
</body>
</html>
