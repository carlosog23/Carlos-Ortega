 {m:"wave",t:"¡Hola! Soy Tlami, el acompañante de Tlamatini. Tlamatini es una palabra náhuatl que quiere decir «el que sabe». Así le llamamos a usted: maestra, maestro, tlamatini de su comunidad.",

$("next").onclick=()=>show(i+1);$("prev").onclick=()=>show(i-1);
$("voz").onclick=()=>{voz=!voz;$("voz").textContent=voz?"🔊 Voz":"🔈 Voz";$("voz").setAttribute("aria-pressed",voz);show(i)};
dots.onclick=e=>{const k=[...dots.children].indexOf(e.target);if(k>=0)show(k)};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);else if(e.key==="ArrowLeft")show(i-1);else if(e.key===" "){e.preventDefault();setPlay(!playing)}});
function arrancar(conVoz){voz=conVoz&&!!synth;$("voz").textContent=voz?"🔊 Voz":"🔈 Voz";$("voz").setAttribute("aria-pressed",voz);$("start").remove();show(0)}
$("go1").onclick=()=>arrancar(true);$("go2").onclick=()=>arrancar(false);
if(!synth)$("go1").style.display="none";
try{if(!/^(localhost|127\.)/.test(location.hostname)&&!localStorage.getItem("gh-token"))new Image().src="https://tlamatini.goatcounter.com/count?p=/formatos-ppie/tlami&t="+encodeURIComponent("Conozca a Tlami")+"&rnd="+Math.random()}catch(e){}
