<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libros de texto · Zona 050</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:"Ubuntu","Noto Sans",system-ui,sans-serif;background:#F3F7FA;color:#0F3B5F}
header{background:#0F3B5F;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}header h1{margin:0;font-size:26px}header p{margin:2px 0 0;opacity:.8}header .t{flex:1}
.vol{color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.5);border-radius:12px;padding:7px 12px;font-weight:700}
.marca{display:flex;align-items:center;gap:10px;color:#fff}.marca img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}.marca b{display:block;font-size:14px;line-height:1.15}.marca small{display:block;font-size:11px;opacity:.75;font-style:italic}
main{max-width:1060px;margin:0 auto;padding:22px}
.grados{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.grados button{font:inherit;font-size:19px;font-weight:800;padding:10px 18px;border-radius:14px;border:2px solid #D6E3EC;background:#fff;color:#0F3B5F;cursor:pointer}
.grados button[aria-pressed=true]{background:#0F3B5F;color:#fff;border-color:#0F3B5F}.grados button small{font-weight:600;opacity:.7;font-size:13px;margin-left:4px}
.estante{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
a.libro{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;border-radius:8px 18px 18px 8px;padding:18px 16px 14px 22px;text-decoration:none;color:#fff;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12)}
a.libro:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:4px;background:rgba(255,255,255,.35)}
a.libro b{font-size:19px;line-height:1.25}a.libro span{font-size:13px;opacity:.85}a.libro:hover{transform:translateY(-3px)}
.vacio{background:#fff;border:2px dashed #D6E3EC;border-radius:18px;padding:22px;font-size:16px;line-height:1.5}
.vacio ol{margin:8px 0 0 20px;padding:0}
.firma{display:flex;flex-direction:column;align-items:center;gap:4px;margin:28px 0 8px;opacity:.75}.firma span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5F6B76}.firma img{width:170px}
</style>
</head>
<body>
<header><span style="font-size:40px">📗</span><div class="t"><h1>Libros de texto</h1><p>Los libros de la SEP de cada grado · funcionan sin internet</p></div><a class="vol" href="/">← Biblioteca</a>
<div class="marca"><img src="/img/zona050.png" alt="Zona Escolar 050"><span><b>Zona Escolar 050</b><small>Responsabilidad y superación</small></span></div></header>
<main>
  <div class="grados" id="grados"></div>
  <div id="estante"><p>Buscando el servidor de la escuela…</p></div>
  <div class="firma"><span>Desarrollado por</span><img src="/img/firma-autor.svg" alt="Maestro Carlos Ortega"></div>
</main>
<script>
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = ["#1F6FD1", "#E8772E", "#2E9E5B", "#7B3FB5", "#D7263D", "#0E8C8C", "#B8860B", "#E0559B"];
const CAND = [...new Set(["http://aula-servidor.local:8050", "http://aula-servidor:8050", location.origin])];
let srv = "", CARP = [], sel = "";
try { sel = localStorage.getItem("z050-libros-grado") || ""; } catch (e) {}
const VACIO = `<div class="vacio"><b>Todavía no hay libros en este estante.</b><br>Para el maestro, en la computadora servidor:<ol>
<li>Si hay internet, abra el ícono <b>«Descargar libros de texto»</b> del escritorio.</li>
<li>O copie los PDF desde una memoria USB: abra <b>«Libros de texto (agregar desde USB)»</b> y pegue cada libro en la carpeta de su grado.</li></ol></div>`;
function pinta() {
  const g = document.getElementById("grados"), e = document.getElementById("estante");
  if (!CARP.length) { g.innerHTML = ""; e.innerHTML = VACIO; return; }
  if (!CARP.some(c => c.nombre === sel)) sel = (CARP.find(c => c.libros.length) || CARP[0]).nombre;
  g.innerHTML = CARP.map(c => `<button aria-pressed="${c.nombre === sel}" data-g="${esc(c.nombre)}">${esc(c.nombre)}<small>${c.libros.length}</small></button>`).join("");
  const C = CARP.find(c => c.nombre === sel);
  e.innerHTML = C.libros.length ? `<div class="estante">${C.libros.map((l, i) => `<a class="libro" style="background:${COL[i % COL.length]}" href="${srv + l.url}" target="_blank" rel="noopener"><b>${esc(l.t)}</b><span>📖 Abrir · ${l.mb} MB</span></a>`).join("")}</div>` : VACIO;
}
document.getElementById("grados").onclick = ev => { const b = ev.target.closest("button[data-g]"); if (!b) return; sel = b.dataset.g; try { localStorage.setItem("z050-libros-grado", sel); } catch (e) {} pinta(); };
(async () => {
  for (const s of CAND) { try { const c = new AbortController(), t = setTimeout(() => c.abort(), 2500); const r = await fetch(s + "/api/ping", { signal: c.signal }); clearTimeout(t); const j = await r.json(); if (j.ok && j.servidor) { srv = s; break; } } catch (e) {} }
  if (!srv) { document.getElementById("estante").innerHTML = `<div class="vacio">No se encontró el servidor de la escuela. Debe estar encendido y conectado a la misma red (cable o módem).</div>`; return; }
  try { CARP = (await (await fetch(srv + "/api/libros")).json()).carpetas || []; } catch (e) {}
  pinta();
})();
</script>
</body>
</html>
