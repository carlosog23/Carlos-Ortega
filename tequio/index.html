        <button type="button" class="boton chico" id="o-ia" ${cfgO.ia ? '' : 'disabled'}>✨ Redactar el texto</button>
        ${cfgO.ia ? '<div class="ayuda">La IA propone el texto; usted lo revisa y corrige antes de guardar. No incluya datos personales delicados.</div>' : `<div class="ayuda">${esAdmin() ? 'Active la IA en Oficios → Configuración (clave gratuita de Gemini).' : 'La Supervisión aún no activa la redacción con IA.'}</div>`}</div>
      <div class="campo"><label for="o-cu">Texto del oficio</label><textarea id="o-cu" style="min-height:260px" placeholder="Por medio del presente, ...&#10;&#10;Deje una línea en blanco entre párrafos. Para una lista, inicie cada renglón con «• ».">${esc(o.cuerpo)}</textarea></div>
      <div class="campo"><label for="o-cc">Con copia para (C.c.p.) <span class="mudo" style="font-weight:400">· uno por renglón</span></label><textarea id="o-cc" style="min-height:60px">${esc(o.ccp)}</textarea></div>
      ${esAdmin() ? `<div class="campo"><span class="et">Firma y sello</span>
        <label class="casilla"><input type="checkbox" id="o-fi" ${o.firma ? 'checked' : ''} ${cfgO.firma ? '' : 'disabled'}> Agregar firma digital</label>
        <label class="casilla"><input type="checkbox" id="o-se" ${o.sello ? 'checked' : ''} ${cfgO.sello ? '' : 'disabled'}> Agregar sello digital</label>
        ${!cfgO.firma || !cfgO.sello ? '<div class="ayuda">Suba su firma y el sello en Oficios → Configuración para poder agregarlos.</div>' : '<div class="ayuda">Sin marcar, queda el espacio para firmar y sellar a mano.</div>'}</div>` : '<div class="ayuda" style="margin-bottom:12px">La firma y el sello digitales solo los agrega la Supervisión.</div>'}
      <div class="ofi-botones">
        <button class="boton terra" id="o-guardar">${guardado ? 'Guardar cambios' : 'Guardar y asignar número'}</button>
        <button class="boton sec" id="o-word" ${guardado ? '' : 'disabled'}>Word</button>
        <button class="boton sec" id="o-pdf" ${guardado ? '' : 'disabled'}>PDF</button>
        <button class="boton sec" id="o-correo" ${guardado ? '' : 'disabled'}>${ico('i-correo')}Correo</button>
        <button class="boton wa" id="o-wa" ${guardado ? '' : 'disabled'}>${ico('i-wa')}WhatsApp</button>
      </div>
      ${guardado && (guardado.envios || []).length ? `<div class="ayuda" style="margin-top:10px">Envíos: ${guardado.envios.map(e => esc(fechaHora(e.f) + (e.de ? ' desde ' + e.de : '') + ' a ' + e.a) + (e.copia ? ` (<a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${e.copia}/view">copia</a>)` : '')).join(' · ')}</div>` : ''}
      ${guardado && guardado.pdfId ? `<div class="ayuda" style="margin-top:6px"><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${guardado.pdfId}/view">Ver el PDF guardado en Drive</a></div>` : ''}
    </div>
    <div class="ofi-prev"><div class="seccion-t" style="padding:0 0 8px">Vista previa <span class="mudo" id="o-escala" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div><div class="prev-marco" id="o-prev"></div></div>
  </div>`;
  let rec = RECURSOS || {};
  const leerForm = () => {
    if (!$('#o-dn')) return;
    Object.assign(o, { destNombre: $('#o-dn').value, destCargo: $('#o-dc').value, destInst: $('#o-di').value, destCorreo: $('#o-dco') ? $('#o-dco').value.trim() : (o.destCorreo || ''), fecha: $('#o-fe').value || hoy(), referencia: $('#o-re').value,
      asunto: $('#o-as').value, notas: $('#o-no').value, cuerpo: $('#o-cu').value, ccp: $('#o-cc').value,
      escuelas: $$('#o-esc input:checked').map(i => i.value), firma: $('#o-fi') ? $('#o-fi').checked : false, sello: $('#o-se') ? $('#o-se').checked : false });
  };
  let tPrev = null;
  const pintarPrev = () => {
    if (!$('#o-prev')) return;
    leerForm();
    const vo = Object.assign({}, o, { folio: folioDe(guardado || o) }), dis = disposicion(vo, rec);
    o.escala = String(dis.s);
    const marco = $('#o-prev'); if (!marco) return;
    const w = marco.clientWidth || 600, k = Math.min(1, w / 816);
    marco.innerHTML = `<div style="transform:scale(${k});transform-origin:0 0;width:816px">${htmlOficio(vo, dis.s, rec, dis.t, dis.unaHoja)}</div>`;
    marco.style.height = (marco.querySelector('.hoja').offsetHeight * k) + 'px';
    const de = $('#o-escala'); if (de) de.textContent = dis.s < 1 ? '· ajustado a una hoja (' + Math.round(dis.s * 100) + ' %)' : dis.unaHoja ? '' : '· ocupa dos hojas';
    const est = $('#o-estado'); if (est && guardado) { const cambio = ['destNombre', 'destCargo', 'destInst', 'destCorreo', 'fecha', 'referencia', 'asunto', 'cuerpo', 'ccp', 'firma', 'sello', 'municipio'].some(k2 => String(o[k2] ?? '') !== String(guardado[k2] ?? '')) || JSON.stringify(o.escuelas || []) !== JSON.stringify(guardado.escuelas || []);
      est.textContent = cambio ? 'Cambios sin guardar' : 'Guardado'; est.className = 'chip ' + (cambio ? 'aviso' : 'ok'); }
  };
  const programar = () => { clearTimeout(tPrev); tPrev = setTimeout(pintarPrev, 250); };
  $$('.ofi-form input, .ofi-form textarea').forEach(el => { el.addEventListener('input', programar); el.addEventListener('change', programar); });
  $$('[data-mun]').forEach(b => b.onclick = () => {
    leerForm();
    const ant = DESTINOS[o.municipio], nue = DESTINOS[b.dataset.mun];
    ['destNombre', 'destCargo', 'destInst'].forEach(k => { if (!o[k] || o[k] === ant[k]) o[k] = nue[k]; });
    o.municipio = b.dataset.mun;
    if (esGrupo(o.municipio)) o.escuelas = escuelasDeGrupo(o.municipio).map(c => c.cct);
    else if (o.municipio !== 'Otro') o.escuelas = (o.escuelas || []).filter(c => (escuelaDe(c) || {}).municipio === o.municipio);
    vEditorOficio();
  });
  $('#b-volver').onclick = () => { vista.ofiEdit = null; vista.ofiBorrador = null; vOficios(); };
  $('#o-lista').onclick = () => { leerForm(); elegirDestinatario(d => { Object.assign(o, d); vEditorOficio(); }); };
  $('#o-ia').onclick = async () => {
    leerForm();
    if (!o.asunto.trim()) return aviso('Escriba primero el asunto.', 'mal');
    if (o.cuerpo.trim() && !confirm('¿Reemplazar el texto actual por la redacción de la IA? (Se usa el texto actual como borrador.)')) return;
    const r = await accion('redactarOficio', { municipio: o.municipio, asunto: o.asunto, notas: o.notas, referencia: o.referencia, escuelas: o.escuelas, fecha: o.fecha,
      destNombre: o.destNombre, destCargo: o.destCargo, destInst: o.destInst, cuerpo: o.cuerpo });
    if (r && r.texto) { $('#o-cu').value = r.texto.replace(/\n{3,}/g, '\n\n'); pintarPrev(); aviso('Texto redactado. Revíselo y corríjalo antes de guardar.', 'ok', 5000); }
  };
  $('#o-guardar').onclick = () => {
    leerForm();
    if (!o.asunto.trim()) return aviso('Escriba el asunto.', 'mal');
    if (!o.cuerpo.trim()) return aviso('Escriba el texto del oficio.', 'mal');
    if (!guardado && !confirm('Se asignará el número ' + (cfgO.siguiente || '') + ' a este oficio. ¿Continuar?')) return;
    accion('guardarOficio', Object.assign({ id: guardado ? guardado.id : '' }, o), r => {
      poner(S.ofi, r.oficio); S.ofi.sort((a, b) => String(b.id).localeCompare(String(a.id))); S.ofiCfg = r.ofiCfg;
      vista.ofiEdit = r.oficio.id; vista.ofiBorrador = Object.assign(JSON.parse(JSON.stringify(r.oficio)), { notas: o.notas, analisis: o.analisis });
      vEditorOficio(); aviso('Oficio ' + esc(r.oficio.folio) + ' guardado.', 'ok', 3500);
    });
  };
  const listo = () => { const g = S.ofi.find(x => x.id === vista.ofiEdit); if (!g) return null;
    if ($('#o-estado') && $('#o-estado').textContent !== 'Guardado') { aviso('Guarde los cambios antes de descargar o enviar.', 'mal'); return null; } return g; };
  $('#o-word').onclick = () => { const g = listo(); if (!g) return; conCarga(async () => { const b = await wordOficio(g, await recursos()); descargarBlob(b, nombreArchivoOfi(g) + '.docx'); }); };
  $('#o-pdf').onclick = () => { const g = listo(); if (!g) return; conCarga(async () => { const b = await pdfOficio(g, await recursos()); descargarBlob(b, nombreArchivoOfi(g) + '.pdf'); archivarPdf(g, b); }); };
  $('#o-correo').onclick = () => { const g = listo(); if (g) formCorreoOficio(g); };
  $('#o-wa').onclick = () => { const g = listo(); if (g) compartirOficio(g); };
  // la vista previa usa la firma y el sello reales
  if (esAdmin() && (cfgO.firma || cfgO.sello) && !RECURSOS) recursos().then(r => { rec = r; pintarPrev(); }).catch(() => {});
  pintarPrev();
  fuentesOficio().then(() => { if ($("#o-prev")) pintarPrev(); });
}

/* ---- Oficio recibido de un director: la IA lo lee y propone el oficio de seguimiento a la autoridad ---- */
function subirOficioRecibido() {
  const ia = (S.ofiCfg || {}).ia;
  modal('Subir oficio de un director', `
    <p style="margin-top:0">Suba el oficio o escrito que le envió la dirección (PDF o foto). La IA lo lee, identifica la escuela y lo que plantea, decide a qué autoridad le compete y le prepara el oficio de seguimiento para que usted lo revise.</p>
    <div class="campo"><label for="r-arch">Oficio del director</label><input id="r-arch" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div>
    <div class="campo"><label for="r-notas">Indicaciones para la IA <span class="mudo" style="font-weight:400">(opcional)</span></label>
      <textarea id="r-notas" style="min-height:70px" placeholder="Ej. Pedir que se atienda antes del inicio del Consejo Técnico; marcar copia a Protección Civil."></textarea></div>
    ${ia ? '<div class="ayuda">El oficio del director se guarda en el Drive (Oficios Tequio → Recibidos) y queda ligado al oficio de seguimiento.</div>'
      : `<div class="aviso-caja peq">Para leer oficios hace falta la redacción con IA. ${esAdmin() ? 'Agregue la clave de Gemini en Oficios → Configuración.' : 'Avise a la Supervisión.'}</div>`}`,
    `<button class="boton sec" id="r-no">Cancelar</button><button class="boton terra" id="r-si" ${ia ? '' : 'disabled'}>✨ Leer y preparar el oficio</button>`);
  $('#r-no').onclick = cerrarModal;
  $('#r-si').onclick = () => conCarga(async () => {
    const f = $('#r-arch').files[0];
    if (!f) throw new Error('Elija el archivo del oficio.');
    if (f.size > 15 * 1024 * 1024) throw new Error('El archivo pesa más de 15 MB.');
    const r = await api('analizarOficioRecibido', { archivo: await blobAB64(f), tipo: f.type || 'application/pdf', nombre: f.name, notas: $('#r-notas').value });
    const a = r.analisis || {};
    const esc0 = a.escuelaCct ? escuelaDe(a.escuelaCct) : null;
    let mun = ['San Quintín', 'Ensenada'].includes(a.autoridad) ? a.autoridad : 'Otro';
    if (mun !== 'Otro' && esc0 && esc0.municipio && esc0.municipio !== mun) mun = esc0.municipio;  // San Quintín y Ensenada no se mezclan
    const od = a.otraDependencia || {};
    const dest = mun !== 'Otro' ? DESTINOS[mun] : { destNombre: String(od.nombre || '').toUpperCase(), destCargo: String(od.cargo || '').toUpperCase(), destInst: String(od.dependencia || '').toUpperCase() };
    vista.ofiEdit = 'nuevo';
    vista.ofiBorrador = Object.assign({ fecha: hoy(), municipio: mun, escuelas: esc0 ? [esc0.cct] : [], referencia: a.referencia || '', asunto: a.asunto || '',
      cuerpo: String(a.cuerpo || '').replace(/\n{3,}/g, '\n\n'), ccp: a.ccp || 'Archivo.', firma: esAdmin() && !!(S.ofiCfg || {}).firma, sello: esAdmin() && !!(S.ofiCfg || {}).sello,
      notas: '', destCorreo: '', recibidoId: a.recibidoId || '', recibidoNombre: a.recibidoNombre || '', analisis: a }, dest);
    cerrarModal(); vista.tab = 'oficios'; pintar(); window.scrollTo(0, 0);
    aviso('Oficio leído. Revise el destinatario y el texto antes de guardar.', 'ok', 5000);
  });
}
function panelAnalisis(a, o) {
  const pet = (a.peticiones || []).filter(Boolean);
  const aut = o.municipio === 'Otro' ? (o.destInst || o.destNombre || 'otra dependencia') : 'Jefe del Departamento en ' + o.municipio;
  return `<div class="analisis">
    <div class="seccion-t" style="padding:0 0 6px">Lo que plantea la dirección</div>
    ${a.remitente || a.escuelaNombre ? `<div><b>${esc(a.remitente || '')}</b>${a.escuelaNombre ? ' · ' + esc(a.escuelaNombre) : ''}${a.oficioDirector ? ' · ' + esc(a.oficioDirector) : ''}</div>` : ''}
    ${a.resumen ? `<p style="margin:6px 0">${esc(a.resumen)}</p>` : ''}
    ${pet.length ? `<div class="peq"><b>Solicita:</b></div><ul style="margin:2px 0 6px;padding-left:20px">${pet.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <div class="peq"><b>Le compete a:</b> ${esc(aut)}${a.motivoAutoridad ? ' — ' + esc(a.motivoAutoridad) : ''}</div>
    ${o.recibidoId ? `<div class="peq" style="margin-top:6px"><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${esc(o.recibidoId)}/view">Ver el oficio del director en Drive</a></div>` : ''}
  </div>`;
}

function elegirDestinatario(listo) {
  const dir = S.dir.filter(c => c.activo !== false && c.activo !== 'false' && c.tipo !== 'atp' && c.nombre);
  const dirs = dir.filter(c => c.tipo === 'director').sort((a, b) => a.municipio.localeCompare(b.municipio, 'es') || a.escuela.localeCompare(b.escuela, 'es'));
  const otros = dir.filter(c => c.tipo !== 'director').sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const usados = destinatariosUsados();
  const items = [
    ...usados.map((u, i) => ({ g: 'usados', t: u.destNombre, s: u.destCargo + (u.veces > 1 ? ' · ' + u.veces + ' oficios' : ''), d: () => Object.assign({ municipio: u.municipio === 'San Quintín' || u.municipio === 'Ensenada' ? u.municipio : 'Otro' }, u) })),
    ...dirs.map(c => ({ g: esMultigrado(c) ? 'multi' : 'dir', mun: c.municipio, t: c.nombre, s: (c.cargo || 'Director(a)') + ' · ' + c.escuela + ' · ' + c.municipio, d: () => Object.assign({ municipio: 'Otro' }, destDeContacto(c)) })),
    ...otros.map(c => ({ g: 'otros', t: c.nombre, s: [c.cargo, c.escuela].filter(Boolean).join(' · '), d: () => Object.assign({ municipio: 'Otro' }, destDeContacto(c)) }))
  ];
  const filtros = [['todos', 'Todos'], ['usados', 'Usados antes'], ['dir-Ensenada', 'Directores Ensenada'], ['dir-San Quintín', 'Directores San Quintín'], ['multi', 'Encargados multigrado'], ['otros', 'Otros contactos']];
  let f = usados.length ? 'usados' : 'todos';
  modal('Elegir destinatario', `
    <input id="d-q" type="search" placeholder="Buscar por nombre, escuela o cargo" style="width:100%;border:1px solid var(--borde);border-radius:9px;padding:9px 11px;margin-bottom:8px">
    <div class="filtros" id="d-f">${filtros.map(x => `<button type="button" class="chip" data-f="${x[0]}" style="cursor:pointer;border:0">${x[1]}</button>`).join('')}</div>
    <div class="lista-act" id="d-l" style="max-height:52vh;overflow:auto;border:1px solid var(--borde);border-radius:10px"></div>
    <div class="ayuda" style="margin-top:8px">Las personas a quienes se les hace un oficio se guardan solas en «Usados antes». Los directores y encargados vienen del Directorio.</div>`,
    '<button class="boton sec" id="d-no">Cerrar</button>');
  const pinta = () => {
    const q = $('#d-q').value.toLowerCase();
    $$('#d-f [data-f]').forEach(b => { b.className = 'chip' + (b.dataset.f === f ? ' indigo' : ''); });
    const l = items.map((x, i) => Object.assign({ i }, x)).filter(x => (f === 'todos' || x.g === f || (f.startsWith('dir-') && (x.g === 'dir' || x.g === 'multi') && x.mun === f.slice(4))) &&
      (!q || (x.t + ' ' + x.s).toLowerCase().includes(q)));
    $('#d-l').innerHTML = l.length ? l.map(x => `<button class="act" data-i="${x.i}"><div class="cuerpo"><div class="t">${esc(x.t)}</div><div class="m">${esc(x.s)}</div></div></button>`).join('')
      : '<div class="vacio peq">' + (f === 'usados' ? 'Aún no hay oficios guardados a personas.' : 'No hay coincidencias.') + '</div>';
    $$('#d-l [data-i]').forEach(b => b.onclick = () => { const d = items[+b.dataset.i].d(); cerrarModal(); listo(d); });
  };
  $('#d-q').oninput = pinta;
  $$('#d-f [data-f]').forEach(b => b.onclick = () => { f = b.dataset.f; pinta(); });
  $('#d-no').onclick = cerrarModal;
  pinta(); $('#d-q').focus();
}

function formCorreoOficio(o) {
  let guardados = {}; try { guardados = JSON.parse(localStorage.getItem('tequio.correosOficio') || '{}'); } catch (e) {}
  const msg = `Buen día.\n\nPor este medio le hago llegar el oficio ${o.folio}, relativo a: ${o.asunto}.\n\nQuedo atento a sus comentarios.\n\nAtentamente,\nMtro. Carlos Gabriel Ortega Gutiérrez\nSupervisor Escolar Zona 050`;
  const rem = (S.ofiCfg && S.ofiCfg.remitentes) || ['supervision050sep@gmail.com'];
  const dirsGrupo = esGrupo(o.municipio) ? directores().filter(c => (o.escuelas || []).includes(c.cct)) : [];
  const sinCorreo = dirsGrupo.filter(c => !correos(c).length);
  const paraIni = esGrupo(o.municipio) ? [...new Set(dirsGrupo.flatMap(correos))].join(', ') : (o.destCorreo || guardados[o.destNombre] || '');
  let deGuardado = ''; try { deGuardado = localStorage.getItem('tequio.remitenteOficio') || ''; } catch (e) {}
  modal('Enviar ' + esc(o.folio) + ' por correo', `
    ${esAdmin() && rem.length > 1 ? `<div class="campo"><label for="m-de">Enviar desde</label><select id="m-de">${rem.map(r => `<option ${r === deGuardado ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`
      : `<div class="campo"><span class="et">Enviar desde</span><div>${esc(rem[0])}</div></div>`}
    <div class="campo"><label for="m-para">Para</label><input id="m-para" type="email" multiple placeholder="correo@ejemplo.mx, otro@ejemplo.mx" value="${esc(paraIni)}">
      ${esGrupo(o.municipio) ? `<div class="ayuda">${dirsGrupo.length} direcciones${sinCorreo.length ? ' · sin correo en el Directorio: ' + esc(sinCorreo.map(c => c.escuela).join(', ')) : ''}</div>` : ''}</div>
    <div class="campo"><label for="m-as">Asunto del correo</label><input id="m-as" value="${esc('Oficio ' + o.folio + ' · ' + o.asunto)}"></div>
    <div class="campo"><label for="m-msg">Mensaje</label><textarea id="m-msg" style="min-height:160px">${esc(msg)}</textarea></div>
    ${o.recibidoId ? `<label class="casilla"><input type="checkbox" id="m-anexo" checked> Adjuntar también el oficio del director (${esc(o.recibidoNombre || 'anexo')})</label>` : ''}
    <div class="ayuda">Va con el PDF adjunto y queda una copia del correo en el Drive (Oficios Tequio → Correos enviados). Quedan ${S.cuota != null ? S.cuota : '—'} envíos hoy.</div>`,
    '<button class="boton sec" id="m-no">Cancelar</button><button class="boton terra" id="m-si">Enviar</button>');
  $('#m-no').onclick = cerrarModal;
  $('#m-si').onclick = () => conCarga(async () => {
    const para = $('#m-para').value.trim();
    if (!para) throw new Error('Escriba el correo del destinatario.');
    const b = await pdfOficio(o, await recursos());
    const de = $('#m-de') ? $('#m-de').value : rem[0];
    try { if ($('#m-de')) localStorage.setItem('tequio.remitenteOficio', de); } catch (e) {}
    const r = await api('enviarOficio', { id: o.id, de, para, adjuntarRecibido: !!($('#m-anexo') && $('#m-anexo').checked), asuntoCorreo: $('#m-as').value, mensaje: $('#m-msg').value, pdf: await blobAB64(b) });
    poner(S.ofi, r.oficio); if (typeof r.cuota === 'number') S.cuota = r.cuota;
    guardados[o.destNombre] = para; try { localStorage.setItem('tequio.correosOficio', JSON.stringify(guardados)); } catch (e) {}
    cerrarModal(); vista.ofiBorrador = null; vEditorOficio();
    aviso('Oficio enviado por correo.' + (r.nota ? '<br>' + esc(r.nota) : ''), r.nota ? 'aviso' : 'ok', r.nota ? 12000 : 3500);
  });
}

async function compartirOficio(o) {
  await conCarga(async () => {
    const b = await pdfOficio(o, await recursos());
    const nombre = nombreArchivoOfi(o) + '.pdf';
    const texto = `Supervisión Escolar Zona 050 · Oficio ${o.folio}\nAsunto: ${o.asunto}`;
    archivarPdf(o, b);
    const archivo = new File([b], nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      try { await navigator.share({ files: [archivo], title: o.folio, text: texto }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    descargarBlob(b, nombre);
    modal('Enviar por WhatsApp', `<p style="margin-top:0">Se descargó el PDF <b>${esc(nombre)}</b>. WhatsApp no permite adjuntar archivos desde una página en la computadora: abra el chat, pulse el clip y elija el PDF descargado.</p>
      <a class="boton wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(texto)}">${ico('i-wa')}Abrir WhatsApp con el mensaje</a>
      <p class="ayuda">En el teléfono, el botón WhatsApp de Tequio comparte el PDF directo.</p>`, '<button class="boton" id="w-ok">Listo</button>');
    $('#w-ok').onclick = cerrarModal;
  });
}

// Para seguir el conteo cuando se hicieron oficios en otra computadora o a mano
function formNumeroOficio() {
  const c = S.ofiCfg || {}, anio = hoy().slice(0, 4);
  const sig = String(c.siguiente || '').split('/')[1] || '';
  modal('Número del siguiente oficio', `
    <p style="margin-top:0">Si se hicieron oficios fuera de Tequio (en otra computadora o a mano), escriba en qué número debe seguir el conteo.</p>
    <div class="campo"><label for="n-sig">El siguiente oficio será el número</label>
      <div style="display:flex;align-items:center;gap:8px"><span>SE-050/</span><input id="n-sig" type="number" min="1" max="999" value="${+sig || ''}" style="width:110px"><span>/${anio}</span></div>
      <div class="ayuda" id="n-ayuda"></div></div>`,
    '<button class="boton sec" id="n-no">Cancelar</button><button class="boton terra" id="n-si">Guardar</button>');
  const usados = (S.ofi || []).filter(o => String(o.anio) === anio).map(o => +o.numero);
  const revisar = () => { const n = +$('#n-sig').value;
    $('#n-ayuda').innerHTML = !n ? '' : usados.includes(n) ? `<b>Ojo:</b> el SE-050/${String(n).padStart(3, '0')}/${anio} ya existe en Tequio; se usará el siguiente número libre.` : `Los siguientes oficios serán ${String(n).padStart(3, '0')}, ${String(n + 1).padStart(3, '0')}, ${String(n + 2).padStart(3, '0')}…`; };
  $('#n-sig').oninput = revisar; revisar();
  $('#n-no').onclick = cerrarModal;
  $('#n-si').onclick = () => { const n = parseInt($('#n-sig').value, 10);
    if (!(n >= 1 && n <= 999)) return aviso('Escriba un número entre 1 y 999.', 'mal');
    accion('numeroOficio', { ultimo: n - 1, anio }, r => { S.ofiCfg = r.ofiCfg; cerrarModal(); vOficios(); aviso('El siguiente oficio será el ' + esc(r.ofiCfg.siguiente) + '.', 'ok', 4000); }); };
}

function formCfgOficios() {
  const c = S.ofiCfg || {};
  modal('Configuración de oficios', `
    <div class="campo"><label for="c-ult">Último número de oficio usado en ${esc(c.anio || hoy().slice(0, 4))}</label><input id="c-ult" type="number" min="0" value="${esc(c.ultimo)}">
      <div class="ayuda">El siguiente oficio será el número que sigue. Cada 1 de enero la numeración vuelve a empezar en 001.</div></div>
    <div class="campo"><label for="c-key">Clave de Gemini (Google AI Studio)</label><input id="c-key" type="password" autocomplete="off" placeholder="${c.ia ? 'Ya está configurada · escriba otra para cambiarla' : 'Pegue aquí la clave (empieza con AIza…)'}">
      <div class="ayuda">Se obtiene gratis en aistudio.google.com con la cuenta de la Supervisión → «Get API key». Se guarda solo en el servidor; nadie la puede ver desde Tequio.${c.modelo ? ' Modelo en uso: ' + esc(c.modelo) + '.' : ''}</div>
      ${c.ia ? '<label class="casilla"><input type="checkbox" id="c-quitar"> Quitar la clave</label>' : ''}</div>
    <div class="campo"><label for="c-firma">Firma (PNG con fondo transparente) ${c.firma ? '<span class="chip ok">cargada</span>' : ''}</label><input id="c-firma" type="file" accept="image/png"></div>
    <div class="campo"><label for="c-sello">Sello (PNG con fondo transparente) ${c.sello ? '<span class="chip ok">cargado</span>' : ''}</label><input id="c-sello" type="file" accept="image/png">
      <div class="ayuda">La firma y el sello se guardan en el Drive de la Supervisión, en una carpeta privada; no se publican en la página.</div></div>`,
    '<button class="boton sec" id="c-no">Cancelar</button><button class="boton terra" id="c-si">Guardar</button>');
  $('#c-no').onclick = cerrarModal;
  $('#c-si').onclick = () => conCarga(async () => {
    const d = { ultimo: $('#c-ult').value, anio: c.anio || hoy().slice(0, 4) };
    const key = $('#c-key').value.trim();
    if (key) d.geminiKey = key; else if ($('#c-quitar') && $('#c-quitar').checked) d.geminiKey = '';
    for (const k of ['firma', 'sello']) { const f = $('#c-' + k).files[0]; if (f) { if (f.type !== 'image/png') throw new Error('La ' + k + ' debe ser una imagen PNG.'); d[k] = await blobAB64(f); } }
    const r = await api('configOficios', d);
    S.ofiCfg = r.ofiCfg; if (d.firma || d.sello) RECURSOS = null;
    cerrarModal(); vOficios(); aviso('Configuración guardada.' + (key ? ' La clave de Gemini funciona.' : ''), 'ok', 4000);
  });
}

cfg = leerCfg();
if (cfg) cargar(); else portada('');
window.addEventListener('hashchange', () => { const c = leerCfg(); if (c) { cfg = c; S = null; cargar(); } });
</script>
<script>
/* Dictado por voz · Tlamatini y Tequio
   Agrega un micrófono a los campos de texto. Se toca, se habla y el texto se escribe solo.
   Usa el reconocimiento de voz del navegador (Chrome, Edge, Safari). Necesita internet.
   Comandos: «punto», «coma», «dos puntos», «punto y aparte» / «nueva línea», «signo de interrogación». */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  const NO=/curp|rfc|cct|tel|cel|correo|mail|clave|folio|token|contra|pass|url|enlace|buscar|^s_zona|cp$|c\.p|codigo/i;
  const CORTO=/\bgrado|\bgrupo\b|^d_grupo|dir_g[rp]|turno|sangre|_gr$|_gp$/i;
  const MIC='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  const css=document.createElement("style");
  css.textContent=`.dct{display:block;position:relative;min-width:0;flex:1 1 auto}
.dct>input,.dct>textarea{padding-right:46px!important}
.dct-b{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted,var(--gris,#666));display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:.75}
.dct.ta>.dct-b{top:6px;transform:none}
.dct-b:hover,.dct-b:focus-visible{opacity:1;background:color-mix(in srgb,currentColor 10%,transparent)}
.dct-b.on{opacity:1;color:#fff;background:#C62828;animation:dctP 1.4s infinite}
@keyframes dctP{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}70%{box-shadow:0 0 0 10px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.dct-t{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));pointer-events:none;transform:translateX(-50%);z-index:9999;max-width:min(92vw,560px);background:#1E2A40;color:#fff;border-radius:14px;padding:10px 14px;font:15px/1.35 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.dct-t[hidden]{display:none}.dct-t b{color:#FFB4A9}.dct-t i{opacity:.8}.dct-t button{pointer-events:auto;margin-left:auto;background:#fff;color:#1E2A40;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;flex:none}
@media print{.dct-b,.dct-t{display:none!important}}`;
  document.head.appendChild(css);
  const toast=document.createElement("div");toast.className="dct-t";toast.hidden=true;toast.setAttribute("role","status");toast.setAttribute("aria-live","polite");
  document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(toast));if(document.body)document.body.appendChild(toast);
  let tTimer=null;
  function aviso(html,ms,boton){clearTimeout(tTimer);toast.innerHTML=`<span>${html}</span>${boton?'<button type="button">Listo</button>':""}`;toast.hidden=false;
    const b=toast.querySelector("button");if(b){b.onmousedown=e=>e.preventDefault();b.onclick=detener}
    if(ms)tTimer=setTimeout(()=>{toast.hidden=true},ms)}
  function apto(el){if(el.dataset.dct||el.readOnly||el.disabled||el.dataset.nodict!==undefined)return false;
    if(el.tagName==="INPUT"){const t=(el.getAttribute("type")||"text").toLowerCase();if(t!=="text"&&t!=="search")return false;
      const ml=+el.getAttribute("maxlength");if(ml&&ml<25)return false}
    if(el.tagName==="INPUT"){const k=(el.id||"")+" "+(el.name||"")+" "+(el.getAttribute("autocomplete")||"");
      if(NO.test(k)||CORTO.test(k))return false;
      const lab=el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`);if(lab&&(NO.test(lab.textContent)||CORTO.test(lab.textContent)))return false}
    if(el.closest("[data-nodict]"))return false;
    return !!el.parentNode}
  function decorar(raiz){(raiz||document).querySelectorAll("textarea,input").forEach(el=>{if(!apto(el))return;el.dataset.dct="1";
    const w=document.createElement("span");w.className="dct"+(el.tagName==="TEXTAREA"?" ta":"");el.parentNode.insertBefore(w,el);w.appendChild(el);
    const b=document.createElement("button");b.type="button";b.className="dct-b";b.innerHTML=MIC;b.title="Dictar por voz";b.setAttribute("aria-label","Dictar por voz");
    b.addEventListener("mousedown",e=>e.preventDefault());b.addEventListener("pointerdown",e=>e.preventDefault());
    b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();if(activo&&activo.el===el)detener();else iniciar(el,b)});w.appendChild(b)})}
  let pend=false;
  new MutationObserver(()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;decorar()})}).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",()=>decorar());
  /* --- reconocimiento --- */
  let activo=null;
  function puntuar(t){return t
    .replace(/\s*\b(punto y aparte|nuevo p[aá]rrafo|nueva l[ií]nea|siguiente rengl[oó]n)\b\s*/gi,"\n")
    .replace(/\s*\bpunto y seguido\b/gi,".")
    .replace(/\s*\bdos puntos\b/gi,":")
    .replace(/\s*\bpunto y coma\b/gi,";")
    .replace(/\s*\bpunto final\b/gi,".")
    .replace(/\s*\bpunto\b(?!\s+(de|del|y|por|com|medio|a|en|que|cardinal)\b)/gi,".")
    .replace(/\s*\bcoma\b/gi,",")
    .replace(/\s*\bsigno de interrogaci[oó]n\b/gi,"?")
    .replace(/\s*\bsigno de admiraci[oó]n\b/gi,"!")
    .replace(/\s*\b(abre|abrir) par[eé]ntesis\b\s*/gi," (")
    .replace(/\s*\b(cierra|cerrar) par[eé]ntesis\b/gi,")")}
  function insertar(el,txt){if(!txt)return;const ta=el.tagName==="TEXTAREA";if(!ta)txt=txt.replace(/\n/g," ");
    const v=el.value;let s=el.selectionStart,e=el.selectionEnd;if(s==null||document.activeElement!==el){s=e=v.length}
    const antes=v.slice(0,s),despues=v.slice(e);
    const fin=antes.replace(/[ \t]+$/,"");
    const inicioFrase=!fin||/[.!?:\n]$/.test(fin);
    txt=txt.trim().replace(/[ \t]+/g," ").replace(/ ([.,;:?!)])/g,"$1").replace(/([.?!]) *\n/g,"$1\n").replace(/\n +/g,"\n");
    if(inicioFrase&&!/:$/.test(fin)||/[.!?]$/.test(fin))txt=txt.charAt(0).toUpperCase()+txt.slice(1);
    txt=txt.replace(/([.!?]\s+|\n)([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
    const sep=!antes||/[\s(\n]$/.test(antes)||/^[.,;:?!)]/.test(txt)||/^\n/.test(txt)?"":" ";
    const sep2=despues&&!/^[\s.,;:?!)]/.test(despues)?" ":"";
    el.value=antes+sep+txt+sep2+despues;const p=(antes+sep+txt).length;try{el.setSelectionRange(p,p)}catch(x){}
    el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}
  function detener(){if(!activo)return;const a=activo;activo=null;a.b.classList.remove("on");a.b.setAttribute("aria-label","Dictar por voz");try{a.r.stop()}catch(e){}
    a.el.removeEventListener("blur",a.onBlur);if(!a.err)aviso("Dictado terminado. Revise el texto antes de guardar.",2600)}
  function iniciar(el,b){detener();
    if(navigator.onLine===false){aviso("<b>El dictado necesita internet.</b> Sin conexión, use el micrófono del teclado de su teléfono.",5000);return}
    const r=new SR();r.lang="es-MX";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    const a={el,b,r,err:false,calla:0,onBlur:()=>setTimeout(()=>{if(activo===a&&document.activeElement!==el)detener()},250)};activo=a;
    b.classList.add("on");b.setAttribute("aria-label","Detener dictado");el.focus();el.addEventListener("blur",a.onBlur);
    aviso("<b>🎙 Escuchando…</b> Hable con calma. Diga «punto», «coma» o «punto y aparte».",0,true);
    r.onresult=ev=>{a.calla=0;let fin="",inter="";for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript+" ";else inter+=x[0].transcript}
      if(fin)insertar(el,puntuar(fin));
      if(activo===a)aviso(inter?`<b>🎙</b> <i>${inter.replace(/[<>&]/g,"")}</i>`:"<b>🎙 Escuchando…</b> Diga «punto», «coma» o «punto y aparte».",0,true)};
    r.onerror=ev=>{a.err=true;const m={"not-allowed":"<b>No hay permiso para el micrófono.</b> Permítalo en el candado junto a la dirección de la página.","service-not-allowed":"<b>Este navegador no permite el dictado aquí.</b> Use el micrófono del teclado de su teléfono.","network":"<b>El dictado necesita internet.</b> Revise su conexión.","audio-capture":"<b>No se encontró un micrófono.</b>","no-speech":"No se escuchó nada. Toque el micrófono e intente de nuevo."}[ev.error];
      if(ev.error==="aborted")return;if(ev.error==="no-speech"&&++a.calla<3){a.err=false;return}/* silencio breve: sigue escuchando */aviso(m||"No se pudo dictar. Intente de nuevo.",5000);if(activo===a){activo=null;b.classList.remove("on");el.removeEventListener("blur",a.onBlur)}};
    r.onend=()=>{if(activo===a){try{r.start()}catch(e){detener()}}}; // cada frase termina sola: se reanuda mientras siga activo
    try{r.start()}catch(e){a.err=true;detener();aviso("No se pudo iniciar el dictado.",4000)}}
  window.addEventListener("pagehide",detener);
  window.Dictado={decorar,detener};
})();
</script>
