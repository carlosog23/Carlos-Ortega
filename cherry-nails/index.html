<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141112">
<title>Cherry Nails Agenda</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cherry Nails">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Un solo mundo visual, tomado del logo: carbón, oro y rojo cereza. App de una pantalla con barra inferior, pensada para el pulgar. */
:root{
  color-scheme:dark;
  --bg:#141112; --surface:#1f1a1b; --surface2:#2b2426; --line:#3d3235;
  --text:#f4ece5; --muted:#ac9c92;
  --gold:#dab56c; --gold-ink:#1b1408; --cherry:#e23a54; --cherry-deep:#8f1227;
  --ok:#74c492; --warn:#e6ad4e;
  --display:"Cormorant Garamond", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header.top img{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);object-fit:cover}
header.top h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;margin:0;color:var(--gold)}
header.top p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{background:none;border:0;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--gold)}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.wa{background:#1f6b4a;border-color:#2b8a60;color:#fff}
.btn.danger{color:var(--cherry);border-color:var(--cherry-deep)}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#2f5a41}
.pill.warn{color:var(--warn);border-color:#6b5222}
.pill.bad{color:var(--cherry);border-color:var(--cherry-deep)}
.pill.gold{color:var(--gold);border-color:#6b5730}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.day{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;padding:0;min-height:40px}
.day.on{background:var(--surface);border-color:var(--line)}
.day.off{color:#6d6059}
.day.past{opacity:.55}
.day.today .n{color:var(--gold)}
.day.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day .c{font-size:10px;line-height:1;font-weight:700;color:var(--cherry);min-height:10px}
.day.full .c{color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend i.a{background:var(--surface)} .legend i.b{background:none;border-style:dashed}
/* agenda del día */
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--line);background:none;border-radius:12px;padding:9px 12px;min-height:44px}
.slot .t{width:84px;white-space:nowrap;font-weight:600;color:var(--muted)}
.slot .free{color:var(--ok);font-weight:600}
.cita{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--cherry);background:var(--surface);border-radius:12px;padding:10px 12px}
.cita.done{border-left-color:var(--ok)} .cita.x{border-left-color:#6d6059;opacity:.6}
.cita .t{width:84px;white-space:nowrap;font-weight:700}
.cita b{display:block}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--gold-ink)}
/* formularios */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--text)}
textarea{min-height:92px;resize:vertical;line-height:1.35}
input[type=time],input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
.grid2>*,label.f{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 11px;font-size:14px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.svc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.tot .big{font-size:20px;font-weight:700}
.tot .rest{color:var(--cherry)} .tot .paid{color:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;min-height:52px}
.item:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--cherry-deep);display:grid;place-items:center;font-weight:700;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--warn);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:13px}
/* hoja */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
#sheet .panel{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:94%;display:flex;flex-direction:column}
#sheet .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#sheet .body{overflow-y:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:700;padding:9px 16px;border-radius:999px;z-index:20;display:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
'use strict';
const KEY='cherrynails.v1';
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TAM=['chico','mediano','grande'], TAMC=['Ch','M','G'];
const METODOS=['Efectivo','Transferencia','Tarjeta'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const hoy=()=>ymd(new Date());
const t2m=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const m2t=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const h12=t=>{let m=t2m(t),h=Math.floor(m/60),x=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m%60)+' '+x};
const fLarga=s=>{const d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]};
const fCorta=s=>{const d=pd(s);return d.getDate()+' '+MES[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-MX');
const durTxt=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60:'');
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};

function defaults(){
  const sv=(n,p,d)=>({id:uid(),nombre:n,precios:p,dur:d||60});
  const hor={};for(let i=0;i<7;i++)hor[i]={on:i!==0,ini:'10:00',fin:'19:00'};
  return {v:1,folio:0,
    cfg:{negocio:'Cherry Nails',duena:'Melissa López',lada:'52',slot:30,horario:hor,
      tConf:'Hola {nombre} 🍒 Tu cita en {negocio} quedó agendada para el {fecha} a las {hora}.\nServicio: {servicios}\nTotal: {total}\nAnticipo: {anticipo}\nResta: {resta}\n¡Te espero!',
      tRec:'Hola {nombre} 🍒 Te recuerdo tu cita en {negocio} el {fecha} a las {hora}.\nResta por pagar: {resta}\nSi no puedes asistir, avísame con tiempo por favor.',
      tGracias:'¡Gracias por tu preferencia! 💅'},
    exc:{},
    servicios:[sv('Esmaltado en manos',[200]),sv('Esmaltado en pies',[300]),sv('Esmaltado en manos y pies',[500]),
      sv('Manicura',[300]),sv('Pedicure',[500]),sv('Manicura y pedicura',[800]),
      sv('Uñas (precio base)',[300,400,500]),sv('Retoque uñas',[400]),sv('Retoque pies',[200]),sv('Retiro',[100]),
      sv('Rubber uña natural',[350]),sv('Builder gel uña natural',[350]),
      sv('Builder extensión',[350,450,550]),sv('Rubber extensión',[350,450,550]),sv('Soft gel',[450,550,650])],
    clientas:[],citas:[]};
}
let S, mem=false;
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){mem=true}
  const d=defaults();
  if(raw){try{const o=JSON.parse(raw);S=Object.assign(d,o);S.cfg=Object.assign(defaults().cfg,o.cfg||{})}catch(e){S=d}}else S=d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true}}

/* ---------- reglas ---------- */
const activa=c=>c.estado!=='cancelada'&&c.estado!=='noasistio';
const total=c=>c.items.reduce((s,i)=>s+num(i.precio),0)+num(c.extra);
const pagado=c=>(c.pagos||[]).reduce((s,p)=>s+num(p.monto),0);
const resta=c=>Math.max(0,total(c)-pagado(c));
const cli=id=>S.clientas.find(x=>x.id===id)||{nombre:'(sin clienta)',tel:''};
function horas(f){const w=S.cfg.horario[pd(f).getDay()],e=S.exc[f];
  if(e){return e.on?{ini:e.ini||w.ini,fin:e.fin||w.fin}:null}
  return w.on?{ini:w.ini,fin:w.fin}:null}
const citasDe=f=>S.citas.filter(c=>c.fecha===f).sort((a,b)=>t2m(a.hora)-t2m(b.hora));
function choca(f,ini,dur,skip){const a=t2m(ini),b=a+dur;return S.citas.some(c=>c.fecha===f&&c.id!==skip&&activa(c)&&t2m(c.hora)<b&&t2m(c.hora)+c.dur>a)}
function libres(f,skip){const h=horas(f);if(!h)return[];const out=[],st=S.cfg.slot;
  for(let m=t2m(h.ini);m+st<=t2m(h.fin);m+=st){if(!choca(f,m2t(m),st,skip))out.push(m2t(m))}return out}
function libresDur(f,dur,skip){const h=horas(f);if(!h)return[];const out=[],st=S.cfg.slot;
  for(let m=t2m(h.ini);m+dur<=t2m(h.fin);m+=st){if(!choca(f,m2t(m),dur,skip))out.push(m2t(m))}return out}
function wa(tel){let d=String(tel||'').replace(/\D/g,'');if(!d)return'';if(d.length===10)d=S.cfg.lada+d;return d}
const waLink=(tel,txt)=>'https://wa.me/'+wa(tel)+'?text='+encodeURIComponent(txt);
function servTxt(c){return c.items.map(i=>i.nombre+(i.tam?' ('+i.tam+')':'')).join(', ')+(num(c.extra)?' + '+(c.extraDesc||'diseño'):'')}
function fill(t,c){const k=cli(c.clientaId);const v={nombre:(k.nombre||'').split(' ')[0],negocio:S.cfg.negocio,fecha:fLarga(c.fecha),hora:h12(c.hora),servicios:servTxt(c),total:money(total(c)),anticipo:money(pagado(c)),resta:money(resta(c))};
  return t.replace(/\{(\w+)\}/g,(m,x)=>x in v?v[x]:m)}
function recibo(c){const k=cli(c.clientaId),L=[];
  L.push('🍒 *'+S.cfg.negocio+'*','Recibo de pago · Folio '+String(c.folio||0).padStart(4,'0'),'','Clienta: '+k.nombre,'Cita: '+fLarga(c.fecha)+', '+h12(c.hora),'');
  c.items.forEach(i=>L.push('• '+i.nombre+(i.tam?' ('+i.tam+')':'')+'  '+money(i.precio)));
  if(num(c.extra))L.push('• '+(c.extraDesc||'Diseño extra')+'  '+money(c.extra));
  L.push('*Total: '+money(total(c))+'*','');
  if((c.pagos||[]).length){L.push('Pagos:');c.pagos.forEach(p=>L.push('• '+fCorta(p.fecha)+' · '+p.tipo+' · '+p.metodo+'  '+money(p.monto)))}
  L.push('*Pagado: '+money(pagado(c))+'*','*Resta: '+money(resta(c))+'*','',S.cfg.tGracias,'Atendió: '+S.cfg.duena);
  return L.join('\n')}
const estTxt={agendada:'Agendada',completada:'Atendida',cancelada:'Cancelada',noasistio:'No asistió'};
function estPill(c){const m={agendada:'gold',completada:'ok',cancelada:'bad',noasistio:'bad'};return '<span class="pill '+m[c.estado]+'">'+estTxt[c.estado]+'</span>'}
function pagoPill(c){if(!activa(c))return'';const r=resta(c),p=pagado(c);
  if(r<=0&&total(c)>0)return'<span class="pill ok">Pagado</span>';
  if(p>0)return'<span class="pill warn">Resta '+money(r)+'</span>';
  return'<span class="pill">Sin anticipo</span>'}

/* ---------- navegación ---------- */
let view='agenda', sel=hoy(), mesV=hoy().slice(0,7), qCli='', cajaM=hoy().slice(0,7);
const TABS=[['agenda','Agenda','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
 ['clientas','Clientas','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'],
 ['tarifas','Tarifas','<path d="M4 12l8-8h8v8l-8 8z"/><circle cx="16" cy="8" r="1.4"/>'],

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function sheet(title,html){$('#sheetT').textContent=title;$('#sheetB').innerHTML=html;$('#sheet').classList.add('open');$('#sheetB').scrollTop=0}

/* ---------- Agenda ---------- */
function vAgenda(){
  const [y,m]=mesV.split('-').map(Number),first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),t=hoy();
  let g='DLMMJVS'.split('').map(x=>'<div class="dow">'+x+'</div>').join('');
  for(let i=0;i<first.getDay();i++)g+='<div></div>';
  for(let d=1;d<=n;d++){const f=mesV+'-'+pad(d),h=horas(f),cs=citasDe(f).filter(activa),fr=h?libres(f).length:0;
    const cl=['day',h?'on':'off',f<t?'past':'',f===t?'today':'',f===sel?'sel':'',h&&!fr?'full':''].join(' ');
    g+='<button class="'+cl+'" data-a="day" data-f="'+f+'" aria-label="'+fLarga(f)+(h?', '+cs.length+' citas, '+fr+' espacios libres':', no trabaja')+'"><span class="n">'+d+'</span><span class="c">'+(cs.length?cs.length+(cs.length>1?' citas':' cita'):'')+'</span></button>'}
  const man=addDays(t,1),pend=S.citas.filter(c=>activa(c)&&c.estado==='agendada'&&(c.fecha===man)&&!(c.av&&c.av.rec));
  let out='';
  if(mem)out+='<div class="note">Este navegador no deja guardar datos aquí. Lo que captures se perderá al cerrar.</div>';
  if(pend.length)out+='<button class="card row between" data-a="recs" style="text-align:left;width:100%"><span><b>'+pend.length+(pend.length>1?' citas de mañana':' cita de mañana')+' sin recordatorio</b><br><span class="small muted">Toca para enviarlos por WhatsApp</span></span><span class="pill warn">Enviar</span></button>';
  out+='<section class="col"><div class="row between"><button class="btn sm ghost" data-a="mes" data-d="-1" aria-label="Mes anterior">‹</button><h2>'+MES[m-1][0].toUpperCase()+MES[m-1].slice(1)+' '+y+'</h2><button class="btn sm ghost" data-a="mes" data-d="1" aria-label="Mes siguiente">›</button></div><div class="cal">'+g+'</div><div class="legend"><span><i class="a"></i>Día que trabaja</span><span><i class="b"></i>Día cerrado</span><span style="color:var(--warn)">Naranja: sin espacios</span></div></section>';
  out+=vDia();return out}
function vDia(){
  const f=sel,h=horas(f),cs=citasDe(f),w=S.cfg.horario[pd(f).getDay()],e=S.exc[f]||{};
  let o='<section class="col"><div class="row between"><div><h2>'+fLarga(f)[0].toUpperCase()+fLarga(f).slice(1)+'</h2><span class="small muted">'+(h?'Trabaja de '+h12(h.ini)+' a '+h12(h.fin)+' · '+libres(f).length+' espacios libres':'Día cerrado, no se ofrecen espacios')+'</span></div><button class="switch" role="switch" aria-checked="'+(!!h)+'" aria-label="Trabajo este día" data-a="togDia"></button></div>';
  if(h)o+='<div class="grid2"><label class="f">Abre<input type="time" id="dIni" data-i="dIni" value="'+(e.ini||w.ini)+'"></label><label class="f">Cierra<input type="time" id="dFin" data-i="dFin" value="'+(e.fin||w.fin)+'"></label></div>';
  const rows=cs.map(c=>({m:t2m(c.hora),c}));
  if(h)libres(f).forEach(t=>rows.push({m:t2m(t),t}));
  rows.sort((a,b)=>a.m-b.m||(a.c?-1:1));
  if(!rows.length)o+='<p class="muted small">Enciende el interruptor para habilitar este día y ver sus espacios.</p>';
  o+='<div class="col" style="gap:6px">'+rows.map(r=>r.c?citaRow(r.c):'<button class="slot" data-a="nueva" data-f="'+f+'" data-h="'+r.t+'"><span class="t num">'+h12(r.t)+'</span><span class="free">Libre</span><span class="muted small" style="margin-left:auto">Agendar</span></button>').join('')+'</div>';
  o+='<button class="btn gold block" data-a="nueva" data-f="'+f+'">Agendar cita este día</button></section>';return o}
function citaRow(c,conFecha){const k=cli(c.clientaId);
  return '<button class="cita '+(c.estado==='completada'?'done':!activa(c)?'x':'')+'" data-a="verCita" data-id="'+c.id+'"><span class="t num">'+(conFecha?fCorta(c.fecha)+'<br><span class="small muted">'+h12(c.hora)+'</span>':h12(c.hora)+'<br><span class="small muted">'+durTxt(c.dur)+'</span>')+'</span><span class="grow"><b>'+esc(conFecha===2?servTxt(c):k.nombre)+'</b><span class="small muted">'+esc(conFecha===2?'':servTxt(c))+'</span><span class="row wrap" style="gap:6px;margin-top:5px">'+estPill(c)+pagoPill(c)+'<span class="pill num">'+money(total(c))+'</span></span></span></button>'}

/* ---------- Formulario de cita ---------- */
let F=null;
function nuevaCita(f,h,clientaId,editId){
  if(editId){const c=S.citas.find(x=>x.id===editId);F=JSON.parse(JSON.stringify(c));F.edit=true;F.durAuto=false}
  else F={id:uid(),clientaId:clientaId||'',fecha:f||sel,hora:h||(libresDur(f||sel,60)[0]||'10:00'),dur:60,durAuto:true,items:[],extra:0,extraDesc:'',pagos:[],estado:'agendada',notas:'',ant:0,antMet:'Efectivo',q:'',nueva:null};
  sheet(F.edit?'Editar cita':'Nueva cita',formHtml());updForm()}
function formHtml(){
  let o='<div class="col"><h3>Clienta</h3><div id="fCli"></div></div>';
  o+='<div class="grid2"><label class="f">Fecha<input type="date" id="fFecha" data-i="fFecha" value="'+F.fecha+'"></label><label class="f">Hora<input type="time" id="fHora" data-i="fHora" value="'+F.hora+'"></label></div><div class="col" style="gap:6px"><h3>Duración de la cita</h3><div class="chips" id="fDurC"></div><label class="f">Otra duración (minutos)<input inputmode="numeric" id="fDur" data-i="fDur" value="'+F.dur+'"></label><span class="small" id="fFin" style="color:var(--gold)"></span></div><div class="col" style="gap:6px"><span class="small muted" id="fLibT"></span><div class="chips" id="fLib"></div><div id="fWarn"></div></div>';
  o+='<div class="col" style="gap:4px"><h3>Servicios</h3><div class="card" id="fSvc" style="padding:4px 12px"></div></div>';
  o+='<div class="grid2"><label class="f">Diseño o extra ($)<input inputmode="decimal" id="fExtra" data-i="fExtra" value="'+(F.extra||'')+'" placeholder="0"></label><label class="f">Concepto del extra<input id="fExtraD" data-i="fExtraD" value="'+esc(F.extraDesc)+'" placeholder="Diseño, pedrería…"></label></div>';
  if(!F.edit)o+='<div class="grid2"><label class="f">Anticipo ($)<input inputmode="decimal" id="fAnt" data-i="fAnt" placeholder="0"></label><label class="f">Forma de pago<select id="fAntM" data-i="fAntM">'+METODOS.map(x=>'<option>'+x+'</option>').join('')+'</select></label></div>';
  o+='<div class="card tot" id="fTot"></div>';
  o+='<label class="f">Notas<textarea id="fNotas" data-i="fNotas" placeholder="Color, diseño, alergias, referencia…">'+esc(F.notas)+'</textarea></label>';
  o+='<button class="btn gold block" data-a="guardarCita">'+(F.edit?'Guardar cambios':'Agendar cita')+'</button>';return o}
function updForm(){updCli();updDur();updLib();updSvc();updTot()}
function updDur(){$('#fDurC').innerHTML=[30,45,60,90,120,150,180].map(m=>'<button class="chip" data-a="fDurC" data-m="'+m+'" aria-pressed="'+(F.dur===m)+'">'+durTxt(m)+'</button>').join('');
  $('#fFin').textContent='De '+h12(F.hora)+' a '+h12(m2t(Math.min(1439,t2m(F.hora)+F.dur)))+' ('+durTxt(F.dur)+')'}
function updCli(){const el=$('#fCli');if(!el)return;let o='';
  if(F.clientaId){const k=cli(F.clientaId);o='<div class="card row between"><span><b>'+esc(k.nombre)+'</b><br><span class="small muted">'+esc(k.tel||'Sin teléfono')+'</span></span><button class="btn sm" data-a="fCamb">Cambiar</button></div>'}
  else if(F.nueva){o='<div class="col">'+(F.nueva.ios?'<span class="small" style="color:var(--gold)">En iPhone: toca el campo Nombre y, arriba del teclado, elige «Autorrellenar contacto» (o «Contactos») para traer el nombre y el teléfono. Si no aparece, actívalo en Ajustes del iPhone › Safari › Autorrelleno › Usar datos de contacto.</span>':'')+'<div class="grid2"><label class="f">Nombre<input id="fNN" data-i="fNN" name="name" autocomplete="name" value="'+esc(F.nueva.nombre)+'"></label><label class="f">WhatsApp<input id="fNT" data-i="fNT" type="tel" name="tel" autocomplete="tel" inputmode="tel" value="'+esc(F.nueva.tel)+'" placeholder="10 dígitos"></label></div><button class="btn sm ghost" data-a="fCamb">Elegir otra clienta</button></div>'}
  else{const q=F.q.toLowerCase(),r=S.clientas.filter(k=>!q||k.nombre.toLowerCase().includes(q)||(k.tel||'').includes(q)).slice(0,5);
    o='<div class="col"><input id="fQ" data-i="fQ" placeholder="Buscar clienta guardada…" value="'+esc(F.q)+'"><div class="list" id="fRes">'+resHtml(r)+'</div><div class="grid2"><button class="btn sm" data-a="contacto" data-to="cita">Desde mis contactos</button><button class="btn sm" data-a="fNueva">Clienta nueva</button></div></div>'}
  el.innerHTML=o}
const resHtml=r=>r.map(k=>'<button class="item" data-a="fPick" data-id="'+k.id+'"><span class="av">'+esc((k.nombre||'?')[0].toUpperCase())+'</span><span class="grow"><b>'+esc(k.nombre)+'</b><br><span class="small muted">'+esc(k.tel||'')+'</span></span></button>').join('');
function updLib(){const l=libresDur(F.fecha,F.dur,F.id),h=horas(F.fecha);
  $('#fLibT').textContent=h?(l.length?'Horas libres para '+durTxt(F.dur)+' el '+fLarga(F.fecha)+':':'Ese día no tiene un espacio libre de '+durTxt(F.dur)+'.'):'';
  $('#fLib').innerHTML=l.map(t=>'<button class="chip num" data-a="fHoraC" data-h="'+t+'" aria-pressed="'+(t===F.hora)+'">'+h12(t)+'</button>').join('');
  let w='';if(!h)w='Ese día está cerrado en la agenda. Puedes agendar de todos modos.';
  else if(choca(F.fecha,F.hora,F.dur,F.id))w='Se encima con otra cita a esa hora.';
  else if(t2m(F.hora)<t2m(h.ini)||t2m(F.hora)+F.dur>t2m(h.fin))w='Queda fuera del horario de ese día ('+h12(h.ini)+' a '+h12(h.fin)+').';
  $('#fWarn').innerHTML=w?'<div class="note">'+w+'</div>':''}
function updSvc(){$('#fSvc').innerHTML=S.servicios.map(s=>{const it=F.items.find(i=>i.servId===s.id);
  return '<div class="svc"><span class="grow">'+esc(s.nombre)+'</span><span class="chips">'+s.precios.map((p,i)=>{const tam=s.precios.length>1?TAM[i]:'';
    return '<button class="chip num" data-a="fSvc" data-id="'+s.id+'" data-i="'+i+'" aria-pressed="'+(!!it&&it.tam===tam)+'">'+(tam?TAMC[i]+' ':'')+money(p)+'</button>'}).join('')+'</span></div>'}).join('')}
function updTot(){const t=total(F),p=F.edit?pagado(F):num(F.ant);
  $('#fTot').innerHTML='<span>Costo</span><span class="big">'+money(t)+'</span><span>'+(F.edit?'Pagado':'Anticipo')+'</span><span class="paid">'+money(p)+'</span><span><b>Resta</b></span><span class="big rest">'+money(Math.max(0,t-p))+'</span>'}
function guardarCita(){if(F&&F.nueva){const a=$('#fNN'),b=$('#fNT');if(a)F.nueva.nombre=a.value;if(b)F.nueva.tel=b.value}
 
  if(!F.clientaId){
    if(F.nueva&&F.nueva.nombre.trim()){const tel=F.nueva.tel.trim(),ex=tel&&S.clientas.find(k=>wa(k.tel)===wa(tel));
      if(ex)F.clientaId=ex.id;else{const k={id:uid(),nombre:F.nueva.nombre.trim(),tel,email:F.nueva.email||'',dir:F.nueva.dir||'',notas:F.nueva.notas||''};S.clientas.push(k);F.clientaId=k.id}}
    else return toast('Elige o captura a la clienta')}
  if(!F.items.length&&!num(F.extra))return toast('Elige al menos un servicio');
  if(!F.fecha||!F.hora)return toast('Falta fecha u hora');
  const c={id:F.id,clientaId:F.clientaId,fecha:F.fecha,hora:F.hora,dur:Math.max(10,num(F.dur)||60),items:F.items,extra:num(F.extra),extraDesc:F.extraDesc,pagos:F.pagos||[],estado:F.estado,notas:F.notas,av:F.av||{},folio:F.folio};
  if(F.edit){S.citas[S.citas.findIndex(x=>x.id===c.id)]=c}
  else{c.folio=++S.folio;if(num(F.ant)>0)c.pagos.push({id:uid(),fecha:hoy(),monto:num(F.ant),metodo:F.antMet,tipo:'Anticipo'});S.citas.push(c)}
  save();sel=c.fecha;mesV=c.fecha.slice(0,7);F=null;toast('Cita guardada');verCita(c.id)}

/* ---------- Detalle de cita ---------- */
function verCita(id){const c=S.citas.find(x=>x.id===id);if(!c)return closeSheet();const k=cli(c.clientaId),tel=wa(k.tel),r=resta(c),av=c.av||{};
  const waBtn=(key,label,txt,done)=>'<a class="btn wa block'+(tel?'':' off')+'" target="_blank" rel="noopener" data-a="aviso" data-id="'+c.id+'" data-k="'+key+'" href="'+(tel?waLink(k.tel,txt):'#')+'">'+label+(done?' · enviado '+fCorta(done):'')+'</a>';
  let o='<div class="card col" style="gap:6px"><div class="row between"><b style="font-size:18px">'+esc(k.nombre)+'</b>'+estPill(c)+'</div><span>'+fLarga(c.fecha)+' · '+h12(c.hora)+' a '+h12(m2t(Math.min(1439,t2m(c.hora)+c.dur)))+' · '+durTxt(c.dur)+'</span><span class="small muted">'+esc(k.tel||'Sin teléfono guardado')+' · Folio '+String(c.folio||0).padStart(4,'0')+'</span>'+(c.notas?'<span class="small">'+esc(c.notas)+'</span>':'')+'</div>';
  o+='<div class="card col" style="gap:6px"><h3>Cuenta</h3>'+c.items.map(i=>'<div class="row between"><span>'+esc(i.nombre)+(i.tam?' <span class="muted small">('+i.tam+')</span>':'')+'</span><span class="num">'+money(i.precio)+'</span></div>').join('')+(num(c.extra)?'<div class="row between"><span>'+esc(c.extraDesc||'Diseño extra')+'</span><span class="num">'+money(c.extra)+'</span></div>':'')+'<div class="tot" style="border-top:1px solid var(--line);padding-top:8px"><span>Costo</span><span class="big">'+money(total(c))+'</span><span>Pagado</span><span class="paid">'+money(pagado(c))+'</span><span><b>Resta</b></span><span class="big rest">'+money(r)+'</span></div></div>';
  o+='<div class="card col"><h3>Pagos</h3>'+((c.pagos||[]).length?c.pagos.map(p=>'<div class="row between"><span>'+fCorta(p.fecha)+' · '+esc(p.tipo)+' · '+esc(p.metodo)+'</span><span class="row"><b class="num">'+money(p.monto)+'</b><button class="btn sm ghost danger" data-a="delPago" data-id="'+c.id+'" data-p="'+p.id+'" aria-label="Quitar pago">✕</button></span></div>').join(''):'<span class="muted small">Aún no hay pagos registrados.</span>');
  if(r>0)o+='<div class="grid2"><label class="f">Monto ($)<input inputmode="decimal" id="pMonto" value="'+r+'"></label><label class="f">Forma de pago<select id="pMet">'+METODOS.map(x=>'<option>'+x+'</option>').join('')+'</select></label></div><button class="btn block" data-a="addPago" data-id="'+c.id+'">Registrar pago</button>';
  o+='</div>';
  o+='<div class="col"><h3>WhatsApp</h3>'+(tel?'':'<div class="note">Esta clienta no tiene teléfono. Agrégalo en su ficha para enviar avisos.</div>')+waBtn('conf','Enviar confirmación',fill(S.cfg.tConf,c),av.conf)+waBtn('rec','Enviar recordatorio',fill(S.cfg.tRec,c),av.rec)+waBtn('recibo','Enviar recibo de pago',recibo(c),av.recibo)+'<span class="small muted">Se abre WhatsApp con el mensaje escrito; solo falta tocar enviar.</span></div>';
  o+='<div class="col"><h3>Estado</h3><div class="chips">'+Object.keys(estTxt).map(e=>'<button class="chip" data-a="estado" data-id="'+c.id+'" data-e="'+e+'" aria-pressed="'+(c.estado===e)+'">'+estTxt[e]+'</button>').join('')+'</div></div>';
  o+='<div class="grid2"><button class="btn" data-a="editCita" data-id="'+c.id+'">Editar</button><button class="btn danger" data-a="delCita" data-id="'+c.id+'">Eliminar</button></div>';
  sheet('Cita',o)}

/* ---------- Clientas ---------- */
function vClientas(){const q=qCli.toLowerCase(),r=S.clientas.filter(k=>!q||k.nombre.toLowerCase().includes(q)||(k.tel||'').includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  return '<div class="row between"><h2>Clientas</h2><span class="muted small">'+S.clientas.length+' guardadas</span></div><input id="qCli" data-i="qCli" placeholder="Buscar por nombre o teléfono" value="'+esc(qCli)+'"><div class="grid2"><button class="btn" data-a="contacto" data-to="cli">Desde mis contactos</button><button class="btn gold" data-a="editCli">Clienta nueva</button></div><div class="card list" id="cliList">'+cliList(r)+'</div>'}
function cliList(r){return r.length?r.map(k=>{const cs=S.citas.filter(c=>c.clientaId===k.id&&activa(c)),d=cs.reduce((s,c)=>s+(c.fecha<=hoy()?resta(c):0),0);
  return '<button class="item" data-a="verCli" data-id="'+k.id+'"><span class="av">'+esc((k.nombre||'?')[0].toUpperCase())+'</span><span class="grow"><b>'+esc(k.nombre)+'</b><br><span class="small muted">'+esc(k.tel||'Sin teléfono')+' · '+cs.length+(cs.length===1?' cita':' citas')+'</span></span>'+(d>0?'<span class="pill bad">Debe '+money(d)+'</span>':'')+'</button>'}).join(''):'<p class="muted small" style="margin:10px 2px">Aquí aparecerán las clientas conforme las agendes. También puedes traerlas de los contactos del celular.</p>'}
function verCli(id){const k=cli(id),cs=S.citas.filter(c=>c.clientaId===id).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora)),ac=cs.filter(activa),t=hoy();
  const pag=cs.reduce((s,c)=>s+pagado(c),0),deb=ac.reduce((s,c)=>s+(c.fecha<=t?resta(c):0),0),ult=ac.find(c=>c.fecha<=t),prox=ac.filter(c=>c.fecha>=t&&c.estado==='agendada').pop();
  let o='<div class="card col" style="gap:4px"><b style="font-size:18px">'+esc(k.nombre)+'</b><span>'+esc(k.tel||'Sin teléfono')+'</span>'+(k.email?'<span class="small muted">'+esc(k.email)+'</span>':'')+(k.dir?'<span class="small muted">'+esc(k.dir)+'</span>':'')+(k.notas?'<span class="small">'+esc(k.notas)+'</span>':'')+'</div>';
  o+='<div class="tiles"><div class="card tile"><span class="small muted">Visitas</span><b>'+ac.filter(c=>c.fecha<=t).length+'</b></div><div class="card tile"><span class="small muted">Ha pagado</span><b>'+money(pag)+'</b></div><div class="card tile"><span class="small muted">Adeudo</span><b style="color:'+(deb?'var(--cherry)':'inherit')+'">'+money(deb)+'</b></div><div class="card tile"><span class="small muted">Última visita</span><b style="font-size:16px">'+(ult?fCorta(ult.fecha):'—')+'</b></div></div>';
  if(prox)o+='<div class="note" style="border-left-color:var(--gold)">Próxima cita: '+fLarga(prox.fecha)+', '+h12(prox.hora)+'</div>';
  o+='<div class="grid2"><button class="btn gold" data-a="nueva" data-c="'+id+'">Agendar cita</button>'+(wa(k.tel)?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(k.tel)+'">Abrir WhatsApp</a>':'<span class="btn off">Sin WhatsApp</span>')+'</div>';
  o+='<div class="col" style="gap:6px"><h3>Historial</h3>'+(cs.length?cs.map(c=>citaRow(c,2)).join(''):'<span class="muted small">Todavía no tiene citas.</span>')+'</div>';

 qCli(v){qCli=v;const q=v.toLowerCase();$('#cliList').innerHTML=cliList(S.clientas.filter(k=>!q||k.nombre.toLowerCase().includes(q)||(k.tel||'').includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')))}
};
const LIVE={fDur:1,fQ:1,qCli:1,fExtra:1,fAnt:1,fNN:1,fNT:1,fNotas:1,fExtraD:1};
function onIn(e,live){const el=e.target;
  if(el.dataset.i){const k=el.dataset.i;if(k==='rsF'){if(!live&&el.files[0]){const r=new FileReader();r.onload=()=>{$('#rsT').value=r.result};r.readAsText(el.files[0])}return}
    if(!!LIVE[k]===live)I[k](el.value);return}
  if(live)return;
  if(el.dataset.cfg){const k=el.dataset.cfg;S.cfg[k]=k==='slot'?Number(el.value):k==='lada'?el.value.replace(/\D/g,''):el.value;save();if(k==='negocio'||k==='duena'){$('#hNeg').textContent=S.cfg.negocio;$('#hDue').textContent=S.cfg.duena}}
  if(el.dataset.hor&&el.value){S.cfg.horario[el.dataset.hor][el.dataset.k]=el.value;save()}}
document.addEventListener('input',e=>onIn(e,true));
document.addEventListener('change',e=>onIn(e,false));
load();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
